# Schema: docs/TASK_DAG.md    Validate: python3 tools/check_task_dag.py

plan: directxmath-migration
title: Replace the hand-rolled math library with native DirectXMath
summary: >
  NeuronCore carries 2,718 lines of inherited math — Vector3, Vector2,
  Matrix33, Matrix34, Plane and the geometry library in MathUtils — reached
  from 207 files and 3,133 Vector3 occurrences. This plan deletes all of it and
  moves the tree onto DirectX::XMFLOAT2/3, XMFLOAT4X4, XMVECTOR and XMMATRIX
  directly, with DirectXCollision replacing the intersection tests that have an
  equivalent there.

  Native means native. There is no wrapper class at the end of this plan and no
  free-function operator layer standing in for one: storage is the XMFLOAT
  types, arithmetic is XMLoad / XMVector* / XMStore at the call site. T1 adds a
  transitional conversion seam so the tree keeps compiling between tasks, and
  T25 deletes it. If T25 does not land, this plan has failed however good the
  intermediate state looks.

  THIS PLAN DELIBERATELY CHANGES WHAT THE SIMULATION COMPUTES. DirectXMath's
  lane arithmetic does not reproduce the current scalar arithmetic bit for bit,
  so the sync value differs from the first converted entity onward. That is
  sanctioned, on the same terms as determinism.yaml T1: the rule suspended is
  "the new build matches the old build", NOT "every client in a session
  agrees". Clients on the same build must still be bit-identical to each other.
  A build carrying part of this plan desyncs against one carrying a different
  part, so this is not a plan to land piecemeal into anything shipped.

  OWNER DECISIONS, 2026-08-03, recorded so no executing agent reopens them:

    1. Cross-architecture: ACCEPT AND DOCUMENT. No _XM_NO_INTRINSICS_, no
       <FloatingPointModel>, no build-topology change. ARM64 (NEON) and x64
       (SSE) will not agree, so mixed-architecture play moves from "unproven"
       to "not supported" in AGENTS.md (T26). Within one architecture the
       simulation stays deterministic, which is what the sync assert tests.
    2. Matrices: XMFLOAT4X4 storage, ROW-VECTOR convention (v * M), which is
       DirectXMath's own. See T1 — this is the decision most likely to be got
       wrong silently, because the current code is inconsistent about it.
    3. Normalise: NATIVE BEHAVIOUR. XMVector3Normalize's zero-length result
       replaces the current (0,0,1) fallback everywhere. T1 carries the audit
       of which call sites can actually see a zero-length input; a NaN reaching
       m_pos shows up in the sync value and nowhere else, so the audit is not
       optional.
    4. TriTri.cpp: DELETED, with its LICENSE row (T4). It has no callers.
    5. Handedness: RIGHT-HANDED, and it stays that way — DirectXMath's *RH
       variants only. Taken 2026-08-03 once the owner said a Direct3D renderer
       migration is planned: LH is D3D's conventional choice rather than a
       requirement, and adopting it would flip winding and culling against
       geometry that has been right-handed since the code was inherited.
    6. No math type knows which graphics API it feeds. The transpose and the
       depth-range difference between GL and D3D both live in renderer code.
       This reshaped T10 — see its notes.

  THE SURVEY'S BIGGEST FINDING, which reshaped this plan: most of the geometry
  library is dead. Measured at 4eeafa6 with
  `grep -rlw <fn> --include=*.cpp <projects>`, these have no caller anywhere
  outside MathUtils.cpp's own internals — RaySegDist and TriTriIntersection
  have none at all:

    RaySegDist, TriTriIntersection                  zero callers
    RayPlaneIntersection                            only RayRayDist
    GetPlaneMatrix, ProjectPointOntoPlane,          only SphereTriangleIntersection
    ConvertWorldSpaceIntoPlaneSpace,
    ConvertPlaneSpaceIntoWorldSpace,
    CalcTriArea, IsPointInTriangle
    Plane (the whole class)                         only RayPlaneIntersection

  So nine functions and one class are deleted rather than migrated (T4, T5,
  T8), and TriTri.cpp goes with them. That is roughly a third of MathUtils.cpp
  removed before a single call site is converted, and it is why the geometry
  tasks come before the sweep rather than after.

  WHAT DIRECTXCOLLISION DOES NOT COVER, established by reading rather than
  assumed: RaySphereIntersection returns an intersection POINT and NORMAL
  through out-parameters, and BoundingSphere::Intersects returns a bool and a
  distance. The function therefore survives T6 as a free function whose body
  becomes native — that is not a wrapper being preserved, it is a routine
  DirectXCollision has no equivalent for. Same for RayRayDist, PointSegDist2D
  and SegRayIntersection2D.

  MEASURED AT 4eeafa6, 2026-08-03, on Linux, with
  P="NeuronCore NeuronClient NeuronServer GameLogic Species Server Tests":

    Vector3     3,133 occurrences, 207 files   grep -row Vector3 --include=*.cpp --include=*.h $P
    Matrix34      489 occurrences,  79 files
    Vector2       220 occurrences,  22 files
    Matrix33      107 occurrences,  10 files
    Plane          20 occurrences,   4 files
    glVertex3fv/glNormal3fv fed from GetData()   46 files
    ConvertToOpenGLFormat call sites              3   GameLogic/Tree.cpp, NeuronClient/Shape.cpp x2
    GetOr / InverseMultiplyVector                 7   all in NeuronClient/Shape.cpp
    math library size            2,718 lines,  16 files

  Re-measure before citing any of these. They will have moved.

  THE PLANNED DIRECT3D MIGRATION shaped decisions 5 and 6 and is worth stating
  in one place, because it mostly CONFIRMS what was already chosen rather than
  changing it. XMFLOAT4X4 with the row-vector convention is D3D's own; XMFLOAT3
  storage is exactly what a D3D input layout wants; DirectXMath is the D3D math
  library, so this migration is a prerequisite for that work rather than a
  detour from it. What it did change: handedness is pinned right-handed now
  rather than decided by reflex when D3D lands, and no math type may name a
  graphics API. Nothing in this plan does any Direct3D work — the renderer is
  out of scope per AGENTS.md and stays there.

  ORDERING AGAINST THE OTHER OPEN PLANS. strings-modernised, ownership,
  language-hygiene and namespace-migration all touch files this plan touches.
  This plan does not change strings, ownership or enums, so a file can be at
  stage 4 or 5 and be converted here in either order — EXCEPT that both edit
  the same lines and will conflict in the tree. Rule: this plan yields. If a
  file is `in_progress` in another plan, skip it and come back. The one hard
  edge is namespace-migration, which should not start on NeuronCore until T25
  has deleted the headers it would otherwise move.

tasks:

  # ------------------------------------------------------------------
  # Wave 1 — pin what must not move, and delete what nothing calls
  # ------------------------------------------------------------------

  - id: T1
    title: Adopt DirectXMath, fix the conventions, and add the transitional seam
    intent: >
      Every later task depends on three things being decided once: which native
      type each legacy type becomes, which multiplication convention the tree
      uses, and how a converted file talks to an unconverted one. Deciding them
      per task is how a 200-file migration ends up half transposed.
    project: NeuronCore
    depends_on: []
    files:
      - NeuronCore/NeuronMath.h
      - NeuronCore/NeuronCore.h
      - NeuronCore/NeuronCore.vcxproj
      - NeuronCore/NeuronCore.vcxproj.filters
      - NeuronCore/Vector2.h
      - NeuronCore/Vector3.h
      - NeuronCore/Matrix33.h
      - NeuronCore/Matrix34.h
      - Tests/NeuronCoreTests/NeuronMathTests.cpp
      - Tests/NeuronCoreTests/NeuronCoreTests.vcxproj
      - Tests/NeuronCoreTests/NeuronCoreTests.vcxproj.filters
    acceptance:
      - NeuronMath.h includes <DirectXMath.h> and <DirectXCollision.h> and states the conventions in a comment block
      - static_asserts pin sizeof and offsetof equality between each legacy type and its native counterpart, and fail to compile if either moves
      - Vector3, Vector2, Matrix33 and Matrix34 each convert to and from their native counterpart, so a converted file compiles against an unconverted API
      - The conventions comment names the row-vector decision explicitly and records that Matrix33 and Matrix34 disagree today
      - NeuronCoreTests covers the seam round-trip and the zero-length normalise behaviour the tree is moving to
      - No .vcxproj gains an include directory or a library reference
    verify:
      - python3 tools/check_project_files.py
      - python3 tools/check_layering.py
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    parallel_safe: false
    status: done
    notes: |
      THE CONVENTION TRAP, found while surveying and the reason this task
      exists at all. Matrix33 and Matrix34 use OPPOSITE conventions for
      identically named members:

        Matrix33::operator*(Vector3)  ->  dot(r,v), dot(u,v), dot(f,v)
                                          r/u/f are ROWS
        Matrix34::operator*(Vector3)  ->  v.x*r + v.y*u + v.z*f + pos
                                          r/u/f are COLUMNS (basis vectors)

      Each class is internally consistent — their InverseMultiplyVector
      implementations are the matching transposes — but Matrix34::GetOr() hands
      r, u and f straight into a Matrix33 constructor, so the rotation
      transposes as it crosses that call. Both traps are confined to
      NeuronClient/Shape.cpp (3 GetOr, 4 InverseMultiplyVector sites), which is
      the only reason this is a footnote rather than a plan of its own. Fix the
      reading there in T10 and state it in the conventions block.

      SECOND TRAP, same shape. In BOTH classes `v * M` and `M * v` have
      byte-identical bodies — the operand order is decorative today. Native
      XMVector3Transform is v*M and means it. Any call site that wrote M*v
      expecting the transpose is already getting the other one, so converting
      it "correctly" would be a behaviour change; converting it to match
      today's behaviour is what this plan wants. Read each transform site, do
      not pattern-match the operand order.

      THIRD: Matrix34 rotates with cos()/sin() — the DOUBLE overloads, cast
      back to float — not cosf/sinf. Native XMMatrixRotation* is float
      throughout. That difference is part of the sanctioned divergence, but
      note it in the commit so the smoke test knows what moved.

      THE SEAM is what keeps the tree compiling across ~20 conversion tasks.
      Layouts are already identical (Vector3 is three floats, XMFLOAT3 is three
      floats), so the conversion is free at runtime and the static_asserts
      prove it rather than trusting it. The seam is a wrapper and it is
      temporary; T25 deletes it and T25 is what makes this plan honest.

      FLOAT TOLERANCES IN TESTS ARE RELATIVE, NEVER ABSOLUTE, and this task
      learned it the useful way. CI run 360 built clean and failed one test:

        Matrix34TransformsIdenticallyThroughTheNativeType
        Assert failed. Expected:<22.7791> Actual:<22.7791>

      Identical to the precision the failure message prints. The tolerance was
      an absolute 1e-6f and one float ULP at magnitude 22.78 is already ~2.7e-6,
      so the test was tighter than the type. What it caught is the migration's
      own premise in the smallest case available: the legacy operator sums
      r.x*v.x + u.x*v.y + f.x*v.z + pos.x in that order, XMVector3Transform does
      four lanes at once and may contract to FMA, and they agree to float
      precision and not beyond it.

      Worth being clear about what this was NOT. Every convention test passed —
      Matrix33's transposing conversion, Matrix34's non-transposing one, the row
      layout, the round trip and the operand-order quirk. A wrong transpose
      moves a coordinate by whole units, not by an ULP. The fix is
      AssertNearlyEqual in NeuronMathTests.cpp, relative at 1e-5; every later
      task should use it rather than writing a literal. Exact comparison is
      still right where a conversion only copies fields, and the row-layout test
      keeps it.

      LANDED. CI runs 362 and 363 green at 41f00ac: x64 Debug builds with
      DirectXMath included tree-wide, and the suite is 132 tests where it was
      124. The eight new ones are the conventions, asserted against the legacy
      operators rather than against my reading of them.

      NOT DONE HERE, and the next agent should not go looking for it: the
      normalise audit below is written as a decision, but the call-site LIST it
      calls for has not been produced. Nothing in the tree normalises through
      the native path yet -- the seam still routes every call to
      Vector3::Normalise -- so the audit belongs with the first task that
      actually converts a normalise site, and T14 is where it starts to matter.
      Recorded as a gap rather than quietly dropped.

      THE NORMALISE AUDIT belongs here because it is a decision, not a sweep.
      Vector3::Normalise returns (0,0,1) for zero length; XMVector3Normalize
      returns zero or QNaN. Owner chose native. Before the sweeps start, list
      the call sites that can see a zero-length input — the candidates are
      Matrix34::Normalise and the six Orient* functions (a degenerate basis),
      HorizontalAndNormalise (which already divides by an unguarded sqrtf, so
      it is no worse), and any direction computed from two entity positions
      that may coincide. Put the list in this task's notes. A NaN in m_pos
      surfaces only in the sync value, minutes later, in Debug.

  - id: T2
    title: Pin the wire bytes for world position and direction
    intent: >
      NetworkUpdate holds a Vector3 and writes it field by field. XMFLOAT3 has
      the same layout so the packet should be unchanged, but "should be" is not
      what a wire format is verified with, and this is the one thing in the
      plan that would break other machines rather than just this build.
    project: NeuronCore
    depends_on: []
    files:
      - Tests/NeuronCoreTests/NetworkUpdateTests.cpp
    acceptance:
      - A test pins the exact bytes an Alive update writes, including all three position floats at their current offsets
      - A test pins the bytes for m_direction on every update type that carries it
      - The tests pass before any type changes and are untouched by T9
    verify:
      - vstest.console.exe x64\Debug\*Tests.dll
    parallel_safe: true
    status: done
    notes: |
      Characterisation before conversion, the documented exception to
      tests-ship-with-the-change (docs/TESTING.md). NetworkUpdateTests already
      exists; this extends it. If the bytes DO move in T9, that is a bug in T9,
      not a test to update.
      LANDED. CI run 380 green at 45049cd.

      TWO OF THREE CRITERIA WERE ALREADY MET OR UNMEETABLE, stated rather than
      quietly reshaped. Alive was already pinned by
      AliveCarriesTheTeamControlFlagsAsOneWord, which reads all three floats at
      their offsets and asserts the 24-byte length; CreateUnit likewise. Both
      predate this plan.

      m_direction CANNOT BE PINNED: it never goes on the wire. Declared,
      assigned by SetDirection, and that is all — no getter, no WRITE_FLOAT, no
      reader, and zero callers of the setter anywhere in the tree. Dead state on
      a wire-format class. Handed to T9, which owns this file's types.

      What was actually missing and is now covered: AimBuilding and
      TargetProgram. TargetProgram had a round-trip test, which proves the two
      ends agree with each other but not that either matches the format.

  - id: T3
    title: Pin the raw-memory assumptions three call sites make about Vector3
    intent: >
      Three places treat Vector3 as twelve bytes rather than as a class:
      LandscapeRenderer's vertex-buffer offsets, TrunkPort's height-map memset,
      and every glVertex3fv site taking &v.x. All three survive the migration
      because XMFLOAT3 matches, but nothing states that today, so nothing
      catches it if a future type choice does not.
    project: GameLogic
    depends_on: []
    files:
      - GameLogic/LandscapeRenderer.cpp
      - GameLogic/TrunkPort.cpp
    acceptance:
      - Each of the three sites carries a static_assert on the size it assumes
      - The asserts name what breaks if they fail, not just the number
    verify:
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
    parallel_safe: true
    status: done
    notes: |
      LandscapeRenderer.cpp:232 derives m_normOffset, m_colOffset and m_uvOffset
      from sizeof(Vector3); TrunkPort.cpp:47 memsets m_heightMapSize^2 *
      sizeof(Vector3). Both are interleaved-vertex-buffer arithmetic handed to
      OpenGL, so an error is a rendering corruption rather than a compile
      failure.
      LANDED. CI run 380 green at 45049cd.

      Two of the three sites carry a static_assert of their own. The third —
      GetData handing &x to glVertex3fv across 46 files — is asserted in
      Vector3.h beside the conversions, because it is a property of the type
      rather than of the call sites. None of the three fails to compile when
      wrong, which is the whole point: a bad vertex offset renders garbage and
      a bad memset gives a rubbish height map.

  - id: T4
    title: Delete the geometry nothing calls, and TriTri.cpp with its licence row
    intent: >
      RaySegDist and TriTriIntersection have no callers anywhere in the tree.
      Migrating them would be work spent on code that is already dead, and
      TriTri.cpp is the one file in the repository whose third-party terms
      LICENSE records as unresolved — deleting it improves the provenance
      position AGENTS.md flags, rather than carrying it forward.
    project: NeuronCore
    depends_on: []
    files:
      - NeuronCore/MathUtils.h
      - NeuronCore/MathUtils.cpp
      - NeuronClient/TriTri.cpp
      - NeuronClient/NeuronClient.vcxproj
      - NeuronClient/NeuronClient.vcxproj.filters
      - LICENSE
    acceptance:
      - RaySegDist and TriTriIntersection are gone from MathUtils.h and from the tree
      - NeuronClient/TriTri.cpp is deleted and removed from the project file and its filters
      - The LICENSE row for TriTri.cpp is removed and the Mersenne Twister and AutoVector rows are untouched
      - grep -rw 'RaySegDist|TriTriIntersection' over the tree returns nothing
    verify:
      - python3 tools/check_project_files.py
      - python3 tools/check_layering.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
    parallel_safe: true
    status: done
    notes: |
      OWNER APPROVED 2026-08-03, having been asked specifically because of the
      licence. The Möller notice is not being stripped from surviving code — the
      code it covers is being removed entirely, which is the only clean way to
      resolve an "all rights reserved, no explicit grant" file.

      Worth recording: TriTriIntersection is DECLARED in NeuronCore/MathUtils.h
      and DEFINED in NeuronClient/TriTri.cpp. That is a symbol declared low and
      defined high — the exact pattern check_layering.py catches for
      executables — and it slipped through because NeuronClient is a library.
      It is worth asking whether that check should extend to libraries; not a
      task here, but a finding for tools/.

      LANDED 2026-08-03. 426 lines deleted, 21 added: TriTri.cpp (367 lines)
      and its two project-file entries, RaySegDist (38 lines), and the two
      declarations. MathUtils.cpp goes from 614 to 576 lines and MathUtils.h
      from 137 to 130.

      THE LICENCE ROW IS NOT SIMPLY DROPPED. LICENSE keeps a paragraph
      recording what went and why, in the shape containers-replaced/T16 set for
      AutoVector.h — that table describes what the repository contains, so an
      entry for an absent file would be wrong in the other direction, but a
      silent removal would read as the notice having been stripped.
      CODING_STANDARDS.md's "two files carry third-party terms" is now one.

      VERIFICATION, HONESTLY. All six tools/ checks pass here. The msbuild and
      vstest lines under verify were NOT run — this agent is on Linux with no
      MSVC — so the build evidence is CI's x64 Debug run on the push, and this
      task was not marked done until that came back green. Nothing here can
      launch the client, and nothing in this task should need it: deleting a
      function with no callers cannot change what the game does at runtime.
      Note the check_format and check_hygiene lines report "0 changed files"
      because a pure deletion writes no new lines for them to judge.

      CI RUN 357 GREEN at bb22630 — x64 Debug built and the suite passed with
      TriTri.cpp out of NeuronClient.vcxproj. That is the build evidence this
      task's verify list asked for and could not produce locally.

  # ------------------------------------------------------------------
  # Wave 2 — the geometry library
  # ------------------------------------------------------------------

  - id: T5
    title: Replace SphereTriangleIntersection with BoundingSphere, deleting six helpers
    intent: >
      SphereTriangleIntersection is the sole caller of GetPlaneMatrix,
      ProjectPointOntoPlane, ConvertWorldSpaceIntoPlaneSpace,
      ConvertPlaneSpaceIntoWorldSpace, CalcTriArea and IsPointInTriangle. One
      DirectXCollision call replaces the whole subtree, which is about a third
      of MathUtils.cpp.
    project: NeuronCore
    depends_on: [T1]
    files:
      - NeuronCore/MathUtils.h
      - NeuronCore/MathUtils.cpp
      - Tests/NeuronCoreTests/NeuronMathTests.cpp
    acceptance:
      - SphereTriangleIntersection is implemented with DirectX::BoundingSphere::Intersects
      - All six helper functions are gone from the header and the tree
      - NeuronCoreTests covers the new contract, including a sphere touching an edge and a sphere containing the triangle
      - The one caller, NeuronClient/Shape.cpp:1204, compiles unchanged
    verify:
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    parallel_safe: true
    status: done
    notes: |
      This is a DIFFERENT ALGORITHM, not a reimplementation — the current one
      projects into plane space and does a triangle-area point test with a
      1.0001f fudge factor; BoundingSphere::Intersects does not. Edge and
      near-degenerate cases will answer differently. The one caller is Shape's
      collision test, so the visible effect is which shape fragment a click or
      a projectile registers against. State the new contract in the tests
      rather than trying to reproduce the old one.
      LANDED. CI run 368 green at 4ccb3e4, 143 tests where there were 132 --
      the seven new ones were discovered and ran, checked in the log rather
      than inferred from a green tick.

      136 lines out, 57 in. All six helpers went with SphereTriangleIntersection
      and none had a caller outside it. PointSegDist2D was the one that could
      not go: it lost this caller but keeps the ones in Weapons.cpp and
      RoutingSystem.cpp. The Matrix34 include and forward declaration went too,
      because nothing in MathUtils uses a matrix any more.

      WHAT A REVIEWER SHOULD BE SUSPICIOUS OF: this is a different algorithm.
      The old routine projected into plane space and ran a triangle-area point
      test with a 1.0001f fudge factor; BoundingSphere::Intersects does not.
      Edge and near-degenerate answers can differ. The tests state the new
      contract rather than reproducing the old one, which is the honest thing to
      do and also means they cannot prove the change is invisible. Its one
      caller is Shape.cpp's collision test, so what the T13 smoke test should
      watch for is clicks and projectiles registering against the wrong shape
      fragment.

  - id: T6
    title: Rebuild the sphere intersection routines on native types
    intent: >
      RaySphereIntersection has fourteen caller files and returns an
      intersection point and normal through out-parameters, which
      BoundingSphere::Intersects does not provide. The routine stays; its body
      becomes native and its callers keep their signature.
    project: NeuronCore
    depends_on: [T1]
    files:
      - NeuronCore/MathUtils.h
      - NeuronCore/MathUtils.cpp
      - Tests/NeuronCoreTests/NeuronMathTests.cpp
    acceptance:
      - RaySphereIntersection and SphereSphereIntersection compute with XMVECTOR throughout, with no Vector3 arithmetic left in either body
      - SphereSphereIntersection uses BoundingSphere::Intersects, which does cover it
      - The out-parameter contract of RaySphereIntersection is unchanged and covered by tests
      - No caller file is edited by this task
    verify:
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    parallel_safe: true
    status: done
    notes: |
      Fourteen caller files: Shape.cpp, GunTurret, ResearchItem, RadarDish,
      Location, GlobalWorld, Tree, Entity, StaticShape, Building,
      ScriptTrigger, UserInput, LocationEditor. They convert with their own
      subsystem later; this task deliberately does not touch them, so the diff
      stays reviewable and the signature change happens once, in T25's wake.
      LANDED. CI run 380 green at 45049cd.

      SphereSphereIntersection became BoundingSphere::Intersects.
      RaySphereIntersection kept its geometric solution on XMVECTOR, because
      DirectXCollision reports a distance and fourteen caller files want the
      point and the normal. Neither signature moved, so those fourteen convert
      with their own subsystems rather than being dragged in here.

      A LATENT NULL DEREFERENCE WENT WITH IT: the old body computed the normal
      as `*pos - spherePos`, dereferencing pos whether or not the caller
      supplied one. Unreached rather than broken — GameLogic/Tree.cpp is the
      only caller wanting a normal and it asks for both — but the rewrite holds
      the hit point in a local, so the shape is safe rather than accidentally
      safe, and there is a test for it.

  - id: T7
    title: Replace RayTriIntersection with TriangleTests::Intersects
    intent: >
      Ray-triangle is the one intersection test with an exact DirectXCollision
      equivalent including the distance out-parameter, so it is a true
      replacement rather than a rewrite.
    project: NeuronCore
    depends_on: [T1]
    files:
      - NeuronCore/MathUtils.h
      - NeuronCore/MathUtils.cpp
      - Tests/NeuronCoreTests/NeuronMathTests.cpp
    acceptance:
      - RayTriIntersection is implemented with DirectX::TriangleTests::Intersects
      - The _rayLen cutoff and the result out-parameter behave as before, covered by tests
      - The four caller files compile unchanged
    verify:
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    parallel_safe: true
    status: done
    notes: |
      Callers: NeuronClient/Shape.cpp, GameLogic/Landscape.cpp,
      GameLogic/LaserFence.cpp. Backface behaviour differs between Möller's
      formulation and TriangleTests — check whether Landscape depends on
      hitting backfaces before assuming it does not.
      LANDED. CI run 380 green at 45049cd.

      TWO DELIBERATE BEHAVIOUR CHANGES, both tested, neither reproducible from
      the old code.

      The direction is normalised first. TriangleTests::Intersects REQUIRES a
      unit direction and asserts on one that is not; every call site looks like
      it passes a unit ray, but "looks like" would be a Debug assert inside
      DirectXCollision on the first one that does not. A zero-length direction
      now returns false rather than dividing by zero.

      The _rayLen cutoff is a plain distance comparison now. It replaced
      sqrt(t*t + u*u + v*v) > _rayLen over Moller's barycentric outputs, which
      mixes a distance with two barycentric coordinates and is not a length of
      anything. Directly above it, commented out, sat `if (result.x > _rayLen)`
      — the test this now does. Someone replaced the sane test with the odd one
      and left the evidence in place.

      Backface behaviour is unchanged and now pinned. Landscape.cpp raycasts
      terrain triangles whose winding depends on which way the mouse ray came
      in, so two-sidedness is load-bearing rather than incidental.

  - id: T8
    title: Rebuild RayRayDist natively and delete the Plane class
    intent: >
      Plane exists to serve RayPlaneIntersection, which exists to serve
      RayRayDist, which has three call sites in Tripod.cpp. Collapsing that
      chain onto XMPlane* removes a class, a header pair and a function.
    project: NeuronCore
    depends_on: [T1]
    files:
