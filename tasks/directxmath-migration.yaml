  - id: T10
    title: Convert the client renderers, and fix Shape's transposed matrix reading
    intent: >
      Shape.cpp is where the Matrix33/Matrix34 convention disagreement is
      actually observable — it holds every GetOr and InverseMultiplyVector site
      in the tree. Converting it is also the point at which the transposed
      reading has to be resolved rather than carried.
    project: NeuronClient
    depends_on: [T1, T5, T6, T7]
    files:
      - NeuronClient/Shape.h
      - NeuronClient/Shape.cpp
      - NeuronClient/3dSprite.h
      - NeuronClient/3dSprite.cpp
      - NeuronClient/SphereRenderer.h
      - NeuronClient/SphereRenderer.cpp
      - NeuronClient/DebugRender.h
      - NeuronClient/DebugRender.cpp
      - NeuronClient/PersistingDebugRender.h
      - NeuronClient/TextRenderer.h
      - NeuronClient/TextRenderer.cpp
    acceptance:
      - Shape.cpp holds no GetOr or InverseMultiplyVector call
      - The matrix reading at each former GetOr site is stated in a comment as row-vector, matching T1's conventions block
      - No math type names a graphics API - ConvertToOpenGLFormat is gone, not renamed, and the transpose it performed lives in renderer code
      - The two former ConvertToOpenGLFormat call sites take an XMFLOAT4X4 by value rather than a pointer into a shared static buffer
      - glVertex3fv and glNormal3fv sites pass &v.x on an XMFLOAT3
      - No Vector3, Vector2, Matrix33 or Matrix34 identifier remains in these files
    verify:
      - python3 tools/check_format.py
      - python3 tools/check_hygiene.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
    parallel_safe: true
    status: todo
    notes: |
      Matrix33::m_openGLFormat and Matrix34::m_openGLFormat are `static
      float[16]` returned by pointer — a shared mutable buffer that is neither
      reentrant nor thread-safe, and two of the three call sites in the tree
      are here. Returning XMFLOAT4X4 by value fixes that as a side effect;
      say so in the commit rather than leaving it as an unexplained signature
      change. OpenGL wants column-major and DirectXMath stores row-major, so
      the transpose happens in the store — one place, stated once.

      RESHAPED 2026-08-03 after the owner said a Direct3D renderer migration is
      planned. The point is no longer "return XMFLOAT4X4 instead of float*" — it
      is that NO MATH TYPE KNOWS WHICH API IT FEEDS. Both APIs need a transpose
      (GL takes column-major, HLSL packs column-major, DirectXMath stores
      row-major) and they differ on depth range (GL z in [-1,1], D3D z in
      [0,1]), so both belong in renderer code. A member function named
      ConvertToOpenGLFormat is the SHAPE being removed, not a signature to
      modernise: renaming it ConvertToNativeFormat would bake the same
      assumption in with a better name. See NeuronMath.h.

