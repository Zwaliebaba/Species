      MEASURED ON TAKING THE WAVE, 2026-08-04. T16 IS THE KEYSTONE OF T15-T17
      AND THE PLAN DOES NOT SAY SO. Building declares five virtuals carrying
      math types -- PerformDepthSort, GetPortPosition, DoesSphereHit,
      DoesShapeHit and DoesRayHit -- and they are overridden in FIFTEEN headers
      spread across three tasks:

        T16  StaticShape, ResearchItem, SpawnPoint, GunTurret, RadarDish, Tree
        T17  LaserFence, FeedingTube, SafeArea, ScriptTrigger, TrunkPort
        T15  Triffid
        T14  Ai -- already converted, and its four overrides were LEFT LEGACY
             on purpose, with a comment saying they clear when Building moves

      A virtual override matches its base exactly or silently stops overriding,
      so Building's signatures and all fifteen overriders have to land in one
      commit. That is T12's finding a second time, one layer up: it is why T12
      could not be done before T18 and T22, and it is why T16 cannot be done
      after T15 and T17.

      SO THE ORDER WITHIN THIS WAVE IS NOT FREE, whatever parallel_safe says.
      Building's storage -- m_front, m_up, m_centrePos -- is also what a large
      share of T14's ~490 AsLegacy repairs point at, so converting it first
      removes repairs rather than adding them.

      Taking T16 first, then T17, then T15's Building-derived stragglers, then
      T18 and T19. Recorded rather than silently reordered.

      CLOSED. Three commits: the keystone (Building plus all fifteen
      overriders), the 25 sites that exposed, and the remaining twenty-two
      bodies. What the second half turned up:

      A SECOND KEYSTONE INSIDE T17, FOUND BY GREPPING FOR THE FIRST ONE.
      RadarDish derives from Teleport, not from Building directly, and Teleport
      declares FOUR more virtuals carrying math types -- GetEntrance, GetExit,
      GetStartPoint, GetEndPoint -- overridden by RadarDish here and by Bridge
      under T17. Same rule, same trap, one layer further down. RadarDish's four
      are therefore LEFT LEGACY with a comment, exactly as T14 left Ai's, and
      T17 converts the family with Teleport. The lesson generalises: before
      converting a class, grep for what DERIVES from it AND for what it derives
      from -- the second question is the one that catches this.

      THE T10 SEAM IS STILL OPEN AND IS NOW THE LOUDEST THING IN THESE FILES.
      ShapeMarker::GetWorldMatrix takes an XMFLOAT4X4 and returns a Matrix34.
      Roughly twenty sites here call it, and where only .pos is wanted they
      collapse to a native XMFLOAT3; where the whole basis is wanted the local
      stays Matrix34 with a comment. Every one is marked "T10's seam" so the
      follow-up can grep them.

      A REAL BUG, PRE-EXISTING, FIXED IN PASSING. ControlTower::Advance tested
      `m_dishMatrix == Matrix34()` to decide whether it had computed the dish
      basis yet. Matrix34's default constructor leaves the matrix
      UNINITIALISED, so that compared indeterminate memory against
      indeterminate memory and only worked because a fresh allocation happens
      to be zeroed. The member is braced to zero now and the test is an
      explicit IsUncomputed. Called out because it is a behaviour change the
      migration would otherwise have smuggled in.

      TWO DEGENERATE-CASE DIVERGENCES, DECIDED DIFFERENTLY ON PURPOSE.
      Vector3::SetLength left (len, 0, 0) for a zero-length vector; the native
      normalise gives QNaN. In GunTurret's aiming rotation that fallback is
      LOAD-BEARING -- when the turret points exactly away from its target the
      cross product is zero, and the fallback's rotation about world X is what
      breaks the deadlock -- so it is reproduced explicitly. In the four
      rendering sites (Generator's power line, SpawnPoint's spirit link) it
      only degenerates one quad with the camera exactly collinear, so those
      take the native behaviour. Both choices are commented at the site.

      GUARD THRESHOLDS ARE NOT INTERCHANGEABLE. Vector3::RotateAround skips
      below 1e-8; Matrix34::RotateAround skips below 1e-5. RadarDish uses both,
      about eighty lines apart. Each converted site names which one it is.

      XMVector3Transform VERSUS XMVector3TransformNormal. Transform adds the
      matrix's translation row and writes w = 1. Harmless when the result is
      stored to an XMFLOAT3, which is every site T14 wrote -- but it would have
      silently corrupted the ShapeFragment basis rows in RadarDish's
      SpinBasisRows, where the xyz are identical and only w differs, so nothing
      would have failed until something downstream multiplied the transform.
      Rows are directions: use TransformNormal.

      GLVERTEX3FV IS INFRASTRUCTURE, NOT A PER-FILE PROBLEM. 513 call sites
      across 52 files, all needing the same XMVECTOR-to-XMFLOAT3 round trip.
      T10 and T14 had already written five byte-identical file-static
      EmitVertex helpers, each commented as being the same as the others. Those
      are folded onto NeuronClient/GlVertex.h now. It is NOT transitional and
      does not die with T25: it bridges DirectXMath to OpenGL, not old math to
      new.

      THE ADDRESS-OF TRAP, WHICH IS A NEW FAILURE MODE AND THE ONE THAT COST
      THIS TASK ITS LAST RED ROUND. Vector3 converts to XMFLOAT3 through
      `operator XMFLOAT3 const&`. That makes `XMFLOAT3 const a = someVector3;`
      compile, which reads as though the two types are interchangeable. They
      are NOT interchangeable through a POINTER: `&someVector3` is a Vector3*
      and XMLoadFloat3 wants an XMFLOAT3*. Every Matrix34 row is a Vector3, so
      `XMLoadFloat3(&mat.f)` on a matrix from ShapeMarker::GetWorldMatrix does
      not compile. Six sites. The fix is a copy-initialised local, which is
      what actually runs the conversion.

      Add it to the list in T14's notes as mode 7: the seam converts by
      reference, and a reference conversion does nothing for an address.

      CHECK_MATH_TYPES HAD TWO GAPS AND BOTH ARE CLOSED. It missed the above
      entirely -- no rule for it -- and it missed `m_x += y` because its
      arithmetic pattern required an identifier after the operator and `+=` has
      an `=` there. Compound assignment is exactly the mutating case that
      matters most. Eight of the twenty-four errors in that round were things
      the tool could have caught in two seconds. Both rules are added and both
      were verified by re-introducing the real bugs and watching them fire.

      WHAT IS STILL NOT CHECKED, and what to do about it. The tool skips
      CONTENDED member names -- m_pos, m_front, m_up, m_vel, m_target and six
      others are native on one class and legacy on another, so resolving them
      needs a type checker. Those are the highest-traffic names in the
      migration, so after converting a file, sweep them by hand against that
      file's own members; T16 did and it was clean.

      DEAD DECLARATION LEFT ALONE. DynamicHub::GetPowerLocation is declared in
      GenericHub.h and never defined or called. Converted with the rest rather
      than deleted -- removing it is not this task's business, but the next
      person to touch that header should know it is dead.

