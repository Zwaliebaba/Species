      THE LAST TWO ARE MEASURED PROPERLY, because the type count understates
      them badly. Counting every edit point rather than every type name:

        Weapons.h    15 types
        Weapons.cpp  88 types, 70 legacy method calls, 26 glVertex/glNormal,
                     56 AsLegacy, 6 legacy globals   -> ~246 edit points
        Rocket.h      4 types
        Rocket.cpp   73 types, 36 legacy method calls, 24 glVertex/glNormal,
                     13 AsLegacy, 15 legacy globals  -> ~161 edit points

      Weapons.cpp holds 56 of the tree's remaining AsLegacy uses on its own —
      more than every other file put together. It is the single densest math
      file in GameLogic, which this task's intent said from the start.

      They are INDEPENDENT of each other, which is worth knowing before
      planning: Rocket.h and Rocket.cpp are the fuel buildings and the escape
      rocket, and Weapons.h's own `Rocket` class is implemented in Weapons.cpp.
      Neither header declares anything the other implements. Do them in either
      order, in separate commits.

      Every convention trap they can hit is already pinned or written down: the
      two Matrix33 reversals (tests), BasisFromFrontAndUp's row order and its
      lack of a namespace, g_upVector and g_zeroVector needing
      DirectX::g_XMIdentityR1 and XMVectorZero(), RotateAround taking its angle
      from the axis magnitude, operator^ being cross and operator* between two
      vectors being dot, and the three-net search method. Nothing new should be
      discovered; the remaining cost is volume.

      THE DUPLICATE-LOCAL SCAN FALSE-POSITIVES ON SIBLING BLOCKS. It flagged
      seven names in Spam and two in Airstrike, and every one was two separate
      for-loop or if bodies rather than one scope. Verify each hit by reading
      the braces; the scan cannot tell a sibling block from a redeclaration.

      g_upVector AND g_zeroVector ARE STILL Vector3, which is failure mode 7
      pointing the other way and it will recur in all three remaining files.
      `m_up = g_upVector` compiles, because the seam converts by value. But
      XMLoadFloat3(&g_upVector) does NOT: taking the address gets a Vector3*,
      and the seam does nothing through a pointer. Use what the already-
      converted files use — DirectX::g_XMIdentityR1 for g_upVector, which is
      (0,1,0,0), and DirectX::XMVectorZero() for g_zeroVector. T25 owns
      retiring the globals themselves. Spirit
      also lost its nine AsLegacy uses, which the seam count in
      _restart-directxmath.md tracks.

      ONE MORE SCRIPTED-CONVERSION HAZARD, from Spirit: replacing every
      occurrence of an identical block puts duplicate declarations in any
      function that contains two of them. Spirit::Render draws two quads
      differing only in size and got two `sizeVec` declarations in one scope.
      No check here can see it — only the compiler. Scan for repeated local
      names per function after any block-level replacement.

      WHAT PARTICLESYSTEM COST, so the next eight are cheaper:
        - Particle's constructor assigns nothing, so m_pos and m_vel needed
          explicit {0,0,0} initialisers. Failure mode 5, invisible to the
          compiler and to CI.
        - check_math_types found three sites grep could not, all failure mode
          2 — a converted member's name with no type on the line. RUN IT AFTER
          EVERY FILE, not at the end.

      THE VERIFICATION RECIPE, written after Explosion shipped a red build with
      all seven checks green locally. Explosion::Advance was never converted and
      nothing caught it: its three lines are `m_tris[i].m_pos += m_tris[i].m_vel
      * g_advanceTime`, `m_vel.Mag()` and `m_vel *= 1.0f - friction`, and not
      one contains a type name. check_math_types could not help either, because
      m_pos and m_vel are contended names it SKIPS rather than guesses at — so
      the type grep and the tool have the same blind spot. Weapons has 103
      occurrences and will be full of this.

      After converting a file, grep the converted MEMBERS rather than the types:

        grep -nE '\.(Mag|MagSquared|Normalise|SetLength|SetToIdentity|Set|Zero|GetData|GetDataConst|RotateAround|FastRotateAround)\s*\(' <file>
        grep -nE '\bm_(name|of|each|converted|member)\b\s*(\*=|\+=|-=|/=|\^)' <file>

      The first finds legacy method calls on native storage; the second finds
      compound assignment and the cross product, neither of which the native
      types have. Both return nothing on a finished file.
        - Vector3::operator/ computed 1/b once and multiplied, so XMVectorScale
          with the reciprocal is exact rather than approximate.
        - Vector3::operator* between two vectors was the DOT PRODUCT. It reads
          like a scale and is not.
        - glVertex3fv(v.GetData()) becomes EmitVertex, and the file needs
          #include "GlVertex.h" — it is not reachable through pch.h.
        - g_camera->GetUp() and GetRight() still return Vector3 and stay that
          way until T12/T22, so the seam converts them on the way in.

      EXPLOSION NEEDS A DECISION BEFORE IT CAN BE CONVERTED, which is why the
      work stopped there rather than part-way through a file. Explosion.h
      stores `Matrix33 m_rotMat` and Explosion.cpp builds one per tick as
      `Matrix33 rotIncrement(yaw, dive, roll)`. That constructor is
      Matrix33.cpp:42 and it applies RotateAroundZ(roll), RotateAroundX(dive),
      RotateAroundY(yaw) IN THAT ORDER to an identity matrix.
      XMMatrixRotationRollPitchYaw documents the same Z-then-X-then-Y order, so
      `Matrix33(yaw, dive, roll)` LOOKS equivalent to
      XMMatrixRotationRollPitchYaw(dive, yaw, roll) with the first two
      arguments swapped.

      IT IS NOT, AND THAT WAS CHECKED RATHER THAN ARGUED. The equivalence was
      worked out numerically against both implementations before any C++ was
      written, over ten angle triples and five vectors each. The answer:

        Matrix33(yaw, dive, roll) * v
          ==  XMVector3Transform(v, RotationY(yaw) * RotationX(dive) * RotationZ(roll))

      RollPitchYaw gives Z * X * Y; the legacy constructor gives Y * X * Z. The
      composition is REVERSED, because RotateAroundZ/X/Y rewrite the matrix's
      three basis rows in place rather than composing in row-vector order. The
      call order in the constructor reads like RPY's and means the opposite.

      Both readings compile and both are rotations. The wrong one tumbles
      exploding debris the wrong way, and no build, test or check in this tree
      would say so.

      PINNED, so nobody has to re-derive it:
      NeuronMathTests::NativeRotationMatchesTheLegacyYawDiveRollConstructor
      asserts the mapping, and TheRollPitchYawReadingOfThatConstructorIsWrong
      is its negative control — it fails if someone later "simplifies" the
      conversion to RPY. Matrix33 has five users outside this task —
      LaserFence, Location, Shape, Camera and Matrix34 itself — so the pin is
      worth well more than Explosion alone.

      A SECOND TRAP IN THE SAME FILE, found the same way and also pinned.
      Matrix33::operator* is an ordinary row-major product, but Matrix33
      transforms as M * v while XMVector3Transform computes v * M — so the
      native matrix is the TRANSPOSE of the legacy one, and transposing
      reverses a product. Tumbler::Advance does `m_rotMat *= rotIncrement`,
      which converts to `rotMat = increment * rotMat` — the operands swap.

      Writing it in the original order is wrong by about two percent after one
      tick. It looks right, and it compounds every frame. Pinned by
      NativeMatrixProductReversesRelativeToTheLegacyOne, which also asserts
      that the same-order version genuinely differs, so the test is about the
      conversion rather than about these particular angles.

      Both pins passed under MSVC on the first run (179 tests, up from 177),
      so the mapping is confirmed by the real toolchain and not only by the
      model used to derive it.

      With both pinned, Explosion is unblocked and is the right next file.
      Note that Tumbler::Advance names its arguments in an order worth
      re-reading before converting: it passes m_angVel.x as YAW, m_angVel.y as
      DIVE and m_angVel.z as ROLL.

  - id: T20
    title: Convert the in-game windows
    intent: >
      The editor and debug windows are the only GameLogic math that never
      reaches the simulation, so they convert last within the layer and carry
      the least risk.
    project: GameLogic
    depends_on: [T16, T17, T18, T22]
    files:
      - GameLogic/BuildingsWindow.cpp
      - GameLogic/CheatWindow.cpp
      - GameLogic/InstantUnitWindow.cpp
      - GameLogic/LandscapeWindow.cpp
      - GameLogic/TreeWindow.cpp
    acceptance:
      - No legacy math type remains in these files
    verify:
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
    parallel_safe: true
    status: todo
    notes: |
      RE-POINTED 2026-08-04, on the same defect as T12 and for the third time
      in this plan: a task scoped by DIRECTORY over code that owns no storage.

      These five files declare no math member at all. Every Vector3 in them is
      a LOCAL feeding an interface this task does not own:

        g_camera->GetClickRay(..., Vector3*, Vector3*)   CameraAccess  (T12/T22)
        m_landscape.RayHit(Vector3, Vector3, Vector3*)   Landscape     (T18)
        building->GetPortPosition(p, Vector3&, Vector3&) Building      (T16/T17)
        g_location->SpawnEntities(Vector3, ...)          Location      (T18)

      So there is nothing here to convert. Making those locals XMFLOAT3 would
      mean converting each one BACK at the call, which adds legacy references
      rather than removing them -- the opposite of the task's point.

      It now depends on its callees. Removing it from T21's dependency list is
      the other half, exactly as T12 needed: T22 is behind T21, so leaving T20
      in front of T21 while depending on T22 is a cycle, and check_task_dag
      rejects it.

      THE GENERAL RULE, worth applying to the rest of the plan before starting
      it: a task that owns only CALL SITES and no STORAGE cannot convert
      independently. Check for a declared member before scheduling a group as
      parallel. T12, T10's GetWorldMatrix and now T20 all cost a discovery
      round to learn this the same way.

