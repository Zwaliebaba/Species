    notes: |
      CLOSED, with two documented exceptions rather than a clean sweep. Six
      commits: the nine leaf files, BlueprintStore, the SurfaceMap2D
      specialisation, Landscape, GlobalWorld, and Location. Three CI rounds.

      THE TWO EXCEPTIONS, both structural and both commented at the
      declaration. Location::GetSoundSource overrides
      LocationAccess::GetSoundSource and moves with it in T12. Landscape's ray
      and sphere API passes its out-pointers into MathUtils, which has no
      converting task — see the gap recorded below. Everything else in the
      twenty-three files is native.

      Landscape.cpp holds the SegRayIntersection2D and RayTriIntersection call
      sites, so it depends on T7 having landed even though the edge is through
      T13. LevelFile parses positions out of GameData text — the parse must
      keep producing the same floats, which is a different question from the
      arithmetic being allowed to diverge.

      TWO GAPS IN THE PLAN ITSELF, both found by doing this task rather than by
      reading it, and both blocking work this task was told to finish.

      ONE: MATHUTILS' GEOMETRY API HAS NO CONVERTING TASK. T7 and T8 rebuilt
      RayTriIntersection and RayRayDist on DirectXMath but deliberately kept
      their Vector3 signatures so callers compiled unchanged — that is written
      into both tasks' acceptance. Nothing after them converts those
      signatures, and PointSegDist2D and SegRayIntersection2D still take
      Vector2 const& and Vector2*. T25 then deletes Vector2 and Vector3.

      That is what stops Landscape's ray and sphere API moving. RayHit,
      RayHitCell, UnsafeRayHit and SphereHit all pass their out-pointer
      straight into MathUtils, and THE SEAM DOES NOT REACH THROUGH A POINTER —
      the same asymmetry T14 recorded as failure mode 7, one level up, in a
      signature rather than a call. Both ends are stuck: seventeen call sites
      in ten files pass `&someVector3` to Landscape::RayHit, and those ten
      files belong to four different tasks.

      So Landscape's storage converts here — m_normalMap and the normal
      generation — and its ray and sphere API does not, commented at the
      declaration. Recorded rather than quietly dropped, because the plan's own
      acceptance for this task says no legacy math type remains in these files,
      and that is now known to be unreachable until MathUtils has an owner.
      A task for MathUtils' 3D and 2D geometry signatures needs to exist, and
      T25 depends on it.

      TWO: SurfaceMap2D HAD NO TASK EITHER, and it is not mentioned anywhere in
      this file. Landscape::m_normalMap is a SurfaceMap2D<Vector3>, so Vector3
      cannot be deleted while that stands, and the element type could not
      change because the generic GetValue interpolates with `T * float` and
      `T + T` — which XMFLOAT3 has by design not got.

      Fixed here rather than deferred, because unlike the MathUtils gap it is
      ten lines and touches nothing else: NeuronClient/2dSurfaceMap.h gains an
      explicit GetValue specialisation for XMFLOAT3 that does the same four
      weighted terms through XMVECTOR, in the same order, with separate
      multiplies and adds so the rounding is unchanged. No operator layer, no
      wrapper — the arithmetic moved to the one place that needed it. That
      header is outside this task's file list and outside its project, which is
      why it landed in its own commit.

      EIGHT CI ERRORS, AND BOTH BLIND SPOTS THEY EXPOSED ARE NOW CLOSED.
      check_math_types was green on all eight, for two distinct reasons:

        THREE WERE CONVERTED PARAMETERS. Converting a SIGNATURE leaves every
        use of the parameter behind exactly as converting a local does —
        `(_target - _pos).Mag()` in a body whose header now says XMFLOAT3 — and
        every local regex in the tool ended at `=` or `;`, so a parameter
        ending at `,` or `)` matched none of them. This task converted fifteen
        Location signatures, which is the most any task has moved at once.

        FIVE WERE MEMBERS REACHED THROUGH A TYPED RECEIVER: vertex1.m_pos.Set,
        cmnt->m_front.Normalise, location->m_pos.Set. The tree-wide member
        rules are silent on m_pos, m_front and m_up because those are the three
        most contended names in the codebase, and the per-file rescue added
        during T15 only covers BARE uses. So the three commonest member names
        of all were completely unchecked.

        A typed receiver removes the ambiguity rather than guessing at it: cmnt
        is declared CameraMount* in LevelFile.cpp and CameraMount is declared
        in LevelFile.h, so there is nothing left to resolve. Same shape as
        every other narrowing this tool has taken — a smaller claim about where
        a name's type is known, not a broader regex.

      AND THE COMMA-DECLARATOR BUG, FOR THE SECOND TIME IN TWO TASKS. The first
      cut of the receiver rule caught vertex1 and not vertex2, because
      `LandVertex vertex1, vertex2;` declares two and the regex captured one —
      exactly what the used-before-declared rule got wrong a task earlier with
      `Vector3 pos, normal;`. Both now read the whole declarator run.

      A SMALLER THING WORTH KEEPING. GenerateNormals normalises three times —
      both face normals, then their sum — and only the last one looks
      redundant. It is not: normalising the two faces first is what makes the
      average unweighted, so dropping either would tilt every landscape normal
      toward the steeper face.

