      It turned out not to matter, and the reason is worth knowing: T1 gave
      Vector3 and Vector2 implicit conversions but left Matrix34's as named
      ToNative/FromNative. Adding the implicit pair collapses all 89 to zero —
      they compile untouched and convert under their own tasks. That is not a
      new concession, it is T1 finished.

      STILL TO DO: Shape.h and Shape.cpp, 94 occurrences. The matrix arithmetic
      is the substance — `m_transform * _transform` becomes XMMatrixMultiply,
