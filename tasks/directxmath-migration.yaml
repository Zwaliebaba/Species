      depending on it, which pushes the deletion one wave later. That is the
      honest shape — the plan previously claimed T25 could run after T22-T24,
      and it could not.

      WHY IT IS ONE TASK AND NOT THREE. Landscape::RayHit and RayHitCell pass
      their Vector3* result straight into RayTriIntersection, and
      Landscape::SegRayIntersection2D use does the same in 2D, so the two APIs
      cannot convert in either order without one of them growing a reverse
      seam that does not exist. The seam is one-directional by construction:
      AsLegacy takes XMFLOAT3& to Vector3&, and nothing goes the other way,
      deliberately (see the comment above it in Vector3.h). Converting a
      signature therefore has to move every caller in the same commit.

      WHY IT DEPENDS ON T19, T20 AND T22. Those are the tasks whose files still
      hold legacy storage AND call these APIs. Weapons.cpp and Spam.cpp are
      T19; the four windows are T20; UserInput.cpp and LocationEditor.cpp are
      T22. Every other caller is already converted and reaches these APIs
      through AsLegacy today, so for those files this task DELETES seam calls
      rather than adding them. It does not depend on T23 or T12 — neither owns
      a caller — and it owns NeuronMathTests.cpp itself, which T24's file list
      does not include.

