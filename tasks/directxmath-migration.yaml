      A PRE-EXISTING BUG DELIBERATELY *NOT* FIXED. Bridge::UpdateEntityInTransit
      computes its arrival velocity as (entityPos - signalPos), pointing AWAY
      from the target, where every other velocity in that function points
      towards it. The entity steps to 2*pos - target before the branch below
