        Landscape::RayHit family 20 caller files   17 sites pass &someVector3
        RayTriIntersection       4                 Shape, Landscape, LaserFence, tests
        SphereSphereIntersection 4                 Shape, Tree, Spam, tests
        PointSegDist2D           2                 Weapons, RoutingSystem
        SegRayIntersection2D     1                 Landscape
        RayRayDist               2                 Tripod, tests
        &AsLegacy sites          9 in 3 files      LaserFence, GlobalWorld, Tree
      Re-measure before starting; these will have moved.

      THE OUT-PARAMETER DEFAULTS ARE PART OF THE SIGNATURE. Five of these
      functions default their out-pointer to nullptr and callers rely on it.
      Keep the defaults; converting the pointee type is the whole change.

