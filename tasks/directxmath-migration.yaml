  - id: T8
    title: Rebuild RayRayDist natively and delete the Plane class
    intent: >
      Plane exists to serve RayPlaneIntersection, which exists to serve
      RayRayDist, which has three call sites in Tripod.cpp. Collapsing that
      chain onto XMPlane* removes a class, a header pair and a function.
    project: NeuronCore
    depends_on: [T1]
    files:
      - NeuronCore/MathUtils.h
      - NeuronCore/MathUtils.cpp
      - NeuronCore/Plane.h
      - NeuronCore/Plane.cpp
      - NeuronCore/NeuronCore.vcxproj
      - NeuronCore/NeuronCore.vcxproj.filters
      - Tests/NeuronCoreTests/NeuronMathTests.cpp
    acceptance:
      - RayRayDist computes with XMPlaneFromPointNormal and XMPlaneIntersectLine
      - RayPlaneIntersection is gone, having had exactly one caller
      - Plane.h and Plane.cpp are deleted and removed from the project file and filters
      - NeuronCoreTests covers RayRayDist including the parallel-rays case the current code special-cases
      - GameLogic/Tripod.cpp compiles unchanged
    verify:
      - python3 tools/check_project_files.py
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    parallel_safe: true
    status: done
    notes: |
      LANDED. CI run 368 green at 4ccb3e4, four new tests discovered and
      passing. MathUtils.cpp is 393 lines and MathUtils.h is 104, down from 614
      and 137 when this plan started -- so T4, T5 and T8 between them removed
      about a third of the geometry library without converting a single call
      site.

      THE DEGENERATE CASE WAS A DECISION, not a translation, and it is the part
      worth re-reading if this ever looks wrong. Parallel rays have no unique
      closest approach. The old code asked RayPlaneIntersection, got back a
      status code meaning "parallel, no intersection", IGNORED IT -- the two
      result variables were assigned and never read -- and left the
      out-parameters holding whatever the caller passed in. XMPlaneIntersectLine
      answers with QNaN instead.

      Propagating that NaN would put it into Tripod's leg positions and from
      there into GenerateSyncValue, where it surfaces as a sync assert minutes
      later in a Debug build and nowhere else. So the NaN is tested for and the
      out-parameters are left alone. The test asserts "no NaN escapes" rather
      than a distance, because there is no correct distance to assert.

      Also worth recording: the plane normals differ in sign from the old ones.
      Plane's three-point constructor took (a-b) x (a-c); XMPlaneFromPoints
      takes (P2-P1) x (P3-P1). Both the normal and d flip together, so it is the
      same plane and the intersection point is unchanged -- checked by reading,
      and the perpendicular-skew-lines test would catch it if it were not.

  - id: T9
    title: Move the wire types to XMFLOAT3
    intent: >
      NetworkUpdate, TeamControls and ServerToClientLetter are where the math
      types meet the wire. Converting them first, with T2's byte pins already
      in place, proves the layout claim the whole plan rests on before 200
      files depend on it.
    project: NeuronCore
    depends_on: [T1, T2]
    files:
      - NeuronCore/NetworkUpdate.h
      - NeuronCore/NetworkUpdate.cpp
      - NeuronCore/NetworkUpdate.inc
      - NeuronCore/TeamControls.h
