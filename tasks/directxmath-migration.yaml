      - NeuronClient/PersistingDebugRender.h
      - NeuronClient/TextRenderer.h
      - NeuronClient/TextRenderer.cpp
    acceptance:
      - Shape.cpp holds no GetOr or InverseMultiplyVector call
      - The matrix reading at each former GetOr site is stated in a comment as row-vector, matching T1's conventions block
      - No math type names a graphics API - ConvertToOpenGLFormat is gone, not renamed, and the transpose it performed lives in renderer code
      - The two former ConvertToOpenGLFormat call sites take an XMFLOAT4X4 by value rather than a pointer into a shared static buffer
      - glVertex3fv and glNormal3fv sites pass &v.x on an XMFLOAT3
      - No Vector3, Vector2, Matrix33 or Matrix34 identifier remains in these files
    verify:
      - python3 tools/check_format.py
      - python3 tools/check_hygiene.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
    parallel_safe: true
    status: done
    notes: |
      Matrix33::m_openGLFormat and Matrix34::m_openGLFormat are `static
      float[16]` returned by pointer — a shared mutable buffer that is neither
      reentrant nor thread-safe, and two of the three call sites in the tree
      are here. Returning XMFLOAT4X4 by value fixes that as a side effect;
      say so in the commit rather than leaving it as an unexplained signature
      change. OpenGL wants column-major and DirectXMath stores row-major, so
      the transpose happens in the store — one place, stated once.

      RESHAPED 2026-08-03 after the owner said a Direct3D renderer migration is
      planned. The point is no longer "return XMFLOAT4X4 instead of float*" — it
      is that NO MATH TYPE KNOWS WHICH API IT FEEDS. Both APIs need a transpose
      (GL takes column-major, HLSL packs column-major, DirectXMath stores
      row-major) and they differ on depth range (GL z in [-1,1], D3D z in
      [0,1]), so both belong in renderer code. A member function named
      ConvertToOpenGLFormat is the SHAPE being removed, not a signature to
      modernise: renaming it ConvertToNativeFormat would bake the same
      assumption in with a better name. See NeuronMath.h.

      PARTIALLY DONE, LEFT in_progress DELIBERATELY. 2026-08-04.

      WHAT LANDED: the first acceptance criterion, by deletion rather than
      conversion. Matrix34::GetOr, Matrix34::InverseMultiplyVector and
      Matrix33::InverseMultiplyVector are gone, along with the two
      commented-out blocks in Shape.cpp that were their only appearance
      anywhere in the tree. NeuronMath.h and Matrix33.h are corrected: I had
      described GetOr as carrying the transpose "every time it is called", and
      it is never called.

      WHAT REMAINS: the actual conversion of the eleven renderer files, roughly
      180 occurrences, of which Shape.h and Shape.cpp are 99.

      WHY IT STOPPED HERE RATHER THAN BEING FORCED THROUGH. ShapeFragment's
      math members are PUBLIC and read from GameLogic and Species —
      m_transform, m_angVel, m_vel, m_centre. A member-and-operator sweep finds
      about twenty external sites that stop compiling the moment those become
      XMFLOAT3, in files owned by T14 through T20 and T22, all of which sit
      behind the T13 smoke-test gate. Converting them here would be six other
      tasks' work done out of order and unreviewed, in the commit least able to
      carry it.

      This is T12's defect in a milder form: a task scoped by DIRECTORY over a
      type whose surface is public across directories. T12 could not be done at
      all; this one can, but only by also owning its consumers.

      THE DECISION IS THE OWNER'S, because both answers are defensible:

        (a) T10 owns the ~20 external fix-ups, as T9 did for its two. Keeps
            T10 before the T13 gate, which is where a wrong matrix convention
            is meant to be caught — and Shape is where matrices are actually
            used, so there is a real argument for not gating without it.

        (b) Split T10: the renderer-internal conversion now, Shape's public
            surface into a new task after the GameLogic wave. Smaller commits,
            but the T13 gate then smoke-tests a renderer whose matrices have
            not moved, which is most of what that gate is for.

      Recommend (a). The twenty sites are mechanical, the sweep that finds them
      is written down, and (b) weakens the only verification this migration has.

      OWNER CHOSE (a), 2026-08-04: this task owns the external fix-ups, and
      lands before the T13 gate. Its `files` list therefore understates its
      touch set — the GameLogic and Species sites it has to repair are named in
      the commit rather than added to the list, because they are seam repairs
      rather than conversions and those files still convert in full under their
      own tasks.

      PART 1 LANDED, CI run 394 green at b8d1fb7. Five of the six file groups
      are native: 3dSprite, SphereRenderer, DebugRender, TextRenderer and
      PersistingDebugRender. Two helpers came out of it — RingPoint in
      DebugRender and EmitVertex in TextRenderer — each replacing an expression
      written out three or four times.

      One behaviour change, in RenderArrow: Vector3::SetLength on a zero-length
      vector left (len,0,0) behind, so a degenerate arrow drew a head pointing
      along x. Scaling a normalised vector yields a zero head instead, which
      draws nothing. Debug rendering, degenerate input either way.

      THE ESTIMATE I GAVE THE OWNER WAS WRONG BY ROUGHLY FOUR TIMES. I said
      about twenty external fix-ups; the real figure is 89 call sites passing a
      Matrix34 into Shape's methods, plus the member accesses. The sweep behind
      the estimate looked at member ACCESS and not at method CALLS. Recorded
