      PARTIALLY DONE 2026-08-05, and set back to todo rather than left
      in_progress, for the reason this task's own note gives above: a task
      marked in_progress that nobody is doing stops --next offering it.

      LANDED AND CI-GREEN: the five files that had drifted from clang-format
