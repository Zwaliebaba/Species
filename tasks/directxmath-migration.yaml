      away from the rendered fence, and nothing would have failed to compile.

      A MEMBER RENAMED, WHICH THE MIGRATION NORMALLY DOES NOT DO.
      MineBuilding::m_trackMatrix1/2 were Matrix34 caches whose only read was
      .pos -- the matrix half was never used. Keeping the name over an
      XMFLOAT4X4 would have meant storing sixteen floats to fish out three;
