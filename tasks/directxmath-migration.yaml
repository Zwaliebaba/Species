      between two clients on the same build — the one thing this plan is not
      allowed to cause.

      PART OF THIS IS ALREADY DONE, 2026-08-04, because it went stale faster
      than this task could wait for T25. Checked rather than assumed:

        AGENTS.md already names DirectXMath as a header-only Windows SDK
        dependency — criterion 1 is satisfied.

        CODING_STANDARDS.md#determinism already carries the *Est ban, the
