      diff.

      FIVE WAYS A TYPE CONVERSION BREAKS A FILE YOU DID NOT TOUCH. Each cost a
      CI round here; each will cost more in T14-T20, where the surface is
      hundreds of members rather than nine:

        1. The type name              grep -w Vector3
        2. A converted MEMBER's name  `vel.Mag()` names no type      (T11)
        3. A transitive include       a header stops supplying it     (T9)
        4. The REPLACED type's fields `GetWorldMatrix(m).pos`         (T10)
        5. Default construction       Vector3() zeroed, XMFLOAT3 does not

      Number 5 is the dangerous one: invisible to the compiler and to CI. It
