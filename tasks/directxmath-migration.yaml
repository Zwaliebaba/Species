    parallel_safe: true
    status: todo
    notes: |
      This is the task the seam was built for. Because XMFLOAT3 and Vector3 are
      layout-identical and T1 makes them convert implicitly, an interface can
      change signature while every implementor and caller stays as it is —
      which is what stops this plan needing one 200-file commit.
    notes: |
      BLOCKED 2026-08-03, ON A MISTAKE IN THIS TASK'S OWN PREMISE, found by
      trying to do it.

      The task assumed T1's seam would let an interface signature change while
      "implementors and callers still compile, unedited". That is true of
      ordinary function parameters, where an implicit conversion applies at the
      call site. It is FALSE of virtual functions: an override must match its
      base declaration exactly, in both parameter and return types. Change
      CameraAccess::GetPos from Vector3 to XMFLOAT3 and Species/Camera.h's
      `Vector3 GetPos()` stops overriding it, so Camera stays abstract and the
      build fails. No implicit conversion is consulted, so there is no partial
      version of this task either -- not even the parameter-only half.

      The implementors are in the layers above, and each already belongs to a
      task:

        CameraAccess, UserInputAccess, GameCursorAccess, RendererAccess
                                       -> Species/  (T22)
        LocationAccess                 -> GameLogic/Location  (T18)

      So this task has to land WITH them, not before them. It is re-pointed at
      T18 and T22 via blocked_by and its acceptance is corrected to say the
      overrides change in the same commit.

      WHAT THIS COSTS ELSEWHERE, so it is not a surprise later: any converted
      file that calls one of these interfaces keeps a legacy type at the seam
      until then. T11 has two such locals in SoundInstance.cpp, both feeding
      LocationAccess::GetSoundSource, both commented. Expect more as
      NeuronClient and GameLogic convert. They are not oversights and they all
      clear when this task lands.

      THE GENERAL LESSON, which applies to every remaining conversion task: the
      seam covers values and parameters, NOT virtual signatures. Any task whose
      files declare a pure virtual taking or returning a math type must also
      own its implementors, or be sequenced after them. T11 satisfied that by
      accident of scoping -- SoundLibrary3d's two implementors were already in
      its file list -- rather than by anyone having checked.

