  - id: T10
    title: Convert the client renderers, and fix Shape's transposed matrix reading
    intent: >
      Shape.cpp is where the Matrix33/Matrix34 convention disagreement is
      actually observable — it holds every GetOr and InverseMultiplyVector site
      in the tree. Converting it is also the point at which the transposed
      reading has to be resolved rather than carried.
    project: NeuronClient
    depends_on: [T1, T5, T6, T7]
    files:
      - NeuronClient/Shape.h
      - NeuronClient/Shape.cpp
      - NeuronClient/3dSprite.h
      - NeuronClient/3dSprite.cpp
      - NeuronClient/SphereRenderer.h
      - NeuronClient/SphereRenderer.cpp
      - NeuronClient/DebugRender.h
      - NeuronClient/DebugRender.cpp
      - NeuronClient/PersistingDebugRender.h
      - NeuronClient/TextRenderer.h
      - NeuronClient/TextRenderer.cpp
    acceptance:
      - Shape.cpp holds no GetOr or InverseMultiplyVector call
      - The matrix reading at each former GetOr site is stated in a comment as row-vector, matching T1's conventions block
      - No math type names a graphics API - ConvertToOpenGLFormat is gone, not renamed, and the transpose it performed lives in renderer code
      - The two former ConvertToOpenGLFormat call sites take an XMFLOAT4X4 by value rather than a pointer into a shared static buffer
      - glVertex3fv and glNormal3fv sites pass &v.x on an XMFLOAT3
      - No Vector3, Vector2, Matrix33 or Matrix34 identifier remains in these files
    verify:
      - python3 tools/check_format.py
      - python3 tools/check_hygiene.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
    parallel_safe: true
    status: done
    notes: |
      Matrix33::m_openGLFormat and Matrix34::m_openGLFormat are `static
      float[16]` returned by pointer — a shared mutable buffer that is neither
      reentrant nor thread-safe, and two of the three call sites in the tree
      are here. Returning XMFLOAT4X4 by value fixes that as a side effect;
      say so in the commit rather than leaving it as an unexplained signature
      change. OpenGL wants column-major and DirectXMath stores row-major, so
      the transpose happens in the store — one place, stated once.

      RESHAPED 2026-08-03 after the owner said a Direct3D renderer migration is
      planned. The point is no longer "return XMFLOAT4X4 instead of float*" — it
      is that NO MATH TYPE KNOWS WHICH API IT FEEDS. Both APIs need a transpose
      (GL takes column-major, HLSL packs column-major, DirectXMath stores
      row-major) and they differ on depth range (GL z in [-1,1], D3D z in
      [0,1]), so both belong in renderer code. A member function named
      ConvertToOpenGLFormat is the SHAPE being removed, not a signature to
      modernise: renaming it ConvertToNativeFormat would bake the same
      assumption in with a better name. See NeuronMath.h.

      PARTIALLY DONE, LEFT in_progress DELIBERATELY. 2026-08-04.

      WHAT LANDED: the first acceptance criterion, by deletion rather than
      conversion. Matrix34::GetOr, Matrix34::InverseMultiplyVector and
      Matrix33::InverseMultiplyVector are gone, along with the two
      commented-out blocks in Shape.cpp that were their only appearance
      anywhere in the tree. NeuronMath.h and Matrix33.h are corrected: I had
      described GetOr as carrying the transpose "every time it is called", and
      it is never called.

      WHAT REMAINS: the actual conversion of the eleven renderer files, roughly
      180 occurrences, of which Shape.h and Shape.cpp are 99.

      WHY IT STOPPED HERE RATHER THAN BEING FORCED THROUGH. ShapeFragment's
      math members are PUBLIC and read from GameLogic and Species —
      m_transform, m_angVel, m_vel, m_centre. A member-and-operator sweep finds
      about twenty external sites that stop compiling the moment those become
      XMFLOAT3, in files owned by T14 through T20 and T22, all of which sit
      behind the T13 smoke-test gate. Converting them here would be six other
      tasks' work done out of order and unreviewed, in the commit least able to
      carry it.

      This is T12's defect in a milder form: a task scoped by DIRECTORY over a
      type whose surface is public across directories. T12 could not be done at
      all; this one can, but only by also owning its consumers.

      THE DECISION IS THE OWNER'S, because both answers are defensible:

        (a) T10 owns the ~20 external fix-ups, as T9 did for its two. Keeps
            T10 before the T13 gate, which is where a wrong matrix convention
            is meant to be caught — and Shape is where matrices are actually
            used, so there is a real argument for not gating without it.

        (b) Split T10: the renderer-internal conversion now, Shape's public
            surface into a new task after the GameLogic wave. Smaller commits,
            but the T13 gate then smoke-tests a renderer whose matrices have
            not moved, which is most of what that gate is for.

      Recommend (a). The twenty sites are mechanical, the sweep that finds them
      is written down, and (b) weakens the only verification this migration has.

      OWNER CHOSE (a), 2026-08-04: this task owns the external fix-ups, and
      lands before the T13 gate. Its `files` list therefore understates its
      touch set — the GameLogic and Species sites it has to repair are named in
      the commit rather than added to the list, because they are seam repairs
      rather than conversions and those files still convert in full under their
      own tasks.

      PART 1 LANDED, CI run 394 green at b8d1fb7. Five of the six file groups
      are native: 3dSprite, SphereRenderer, DebugRender, TextRenderer and
      PersistingDebugRender. Two helpers came out of it — RingPoint in
      DebugRender and EmitVertex in TextRenderer — each replacing an expression
      written out three or four times.

      One behaviour change, in RenderArrow: Vector3::SetLength on a zero-length
      vector left (len,0,0) behind, so a degenerate arrow drew a head pointing
      along x. Scaling a normalised vector yields a zero head instead, which
      draws nothing. Debug rendering, degenerate input either way.

      THE ESTIMATE I GAVE THE OWNER WAS WRONG BY ROUGHLY FOUR TIMES. I said
      about twenty external fix-ups; the real figure is 89 call sites passing a
      Matrix34 into Shape's methods, plus the member accesses. The sweep behind
      the estimate looked at member ACCESS and not at method CALLS. Recorded
      because the recommendation to go with option (a) rested on that number.

      It turned out not to matter, and the reason is worth knowing: T1 gave
      Vector3 and Vector2 implicit conversions but left Matrix34's as named
      ToNative/FromNative. Adding the implicit pair collapses all 89 to zero —
      they compile untouched and convert under their own tasks. That is not a
      new concession, it is T1 finished.

      STILL TO DO: Shape.h and Shape.cpp, 94 occurrences. The matrix arithmetic
      is the substance — `m_transform * _transform` becomes XMMatrixMultiply,
      `totalMatrix * m_centre` becomes XMVector3Transform — plus m_positions,
      m_normals and m_positionsInWS moving from Vector3* to XMFLOAT3*, and
      ConvertToOpenGLFormat's two call sites at lines 909 and 1457, which per
      decision 6 must end up in renderer code rather than on the type.

      Stopped here rather than starting Shape and running out mid-file: a
      half-converted Shape.cpp does not compile, and the checkpoint above does.

      DONE. CI run 406 green at 36dd038, after five red rounds -- 398, 400,
      402, 404 -- every one of them a call site the sweep before the push did
      not reach. That is the story of this task and it is worth more than the
      diff.

      FIVE WAYS A TYPE CONVERSION BREAKS A FILE YOU DID NOT TOUCH. Each cost a
      CI round here; each will cost more in T14-T20, where the surface is
      hundreds of members rather than nine:

        1. The type name              grep -w Vector3
        2. A converted MEMBER's name  `vel.Mag()` names no type      (T11)
        3. A transitive include       a header stops supplying it     (T9)
        4. The REPLACED type's fields `GetWorldMatrix(m).pos`         (T10)
        5. Default construction       Vector3() zeroed, XMFLOAT3 does not

      Number 5 is the dangerous one: invisible to the compiler and to CI. It
      surfaced here only because `centre /= n` failed on the same variable that
      CalculateCentre accumulates into -- and the same change had already
      shipped in T11's sound members, where nothing would have caught it. Every
      converted member now carries an explicit {0,0,0}.

      TWO SIGNATURES DELIBERATELY LEFT LEGACY, both recorded rather than
      claimed clean. ShapeMarker::GetWorldMatrix still returns Matrix34,
      because 43 sites in fourteen GameLogic files read .pos or .f off it and
      converting them means whole-file reformatting twenty legacy files from a
      task that owns none of them. And T11's two Vector3 locals still feed
      LocationAccess::GetSoundSource. Both clear when their own tasks land.

      FOUR EXTERNAL FILES CARRY SEAM REPAIRS: Species/Renderer.cpp,
      GameLogic/RadarDish.cpp, GameLogic/Explosion.cpp and
      Tests/NeuronCoreTests/NetworkUpdateTests.cpp. All convert BACK to the
      legacy types on purpose -- RadarDish is simulation code where
      Matrix34::RotateAround's exact semantics matter -- and all are commented
      with the task that will finish them.

      THE OPENGL FORMAT IS NOW ONE FUNCTION, MultiplyGLMatrix, in renderer
      code, and it does nothing: OpenGL reads column-major, DirectXMath stores
      row-major, so the same sixteen floats already are the transpose. That
      coincidence is exactly why it belongs in the renderer -- Direct3D wants a
      different answer and changes it there and nowhere else.

      A DEFECT FROM THIS TASK REACHED THE OWNER, 2026-08-05. Recorded here
      because it is failure mode 5 in a form the {0,0,0} sweep above was
      constructed not to see.

      ShapeMarker::m_transform became an XMFLOAT4X4 and kept the parsing
      constructor's empty initialiser list. Matrix34 was TWELVE floats -- r, u,
      f, pos -- with no fourth column at all, and ToNative() supplied
      (0,0,0,1) for the one it did not have. XMFLOAT4X4 has that column for
      real. The shape-file parser writes nine floats (front, up, pos) and
      NormaliseBasis derives right, so _14, _24, _34 and _44 were never
      written. XMMatrixMultiply reads all sixteen:

        row3 = _41*r0 + _42*r1 + _43*r2 + _44*r3

      so a _44 of about -1e9 times a building position of about 1200 put every
      marker at roughly -1.2e12.

      IT SURFACED AS TWO REPORTS THAT LOOKED UNRELATED. A research item that
      stopped appearing -- Library::Advance spawns one AT a marker's world
      position, `item->m_pos = scrollMarker->GetWorldMatrix(rootMat).pos` -- and
      a GenerateSyncValue assert on a total of -2.5e12, which is that same
      position summed. One uninitialised field, one rendering symptom, one
      determinism symptom.

      WHY THE SWEEP MISSED IT: the sweep asked "which members lost Vector3's
      zeroing", and check_math_types.py encoded exactly that question --
      `if kind in NATIVE_VECTORS`. A matrix that GAINED A FIELD is a different
      question with the same answer, and neither the sweep nor the checker was
      asking it. The checker now checks matrix members too, verified by
      re-introducing the bug.

      THE GENERAL RULE, added to CODING_STANDARDS.md: when a converted type is
      WIDER than the one it replaced, audit every WRITER, not just every
      reader. Fixed in ShapeMarker::m_transform and ShapeFragment::m_transform;
      BuildingPort::m_mat got the same default defensively, being the only
      other bare XMFLOAT4X4 member in the tree.

