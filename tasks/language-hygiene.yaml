  - id: T9
    title: Convert the enums that int typedefs stand in for
    intent: >
      ControlType, InputType and InputCondition are the three the old T4 could
      not have carried. Each has an `int` typedef used interchangeably with it
      across the driver API — controltype_t, inputtype_t and condition_t — so
      making the enum strong means deciding what those typedefs become, and
      that is an API change to ControlBindings and InputDriver rather than a
      keyword swap. InputType is additionally a BIT FIELD, so enum class costs
      it the operators it is built on.
    project: NeuronClient
    depends_on: [T4]
    files:
      - NeuronClient/ControlTypes.h
      - NeuronClient/InputTypes.h
      - NeuronClient/InputSpec.h
      - NeuronClient/InputDriver.h
      - NeuronClient/ControlBindings.h
      - NeuronClient/ControlBindings.cpp
      - NeuronClient/Input.h
      - NeuronClient/Input.cpp
      - NeuronClient/InputDriverWin32.cpp
    acceptance:
      - The three enums are enum class with an explicit underlying type
      - controltype_t, inputtype_t and condition_t either name the enum type or are gone; no signature takes a bare int where an enumerator is meant
      - InputType's bitwise operators are defined on the enum class rather than reached through a cast, and INPUT_TYPE_1D still implies ANALOG
      - The 421 Control* and 216 INPUT_TYPE_* use sites compile without a C-style cast, except at the ControlTypes.inc table boundary, which is listed in notes
    verify:
      - python3 tools/check_layering.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - Owner runs the Garden smoke test — every step needs input to work at all
    parallel_safe: false
    status: todo
    notes: |
      Split out of T4 on 2026-08-03, measured at fdf9421 before either was
      started. The three things that make this its own task, none of which the
      original T4 mentions:

      (1) THE INT TYPEDEFS. InputSpec.h has `typedef int inputtype_t` and
      `typedef int condition_t`, ControlTypes.h has `typedef int
      controltype_t`, and 46 sites use them where the enum is meant —
      ControlBindings::getControlID RETURNS controltype_t, operator[] and bind
      TAKE it. Converting the enum without deciding what these become leaves an
      implicit conversion the enum class was supposed to remove.

      (2) INPUT_TYPE_* IS A BIT FIELD, which the enumerator values say out
      loud: FAIL 0, BOOL 1, ANALOG 2, 1D 6, 2D 10, ANY 15 — 1D and 2D both
      carry ANALOG's bit, and ControlBindings.cpp:52-53 tests and ORs them.
      enum class has no bitwise operators, so this needs them defined or it
      needs to stay a plain enum with a documented reason. That is a design
      decision, not a conversion.

      (3) AN INTEGER LOOP OVER THE RANGE. Input.cpp:293 runs
      `for (controltype_t i = 0; i < NumControlTypes; ++i)`. NeuronHelper.h's
      ENUM_HELPER is what this plan's T5 points at for exactly this case.

      Also worth knowing before starting: ControlTypes.h builds its enumerators
      by including ControlTypes.inc through a DEF_CONTROL_TYPE macro, so the
      enumerator list is generated and the table in ControlTypes.cpp is keyed
      to it positionally. The two must not drift.

