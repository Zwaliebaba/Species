# Schema: docs/TASK_DAG.md    Validate: python3 tools/check_task_dag.py

plan: language-hygiene
title: Tree-wide language cleanups — nullptr, pragma once, enum class, dead files
summary: >
  The mechanical modernisations that are safe as sweeps, plus the enum and
  dead-file work that is not. Owner approved tree-wide sweeps as single
  diffs (2026-08-02). Measured on b69c951 — re-measure: ~578 NULL, 223 of
  242 headers on `#ifndef _included_*` guards (a reserved-form identifier —
  `_lowercase` at global scope — so the sweep also fixes a conformance
  wart), 11 plain enums in headers and zero `enum class` anywhere.

  Sweeps interact with the changed-lines format check: a mechanical
  substitution must not force reformatting of otherwise-untouched legacy
  lines. Both sweep tasks use the `Rename:` commit-trailer mechanism
  (CODING_STANDARDS.md, "Declare the rename in the commit") so
  check_format.py skips lines whose only change is the substitution.

  Sweeps are parallel_safe: false and touch nearly every file — run each at
  a moment when no other task (in any plan) is in flight, land it, and let
  everyone rebase. They are cheap to redo from scratch if they collide.

  Determinism: nullptr-for-NULL and pragma-once-for-guards are compile-time
  identical. The enum tasks are not automatically safe — three enums are
  wire values — which is why they are separate, ordered tasks with pinning.

tasks:
  - id: T1
    title: Sweep NULL to nullptr tree-wide
    intent: >
      ~578 occurrences across all six projects become nullptr, ending the
      convention split. Purely textual for pointer contexts; any NULL used
      as an integer 0 (rare, found during the sweep) is left in place and
      listed in notes rather than silently changed.
    depends_on: []
    notes: >
      Six NULLs were not null pointers, in three disguises CI unmasked one
      compile round at a time — worth knowing before the next sweep of
      this kind, because none is greppable:

      (1) Value contexts, now the literal 0 NULL expanded to:
      ParticleSystem.h:91's default argument constructs RGBAColour(0)
      through the int constructor (C2440), and NetThreadWin32.cpp:13
      feeds CreateThread's SIZE_T stack-size and DWORD flags.

      (2) Template-dependent T, now T(): HashTable.h:41's GetData default
      argument and BTree.h:88's node reset assigned NULL to T, converting
      per instantiation. T() value-initialises to the same 0 / 0.0f /
      null for every instantiation in the tree.

      (3) Typedef'd integers, KEPT as NULL: the ControlTypes.cpp:14 and
      InputDriver.cpp:25 table terminator rows put NULL in
      inputtype_t/condition_t columns (typedef int, InputSpec.h). These
      are the integer-context exception this task's intent reserves.
      Writing 0 is semantically identical but makes the line newly
      authored, and the changed-lines format check then rewrites the
      whole hand-aligned table — an incidental reformat of legacy code
      the standards forbid. Two documented NULLs cost less.

      Everything else in the tree was a genuine pointer context. The
      remaining grep hits are these two plus a comment and a string
      literal (Matrix33.h:5, Win32EventHandler.cpp:101).
    files:
      - NeuronCore
      - NeuronClient
      - NeuronServer
      - GameLogic
      - Species
      - Server
    acceptance:
      - grep -rw NULL over the six projects returns 0 code occurrences (comments and any noted integer-context exceptions aside)
      - The commit carries a "Rename: NULL=nullptr" trailer and check_format.py passes without reformatting legacy lines
      - The solution builds and the suite passes
    verify:
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    parallel_safe: false
    status: done

