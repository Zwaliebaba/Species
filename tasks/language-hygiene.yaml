  - id: T7
    title: Ratchet the sweeps with a hygiene check in CI
    intent: >
      A sweep that is not enforced regrows. A small tools/check_hygiene.py
      rejects NEW occurrences of NULL, `#ifndef _included`, strcpy-family
      calls and plain `enum` in changed lines — same changed-lines-only
      philosophy as check_format.py, so legacy files not yet converted do
      not fail. Added to ci.yml alongside the existing four checks; this is
      a new check, not a build-topology change, but flag it to the owner in
      the PR since ci.yml is shared.
    depends_on: [T1, T2]
    files:
      - tools/check_hygiene.py
      - .github/workflows/ci.yml
      - AGENTS.md
    acceptance:
      - check_hygiene.py fails on a synthetic diff reintroducing each banned pattern and passes on the clean tree
      - CI runs it on every push; AGENTS.md's "Before you push" section lists it
    verify:
      - python3 tools/check_hygiene.py
      - python3 tools/check_task_dag.py
    parallel_safe: true
    notes: >
      Landed 2026-08-02. tools/check_hygiene.py enforces four rules on changed
      lines only, the same contract as check_format.py and for the same reason:
      a whole-file rule would fail most of the tree, because stages 4 and 5 have
      not run, and a check that has to be switched off to get work done is not a
      check. `--all` scans whole files as a diagnostic and is explicitly not a
      gate.

      Acceptance evidence, all run on Linux: a synthetic file exercising every
      rule reports exactly eight findings and exits 1, while `enum class`,
      `enum struct`, a comment naming NULL and sprintf, and a string literal
      containing both are all correctly ignored. Four diff scenarios were run
      against real history — untracked file inside a checked root (flagged),
      untracked file outside one (ignored), a committed file diffed against
      HEAD~1 (flagged), and one line inserted into NeuronCore/Preferences.cpp,
      a legacy file already full of violations, which reported that line and
      nothing else. The clean tree exits 0.

      Two design decisions worth keeping. String literals and comments are
      blanked before matching, because the first false positive on a comment
      is what teaches people to suppress the tool reflexively —
      layering-inversion T13 recorded the mirror-image failure, where a
      substring search for g_app matched "dialog_apply". And the escape hatch
      is a `hygiene-ok` marker rather than a config file, so an exception is
      visible on the line it applies to; T1's two typedef'd-integer NULLs in
      ControlTypes.cpp and InputDriver.cpp are what it exists for, though
      neither carries the marker yet since neither line has been touched
      since.

      Known limitation, accepted: strip_noise is single-line, so a banned token
      inside a multi-line block comment still matches. `hygiene-ok` covers it.

      Not verified here: nothing in this task compiles, so the msbuild and
      vstest lines other tasks carry do not apply. CI's static-checks job runs
      the new check on every push, which is the verification that matters for
      it.
    status: done

  - id: T8
    title: Retire the min and max macros that shadow the std functions
    intent: >
      NeuronCore/MathUtils.h defines function-style `min(a,b)` and `max(a,b)`
      macros. NeuronCore.h sets NOMINMAX to keep the Windows pair out, and then
      this header puts an equivalent pair back — so `std::min` and `std::max`
      do not compile anywhere MathUtils.h is reachable, which from a NeuronCore
      header is most of the tree. Every stage 3, 4 and 5 conversion wants those
      functions; today each one has to write the comparison out by hand and
      explain why. Replacing the macros with the std functions removes a
      standing obstacle rather than a wart.
    project: NeuronCore
    depends_on: []
    files:
      - NeuronCore/MathUtils.h
    acceptance:
      - MathUtils.h defines no min or max macro; grep -nE "define[[:space:]]+(min|max)\b" over the six projects returns nothing
      - The 216 bare min(/max( call sites across 51 files resolve to std::min/std::max, by include or by qualification, with no change to any computed value
      - A file that previously failed on std::min now compiles — NetworkUpdate.cpp's SetClientIp is the worked example, and its hand-written comparison collapses back to std::min in the same commit
    verify:
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    parallel_safe: false
    notes: >
      Found on 2026-08-02 by strings-modernised T2, the hard way: one
      std::min in NetworkUpdate.cpp failed CI with C2589, and it turned out to
      be the only std::min or std::max anywhere in the tree. Nobody had tried
      before, which is why a macro that shadows two of the most reachable
      functions in the standard library had gone unnoticed.

      Determinism: min and max on floats are the macro's `(a) < (b) ? ...`
      versus std::min's `b < a ? b : a`. Those agree for every non-NaN input
      and pick different arguments only on ties of equal value, so no computed
      float changes — but the macros also double-evaluate their arguments, so
      any call site passing an expression with a side effect (or an expensive
      one) changes behaviour when it stops being evaluated twice. Audit for
      that while converting; it is the one place this can bite.

      MathUtils.cpp carries a third-party notice listed in LICENSE. MathUtils.h
      does not, but check before editing rather than after.

      parallel_safe false: 51 files, and the include-order sensitivity means a
      half-landed version is worse than either end state.

      DONE 2026-08-03. 216 grep matches at b0bde71, which resolve to 202 call
      sites: 2 were the macro definitions and 12 are inside commented-out code
      or prose, left alone. 188 converted mechanically, 12 needed an explicit
      type, 2 were preserved verbatim. 50 files.

      THE FINDING THAT MATTERS, and it is not a formatting one. Spirit.cpp
      wrote `max(m_hover.y, 0.0f + syncfrand(0.5f))` in StateBirth and the same
      shape with syncfrand(2.0f) in StateDeath. The macro evaluates its second
      argument TWICE — once in the comparison, once to produce the result — so
      when m_hover.y loses the comparison, syncfrand() is called a second time
      and THAT second draw is what lands in m_hover.y. Two consequences:
      the expression does not compute a maximum (the value stored can be lower
      than m_hover.y), and the number of draws from the synchronised stream
      depends on the comparison. syncrand() is the deterministic lockstep RNG,
      and CODING_STANDARDS.md#determinism names its call sequence as network
      identity.

      Both sites are preserved EXACTLY, written out as the conditional the
      macro expanded to, with the reason in a comment at the call site.
      Collapsing them to std::max would have been a one-character-looking
      change that altered the RNG sequence — the precise failure this plan's
      determinism paragraph warns about, found in the wild rather than
      theorised. Whether the double draw is intended is an owner question and
      a behaviour change either way; it is deliberately NOT decided here.

      TWELVE MIXED-TYPE SITES, which is the other thing a sweep would have got
      wrong. The macro's conditional operator applies the usual arithmetic
      conversions, so `max(pos.x, 20)` compiled and returned a float;
      std::max cannot deduce from (float, int) and fails. Each was rewritten to
      the type the conditional operator produced, not to the type that looked
      tidy: Rocket's maxLoops and m_surges are floats compared against integer
      literals, Centipede's newHealth likewise, Armour's and Engineer's speed
      clamps compare a float against an `unsigned char` stat, Camera's
      forwardSpeed against 1000/2000, Location's pos.x/pos.z against 20, and
      `int numDebris = max(1, <float>)` needed a static_cast<int> around a
      float std::max to keep the same truncation.

      ONE OF THEM IS A DIFFERENT NUMBER IF WRITTEN NAIVELY.
      Camera::AdvanceMoveToTargetMode clamps a DOUBLE against the literal 0.2f.
      The macro promoted 0.2f to double — 0.20000000298023224 — and writing
      std::max(x, 0.2) would substitute 0.2000000000000000111. It is
      static_cast<double>(0.2f), with the arithmetic in a comment, because the
      acceptance criterion is "no change to any computed value" and this is
      exactly the kind of change that hides inside a tidy-up.

      DOUBLE EVALUATION ELSEWHERE, all benign and all now single: four
      heightmap GetValue lookups (Engineer x3, Water), Spam's landHeight, and
      SoundLibrary3dDSound's GetMaxChannels. Same values, one call instead of
      two. Species/Script.cpp's `max(m_waitUntil, GetHighResTime() + _time)`
      read the CLOCK twice and used the second reading; it reads once now,
      which is a real behaviour change of sub-microsecond size on a real-time
      script wait, not on anything the simulation sees.

      TWELVE MATCHES LEFT, all in commented-out code: InvertMatrix's two prose
      comments, four commented-out assignments (SoulDestroyer, Armour, Camera,
      GameMenu), and six inside the /* ... */ block that spans GameCursor.cpp
      772-953. That block is why SELECTION_ARROWS_MAX_ALPHA and BOOST_FADE_RATE
      are used in that file and defined nowhere in the tree — worth knowing
      before someone greps for them. Rewriting dead comments is noise, so they
      were left; none is a call site.

      MessageDialog.cpp needed a whole-file reformat first, in its own commit.
      It is tab-indented legacy and two converted lines sit in one hunk with
      untouched lines between them, so the changed-lines format check
      reformatted those too and each --fix pass dragged in the next adjacent
      line. It was the only one of the fifty that did.

      NOT COMPILED HERE. This was done on Linux; the six Python checks pass and
      nothing else was run. Every mixed-type site is a compile error if the
      analysis is wrong, which makes CI's x64 Debug build the real verification
      — and a green build is still not evidence that the game runs. The two
      Spirit.cpp sites are argued from the code and are not covered by any
      test; the Garden smoke test would not catch a changed RNG sequence in
      single player either.
    status: done

