    depends_on: []
    files:
      - NeuronCore
      - NeuronClient
      - NeuronServer
      - GameLogic
      - Species
      - Server
    acceptance:
      - grep -rlE "#ifndef _included" over the six projects returns nothing
      - Every header in the six projects contains exactly one `#pragma once`
      - The solution builds and the suite passes
    verify:
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    parallel_safe: false
    status: done

  - id: T3
    title: Pin and convert the wire enums to enum class
    intent: >
      NetworkUpdate::UpdateType, ServerToClientLetter::LetterType and
      NetLib's NetRetCode are serialised as integers — their numeric values
      are the protocol. Each enumerator's value gets pinned in the wire
      tests first (where the byte-pinning tests do not already fix them),
      then the enums become enum class with explicit underlying type and
      unchanged values, with casts at the serialisation boundary.
    project: NeuronCore
    depends_on: []
    files:
      - NeuronCore/NetworkUpdate.h
      - NeuronCore/NetworkUpdate.cpp
      - NeuronCore/ServerToClientLetter.h
      - NeuronCore/ServerToClientLetter.cpp
      - NeuronCore/NetLib.h
      - Tests/NeuronCoreTests/NetworkUpdateTests.cpp
      - Tests/NeuronCoreTests/ServerToClientLetterTests.cpp
    notes: >
      File overlap without an ordering: containers-replaced T4 also touches
      ServerToClientLetter.h/.cpp and the letter tests. Neither task has to
      precede the other — this one changes enumerator types at the
      serialisation boundary, that one changes the container behind the
      updates — but they must not run concurrently. Whichever starts second
      rebases. There is deliberately no blocked_by edge here: a collision is
      not an ordering, and inventing one would serialise two tasks that are
      genuinely independent.
    acceptance:
      - Each enumerator's numeric value is asserted by a test that passes on both sides of the conversion
      - The three enums are enum class with an explicit underlying type
      - The existing byte-pinning wire tests pass unchanged
    verify:
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    parallel_safe: true
    status: todo

