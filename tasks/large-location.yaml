# Implementation DAG for the 65,536 x 65,536 Location.
# Written from docs/LARGE_LOCATION.md Part 2 (milestones M1-M4); M0 is
# tasks/landscape-index-safety.yaml and precedes this plan via blocked_by.
# Schema and conventions: docs/TASK_DAG.md
# Validate with:  python3 tools/check_task_dag.py tasks/large-location.yaml

plan: large-location
title: Raise the Location to 65,536 x 65,536 under the no-regression bar
summary: >
  Executes docs/LARGE_LOCATION.md, whose fifteen owner decisions (D1-D15,
  all dated 2026-08-06) are the authority this plan implements and does not
  reopen. The shape in one paragraph, so a task can be judged against it:
  the large map is 32x32 chunks of 128x128 terrain cells at cellSize 16
  (D12), terrain and population are pure integer functions of
  (worldSeed, chunkCoord, layer) (D6, D15), residency is a policy bounded
  by the unchanged 15,000 far plane (D8), the twelve authored maps keep
  their exact load path and behaviour throughout (D7), and the map is
  populated at today's density via per-chunk ledgers materialised by
  simulation-keyed region activation under an explicit active budget (D5,
  D10) - which is what keeps ~245,000 entities compatible with the
  deterministic lockstep this plan must never break.

  Milestone gates T5, T10, T16 and T19 are owner Garden/large-map runs, the
  same kind of node as input-native-events/T12 - CI proves none of what they
  prove. Every task before a gate keeps the authored maps green so the
  seven-step Garden baseline never stops being the control. The performance
  bar and its proposed numbers are in docs/LARGE_LOCATION.md Part 3; the
  Garden baseline that makes them falsifiable is captured at the T10 gate
  (D9).

tasks:
  # ---------------------------------------------------------------- M1
  - id: T1
    title: Move 2dSurfaceMap.h down to NeuronCore
    intent: >
      D13. The per-chunk terrain container must be reachable below the
      client layer so a headless server can hold terrain later. The header
      includes only 2dArray.h and NeuronMath.h, both already in NeuronCore,
      and NeuronClient's include directories already list NeuronCore, so no
      #include text changes anywhere - the move is two .vcxproj edits and a
      file relocation.
    project: NeuronCore
    blocked_by:
      - landscape-index-safety/T2   # edits 2dSurfaceMap.h construction
      - landscape-index-safety/T4   # edits its accessors; M0 lands first
    files:
      - NeuronCore/2dSurfaceMap.h
      - NeuronClient/2dSurfaceMap.h
      - NeuronCore/NeuronCore.vcxproj
      - NeuronCore/NeuronCore.vcxproj.filters
      - NeuronClient/NeuronClient.vcxproj
      - NeuronClient/NeuronClient.vcxproj.filters
    acceptance:
      - 2dSurfaceMap.h exists under NeuronCore and not under NeuronClient,
        and no #include line anywhere changed its spelling
      - check_layering reports no upward include; check_project_files is
        clean on all four touched project files
      - The full solution builds and all tests pass, unchanged in count
    verify:
      - python3 tools/check_layering.py
      - python3 tools/check_project_files.py
      - vstest.console.exe ARM64\Debug\*Tests.dll /Platform:ARM64
    parallel_safe: true
    status: todo
    notes: >
      AGENTS.md's standing lesson on moved/deleted headers - a header
      withdraws everything it INCLUDED, not just what it declared - is the
      thing to check: grep what NeuronClient sources were getting through
      this header's includes before declaring the move trivial.

