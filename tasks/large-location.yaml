    intent: >
      One whole-map vertex array and one draw become one mesh per chunk,
      frustum-culled against the unchanged 15,000 far plane, no LOD (D8).
      The strip builder, below-water skip, colour and UV logic are reused
      per chunk with chunk-local offsets. On authored maps the rendered
      image is unchanged; the win only cashes in at M2 scale.
    project: GameLogic
    depends_on: [T3]
    files:
      - GameLogic/LandscapeRenderer.h
      - GameLogic/LandscapeRenderer.cpp
      - GameLogic/Landscape.cpp
      - GameLogic/Location.cpp
    acceptance:
      - LandscapeRenderer builds and owns one mesh per chunk; RenderLandscape
        submits only chunks intersecting the frustum
      - The fog constant the large map runs with is read from
        Species/Renderer.cpp, pinned Garden-like (~3,000-4,000 units of
        effective terrain visibility per the design's area E arithmetic),
        and recorded in this task's notes with the resulting worst-case
        triangles-per-frame figure - fog is the triangle bound that makes
        no-LOD true, and pushing it toward the far plane is a new decision,
        not a tuning knob
      - Chunk meshes draw from a pooled buffer set - VBOs are recycled on
        evict and rebuild, never created and destroyed per chunk
      - No vertex allocation is sized from whole-world dimensions
      - Authored maps render visually identically (owner-confirmed at the T5
        gate; nothing in CI can see this and this task does not claim it)
    verify:
