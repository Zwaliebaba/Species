      by construction) and a ChunkCoord with the world-to-chunk conversions,
      in one header pair in GameLogic. This is also the seam the open-world
      int64 design later widens (docs/LARGE_LOCATION.md area A), so the
      conversion lives in exactly one place.
    project: GameLogic
    depends_on: []
    files:
      - GameLogic/TerrainChunk.h
      - GameLogic/TerrainChunk.cpp
      - GameLogic/GameLogic.vcxproj
      - GameLogic/GameLogic.vcxproj.filters
      - Tests/GameLogicTests/TerrainChunkTests.cpp
      - Tests/GameLogicTests/GameLogicTests.vcxproj
      - Tests/GameLogicTests/GameLogicTests.vcxproj.filters
    acceptance:
      - ChunkCoord conversion is tested at the origin, at chunk borders, at
        the exact world edge 65,536, and one sample inside and outside each
      - The shared-border rule (sample row/column 128 of chunk N equals row
        zero of chunk N+1) is stated in the header comment and pinned by a
        test
      - Chunk constants (128 cells, cellSize 16, 32x32 chunks) are named
        constants in one place, per D12
    verify:
      - python3 tools/check_project_files.py
      - python3 tools/check_format.py
      - vstest.console.exe ARM64\Debug\*Tests.dll /Platform:ARM64
    parallel_safe: true
    status: todo

