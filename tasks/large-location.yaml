  - id: T13
    title: Population generation layer, generated buildings, and the ledger
    intent: >
      D5/D10/D17 made data. A population layer of the T6 function - per
      chunk, biome-keyed off the terrain octaves, clumped, deterministic
      spawn groups of species, counts and positions, with clump size clamped
      so the worst-case activation is bounded. Buildings are part of this
      layer and come FIRST - sites slope-constrained, each with a
      deterministic id keyed (chunk, ordinal), because building ids are
      load-bearing (pylons, fences and tracks link by int id) - and the
      terrain function flattens under the chosen sites as its final step,
      which is what keeps generated buildings from floating on noise while
      terrain stays a pure function. The ledger is the dormant form -
      records, not entities - with full survivor state per D17 and a
      deterministic materialisation order. Data only; the machinery that
      wakes it is T14.
    project: GameLogic
    depends_on: [T6]
    files:
      - GameLogic/WorldGeneration.h
      - GameLogic/WorldGeneration.cpp
      - GameLogic/PopulationLedger.h
      - GameLogic/PopulationLedger.cpp
      - GameLogic/GameLogic.vcxproj
      - GameLogic/GameLogic.vcxproj.filters
      - Tests/GameLogicTests/PopulationLedgerTests.cpp
      - Tests/GameLogicTests/GameLogicTests.vcxproj
      - Tests/GameLogicTests/GameLogicTests.vcxproj.filters
    acceptance:
      - Population purity is pinned like terrain purity - same (seed,
        chunkCoord) yields identical groups, any order
      - Building sites are slope-constrained, id'd (chunk, ordinal), and a
        test pins that terrain generated for a chunk is flat under every
        site the population layer places in it - the flatten is part of
        generation, so a regenerated chunk comes back flattened identically
      - Clump-size clamp is a named constant and a test proves no chunk's
        ledger exceeds it
      - The ledger record carries full survivor state per D17 - type,
        fixed-point position at ~0.1-unit quantisation, health, group
        membership - and chunk membership is position at dematerialise time
      - Ledger round-trip is pinned - materialise-order list ->
        dematerialise -> materialise yields identical records, keyed
        (chunk, ordinal) so stable ids can be laid over it later without a
        format change
      - The record format carries a version byte, and a ByteStream-style
        test pins its serialised bytes - the open world's delta store will
        serialise exactly this record, and the format is versioned before
        anything depends on it
      - The world total at the D5 density is computed by a test and
        recorded in the task notes as the number the design's ~245,000
        estimate becomes
    verify:
      - python3 tools/check_project_files.py
      - python3 tools/check_format.py
      - vstest.console.exe ARM64\Debug\*Tests.dll /Platform:ARM64
    parallel_safe: true
    status: todo

  - id: T14
    title: Region activation - simulation-keyed wake, budget, sync coverage
    intent: >
      The machinery that keeps a quarter-million entities compatible with
      lockstep. Regions (3x3 chunks) activate on simulation-visible causes
      only - player-controlled units, orders, active buildings - never the
      camera (docs/LARGE_LOCATION.md 1.5 rule 4). Activation materialises
      the region's ledgers through the normal spawn paths in ledger order;
      deactivation writes survivors back. The active-entity budget is a
      named constant starting at the design's proposed 4,000.
      GenerateSyncValue keeps summing the active containers and folds in a
      ledger checksum per modified chunk.
    project: GameLogic
    depends_on: [T7, T11, T13]
    files:
      - GameLogic/RegionActivation.h
      - GameLogic/RegionActivation.cpp
      - GameLogic/Location.h
      - GameLogic/Location.cpp
      - Species/Main.cpp
