  # ---------------------------------------------------------------- M2
  - id: T6
    title: Integer lattice generation, keyed streams, pinned golden values
    intent: >
      D6/D15. Terrain height becomes a pure function of (worldSeed,
      chunkCoord, layer) - hand-rolled integer value-noise octaves, each
      lattice hash a pure function of (worldSeed, layer, latticeX,
      latticeZ), accumulated in fixed point and converted to float once at
      the end. Naturally border-continuous, no whole-tile context, no
      shared RNG state - the determinism rules 1 and 2 of
      docs/LARGE_LOCATION.md 1.5 made executable.
    project: GameLogic
    depends_on: [T2]
    files:
      - GameLogic/WorldGeneration.h
      - GameLogic/WorldGeneration.cpp
      - GameLogic/GameLogic.vcxproj
      - GameLogic/GameLogic.vcxproj.filters
      - Tests/GameLogicTests/WorldGenerationTests.cpp
      - Tests/GameLogicTests/GameLogicTests.vcxproj
      - Tests/GameLogicTests/GameLogicTests.vcxproj.filters
    acceptance:
      - Purity is pinned - the same (seed, chunkCoord) yields a bit-identical
        block regardless of generation order or which other chunks were
        generated first
      - Border continuity is pinned - adjacent chunks agree exactly on their
        shared samples
      - Golden values are pinned - specific samples for a fixed seed are
        asserted as exact integers, so a compiler or flag change that moves
        the terrain fails the suite instead of shipping a different world
      - Nothing in WorldGeneration draws from syncrand, speciesRandom, or
        any shared RNG state - grep both names, zero hits
    verify:
