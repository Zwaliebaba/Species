  # ---------------------------------------------------------------- M3
  - id: T11
    title: EntityGrid becomes sparse, hashed, population-proportional
    intent: >
      The 8.6 GB dense allocation (docs/LARGE_LOCATION.md 1.2) becomes a
      per-team hash of occupied cells only. Query semantics are the
      dangerous part, not storage - neighbour ordering feeds AI target
      selection which feeds positions which feed the sync value, so radius
      queries must walk the cell rectangle in the exact x-then-z order the
      dense grid walks it.
    project: GameLogic
    depends_on: []
    files:
      - GameLogic/EntityGrid.h
      - GameLogic/EntityGrid.cpp
      - Tests/GameLogicTests/EntityGridTests.cpp
    acceptance:
      - Characterisation first, conversion second, in separate commits -
        tests written against the dense grid (same insertions -> pinned
        results AND result order for GetNeighbours, GetEnemies,
        GetBestEnemy, the counting and presence variants) still pass
        unmodified on the sparse grid
      - Shadow-mode dual verification exists behind a Debug define - dense
        and sparse grids run side by side with every query asserting equal
        results and order - and stays on through the next Garden gate
        before being stripped, same pattern as T3
      - No simulation-reachable code iterates the hash container - every
        query walks its cell rectangle by key lookup in the dense grid's
        x-then-z order, and the only range-iteration permitted is in Render
        or debug paths; stated in a comment on the container member
      - The container is pre-sized (reserve or equivalent) so rehashing
        cannot spike inside Advance
      - No allocation in EntityGrid is sized from GetWorldSizeX/Z
      - Memory is proportional to occupied cells - asserted by a test that
        inserts N entities and checks the cell count is bounded by N
    verify:
      - python3 tools/check_project_files.py
