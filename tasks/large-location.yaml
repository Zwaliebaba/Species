    status: todo

  - id: T7
    title: Chunk residency as a policy, with synchronous simulation queries
    intent: >
      The lifecycle generate -> resident -> evict behind a policy interface,
      with the camera window (one ring beyond the far plane) as the client
      policy and budgeted per-frame generation to bound hitches. The
      load-bearing rule is docs/LARGE_LOCATION.md 1.5 rule 3 - a
      simulation-critical query (GroundHeight, IsWalkable, ray and sphere
      hits) against a non-resident chunk generates it synchronously and
      deterministically, so no simulation value ever depends on what the
      local client happened to have resident.
    project: GameLogic
    depends_on: [T3, T4, T6]
    blocked_by:
      - landscape-index-safety/T4   # wrap-to-zero becomes live under
                                    # partial residency; clamp must land
    files:
      - GameLogic/ChunkManager.h
      - GameLogic/ChunkManager.cpp
      - GameLogic/Landscape.h
      - GameLogic/Landscape.cpp
      - GameLogic/GameLogic.vcxproj
      - GameLogic/GameLogic.vcxproj.filters
      - Tests/GameLogicTests/ChunkManagerTests.cpp
      - Tests/GameLogicTests/GameLogicTests.vcxproj
      - Tests/GameLogicTests/GameLogicTests.vcxproj.filters
    acceptance:
      - A test pins that generate -> query -> evict -> query returns
        bit-identical values, and that a query against a never-resident
        chunk answers identically to one against a long-resident chunk
      - Residency policy is an interface with the camera-window policy as
        one implementation; authored maps run an everything-resident policy
        and behave exactly as before, and the everything-resident policy is
        selectable on the large map by a named preference - the debugging
        kill switch that separates streaming bugs from logic bugs
      - The coarse height envelope exists - min/max height per chunk,
        computed closed-form from the coarse octaves at load and always
        resident - and conservative ray and line-of-sight queries resolve
        against it first, forcing full chunk generation only where the
        envelope admits a possible hit; a test pins that the envelope
        bounds every sample of a generated chunk
      - Per-frame generation budget is a named tunable; exceeding demand
        queues chunks rather than stalling the frame unboundedly
    notes: >
      The T4 edge is a file-collision serialisation as much as logic - both
      tasks edit Landscape.cpp and would otherwise share a wave; it also
      matches the milestone order, since T4 closes M1's code and this opens
      M2's. docs/TASK_DAG.md names the edge as the sanctioned fix.
    verify:
      - python3 tools/check_project_files.py
      - python3 tools/check_format.py
      - vstest.console.exe ARM64\Debug\*Tests.dll /Platform:ARM64
    parallel_safe: true
    status: todo

