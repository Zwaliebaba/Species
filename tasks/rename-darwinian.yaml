      FILES TO git mv: GameLogic/Darwinian.cpp + .h (20 include sites, 4
      vcxproj/filters entries). Allowlist: 14 entries, all
      GameLogic/Darwinian.cpp ->; exactly one invocation needed:
      "python3 tools/check_layering.py --rename GameLogic/Darwinian.cpp
      GameLogic/Citizen.cpp" (Darwinian.h has no entries).

      HARDCODED LITERALS that do NOT follow automatically (hand edits):
      "Sprites/Darwinian.bmp" x5 (Darwinian.cpp:2357, BlueprintStore:383,
      430, MainMenus:539, Team.cpp:564); "Darwinian.shp" in Officer.cpp:47;
      "Darwinian SeenThreat"/"Darwinian TakenControl" StopAllSounds
      literals x4 (Darwinian.cpp:464,481,805,1660 — mirror
      SoundInstance::SetEventName's "<TypeName> <Event>" format);
      "SpawnDarwinians" (Triffid.cpp:488 names[] + spawnname key +
      SpawnPoint.cpp:651,671 PROFILE labels); "Render Darwinians" PROFILE
      label (Team.cpp:478,480); "LoadDarwinian"/"UnloadDarwinian"
      (Armour.cpp:390-414 — orphan sound events, not in Sounds.txt);
      FilesysUtilsTests path fixtures x6 (cosmetic).

      GAMEDATA BY FILENAME (37): Shapes/Darwinian.shp,
      Sprites/Darwinian.bmp, Icons/IconDarwinian.bmp, 34 wavs — of which 13
      are referenced by Sounds.txt SAMPLEs (DarwinianThreatAttack{,2,3},
