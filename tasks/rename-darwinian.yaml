      The save-path half of CODING_STANDARDS' frozen table
      ("~/.darwinia", "Application Support/Darwinia") NO LONGER EXISTS —
      App::GetProfileDirectory now returns "" — so the doc's count of 30
      overstates; correct that table when T3 lands. Docs to update with T3:
      CODING_STANDARDS.md (rename section + worked example), GLOSSARY.md
      (Darwinian row + frozen-names note), AGENTS.md:247 (smoke-test row
