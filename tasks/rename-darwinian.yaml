# Schema: docs/TASK_DAG.md    Validate: python3 tools/check_task_dag.py

plan: rename-darwinian
title: Rename the Darwinian entity across code, assets and content, gated on the owner
summary: >
  The one rename CODING_STANDARDS.md describes as unblocked but unwritten:
  the Darwinian entity and everything derived from it. It was gated on the
  game running so a missed reference is catchable — the game runs, so this
  is now executable, but only as ONE deliberate operation covering code,
  assets and content together, verified by an owner-run Garden smoke test.

  Measured scope on b69c951 (re-derive with grep -rlw): ~372 occurrences
  across 27 spellings — level-file entity strings ("Darwinian 0 598.8 ..."),
  GameData filenames (Shapes/Darwinian.shp, Sprites/Darwinian.bmp,
  Icons/IconDarwinian.bmp, ~40 Sounds/*Darwinian*.wav), language-table
  keys, and the code identifiers derived from the entity name
  (TypeDarwinian, FindDarwinian, numDarwinians, RenderDarwinians, the
  Darwinian class itself).

  Explicitly OUT of scope, per the frozen-groups table: the "DARWINIA"
  title text and window class (branding, owner's call, not a refactor) and
  the ~/.darwinia user-data paths (renaming orphans every existing save).
  Those stay until the owner opens a separate decision.

  Why a rename plan lives among modernisation plans: content resolves by
  string at runtime and fails silently when missed, which is exactly why
  this must be a planned, gated task rather than something an agent does
  opportunistically. Nothing else in any plan may rename Darwinian or any
  GameData-coupled name.

tasks:
  - id: T1
    title: Owner decides the replacement name
    intent: >
      Every downstream step substitutes one name; nothing can start until
      the owner picks it. CODING_STANDARDS.md's worked example uses
      "Citizen" (TypeCitizen), which fits the colony framing — offered as
      the default, not assumed.
    depends_on: []
    files: []
    acceptance:
      - The chosen name is recorded in this task's notes by or with the owner
    status: done
    notes: >
      Decided by the owner on 2026-08-02: the replacement name is Citizen
      (TypeCitizen, numCitizens, Citizen.shp, and the "Citizen" entity
      string in level files). Chosen over Colonist and Settler.

  - id: T2
    title: Build the complete rename inventory
    intent: >
      A rename that misses one string fails silently at load. Before
      anything changes, enumerate every occurrence: code identifiers
      (grouped by the two-question test in CODING_STANDARDS.md), GameData
      filenames, level-file entity strings, language keys, and sound-script
      references, with the exact command that found each group. The
      inventory is the checklist T3 executes and the evidence T4 checks
      against. Name-independent, so it can run before T1 resolves.
    depends_on: []
    files: []
    acceptance:
      - notes carries the full occurrence table — spelling, count, file class, resolved-by-string or code-only — reproducible by the recorded commands
      - The frozen-for-branding strings are listed as explicitly excluded
    verify:
      - python3 tools/check_layering.py
    parallel_safe: true
    status: done
    notes: >
      Inventory complete (2026-08-02, re-derived at 4840da3). Baseline:
      grep -ril darwini (excl .git) = 126 files, 2043 tokens; code = 394
      tokens across 36 spellings in GameLogic/Species/NeuronClient/Tests
      (NeuronCore, NeuronServer, Server: zero).

      TWO ANCHORS everything derives from: Entity.cpp typeNames[] slot 12
      ("Darwinian", Entity.cpp:698) and GlobalResearch::GetTypeName names[]
      slot 0 (GlobalWorld.cpp:621). The constructed-string machinery
      (entityname_%s, research_%s[_v%d], researchname_%s,
      newcontrols_research_%s, spawnname_%s, Icons/Icon%s.bmp, Shapes/%s,
      %s.wav, "ENTITY %s" in Sounds.txt, ScriptTrigger's entity field)
      follows automatically IF both anchors, the GameData filenames and the
      language keys change together. LANGUAGEPHRASE matches
      case-insensitively, so entityname_citizen works against typeName
      "Citizen".

      FILES TO git mv: GameLogic/Darwinian.cpp + .h (20 include sites, 4
      vcxproj/filters entries). Allowlist: 14 entries, all
      GameLogic/Darwinian.cpp ->; exactly one invocation needed:
      "python3 tools/check_layering.py --rename GameLogic/Darwinian.cpp
      GameLogic/Citizen.cpp" (Darwinian.h has no entries).

      HARDCODED LITERALS that do NOT follow automatically (hand edits):
      "Sprites/Darwinian.bmp" x5 (Darwinian.cpp:2357, BlueprintStore:383,
      430, MainMenus:539, Team.cpp:564); "Darwinian.shp" in Officer.cpp:47;
      "Darwinian SeenThreat"/"Darwinian TakenControl" StopAllSounds
      literals x4 (Darwinian.cpp:464,481,805,1660 — mirror
      SoundInstance::SetEventName's "<TypeName> <Event>" format);
      "SpawnDarwinians" (Triffid.cpp:488 names[] + spawnname key +
      SpawnPoint.cpp:651,671 PROFILE labels); "Render Darwinians" PROFILE
      label (Team.cpp:478,480); "LoadDarwinian"/"UnloadDarwinian"
      (Armour.cpp:390-414 — orphan sound events, not in Sounds.txt);
      FilesysUtilsTests path fixtures x6 (cosmetic).

      GAMEDATA BY FILENAME (37): Shapes/Darwinian.shp,
      Sprites/Darwinian.bmp, Icons/IconDarwinian.bmp, 34 wavs — of which 13
      are referenced by Sounds.txt SAMPLEs (DarwinianThreatAttack{,2,3},
      DarwinianThreatRun{,2..10}) and 21 are orphans
      (LaserHitDarwinian1..19, CrateRewradDarwinians1..2; nothing loads
      them — rename for consistency only).

      GAMEDATA BY CONTENT (1246 lines / 24 text files): 61 Units/
      InstantUnits rows across 10 mission files (incl. the two
      MissionGardenLiberate.txt rows the smoke test counts); 6
      ScriptTrigger trailing entity fields; MapLaunchpad.txt:126
      ResearchItem "Darwinian 4"; Game.txt:26 + GameUnlockAll.txt:26
      "Research Darwinian"; Stats.txt:26 (POSITIONAL parse — name never
      string-matched, cosmetic); Sounds.txt: "ENTITY Darwinian" :495, 3
      SAMPLEGROUPs darwinian{die,losehealth,create} — CAUTION: those
      groups are SHARED, referenced from ENTITY LaserTroop and ENTITY
      Officer too — plus 13 SAMPLE names.

      LANGUAGE FILES: 12 distinct darwini keys; 8 entity-derived (rename):
      entityname_darwinian, researchname_darwinian, research_darwinian,
      _v3, _v4 (+2 commented), newcontrols_research_darwinian,
      spawnname_spawndarwinians. 4 BRANDING keys (keep):
      dialog_leavedarwinia, dialog_buydarwinia, about_darwinia,
      darwinia_vistaedition. ~1087 prose-value lines use LOCALISED
      derivations (Darwinianer/Darwiniens/Darwiniani/darwinianos) — T3
      needs an owner decision on translated forms of "Citizen" per
      language, or an explicit choice to rename keys+English only.

      EXCLUSIONS CONFIRMED, one stale: title text ("DARWINIA" x4 in
      GameMenu/Renderer), Win32 class "Darwinia" (WindowManager.cpp:183),
      game-name strings in MainMenus/BuyNowWindow/ReallyQuitWindow/
      UpdateAvailableWindow/SoundLibrary3dDSound/Script.cpp URLs, the
      branding language keys, Textures/ProgramDarwinia.bmp (unreferenced).
      The save-path half of CODING_STANDARDS' frozen table
      ("~/.darwinia", "Application Support/Darwinia") NO LONGER EXISTS —
      App::GetProfileDirectory now returns "" — so the doc's count of 30
      overstates; correct that table when T3 lands. Docs to update with T3:
      CODING_STANDARDS.md (rename section + worked example), GLOSSARY.md
      (Darwinian row + frozen-names note), AGENTS.md:247 (smoke-test row
      "50 Darwinians"), ARCHITECTURE.md:225, containers-replaced.yaml T9
      files list (GameLogic/Darwinian.cpp). LICENSE derivation notice: do
      not touch. Binary wav INFO chunks carrying old filenames: harmless,
      leave.

  - id: T3
    title: Execute the rename in one operation
    intent: >
      Code, GameData filenames, level files, language keys and sound
      references change together, in one commit, so the tree never holds a
      TypeCitizen that loads "Darwinian". Uses git mv for renamed files,
      Rename: trailers for the changed-lines format check, and
      check_layering.py --rename for every renamed source file so the
      allowlist count is untouched.
    depends_on: [T1, T2]
    files:
      - GameLogic/Darwinian.cpp
      - GameLogic/Darwinian.h
      - GameLogic/Entity.cpp
      - GameData/Levels
      - GameData/Shapes
      - GameData/Sprites
      - GameData/Icons
      - GameData/Sounds
      - GameData/Language
      - tools/layering_allowlist.txt
    acceptance:
      - grep -rlw Darwinian over code and GameData/ returns nothing outside the branding/save-path exclusions listed by T2
      - Entity.cpp's typeNames[] entry, the class, the level files and every asset filename agree on the new name
      - The commit carries Rename trailers and the allowlist entry count is unchanged
    verify:
      - python3 tools/check_layering.py
      - python3 tools/check_project_files.py
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    parallel_safe: false
    notes: >
      parallel_safe false and then some: nothing else may be in flight in
      ANY plan while this lands — it touches entity code, content and the
      allowlist at once.
    status: todo

  - id: T4
    title: Owner runs the full Garden smoke test against the rename
    intent: >
      The smoke test is the only thing that can catch a missed
      string-resolved reference — 50 Darwinians spawning under their new
      name, sounds firing, the Task Manager listing programs. All seven
      steps, run by the owner on a Windows machine, results recorded in
      AGENTS.md's "What working looks like" section as the standard
      requires.
    depends_on: [T3]
    files:
      - AGENTS.md
    acceptance:
      - All seven Garden smoke-test steps pass on the renamed build, owner-reported
      - AGENTS.md records the run with the commit hash
    status: blocked
    notes: >
      Blocked on owner execution — agents in this environment cannot launch
      the Windows client. This is the gate the whole plan exists for; T3
      landing without T4 passing is not done.
