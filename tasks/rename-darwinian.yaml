  - id: T3
    title: Execute the rename in one operation
    intent: >
      Code, GameData filenames, level files, language keys and sound
      references change together, in one commit, so the tree never holds a
      TypeCitizen that loads "Darwinian". Uses git mv for renamed files,
      Rename: trailers for the changed-lines format check, and
      check_layering.py --rename for every renamed source file so the
      allowlist count is untouched.
    depends_on: [T1, T2]
    files:
      - GameLogic/Citizen.cpp
      - GameLogic/Citizen.h
      - GameLogic/Entity.cpp
      - GameData/Levels
      - GameData/Shapes
      - GameData/Sprites
      - GameData/Icons
      - GameData/Sounds
      - GameData/Language
      - tools/layering_allowlist.txt
    acceptance:
      - grep -rlw Darwinian over code and GameData/ returns nothing outside the branding exclusions listed by T2 and the non-English prose values the owner deferred
      - Entity.cpp's typeNames[] entry, the class, the level files and every asset filename agree on the new name
      - The 8 entity-derived language keys are renamed and their English values updated; non-English prose values are left as-is and listed in notes as known-stale
      - The commit carries Rename trailers and the allowlist entry count is unchanged
      - containers-replaced T9's `files` list names GameLogic/Citizen.cpp, not Darwinian.cpp, and check_task_dag.py passes
      - CODING_STANDARDS.md, GLOSSARY.md, ARCHITECTURE.md and AGENTS.md's smoke-test row are updated per T2's doc list, including the stale save-path row T2 found
    verify:
      - python3 tools/check_layering.py
      - python3 tools/check_project_files.py
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    parallel_safe: false
    notes: >
      parallel_safe false and then some: nothing else may be in flight in
      ANY plan while this lands — it touches entity code, content and the
      allowlist at once.

      The localisation question T2 raised is settled — keys plus English
      only, see the plan summary. That was the last thing holding this task,
      which is why it is todo rather than blocked. Record the deferred
      non-English prose in notes when it lands, with the grep that finds it,
      so the follow-up is a lookup rather than a re-survey.

      GameLogic/Citizen.cpp is named by containers-replaced T9, which is
      blocked_by this task. Rewriting that file list is in the acceptance
      criteria above, not an afterthought — T9 cannot resolve its own touch
      set until this decides what the file is called.

      LANDED. Darwinian -> Citizen, darwinian -> citizen, DARWINIAN -> CITIZEN,
      in one commit: 72 files rewritten, 39 renamed by git mv (Citizen.cpp and
      .h plus 37 GameData assets), and both project files followed.

      THE ALLOWLIST STEP TURNED OUT TO BE UNNECESSARY, which is worth recording
      because T2 measured it carefully. T2 found 14 entries keyed on
      GameLogic/Darwinian.cpp and specified exactly one --rename invocation.
      By the time this ran there were none: layering-inversion T9, T10, T14 and
      T15 had removed every one of them, and the allowlist is down to 4 entries
      tree-wide, none of them this file. The acceptance line "the allowlist
      entry count is unchanged" holds trivially. This is what running the
      layering plan first bought.

      WHAT WAS VERIFIED, beyond the checks:

        Both anchors agree - Entity.cpp typeNames[] slot 12 and
        GlobalResearch names[] slot 0 both read "Citizen".
        The Garden rows read Citizen 0 598.8 1202.4 30 and Citizen 0 1252.7
        1353.9 20 - the 30 and 20 the smoke test counts as 50.
        All 900 SAMPLE references in Sounds.txt resolve to a wav that exists.
        The 21 that do not resolve are the same 21 orphans T2 found
        (LaserHitCitizen1..19, CrateRewradCitizens1..2) - nothing loads them,
        and they were orphans before this ran.
        All 7 constructed language keys resolve in English.txt:
        entityname_citizen, researchname_citizen, research_citizen{,_v3,_v4},
        newcontrols_research_citizen, spawnname_spawncitizens. Present in every
        language file; Russian has 6, lacking newcontrols_ as it always did.
        Shapes/Citizen.shp, Sprites/Citizen.bmp and Icons/IconCitizen.bmp all
        exist under their new names.

      THE FORMAT CHECK NEEDED THE TRAILERS AND THEN SOME. Three --rename
      declarations cover the mechanical lines. What they do NOT cover, correctly,
      is alignment: "Citizen" is two characters shorter than "Darwinian", so
      clang-format rewraps the aligned string tables in Entity.cpp and
      Triffid.cpp. Those columns ARE this change's doing, so they were formatted
      rather than declared away.

      DEFERRED, and findable with `grep -ril darwinian GameData/Language/`:
      523 prose lines across five files keep their localised derivations -
      German 168, Italian 174, Spanish 178, French 2, Russian 1. The KEYS were
      renamed in all six files so every lookup resolves; only the values are
      stale. The owner deferred these rather than machine-translate forms nobody
      has reviewed.

      ONE OF THOSE 523 IS NOT PROSE AND THE OWNER MAY WANT IT.
      GameData/Language/Russian.txt:965 reads

        spawnname_spawncitizens   SpawnDarwinians

      The key renamed; the value is the untranslated ENGLISH string, so a
      Russian player sees an entity name that exists nowhere else in the build.
      Changing it needs no linguistic judgement — it is the same identifier-like
      string, not a translation. It was left alone because the owner's rule says
      non-English values are untouched, and a gated task is the wrong place to
      start interpreting. Two lines in French.txt (840, 841) are the same shape
      but commented out, so they are invisible either way.

      NOT TOUCHED, as specified: the DARWINIA title text, the Darwinia Win32
      window class, the store and website URLs, the four branding language keys,
      and GameData/Textures/ProgramDarwinia.bmp. The save-path row of
      CODING_STANDARDS' frozen table that T2 flagged as stale is gone — it
      described paths App::GetProfileDirectory no longer returns.
    status: done

  - id: T4
    title: Owner runs the full Garden smoke test against the rename
    intent: >
      The smoke test is the only thing that can catch a missed
      string-resolved reference — 50 Darwinians spawning under their new
      name, sounds firing, the Task Manager listing programs. All seven
      steps, run by the owner on a Windows machine, results recorded in
      AGENTS.md's "What working looks like" section as the standard
      requires.
    depends_on: [T3]
    files:
      - AGENTS.md
    acceptance:
      - All seven Garden smoke-test steps pass on the renamed build, owner-reported
      - AGENTS.md records the run with the commit hash
    status: done
    notes: |
      Blocked on owner execution — agents in this environment cannot launch
      the Windows client. This is the gate the whole plan exists for; T3
      landing without T4 passing is not done.

      PARTIAL RUN 2026-08-03 at 586c072, recorded in AGENTS.md: launch, load,
      30s of play, Task Manager and no sync assert all pass. The two steps this
      task actually needs — 50 Citizens in groups of 30 and 20, 179 Virii
      across eight groups — were not checked, so it stays blocked.

      Why those two and not the others: a reference the rename missed is a
      string that no longer resolves, and an unresolved spawn name produces a
      SMALLER GROUP rather than a crash. Every other step would pass with a
      spawn silently missing. Reading the two counts is the whole test, and it
      is about a minute of the run.

      PASSED 2026-08-03. The owner ran the smoke test and reported all seven
      steps correct, including the two spawn counts this task exists for. The
      plan is closed.

      Recorded against b0bde71, which was the tip of the default branch when
      the owner reported it and the last commit carrying code — everything
      after it on this branch is documentation and plan files. The agent
      writing this line did not observe the run and cannot launch a Windows
      client; if the build tested was not b0bde71, correct the hash here and in
      AGENTS.md rather than leaving it approximate.

      WHAT THIS DOES AND DOES NOT ESTABLISH. It establishes that no
      string-resolved reference was missed on the Garden path: both anchors
      resolve, the 30/20 and eight-group spawns are intact, and the sounds and
      language keys behind them load. It does not cover the nine other mission
      files T2's inventory lists, the orphaned assets, or the 523 stale
      localised prose lines the owner deferred — those are findable with
      `grep -ril darwinian GameData/Language/` and are a text bug, not a
      resolution failure.
