  - id: T8
    title: Decide who owns a SoundInstance, then convert m_sounds
    intent: >
      The sixth of SoundSystem's EmptyAndDelete containers, and the only one
      MarkNotUsed touches. It is not an element-type swap: ShutdownSound is
      called both with instances m_sounds holds and with instances it never
      accepted, so making the map own requires deciding who holds an instance
      between `new` and InitialiseSound succeeding. Sound destructors stop audio
      channels, so getting it wrong is silent.
    project: NeuronClient
    depends_on: [T3]
    files:
      - NeuronClient/SoundSystem.cpp
      - NeuronClient/SoundSystem.h
      - NeuronClient/SoundInstance.cpp
      - GameLogic/PrefsSoundWindow.cpp
    acceptance:
      - grep -w EmptyAndDelete over SoundSystem.cpp returns nothing
      - InitialiseSound takes std::unique_ptr<SoundInstance> and no caller shuts down an instance it handed over
      - m_sounds is a SlotMap of unique_ptr, and a slot is reset explicitly while operator[] is still valid rather than left to MarkNotUsed
      - ShutdownSound has one contract, stated in the header, and serves registered instances only
      - ShutdownSound releases a slot only when that slot still holds this instance; the commit states this as a fix, separately from the conversion
      - Instances die at the same program points they do today, stated per call site in the commit — except the folding path, where the instance now dies inside InitialiseSound instead of in the caller's ShutdownSound
      - Owner runs the Garden smoke test — sounds fire throughout it, and a lifetime mistake here is silent rather than a crash
    verify:
      - python3 tools/check_layering.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
    parallel_safe: false
    status: done
    notes: |
      Split out of T3 on 2026-08-03, after the other five containers converted
      mechanically and this one would not.

      THE SHAPE OF THE PROBLEM, so the next attempt starts from it rather than
      finding it. Callers do:

        auto instance = new SoundInstance();
        ...configure...
        if (!InitialiseSound(instance)) ShutdownSound(instance);

      InitialiseSound returns false when the sound is monophonic and a matching
      instance already exists — it folds the object ids into that one and the
      new instance is never registered. So ShutdownSound serves two populations
      and deletes unconditionally, while MarkNotUsed clears the occupancy bit
      without destroying. That is hazard 1 from T2's NeuronServer survey, with a
      second case T2 did not have.

      A further trap: ShutdownSound tests ValidIndex(m_id.m_index) and does not
      check that the slot still holds THIS instance. If an index has been
      reused, today's code marks the wrong slot unused and deletes the argument
      anyway. Adding the identity check is a behaviour change and probably a fix;
      it should be a stated decision, not a side effect of the conversion.

      m_music and m_requestedMusic are raw observers into the same instances and
      have to be reasoned about with them.

      DECIDED BY THE OWNER 2026-08-05. Both questions above were put and both
      were answered; this task is no longer blocked on anything but an agent.

      (1) INITIALISESOUND TAKES OWNERSHIP. Its parameter becomes
      std::unique_ptr<SoundInstance>, m_sounds becomes SlotMap<unique_ptr>, and
      the instance is stored on success and destroyed inside InitialiseSound on
      the monophonic folding path. The caller therefore never shuts down
      something it thought it still owned, and ShutdownSound stops serving two
      populations — which is what made the old signature undecidable rather than
      merely untidy. Chosen over keeping the raw parameter and splitting the two
      cases inside ShutdownSound: that is a smaller diff, and it leaves the
      transfer in a comment, which is precisely what ownership T2 and T9 were
      done to stop doing.

      This is a call-site change, so the enumerate-every-use discipline T1 and
      T2 each lost a CI round to applies: ShutdownSound and InitialiseSound have
      26 references between them, and every local whose type changes has to be
      read, not just every member.

      (2) THE IDENTITY CHECK GOES IN, as a fix and stated as one. ShutdownSound
      releases the slot only when the slot still holds this instance. The
      current ValidIndex-only test can un-register a live sound belonging to
      somebody else after an index is reused, which is silent — sound
      destructors stop audio channels, and nothing asserts. It lands in the same
      task but says in the commit that it is a behaviour change rather than part
      of the conversion, per this plan's rule about not letting a fix ride along
      unannounced. Preserving today's behaviour exactly was offered and refused.

      SAME FILE, DIFFERENT TASK: SoundInstance.cpp's two speciesRandom() draws
      are determinism/T3 as of the same decision. Do not fix them here. Whoever
      takes this task is in the right place to take that one, and they want
      separate commits — a lifetime conversion and an RNG question in one diff
      is exactly the review nobody can judge.

      DONE 2026-08-05. Both owner decisions implemented as recorded above.

      THE SECOND POPULATION WAS THE MUSIC, and finding that is what made the
      "one contract" line achievable rather than aspirational. m_music and
      m_requestedMusic are never registered in m_sounds -- TriggerOtherEvent's
      music branch stores the instance straight into m_requestedMusic without
      calling InitialiseSound at all -- and ShutdownSound(m_music) was the one
      caller passing something the map had never accepted. Both members are
      unique_ptr now and the music is released by resetting them, at the same
      program point. That is what lets ShutdownSound serve registered
      instances only.

      A LEAK WENT WITH IT, unlooked for. TriggerOtherEvent allocates the
      instance BEFORE testing whether the same music is already playing, and
      the already-playing branch did nothing with it -- so every redundant
      music trigger leaked a SoundInstance. make_unique ends that without
      anyone deciding to; the local simply dies. Stated here because it is a
      behaviour change, even though nothing observable depends on it.

      WHAT MOVED, per call site. Four callers did `new` + InitialiseSound +
      ShutdownSound-on-failure; all four now hand the instance over and drop
      the failure branch, because the folding path destroys it inside
      InitialiseSound. TriggerDuplicateSound keeps a raw observer across the
      move because it reads m_id afterwards -- valid only when registration
      succeeded, which is what the code already tested.

      EVERY REMAINING ShutdownSound CALLER PASSES A REGISTERED INSTANCE,
      checked one at a time: five come from m_sounds[i].get() and three from
      GetSoundInstance, which reads the same map. The ten apparent callers
      below them are inside the commented-out Advance at :1525-1770 and are
      not compiled.

      NOT CONVERTED, deliberately: SoundEventBlueprint::m_instance
      (SoundSystem.cpp:742) is a template the blueprint owns, never
      registered and never shut down. It is a different lifetime question and
      no acceptance line here reaches it.

      NOT COMPILED. No MSVC here; the seven Python checks pass. The owner
      smoke test this task's acceptance asks for is still outstanding, and a
      lifetime mistake in this file is silent rather than a crash.


