  - id: T11
    title: Adopt unique_ptr in GlobalWorld
    intent: >
      The half of T5 that was split out rather than rushed. GlobalWorld owns
      its locations, buildings and events through raw vectors, and the three
      global subsystems -- GlobalInternet, SphereWorld, GlobalResearch --
      through raw members it deletes by hand. None of it is reachable from
      Location::Advance, which is why it could be separated from the rest of
      T5 without splitting a lifetime question in half.
    project: GameLogic
    depends_on: []
    files:
      - GameLogic/GlobalWorld.cpp
      - GameLogic/GlobalWorld.h
    acceptance:
      - No raw owning new or delete remains in GlobalWorld.cpp; observers stay raw and say .get()
      - m_locations, m_buildings and m_events are vectors of unique_ptr, and every file naming
        one of them outside GlobalWorld.cpp is listed in notes with what it needed
      - The three subsystem members are unique_ptr and the destructor does not delete them by hand
      - A scan for a member used after std::move of the same local finds nothing
    verify:
      - python3 tools/check_layering.py
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
    parallel_safe: false
    notes: |
      Split out of T5 on 2026-08-05, at the point T5 had converted its other
      seven owning files and the diff had reached twenty-seven files. Nothing
      technical blocks this; it was a reviewability decision.

      MEASURED AT THAT COMMIT: 23 raw `new` and 19 raw `delete` in
      GlobalWorld.cpp. Five owning vectors -- m_locations, m_buildings and
      m_events on GlobalWorld, plus m_conditions and m_actions on GlobalEvent
      -- and three raw subsystem members deleted in the destructor. The
      TextFileReader and FileWriter locals are the same scoped-resource shape
      T5 converted in LevelFile.cpp; copy that.

      GlobalWorld::m_buildings IS NOT LevelFile::m_buildings AND IS NOT
      Location::m_buildings. Four members share that name and
      check_containers.py skips it for exactly this reason. Location's is a
      FastSlotMap whose indices are network identity and must not be touched.

      READ T5's NOTES BEFORE STARTING. Two use-after-move bugs were introduced
      and caught there by a scan for "member used after std::move of the same
      local"; the same scan belongs in this task's verification, and its
      acceptance says so.

      REACH MEASURED 2026-08-05 FOR BATCH 5, AND THE FILE LIST ABOVE IS TWO OF
      SEVEN. This is T5's lesson arriving before the work rather than after it:
      the list names where ownership LIVES, and the acceptance line already
      asks for "every file naming one of them outside GlobalWorld.cpp", so
      that list is here rather than waiting for CI to produce it.

      Eight range-for loops in five files bind a raw element straight out of
      the three owning vectors, and every one of them stops compiling the
      moment those vectors hold unique_ptr:

        GameLogic/Generator.cpp:435    for (GlobalBuilding* gb : ...m_buildings)
        GameLogic/Mine.cpp:523         for (GlobalBuilding* gb : ...m_buildings)
        GameLogic/TrunkPort.cpp:364    for (GlobalBuilding* building : ...m_buildings)
        GameLogic/CheatWindow.cpp:179  for (GlobalBuilding* gb : ...m_buildings)
        GameLogic/CheatWindow.cpp:204  for (GlobalBuilding* gb : ...m_buildings)
        GameLogic/CheatWindow.cpp:226  for (GlobalLocation* loc : ...m_locations)
        Species/App.cpp:331            for (GlobalBuilding* building : ...m_buildings)
        Species/App.cpp:336            for (GlobalLocation* loc : ...m_locations)

      Each wants `auto const&` plus `.get()` at the use, not a cast.

      THE THREE SUBSYSTEM MEMBERS ARE THE CHEAP HALF, WHICH IS WORTH KNOWING
      BEFORE THE COUNT FRIGHTENS ANYONE. m_research is named 69 times through
      g_globalWorld->m_research, and ALL 69 are `m_research->` observation,
      which unique_ptr's operator-> serves unchanged. m_globalInternet and
      m_sphereWorld are named nowhere outside GlobalWorld.cpp/.h at all. So
      the 69 sites need no edit and the eight loops above do.

      THIS TASK REACHES Species/App.cpp, WHICH IS T6's FILE. Not a dependency
      -- T6 does not have to land first -- but they must not be in flight at
      the same time, and the declared-file collision script in _next-batch.md
      cannot see it because App.cpp is not on either list.

      DONE 2026-08-05, in Batch 5. Eight files, and the diff is net NEGATIVE in
      code -- 100 added against 108 removed -- with 42 lines of added comment
      on top. T1's notes say a stage-5 conversion that grows its files is doing
      something other than moving ownership into the type system; that check
      was run deliberately here and it passes.

      EIGHT FILES, NOT THE SEVEN THE REACH MEASUREMENT PREDICTED, and the miss
      is instructive because it is the same shape as the miss it was written to
      catch. The Batch 5 measurement greped MEMBER NAMES -- who touches
      m_locations, m_buildings, m_events -- and found the eight range-for
      loops. It did not grep the ownership-TRANSFER API, so it missed
      GlobalWorldEditorWindow.cpp, which never names a member: it calls
      `new GlobalLocation()` and hands the result to AddLocation. A member-name
      sweep cannot see a file that only touches the object in flight. Grep the
      Add*/Set*/Register* entry points too.

      WHAT EACH EXTERNAL FILE NEEDED, as the acceptance line asks:

        GameLogic/Generator.cpp:435       loop -> auto const&
        GameLogic/Mine.cpp:523            loop -> auto const&
        GameLogic/TrunkPort.cpp:364       loop -> auto const&
        GameLogic/CheatWindow.cpp:179     loop -> auto const&
        GameLogic/CheatWindow.cpp:204     loop -> auto const&
        GameLogic/CheatWindow.cpp:226     loop -> auto const&
        Species/App.cpp:331               loop -> auto const&
        Species/App.cpp:336               loop -> auto const&
        GameLogic/GlobalWorldEditorWindow.cpp:71,79
                                          make_unique + AddLocation(std::move)

      Every loop body only dereferences or tests truthiness, both of which a
      const unique_ptr& serves unchanged, so no body needed a .get(). The 69
      g_globalWorld->m_research sites needed nothing at all, as predicted.

      AddLocation AND AddBuilding NOW TAKE unique_ptr BY VALUE. They always
      took ownership; the signature said `GlobalLocation*` and a caller had to
      know. Same move ownership T9 made for EclRegisterWindow.

      THE USE-AFTER-MOVE TRAP IS REAL IN THIS FILE and it appears twice.
      AddLocation calls m_sphereWorld->AddLocation(location->m_id) AFTER
      push_back, and AddLevelBuildingToGlobalBuildings writes gb->m_link and
      gb->m_pos after it. Both take a raw observer with .get() before the move
      and reach through that. A scan for a name used after std::move of itself
      was run across all eight changed files and returns nothing.

      THE DESTRUCTOR IS WRITTEN OUT RATHER THAN DEFAULTED, on purpose. unique_ptr
      members destroy in reverse declaration order, which would have run all six
      in the opposite order to the hand-written deletes. Nothing here is known to
      reach anything else during teardown -- but ownership T6 is about to prove
      that "known to" is doing a lot of work in this codebase, and keeping the
      sequence identical cost two lines.

      GLOBALEVENT LEAKED, AND NOW DOES NOT. It had no destructor at all, so
      every condition and every unexecuted action died with the event and was
      never freed. The implicit destructor over vectors of unique_ptr fixes it.
      That is a real leak fixed as a side effect, not a behaviour change to
      worry about -- nothing observed those objects after the event went.

      SIX RAW DELETES REMAIN IN GlobalWorld.cpp AND THE ACCEPTANCE LINE ABOVE
      IS THEREFORE NOT FULLY MET. Stated rather than glossed:

        1. GlobalEventCondition::m_stringId and m_cutScene (4 sites: the
           destructor and the two setters). These are char* from NewStr, which
           is new char[], correctly paired with delete[]. The right conversion
           is std::string -- stage 4, not stage 5 -- and it reaches
           LevelFile.cpp's WRITER, where `if (gec->m_stringId)` becomes an
           empty-vs-null question and byte-identity is owned by strings T8 and
           T17. Doing it here would mix two migrations in one diff, which
           CODING_STANDARDS forbids. NO STRINGS TASK OWNS THESE TWO MEMBERS
           TODAY; T19 converted GlobalEventAction::m_filename and stopped.
        2. ColourShapeFragment's `new RGBAColour[1]` (line 661). That allocates
           into a ShapeFragment, which Shape owns, in NeuronClient. It is a
           free function that happens to live in this file. Converting it is a
           Shape task and no plan has one. Noted separately: that line does not
           set m_numColours to 1 after allocating, which looks wrong, and is
           left alone rather than fixed blind.
        3. The `delete[] missionFileName` loop. Resource::ListResources returns
           std::vector<char*>* -- an owning vector of owning char* -- and
           freeing the elements is the caller's job under that API. The VECTOR
           is now a unique_ptr, so `delete missionFileNames` is gone; the
           element loop cannot go without changing Resource's signature.

      NOT BUILT AND NOT RUN. No MSVC and no Windows client here. The seven
      checks pass and the use-after-move scan is clean, but nothing in this
      task has been compiled. GlobalWorld is on the Garden smoke-test path --
      it is what loads Game.txt and holds the location list -- so a mistake
      here would show at step 2, and ownership T6's run is not this task's run.

    status: done
