  - id: T6
    title: Make App own its subsystems with unique_ptr
    intent: >
      App.cpp constructs and SAFE_DELETEs the whole subsystem graph —
      renderer, sound, world, camera, netcode. Converting it makes every
      subsystem lifetime explicit and is the single highest-blast-radius
      ownership change in the tree, so it runs last, in small commits
      (one subsystem group at a time), each preserving construction and
      destruction ORDER exactly — subsystems reach each other during
      teardown.
    project: Species
    depends_on: [T1, T2, T3, T4, T5]
    blocked_by:
      - strings-modernised/T7
    files:
      - Species/App.cpp
      - Species/App.h
    acceptance:
      - grep -wE "SAFE_DELETE|SAFE_FREE" over App.cpp and App.h returns nothing
      - Subsystem construction and destruction order is byte-for-byte the same sequence as before, stated in the commit message
      - The game reaches the main menu (Garden smoke test step 1) after each commit, owner-verified for the final one
    verify:
      - python3 tools/check_layering.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
    parallel_safe: false
    status: todo

