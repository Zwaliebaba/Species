# Schema: docs/TASK_DAG.md    Validate: python3 tools/check_task_dag.py

plan: ownership
title: Replace raw owning pointers with unique_ptr and values
summary: >
  Migration stage 5 (CODING_STANDARDS.md): raw new/delete, SAFE_DELETE and
  EmptyAndDelete become std::unique_ptr and values. Measured on b69c951 —
  re-measure: ~813 raw `new` in .cpp files, ~246 `delete`, 35 SAFE_DELETE
  (NeuronCore.h defines it; ClientToServer.cpp, Shape.cpp, SpawnPoint.cpp,
  GameCursor.cpp, App.cpp use it), and EmptyAndDelete callers in 23 files
  outside the container headers.

  Re-measured 2026-08-02 at 11aee84: 815 `new` and 246 `delete` in .cpp
  files (the `new` figure is a raw token count and includes comments), 35
  SAFE_DELETE occurrences across five callers plus the NeuronCore.h
  definition, and EmptyAndDelete in 26 files outside the container headers.
  The b69c951 figures above stand; nothing in stage 5 has been converted.

  Stage 5 depends on stage 3 PER FILE: most ownership currently lives
  inside LList/DArray (EmptyAndDelete), so a file's containers-replaced
  task lands before its task here — and its strings-modernised task in
  between, per the stage order. That ordering IS now an edge: `blocked_by`
  (docs/TASK_DAG.md, "Ordering across plans") names the specific upstream
  task per file, and the validator refuses to let a task here go
  in_progress or done while one is outstanding.

  This matters more here than in any other plan. Before those edges
  existed, `check_task_dag.py --next` reported all five of T1-T5 as ready
  to start, on files whose stage-3 conversion had not begun — an agent
  following the documented execution loop would have picked one up and
  rewritten ownership that still lived inside an LList. Every task below
  has no depends_on and is genuinely a graph root; the ordering was
  entirely in prose, and --next does not read prose.

  Determinism note: converting owner-ship changes WHERE deletion happens in
  the source but must not change WHEN objects die relative to the
  simulation. unique_ptr reset at the same program point as the old delete;
  no lifetime extension of anything Location::Advance walks; destruction
  order within containers preserved where destructors have side effects
  (sound handles, GL resources).

tasks:
  - id: T1
    title: Adopt unique_ptr in NeuronCore (Preferences, Profiler)
    intent: >
      The foundation demonstrates the pattern under test coverage:
      Preferences' item list and Profiler's element map own their contents
      via container EmptyAndDelete today; both become containers of
      unique_ptr (or values where the type allows) with deletion at the
      same program points.
    project: NeuronCore
    depends_on: []
    blocked_by:
      - containers-replaced/T18
      - strings-modernised/T2
    files:
      - NeuronCore/Preferences.cpp
      - NeuronCore/Preferences.h
      - NeuronCore/Profiler.cpp
      - NeuronCore/Profiler.h
    acceptance:
      - grep -wE "EmptyAndDelete|SAFE_DELETE" over the four files returns nothing
      - No raw owning `new` remains in the four files; observers stay raw
      - Existing NeuronCore tests pass unchanged
    verify:
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    parallel_safe: true
    notes: >
      The blocked_by names containers-replaced/T18, not T15. These files used
      to sit inside T15, which depends on all thirteen of T4-T14 — so this
      task, the cheapest and best-covered ownership conversion in the tree,
      was parked behind the whole of stage 3 for no reason. T18 split them
      out (owner decision, 2026-08-02) precisely so this one can run early.
    status: todo

