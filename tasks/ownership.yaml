# Schema: docs/TASK_DAG.md    Validate: python3 tools/check_task_dag.py

plan: ownership
title: Replace raw owning pointers with unique_ptr and values
summary: >
  Migration stage 5 (CODING_STANDARDS.md): raw new/delete, SAFE_DELETE and
  EmptyAndDelete become std::unique_ptr and values. Measured on b69c951 —
  re-measure: ~813 raw `new` in .cpp files, ~246 `delete`, 35 SAFE_DELETE
  (NeuronCore.h defines it; ClientToServer.cpp, Shape.cpp, SpawnPoint.cpp,
  GameCursor.cpp, App.cpp use it), and EmptyAndDelete callers in 23 files
  outside the container headers.

  Re-measured 2026-08-02 at 11aee84: 815 `new` and 246 `delete` in .cpp
  files (the `new` figure is a raw token count and includes comments), 35
  SAFE_DELETE occurrences across five callers plus the NeuronCore.h
  definition, and EmptyAndDelete in 26 files outside the container headers.
  The b69c951 figures above stand; nothing in stage 5 has been converted.

  Stage 5 depends on stage 3 PER FILE: most ownership currently lives
  inside LList/DArray (EmptyAndDelete), so a file's containers-replaced
  task lands before its task here — and its strings-modernised task in
  between, per the stage order. That ordering IS now an edge: `blocked_by`
  (docs/TASK_DAG.md, "Ordering across plans") names the specific upstream
  task per file, and the validator refuses to let a task here go
  in_progress or done while one is outstanding.

  This matters more here than in any other plan. Before those edges
  existed, `check_task_dag.py --next` reported all five of T1-T5 as ready
  to start, on files whose stage-3 conversion had not begun — an agent
  following the documented execution loop would have picked one up and
  rewritten ownership that still lived inside an LList. Every task below
  has no depends_on and is genuinely a graph root; the ordering was
  entirely in prose, and --next does not read prose.

  Determinism note: converting owner-ship changes WHERE deletion happens in
  the source but must not change WHEN objects die relative to the
  simulation. unique_ptr reset at the same program point as the old delete;
  no lifetime extension of anything Location::Advance walks; destruction
  order within containers preserved where destructors have side effects
  (sound handles, GL resources).

tasks:
  - id: T1
    title: Adopt unique_ptr in NeuronCore (Preferences, Profiler)
    intent: >
      The foundation demonstrates the pattern under test coverage:
      Preferences' item list and Profiler's element map own their contents
      via container EmptyAndDelete today; both become containers of
      unique_ptr (or values where the type allows) with deletion at the
      same program points.
    project: NeuronCore
    depends_on: []
    blocked_by:
      - containers-replaced/T18
      - containers-replaced/T20
      - strings-modernised/T2
    files:
      - NeuronCore/Preferences.cpp
      - NeuronCore/Preferences.h
      - NeuronCore/Profiler.cpp
      - NeuronCore/Profiler.h
      - GameLogic/ProfileWindow.cpp
      - GameLogic/PrefsGraphicsWindow.cpp
      - GameLogic/PrefsSoundWindow.cpp
    acceptance:
      - grep -wE "EmptyAndDelete|SAFE_DELETE" over the four files returns nothing
      - No raw owning `new` remains in the four files; observers stay raw
      - Existing NeuronCore tests pass unchanged
    verify:
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    parallel_safe: true
    notes: >
      The blocked_by names containers-replaced T18 and T20, not T15. These
      files used to sit inside T15, which depends on all thirteen of T4-T14 —
      so this task, the cheapest and best-covered ownership conversion in the
      tree, was parked behind the whole of stage 3 for no reason. The split
      (owner decision, 2026-08-02) was made precisely so it could run early.

      Two edges rather than one because the split itself split again: T18
      landed Preferences, and Profiler turned out not to be a leaf — its
      SortingHashTable is walked from GameLogic/ProfileWindow.cpp — so it
      became T20. Preferences' half of this task is therefore reachable well
      before Profiler's; if the wait becomes the obstacle, splitting this
      task along the same line is the obvious move rather than starting it
      half-blocked.

      LANDED 2026-08-02, CI green. m_items and m_children became maps of
      unique_ptr and Profiler::m_rootElement a unique_ptr; the 21 preferences
      tests pass unchanged and this conversion did not touch them.

      THE SHAPE TO EXPECT, for T2-T6. The diff is net negative: 42 insertions
      against 56 deletions. PrefsManager::DeleteItems and ProfiledElement's
      child-deleting destructor both disappeared outright, because a map of
      unique_ptr already does that. A stage-5 conversion that GROWS its files
      is doing something other than moving ownership into the type system —
      treat that as a signal to stop and look.

      WHAT STAYS RAW, which is most of the judgement in this task.
      ProfiledElement::m_parent is not converted: a child does not own its
      parent, and a unique_ptr there builds a cycle that never frees.
      Profiler::m_currentElement is a cursor. The three GameLogic windows hold
      observers and say .get(). "Observers stay raw" in the acceptance list is
      the whole discipline, not a caveat.

      TWO ORDERING HAZARDS the code now states. AddLine move-assigns over the
      map node, and that frees whatever it displaces, so the key is copied out
      before the owner moves — `m_items[item->m_key] = std::move(item)` reads
      fine and is a trap. StartProfile takes its observer from the unique_ptr
      before moving it into the map, because everything after works through
      the observer.

      PROCESS NOTE worth more than the conversion. CI rejected this twice, both
      times for the same reason: changing a member's type makes the blast
      radius EVERY mention of that member, and I converted the mentions I had
      noticed. The reliable method is mechanical — grep the member name across
      all six projects, read every hit, convert what needs it — and it takes a
      minute. containers-replaced T20 lost a round to exactly this too.

      Evidence is asymmetric and the notes should say so: Preferences is
      covered by T19's tests, the profiler half has no test reach at all. If
      the Garden smoke test is run against this branch, open the profile
      window.
    status: done

  - id: T2
    title: Adopt unique_ptr in NeuronServer
    intent: >
      Server.cpp owns its per-client ServerToClient records and letter
      queues. Making that ownership explicit under the existing
      Server-initial-state tests keeps the authoritative host the
      best-covered ownership conversion in the tree.
    project: NeuronServer
    depends_on: []
    blocked_by:
      - containers-replaced/T4
      - containers-replaced/T22
    files:
      - NeuronServer/Server.cpp
      - NeuronServer/Server.h
      - NeuronServer/ServerToClient.h
      - Tests/NeuronServerTests/ServerTests.cpp
    acceptance:
      - grep -wE "EmptyAndDelete|SAFE_DELETE" over the listed files returns nothing
      - Server.exe --ticks 20 still advances the sequence id
      - ServerTests pass unchanged
    verify:
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    parallel_safe: true
    notes: >
      Surveyed 2026-08-02 and deliberately NOT started: the survey turned up
      two lifetime hazards and one pre-existing leak, in code whose only
      coverage is "a new Server starts empty" plus CI's 20-tick run with no
      client attached. A mistake here is a use-after-free in the authoritative
      host, so the analysis is written down and the conversion left for a pass
      that can give it full attention.

      The containers are already converted (containers-replaced T4 and T22).
      What remains: m_clients and m_teams become SlotMap<unique_ptr>, and
      m_history, m_inbox and m_outbox become vectors of unique_ptr. m_sync
      holds values and needs nothing.

      HAZARD 1 — MarkNotUsed does not destroy. It clears the occupancy bit and
      nothing else, so a SlotMap<unique_ptr> keeps the object alive until the
      slot is reused or the map dies. RemoveClient currently does
      `m_clients.MarkNotUsed(clientId); delete sToC;` — the object dies THERE.
      Preserving that means resetting the slot's unique_ptr explicitly, before
      MarkNotUsed while operator[] is still valid. Getting this wrong does not
      crash; it silently keeps disconnected clients alive, which is exactly
      the "changes WHEN objects die" failure this plan's summary warns about.

      HAZARD 2 — the outbox send path deletes conditionally. SendLetters does
      `letter = m_outbox.front(); if (m_clients.ValidIndex(...)) { ...send...;
      delete letter; } m_outbox.erase(begin());`. The delete is INSIDE the
      valid-client branch, so a letter addressed to a client that disconnected
      before it was sent is erased and leaked — a real pre-existing leak on a
      reachable path. Converting to unique_ptr fixes it by construction
      (moving the letter out of the vector and letting scope end it), which
      is a behaviour change, however desirable. Call it out in the commit
      rather than letting it ride along silently, and drop the explicit
      delete or the result is a double free.

      UNRELATED DEFECT, found while surveying, not this task's business:
      ListenThread contains `auto m_listener = new NetSocketListener(4000);`.
      That is a LOCAL with a member's name prefix, and it is never deleted.
      The leak is once per process and probably harmless if StartListening
      blocks — but whether it blocks is the thing to establish before anyone
      "fixes" it into a stack object, because if it returns immediately a
      stack object would destroy the listener and kill inbound connections.

      Nothing outside NeuronServer touches these members; ServerTests reads
      m_clients.NumUsed() and m_teams.NumUsed(), both of which survive the
      conversion unchanged.

      LANDED 2026-08-02, CI green at edbc8f6 and re-verified since. 56
      insertions against 67 deletions — the net-negative shape T1 predicted.

      Both surveyed hazards were handled as planned. RemoveClient resets the
      slot before MarkNotUsed, so the record dies where `delete sToC` used to
      rather than lingering until the slot is reused. The outbox leak is
      fixed: the delete used to sit INSIDE the valid-client branch, so a
      letter addressed to a client that disconnected first was erased and
      never freed; the letter is now moved out and erased before the send and
      destroyed when the scope ends either way. That is a behaviour change and
      a deliberate one.

      The three signatures now carry ownership rather than leaving it to a
      comment: GetNextLetter returns unique_ptr, ReceiveLetter and SendLetter
      take it. m_history is the sole owner of every letter ever sent.

      ONE CI ROUND LOST, and to a wider version of T1's lesson.
      letter->AddUpdate(incoming) stopped compiling once `incoming` became a
      unique_ptr. AddUpdate COPIES — "Make sure we COPY the update", new plus
      memcpy — so .get() was right and a move would have been actively wrong.
      I had enumerated every use of every MEMBER whose type changed and not
      done the same for the LOCAL whose type I also changed. Enumerate every
      use of anything whose type changes, member or not.

      EVIDENCE IS THIN AND SHOULD BE READ THAT WAY. ServerTests asserts a new
      Server starts empty; CI runs Server.exe --ticks 20 with no client
      attached. Neither exercises join, disconnect or send, which is exactly
      where both hazards live. They are argued from the code, not tested. A
      two-client smoke test is what would actually prove them.
    status: done

  - id: T3
    title: Adopt unique_ptr across NeuronClient subsystems
    intent: >
      ClientToServer (inbox/outbox letters), Shape (fragments), Eclipse
      (widgets), SoundSystem/SoundInstance/SampleCache (sounds, cached
      samples), Resource and LanguageTable (cached assets and strings) all
      own heap objects through legacy patterns. Sound and GL destructors
      have side effects, so destruction order within each converted
      container is preserved.
    project: NeuronClient
    depends_on: []
    blocked_by:
      - containers-replaced/T5
      - containers-replaced/T6
      - containers-replaced/T7
      - containers-replaced/T8
      - strings-modernised/T3
      - strings-modernised/T4
    files:
      - NeuronClient/ClientToServer.cpp
      - NeuronClient/Shape.cpp
      - NeuronClient/Eclipse.cpp
      - NeuronClient/SoundSystem.cpp
      - NeuronClient/SoundInstance.cpp
      - NeuronClient/SampleCache.cpp
      - NeuronClient/Resource.cpp
      - NeuronClient/LanguageTable.cpp
    acceptance:
      - grep -wE "EmptyAndDelete|SAFE_DELETE" over the listed files returns nothing
      - Letter-processing order in ClientToServer is unchanged
    verify:
      - python3 tools/check_layering.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    parallel_safe: true
    notes: |
      After each file's containers-replaced task (T5, T6, T7, T8 there).
      Split into per-subsystem commits.

      TWO OF FIVE SUBSYSTEMS LANDED 2026-08-03, as separate commits, each
      preceded by a whole-file reformat commit because both files are legacy
      formatted and the changed-lines check otherwise creeps into their
      neighbours one --fix pass at a time.

      ClientToServer. The five SAFE_DELETEd members, both letter queues, and the
      three signatures that move letters across the thread boundary —
      GetNextLetter returns unique_ptr, ReceiveLetter and SendLetter take one,
      mirroring what T2 did for NeuronServer. 61 insertions against 68
      deletions, the net-negative shape T1 predicted.

      Two destruction points had to be pinned rather than left to scope, which
      is this plan's rule in practice rather than in the summary. AdvanceSender
      deleted the letter BEFORE erasing it from the outbox; Main.cpp deleted it
      BEFORE calling GenerateSyncValue(). Both reset() at those points. Letting
      either fall out of scope would have moved the destruction later — the
      "changes WHEN objects die" failure this plan opens by warning about.

      The destructor keeps an explicit body. Members destroy in reverse
      declaration order, which takes both sockets down BEFORE NetLib; the
      SAFE_DELETEs did the opposite. Preserved rather than reasoned about,
      because whether NetLib may outlive its sockets is not established.

      Shape. m_rootFragment, m_childFragments and m_childMarkers own through
      unique_ptr; ShapeMarker::m_parents becomes a vector of observers, which is
      what it always was.

      A REAL DEFECT WENT WITH IT: m_parents was `new ShapeFragment*[m_depth]`
      released with SAFE_DELETE — plain delete on an array, undefined behaviour,
      and exactly the mismatch VectorUtils.h's EmptyAndDelete comment warns
      about. The commented-out "should we?" delete loop above it is answered in
      the header now.

      The load path is the subtle part and is worth reading before touching it
      again: the hierarchy loop reads allFrags[j]->m_name for every j after
      earlier iterations have handed ownership to the tree, so ownership lives
      in a second array and the loop reads through plain observers. Reading
      through the owning slot would follow a moved-from unique_ptr.

      ~ShapeFragment keeps explicit clear() calls so children still die before
      the display list, and fragments still before markers. Both destructors
      reach GL.

      THE THREE THAT REMAIN, measured at 3cc7a9d rather than guessed, because
      the sizes are not what this task's intent implies:

        Eclipse is the BIGGEST, not the smallest. Its two file-static vectors
        are handed out whole by EclGetWindows(), which returns
        std::vector<EclWindow*>* and has 19 callers outside Eclipse.cpp across
        GameLogic and Species. Converting the element type changes that public
        signature and every one of them. EclGetDirtyRects() has none, so
        dirtyrects is free. Consider whether EclGetWindows should hand out
        observers rather than the container.

        The sound trio is the most CONTAINED, which is the opposite of what
        "sound and GL destructors have side effects" suggests. Of the six
        containers SoundSystem::EmptyAndDeletes, four have zero reach outside
        SoundSystem.cpp; m_sounds is read by GameLogic/PrefsSoundWindow.cpp and
        m_filterBlueprints by SoundInstance.cpp. They are SlotMap<T*> and
        FastSlotMap<T*>, so the conversion is SlotMap<unique_ptr<T>> and the
        hazard is the one T2 hit in NeuronServer: MarkNotUsed clears the
        occupancy bit and does NOT destroy, so a slot must be reset explicitly
        while operator[] is still valid or objects outlive their removal.

        Resource and LanguageTable are cache maps whose values are deleted in a
        loop (Resource.cpp:42,46,65; LanguageTable.cpp:61,64,65,69,73). The
        LanguageTable pair is the one to read first: m_phrasesKbd and
        m_phrasesXin are deleted in three places, two of them conditional
        reassignments, so the ownership is genuinely unclear from the code.

      ALL SIX FILES LANDED 2026-08-03, in five commits plus three whole-file
      reformats. Eclipse's two vectors, the Resource bitmap and shape maps,
      CachedSampleManager's sample map, LangTable's phrases, offset tables and
      text chunk, and five of SoundSystem's six containers.

      The survey above got Eclipse right and the sound trio wrong, which is
      worth keeping as a record of what measurement does and does not tell you.
      Eclipse was the biggest and its 19 external callers were the work, exactly
      as predicted. The sound trio was measured as "most contained" on the reach
      of its members — and that was true, and irrelevant: five of its six
      containers converted mechanically, and the sixth is not a container
      problem at all. Reach measures who can see a member. It says nothing about
      whether the ownership is decidable.

      TWO CARVE-OUTS, both now tasks rather than sentences.

      m_sounds is ownership T8. ShutdownSound is called both with instances the
      map holds and with instances it never accepted, because InitialiseSound
      returns false when it folds a monophonic sound into an existing one and
      the caller then shuts down the instance it still owns. Who owns an
      instance between `new` and InitialiseSound succeeding is a decision, and
      SoundInstance destructors stop audio channels.

      EclRegisterWindow's raw parameter is ownership T9. It adopts at the
      boundary today, with the transfer in a comment rather than the signature.
      43 call sites: 24 pass an inline `new`, 19 hand over a configured local
      whose type has to be read rather than swept.

      Three destruction points are pinned rather than left to scope, and they
      are the whole of the care this task needed: EclRemoveWindow destroys after
      the erase, EclBringWindowToFront moves the owner while holding an
      observer, and Resource keeps its two clear() calls so both maps still
      empty after FlushOpenGlState.

      Not compiled here — CI's x64 Debug build is what checks all six. The
      Garden smoke test reaches this through Shape, which every building
      renders, and through Eclipse, which step 6 exercises.
    status: done

  - id: T4
    title: Adopt unique_ptr in GameLogic
    intent: >
      SpawnPoint, FileDialog, InsertionSquad, DropDownMenu, PrefsOtherWindow,
      Virii and Building carry the EmptyAndDelete/SAFE_DELETE sites. Virii
      and Building delete simulation objects — those deletions stay at the
      same tick-relative points and the surrounding slot bookkeeping
      (MarkNotUsed ordering) is untouched, because freed slots are reused as
      network identity.
    project: GameLogic
    depends_on: []
    blocked_by:
      - containers-replaced/T9
      - containers-replaced/T10
      - containers-replaced/T11
      - strings-modernised/T5
      - strings-modernised/T6
      - strings-modernised/T15
    files:
      - GameLogic/SpawnPoint.cpp
      - GameLogic/FileDialog.cpp
      - GameLogic/InsertionSquad.cpp
      - GameLogic/DropDownMenu.cpp
      - GameLogic/PrefsOtherWindow.cpp
      - GameLogic/Virii.cpp
      - GameLogic/Building.cpp
    acceptance:
      - grep -wE "EmptyAndDelete|SAFE_DELETE" over the listed files returns nothing
      - Entity/building deletion happens at the same program points; slot release order unchanged, confirmed in review
    verify:
      - python3 tools/check_layering.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
    parallel_safe: true
    notes: >
      The LinkStubs wall this note used to cite is gone — layering-inversion
      T14 emptied the file, so GameLogic links into a test DLL on its own and
      these conversions can be covered by real tests. Prefer whatever
      layering-inversion T11 has landed by then over review-plus-smoke-test;
      fall back on review and the Garden smoke test only where no coverage
      exists yet, and say which in the commit.

      MEASURED 2026-08-05, claimed and then released unstarted, because the
      measurement changed what the task is. No code was touched.

      Only SIX EmptyAndDelete calls are left in the seven files, not the ten a
      grep suggests — the other mentions are comments left by containers-replaced
      T19 and T20 explaining conversions already done, and SpawnPoint.cpp:37's
      SAFE_DELETE is commented out. So the sites are:
        SpawnPoint.cpp:36 and :239   m_links
        InsertionSquad.cpp:56        m_positionHistory
        DropDownMenu.cpp:93          m_options
        Virii.cpp:143                m_positionHistory
        Building.cpp:152             m_ports

      THE SIX CALLS ARE NOT THE WORK. Each one only becomes a clear() once its
      container owns its elements, and changing the element type makes the
      blast radius every mention of that member — this plan's own T1 and T2
      recorded exactly that lesson. Counted:
        SpawnBuilding::m_links          vector<SpawnBuildingLink*>   20 uses
        Virii::m_positionHistory        vector<ViriiHistory*>        28 uses
        DropDownMenu::m_options         vector<DropDownOptionData*>  15 uses
        Building::m_ports               vector<BuildingPort*>        14 uses
        InsertionSquad::m_positionHistory vector<HistoricWayPoint*>   4 uses
      About eighty sites, nearly all of them a `T* x = v[i]` that becomes
      `v[i].get()`.

      m_positionHistory IS A CONTENDED NAME and three classes mean three
      different things by it: Virii holds ViriiHistory*, InsertionSquad holds
      HistoricWayPoint*, Engineer holds XMFLOAT3*, and SoulDestroyer holds
      XMFLOAT3 BY VALUE. Only the first two are this task's. check_containers.py
      already skips names like this rather than guessing, so it will not catch
      a mistake here — read the declaration, not the name.

      DONE ON CI RUN 514 (commit a09d0bd), 2026-08-05, all five members: x64
      Debug builds and the unit suite passes. Not smoke-tested -- a lifetime
      mistake here is silent, and Virii is simulation code, so the Garden run
      that T21 and determinism/T2 already need covers this too. Two findings worth carrying:

      THE FILE LIST IS INCOMPLETE AND WAS ALWAYS GOING TO BE. It names seven
      .cpp files, but a vector's element type is declared in a HEADER, so
      Building.h, SpawnPoint.h, DropDownMenu.h, Virii.h and InsertionSquad.h
      all had to change too -- each also gaining <memory>. The list was
      written from the grep that found the EmptyAndDelete calls, and that grep
      cannot see where the member is declared. Any remaining task in this plan
      that names only .cpp files has the same gap.

      TWO SITES NEEDED OWNERSHIP TO START AT THE ALLOCATION, not at the push,
      and a mechanical `.get()` sweep would have missed both:
      InsertionSquad::SetWayPoint reads the waypoint again AFTER inserting it,
      so it keeps a non-owning observer across the move; Virii::RecordHistory
      fills the record over twenty lines before inserting, so it make_uniques
      at the top and lets operator-> carry the rest.

      THE ACCEPTANCE GREP STILL RETURNS THREE MATCHES AND ALL THREE ARE PROSE
      -- comments in FileDialog.cpp and PrefsOtherWindow.cpp, left by
      containers-replaced T19 and T20, explaining that the legacy helper used
      plain `delete` where the elements needed `delete[]` or `free`. Rewording
      them to satisfy a grep would trade a real hazard note for a green tick.
      They stay. Read the criterion as "no EmptyAndDelete or SAFE_DELETE CALL
      remains", which is met.

      WHAT IS STILL RAW IN THE LISTED FILES, deliberately not taken here:
      FileDialog's m_scrollBar and its m_files list of `new char[]` names, and
      PrefsOtherWindow's language file list. The char* lists are a strings
      task rather than an ownership one -- they want std::vector<std::string>,
      not unique_ptr -- and taking them here would have mixed two migrations
      in one diff.

      VIRII IS SIMULATION CODE and the one to do last and carefully. Its
      m_positionHistory is walked from Advance and erased mid-tick at
      Virii.cpp:336; unique_ptr frees at the same program point, which is what
      the intent above requires, but that has to be stated per site in the
      commit rather than assumed.
    status: done

