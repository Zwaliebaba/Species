      WHERE THEY ARE: ShapeMarker::~ShapeMarker, Shape.cpp:142-143 —
      SAFE_FREE(m_parentName) then SAFE_FREE(m_name), both strdup'd, both
      `char*` members on ShapeMarker in Shape.h.

      TWO OPTIONS, AND THE DECISION BELONGS TO WHOEVER RUNS IT.

      (1) MATCH THE FILE. ShapeFragment::~ShapeFragment (:374, :376) and
