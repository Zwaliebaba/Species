  - id: T11
    title: Closing sweep - greps at zero, checks green
    intent: >
      Baselines recorded the day this node was written, per docs/TASK_DAG.md,
      so the closing criteria are testable now and meaningful later.
    depends_on: [T1, T2, T3, T7, T9, T10]
    files:
      - GameData/Input/InputPreferences.txt
      - NeuronClient/ControlTypes.inc
    acceptance:
      - CameraAccess::GetControlVector and Camera::m_controlVector are gone - T3 removed their last caller and recorded them here
      - Decide whether the Chord and Idle drivers stay: T13 deleted the last binding data exercising either, so both are now registered and reachable by nothing (see T13 notes)
      - grep XInput over GameData returns nothing (baseline 2026-08-06 - 69 lines)
      - grep for InputDriverPipe, InputDriverValue, InputDriverAlias, InputDriverPrefs and InputFilterManager returns nothing outside tasks/Archive
      - grep for "extern signed char g_keys" and "g_keys\[" returns nothing (baseline - 1 extern site, 2 live readers outside the driver)
      - grep suppressEvent returns nothing (baseline - 2 sites)
      - All seven tools/ checks pass, the x64 Debug build is green, the full suite passes
    verify:
      - python3 tools/check_project_files.py
      - python3 tools/check_layering.py
      - python3 tools/check_task_dag.py
      - python3 tools/check_containers.py
      - python3 tools/check_math_types.py
      - python3 tools/check_format.py
      - python3 tools/check_hygiene.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    status: todo
    notes: |
      DEAD CONTROL TYPES, audited 2026-08-06 while doing T5. THIRTY-EIGHT of the
      131 names in ControlTypes.inc have no reference anywhere in any .cpp or
      .h — nothing calls controlEvent for them and nothing names the
      enumerator. The audit is trustworthy in both directions: the only
      static_cast<ControlType> in the tree is ControlBindings.cpp:85, the
      name-to-index lookup itself, so there is no enum arithmetic anywhere that
      could be reaching one of these under a computed name.

      They fall into two kinds and the sweep should not treat them alike:

      * DECLARED, BOUND, NEVER ASKED. A binding is parsed out of
        InputPreferences.txt, stored, and no code ever queries it. The three
        GesturesTaskManager* controls are the clearest case — Display on
        `key alt pressed`, Hide on `key alt up`, EndTask on
        `key control ++ key c`, which is the ONLY chord in the whole data set.
        StopAttractMode is another, bound four times.
      * DECLARED AND NOT EVEN BOUND. MouseMovement and TaskManagerDisplay have
        no line in any prefs file and no consumer. Pure declarations.

      DELETE THE THREE GesturesTaskManager* CONTROLS AND THEIR BINDINGS. They
      are what prompted this note, and they are the safest of the 38: T5 found
      that `key alt up` could never have fired anyway, because WM_SYSKEYUP wrote
      the key state and never a delta. So the pair is dead twice over — no
      consumer, and a binding that could not have reached one. Removing
      GesturesTaskManagerEndTask also removes the only `++` line in the data,
      which means the Chord driver would afterwards have NO data exercising it;
      that is a fact to record when it happens, not a reason to keep a dead
      control, and T1's audit already established Chord parses correctly.

      The other 35 need judging individually rather than sweeping. Several
      (RTLoader*, GOLLoader*) look like they belong to loader screens that may
      still be wanted; deleting a control type is cheap to reverse but the
      decision is about intent, not code. Removing any of them is safe for
      players' own prefs files: ControlBindings already tolerates a name it does
      not know — that is what the 69 XInput lines did at every startup before T2.

      Three lines out of ControlTypes.inc shifts every enumerator after them,
      which is FINE and worth stating so nobody worries: bindings resolve by
      NAME, not index, no control index is written to disk or the wire, and the
      two ControlBindingsTests that pin the table's ends pin MenuLeft (line 2)
      and IconsTaskManagerQuickUnitRight (line 165) — the Gestures block is at
      67-69 and touches neither.

      NOT THIS TASK'S WORK, but it lands in this task's territory and the sweep
      needs to know. The owner deleted the 22 gamepad button BMPs under
      GameData/Icons on 2026-08-06 (commit ca1a5c5), finishing what T2 started
      when it removed the 18 gamepad glyph LINES from InputPreferences.txt.

      VERIFIED SAFE before this note was written, because live code still names
      those files: ControlHelp.cpp builds HelpIcons for them in
      InitialiseIcons, and TaskManagerInterfaceIcons.cpp calls RenderIcon on
      two of them. Neither loads anything. HelpIcon's constructor only stores
      the filename strings; the GetTexture call is at ControlHelp.cpp:206, on a
      render path that returns early unless getInputMode() is
      INPUT_MODE_GAMEPAD, and both TaskManagerInterfaceIcons sites sit behind a
      render360Controls flag with the same condition. No driver produces that
      mode, so none of the loads is reachable.

      WHAT IT CHANGES ABOUT T2'S DECISION, and this is the part worth reading.
      T2 deliberately KEPT the twenty INPUT_MODE_GAMEPAD consumers, arguing
      that they are the controller user interface and deleting them would turn
      re-introducing a gamepad into a UI rewrite rather than a new driver. That
      argument still holds for the CODE. It no longer holds for the ART: the
      icons a re-introduced controller would render are gone from the tree and
      would have to come back with it. Decide in this task whether the UI code
      follows the art out, or whether the art is restored — do not leave the
      two disagreeing.

  - id: T13
    title: Delete the 38 control types nothing consumes
    intent: >
      Thirty-eight of the 131 names in ControlTypes.inc have no reference in
      any .cpp or .h - nothing calls controlEvent for them and nothing names
      the enumerator. Most belong to the GOL and ray-tracer loader screens and
      the gesture task manager, all of which were removed from the game. A
      declared control that nothing asks about is a binding the user can set
      and never observe, and it teaches the wrong lesson about what the input
      system has to support.
    project: NeuronClient
    # No graph dependency: this is a deletion of things nothing references, so
    # nothing in the plan blocks it. Directed by the owner on 2026-08-06 after
    # T11's audit surfaced the list - the loader screens they belong to are
    # gone, which is the fact the audit could not establish from the code.
    depends_on: []
    files:
      - NeuronClient/ControlTypes.inc
      - GameData/Input/InputPreferences.txt
      - GameData/Input/Keyboards/de_DE.txt
      - GameData/Input/Keyboards/fr_FR.txt
    acceptance:
      - The 38 unused control types are gone from ControlTypes.inc and every binding naming one is gone from every file under GameData/Input
      - The audit is re-run afterwards and reports zero unused control types
      - RTLoaderPixelWaveIncrease and RTLoaderPixelWaveDecrease STAY - they have a live consumer at GameLogic/Location.cpp:1124 behind CHEATMENU_ENABLED, and are the reason this is a per-name audit rather than a prefix sweep
      - Both ControlBindingsTests end-of-table tests still name MenuLeft and IconsTaskManagerQuickUnitRight and still pass; neither is in the deletion set
      - The consequences for the Chord and Idle drivers are recorded in notes
    verify:
      - python3 tools/check_format.py
      - python3 tools/check_hygiene.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    status: done
    notes: |
      Landed 2026-08-06 on the owner's direction: "loader screens was something
      we had in the past, but they are removed, so you can remove the 35 unused
      control types". That is the fact the audit could not get from the code —
      an unreferenced control is indistinguishable from one waiting for a
      feature — so it was asked rather than assumed.

      38 control types gone, 131 down to 93, and the audit re-run afterwards
      reports ZERO unused. 39 binding lines went with them: 37 from
      InputPreferences.txt (including three commented-out ones that named a
      deleted control) and one each from the de_DE and fr_FR keyboard layouts.
      Every remaining binding in GameData/Input names a control that still
      exists — checked, not assumed.

      A PER-NAME AUDIT, NOT A PREFIX SWEEP, and RTLoaderPixelWaveIncrease and
      RTLoaderPixelWaveDecrease are why. Sixteen of the eighteen RTLoader
      controls were dead; those two have a live consumer at
      GameLogic/Location.cpp:1124 behind CHEATMENU_ENABLED, where they toggle
      RenderSpecialLighting. Deleting by prefix would have taken them and the
      cheat-menu lighting toggle with them.

      THE CONSEQUENCE, and it is the reason this note matters more than the
      deletion: THE CHORD AND IDLE DRIVERS NOW HAVE NO DATA EXERCISING THEM.
      `GesturesTaskManagerEndTask = key control ++ key c` was the only ++ line
      in the tree and `StopAttractMode = idle no longer` was the only live idle
      line. Both are now zero. T1 kept Chord and Idle precisely BECAUSE the
      binding data used them — that justification is gone, and the two drivers
      are now in the same position InputDriverPipe was in when T1 deleted it:
      registered, functional, and reachable by nothing.

      They are NOT deleted here. That was not directed, and it is a judgement
      about whether the binding language keeps a feature with no current user.
      T11 decides. What is NOT affected either way: InputManager::isIdle() and
      the m_idle computation at Input.cpp:176-190 are independent of the Idle
      DRIVER — the manager polls every driver's isIdle() each frame regardless
      of bindings, and W32InputDriver::isIdle() still answers it.

      The two ControlBindingsTests that pin the table's ends were untouched and
      needed no repointing: MenuLeft is still the first row and
      IconsTaskManagerQuickUnitRight still the last, because the deletions were
      all interior.
