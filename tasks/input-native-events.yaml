      wait for the event rework: focus is computed by calling
      GetForegroundWindow on EVERY message, the stuck-ALT hack covers only one
      key, the wheel divides by a literal 120, and the Alt-Tab RegisterHotKey
      machinery has been dead since its only caller was commented out.
    project: NeuronClient
    depends_on: []
    files:
      - NeuronClient/InputDriverWin32.h
      - NeuronClient/InputDriverWin32.cpp
      - NeuronClient/Win32EventHandler.h
      - NeuronClient/Win32EventHandler.cpp
      # Gains the focus-lost hook, so the driver can release its own state
      # instead of the handler reaching into it through externs.
      - NeuronClient/Win32EventProc.h
      # THE ALT-TAB MACHINERY REACHES INTO GameLogic, which this list did not
      # say and the summary got wrong - see the corrected note below. These
      # three hold the calls and dead comments that go with it.
      - GameLogic/MainMenus.cpp
      - GameLogic/PrefsKeybindingsWindow.cpp
      - GameLogic/PrefsScreenWindow.cpp
      - Species/Main.cpp
    acceptance:
      - Focus state comes from WM_ACTIVATE handling; GetForegroundWindow no longer appears in the message path
      - Losing focus releases ALL held keys and buttons, generalising the ALT special case
      - BindAltTab, UnbindAltTab, ResetWindowHandle, the WM_HOTKEY handler and the duplicate WM_SYSKEYUP branch are gone, along with the one live ResetWindowHandle call and the three dead comment blocks that name the others
      - The wheel handler uses the named WM_MOUSEWHEEL constant and GET_WHEEL_DELTA_WPARAM, accumulating fractional detents instead of truncating
    verify:
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    status: done
    notes: |
      CORRECTION, 2026-08-06, before the work. This plan's summary said the
      Alt-Tab machinery was "dead since its only caller was commented out
      (Main.cpp:865)". That was written from a grep of Species/ alone and it
      is wrong twice over. BindAltTab and UnbindAltTab are named in GameLogic
      too - PrefsKeybindingsWindow.cpp and PrefsScreenWindow.cpp - though both
      of those are inside comment blocks, so the conclusion that nothing calls
      them survives. What does NOT survive is the file list: ResetWindowHandle
      has a LIVE caller at MainMenus.cpp:267, on the resolution-change path,
      and it exists only to re-register the hotkey against the new window.

      It is a no-op in practice, which is why nobody noticed: g_altTabBound is
      set true only by BindAltTab, BindAltTab is never called, so
      ResetWindowHandle reduces to UnbindAltTab, which unregisters a hotkey
      that was never registered. Deleting it and its one call is the honest
      outcome; keeping an empty stub would preserve a function whose whole
      subject is gone.

      This is the failure mode tasks/_next-batch.md names: a file list written
      from where a thing is DECLARED when the work is wherever it is NAMED.
      Three GameLogic and Species files joined the list above because of it.

  - id: T5
    title: Make OS messages an InputEvent stream and derive driver state from it
    intent: >
      The foundation move - WndProc produces typed, timestamped InputEvents
      into a queue, and the W32 driver builds its per-frame state by draining
      that queue, instead of scattering writes into file-scope arrays. The
      g_keys/g_keyDeltas globals and their block-scope-extern workarounds
      disappear, and a key pressed and released inside one frame finally
      reports both edges.
    project: NeuronClient
    depends_on: [T4]
    files:
      - NeuronClient/InputEvents.h
      - NeuronClient/InputDriverWin32.h
      - NeuronClient/InputDriverWin32.cpp
      - NeuronClient/Win32EventHandler.cpp
      - NeuronClient/WindowManager.cpp
      - NeuronClient/NeuronClient.vcxproj
      - NeuronClient/NeuronClient.vcxproj.filters
      - Species/Camera.cpp
      - Tests/NeuronClientTests/InputEventTests.cpp
      - Tests/NeuronClientTests/NeuronClientTests.vcxproj
      - Tests/NeuronClientTests/NeuronClientTests.vcxproj.filters
    acceptance:
      - InputEvents.h defines the event types (key down/up with repeat flag, char, mouse button, mouse move, wheel, focus); the window procedure only enqueues
      - g_keys and g_keyDeltas are driver members; the extern declarations in Win32EventHandler.cpp and the direct read in Camera.cpp:343 are gone (grep zero)
      - The queue-to-state derivation is a free function testable without a window, and InputEventTests covers it - including the press-and-release-within-one-frame case producing a down edge then an up edge on consecutive frames
      - Every existing controlEvent condition (down, up, pressed, read, moved) behaves identically at frame granularity
    verify:
      - python3 tools/check_project_files.py
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    status: done
    notes: |
      Landed 2026-08-06.

      THE SHAPE OF THE CHANGE: WndProc appends an InputEvent and does nothing
      else — no state writes, no Eclipse call, no window call. Advance pumps the
      queue, then DeriveFrameState builds the frame's state from it. The rule
      that recovers the lost information is one line: AT MOST ONE EDGE PER
      CONTROL PER FRAME, and an event that would need a second is left for the
      next frame. Press and release inside one frame now reports a down edge,
      then an up edge on the frame after.

      Stopping early defers everything BEHIND the deferred event too, not just
      that control. That is deliberate: consuming later events out of order
      would reorder edges, which is the thing this task exists to stop.

      g_keys and g_keyDeltas are gone as globals — not moved, deleted. The
      driver holds one InputFrameState and six former driver arrays collapsed
      into it. The last read outside the driver was in a 37-line commented-out
      Camera::AdvanceSphereWorldIntroMode, which went with them, so the grep is
      genuinely zero rather than zero-except-in-comments.

      FOUR THINGS THE REWRITE HAD TO PRESERVE DELIBERATELY, each found by
      reading the old code rather than by it failing:

      1. Modifier state for EclUpdateKeyboard is tracked ACROSS the walk from a
         snapshot taken before derivation. Reading it off the finished frame
         state would give every keystroke in a frame the same final answer, so
         shift-then-letter and letter-then-shift would look identical.
      2. System keys carry a flag and are NOT forwarded to Eclipse. The old
         window procedure hooked WM_KEYDOWN and not WM_SYSKEYDOWN, so Eclipse
         has never heard about Alt+anything; this task is not the one to change
         that.
      3. Alt-F4 still quits from inside the window procedure, not from a
         binding. It has to work with the queue full and the frame loop stalled.
      4. SetMousePosNoVelocity drops queued MouseMove events. A warp that left
         them in would report travel from the position it just overwrote, which
         is exactly the velocity the function exists to suppress.

      AUTO-REPEAT IS NOW DISTINGUISHABLE and is not an edge. Windows sets bit 30
      of lParam when it is repeating a held key; the old pipeline had no way to
      express the difference and the state made every repeat look like nothing,
      so the effect is unchanged and the information is now available to T6.

      A PRE-EXISTING BUG THIS FIXES, with no consumer to notice: WM_SYSKEYUP
      wrote g_keys[k] = 0 and never wrote a delta, so releasing ALT produced no
      up edge and `key alt up` could never fire. It fires now. The three
      GesturesTaskManager control types that bind ALT are declared in
      ControlTypes.inc and bound in InputPreferences.txt and NO CODE CALLS
      controlEvent FOR ANY OF THEM — dead controls, so nothing observes either
      the old bug or the fix. Handed to T11.

      VERIFIED TWICE. InputEventTests is 14 tests over DeriveFrameState, which
      needs no window: the fast press-and-release case the task names, deferral
      ordering, auto-repeat, click-in-one-frame, move coalescing and per-frame
      velocity, partial wheel detents accumulating, focus loss releasing held
      controls, focus loss DEFERRING behind a press made the same frame,
      characters, out-of-range keys, and an empty frame clearing deltas while
      keeping held state. The same rules were also run as a standalone g++
      program under ASan and UBSan before the driver was touched at all, which
      is what let the design be wrong cheaply.

      The queue is bounded at 4096 events and drops the NEWEST when full.
      Dropping the oldest would reorder edges.

  - id: T6
    title: Route WM_CHAR to text input
    intent: >
      Typing is currently synthesised from virtual-key codes plus a shift flag,
      which is wrong on any non-US layout - the per-locale keyboard files patch
      game controls, not text. Char events flowing to the focused InputField
      make typing correct on every layout at once, while VK codes remain the
      currency of control bindings.
    project: GameLogic
    depends_on: [T5]
    files:
      - NeuronClient/InputDriverWin32.cpp
      # Holds the per-key text-capture mask, so the driver can answer "the UI
      # took that key" without reaching outside itself. Added during the work,
      # per docs/TASK_DAG.md.
      - NeuronClient/InputDriverWin32.h
      - NeuronClient/Eclipse.h
      - NeuronClient/Eclipse.cpp
      - NeuronClient/EclWindow.h
      - NeuronClient/EclWindow.cpp
      # The base Char() virtual every widget inherits. The list was written from
      # where text editing LIVES - InputField - and the work is wherever the
      # dispatch passes through.
      - NeuronClient/EclButton.h
      - NeuronClient/EclButton.cpp
      # m_chars was T5's placeholder for exactly this task and is retired by it:
      # characters dispatch from the driver's side-effect walk, in event order
      # with the key events, which a per-frame collection cannot express.
      - NeuronClient/InputEvents.h
      - NeuronClient/InputEvents.cpp
      - Tests/NeuronClientTests/InputEventTests.cpp
      - GameLogic/InputField.h
      - GameLogic/InputField.cpp
      - Tests/GameLogicTests/InputFieldTests.cpp
    acceptance:
      - WM_CHAR (and WM_SYSCHAR suppression) feed Char events; the focused InputField consumes characters, not virtual-key guesses
      - Editing keys - backspace, delete, arrows, enter, escape - still arrive as key events
      - The InputField keystroke tests are extended with a shifted character and a character that differs between US and German layouts, asserting the character, not the VK
      - While an InputField has focus, character-producing keys do not also fire game bindings (the capture rule the router formalises in T8)
    verify:
      - python3 tools/check_project_files.py
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    status: done
    notes: |
      Landed 2026-08-06. The build and test verify commands were run by CI
      rather than locally - this was written on Linux and no MSVC build or
      vstest run happened here.

      THE SHAPE. WM_CHAR was already being enqueued by T5 with nothing reading
      it. It now reaches the focused widget through a new EclUpdateChar ->
      EclWindow::Char -> EclButton::Char chain, and InputField overrides the
      last of those. Keypress keeps the editing keys - backspace and enter - and
      lost the letter, digit and full-stop branches, which is where the layout
      bug lived: they rebuilt a character from a virtual key code plus a shift
      flag, which is only correct on a US layout.

      DISPATCHED FROM THE SIDE-EFFECT WALK, NOT FROM A PER-FRAME LIST, and that
      decision is what retired T5's InputFrameState::m_chars. Typing "ab" and
      pressing enter inside one frame has to append both letters BEFORE the
      enter reaches EclUpdateKeyboard and commits the field; a collection of the
      frame's characters delivered after the frame's key events commits an empty
      name. The events are already in order, so the walk over them is where the
      ordering already exists.

      THE CAPTURE RULE, and it is deliberately narrower than "the UI has focus,
      so the keyboard is gone". A key whose character the field TOOK is marked
      in the driver, and getKeyInput answers false for it until it is released -
      so typing a name does not also fire the control that letter is bound to,
      and `key g up` does not fire when you let go. Enter, escape and the arrows
      produce only control codes, which InputField refuses, so they are never
      marked and still reach the bindings exactly as before. That is what keeps
      menu navigation and escape-to-close working while the cursor is in a text
      box - a blanket suppression would have broken both, in the one window
      where a player is most likely to want them.

      The mask is over READS, not over the state. m_keys and m_keyDeltas stay
      truthful underneath it, so nothing is left stuck when a mark clears, and
      getFirstActiveInput - the key-rebinding window's door - and isIdle are
      both unaffected because they read the state directly.

      A CONTROL CODE IS NOT TEXT, and refusing them is load-bearing rather than
      tidy. Windows sends WM_CHAR for enter, escape, tab and backspace too;
      consuming a character is what tells the driver the UI swallowed the key,
      so taking enter's carriage return would stop enter committing the field
      and escape's would stop escape closing the window.

      WM_SYSCHAR IS SWALLOWED WITH AN EMPTY BODY. It enqueues nothing and
      returns 0, so it never reaches DefWindowProc - whose handling of a
      WM_SYSCHAR with no menu to open is the system beep, once per keystroke for
      every Alt combination the game binds.

      TWO THINGS THE REWRITE FIXED ON THE WAY, neither of them the task:

      * The old Keypress ended its ignore-everything-else branch by writing the
        buffer back and calling Refresh - which CLICKS the registered callback
        button - for keys it had just decided to do nothing with. It returns now.
      * The length bound covers letters. It did not: the digit and full-stop
        branches tested before appending and the letter branch wrote at
        m_buf[len] and [len + 1] of a char[256] with nothing stopping it.

      AND ONE STALE COMMENT CORRECTED RATHER THAN LEFT. Render said m_buf was a
      format string and that '%' could not be typed anyway. Neither half is
      true: the call passes one argument, so it resolves to DrawText2D's PLAIN
      string_view overload and formats nothing - which is what makes accepting
      every printable character safe, because '%' and '{' are typeable now.

      VERIFIED AS FAR AS LINUX ALLOWS. The eight InputEventTests over characters
      and the capture mask's lifecycle were also transcribed into a standalone
      g++ program and run under ASan and UBSan: character events consuming
      without deferring what is behind them, the "ab" then enter ordering, the
      mark surviving across frames and covering the up edge and clearing the
      frame after, an arrow and an escape NOT being captured, the numeric
      filter, a 0xE4 byte staying one byte, and a full field dropping the
      character. All pass. That is not MSVC and it type-checks no call site.

      A LATENT BREAK THE HARNESS FOUND. Removing m_chars removed <vector> from
      InputEvents.h, and DeriveFrameState's signature had been getting size_t
      through it. <cstddef> is included explicitly now. This is the failure mode
      AGENTS.md records from sound-xaudio2 T7 and T8 - deleting an include
      withdraws everything it included, not just what it declared - and it would
      have cost a CI round.

      InputFieldTests went from 12 tests to 17 and every one of them changed
      meaning: Type() sends CHARACTERS now, so the tests that asserted the
      reassembly ('A' with no shift means 'a') assert the absence of it instead.
      The two the acceptance named are TheVirtualKeyContributesNothingOnANonUsLayout
      - the German z/y swap, VK 89 and the character 'z' - and
      AShiftedPunctuationCharacterIsTakenFromTheMessage.

  - id: T7
    title: Raw Input for relative mouse motion
    intent: >
      Camera aiming is derived from client-coordinate WM_MOUSEMOVE deltas,
      which saturate at screen edges and force the warp-and-suppress-velocity
      hacks. WM_INPUT deltas are unclamped and DPI-independent; the visible
      cursor keeps riding WM_MOUSEMOVE for the UI.
    project: NeuronClient
    # T6 in the edge is file-collision serialisation over InputDriverWin32.cpp,
    # not a logical dependency; the real prerequisite is T5.
    depends_on: [T5, T6]
    files:
      - NeuronClient/InputEvents.h
      # The frame's relative axis is derived here, and the derivation is what
      # InputEventTests covers. Added during the work, per docs/TASK_DAG.md.
      - NeuronClient/InputEvents.cpp
      - Tests/NeuronClientTests/InputEventTests.cpp
      - NeuronClient/InputDriverWin32.h
      - NeuronClient/InputDriverWin32.cpp
      - NeuronClient/WindowManager.h
      - NeuronClient/WindowManager.cpp
    acceptance:
      - RegisterRawInputDevices is called for the mouse; WM_INPUT deltas accumulate into the frame's relative axis
      - The MOUSE_MOVEMENT read condition serves raw deltas; absolute cursor position still comes from WM_MOUSEMOVE
      # AMENDED 2026-08-06, DURING the work, original wording kept: it read
      # "SetMousePosNoVelocity shrinks to warping the visible cursor - raw
      # deltas need no velocity suppression". The first half is true and is
      # done; the second half assumed raw deltas are the ONLY movement source,
      # and they cannot be. RegisterRawInputDevices can fail, and a device that
      # reports ABSOLUTE coordinates - a tablet, some remote-desktop stacks -
      # registers successfully and then never sends a relative packet. With no
      # fallback, either of those leaves the game with no mouse aim at all,
      # which is a worse failure than the edge saturation this task exists to
      # fix. So the WM_MOUSEMOVE path stays as a fallback, and the velocity
      # suppression stays with it - reached only when the fallback is live.
      - SetMousePosNoVelocity does nothing but record the position on the raw path; its queue surgery and velocity zeroing are reached only by the WM_MOUSEMOVE fallback, and say so at the site
      # AMENDED 2026-08-06: this task was done on Linux, where the client cannot
      # be launched at all, so the manual check could not be performed. It is
      # not dropped - T12's gate already names it in exactly these words
      # ("rotation continues at screen edges (the Raw Input improvement),
      # reported explicitly"), so the owner run is where it lands.
      - The screen-edge behaviour is pinned by a test at frame granularity (RawTravelSurvivesAPositionThatCannotMoveAnyFurther); the manual check is owed by T12, which already names it
    verify:
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    status: done
    notes: |
      Landed 2026-08-06. Written on Linux: no MSVC build, no vstest run and NO
      RUNNING GAME. CI answers the first two; the third is T12's.

      WHAT MOVED. WM_INPUT is registered for usage page 1 usage 2 in
      WindowManager::CreateWin - there, not once at startup, because the
      registration names a window and that function builds a new one on every
      resolution change; a second call with the same usage REPLACES the first,
      so there is nothing to unregister. Relative packets become MouseRawMove
      events, DeriveFrameState SUMS them into a new m_mouseRelative pair, and
      MOUSE_MOVEMENT reads that instead of the client-position difference.

      SUMMED, WHERE MouseMove OVERWRITES, and it is worth stating because
      getting it backwards is silent: two absolute positions in a frame mean the
      second one is where the mouse is, two relative steps mean it travelled the
      total of them.

      WM_INPUT IS THE ONE MESSAGE THIS DRIVER BOTH READS AND PASSES ON. It
      returns -1 - "not processed" - so the window procedure hands it to
      DefWindowProc, which the system needs in order to clean the raw input up.

      THE FALLBACK, and the amended criterion above is where the reasoning is.
      Two independent failure modes end with no relative packet ever arriving,
      and the guard is deliberately NOT "did the registration succeed" but "has
      a relative packet actually been seen" - m_rawMouseMovementSeen - because
      an absolute-reporting device satisfies the first and never the second.
      Until one arrives the driver aims exactly as it did before this task.

      A CONSEQUENCE THE SMOKE TEST HAS TO JUDGE, and it is the thing to look at
      first: RAW DELTAS DO NOT CARRY WINDOWS' POINTER ACCELERATION, and in this
      tree that reaches further than camera aim. TargetCursor does not read the
      OS cursor position at all - it accumulates ControlTargetMove into its own
      m_screenCoords and WARPS the OS cursor to match - so the same control
      moves the visible cursor and the camera. Serving it raw deltas therefore
      changes how the cursor feels in menus as well as how the camera turns.
      That is what the acceptance asks for and the plan's intent describes, and
      it is not something a green build can have an opinion about.

      WHAT THAT SAME MEASUREMENT SAYS ABOUT THIS TASK'S INTENT FIELD, recorded
      because it is wrong rather than because it matters: "the visible cursor
      keeps riding WM_MOUSEMOVE for the UI" describes a design this code does
      not have. NOTHING reads the driver's absolute mouse position - m_mousePos
      exists to difference into m_mouseVel and for nothing else, because the
      cursor is game-driven as above. The absolute position is still tracked
      from WM_MOUSEMOVE, as the acceptance requires, and T8 is the task that
      gives it a consumer when the Eclipse sink starts receiving mouse events
      directly.

      isIdle GOT BETTER RATHER THAN JUST DIFFERENT. It compared m_mouseVel,
      which moves when the GAME warps the cursor - every frame, in every camera
      mode - so outside a menu it could never have answered "idle". On the raw
      path it compares m_mouseRelative, which is silent unless a hand moved the
      mouse. The wheel still comes from m_mouseVel[Z].

      VERIFIED AS FAR AS LINUX ALLOWS. Three new InputEventTests, and the same
      rules run again in the standalone g++ harness under ASan and UBSan: deltas
      summing across a frame and resetting on the next, raw moves never
      deferring what is behind them, and the named case - a pinned position
      reporting zero velocity while the raw axis reports 12. That last one is
      the whole task at frame granularity, and it is still not the same claim as
      turning the camera with the pointer against the edge of a real screen.

