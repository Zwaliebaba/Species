# Schema: docs/TASK_DAG.md    Validate: python3 tools/check_task_dag.py

plan: input-native-events
title: Event-driven native input - OS events in, subscriptions for the UI, one sampled view for the game
summary: >
  Mouse and keyboard are already native Win32 messages - there is no
  DirectInput anywhere - but the pipeline flattens those messages into polled
  state and then re-derives events from it twice: ControlBindings turns
  per-frame deltas back into down/up edges, and EclUpdateMouse
  (Eclipse.cpp:49-120) synthesises MouseDown/MouseUp widget calls from polled
  booleans. Information is lost each way - a key pressed and released within
  one frame vanishes (the m_keyNewDeltas overwrite, InputDriverWin32.cpp:368
  and :380), character identity and key repeat are discarded (no WM_CHAR, so
  text input guesses from VK codes and breaks on non-US layouts), and
  suppressEvent exists because polling has no way to say "the UI took that
  click".

  The owner directed the target on 2026-08-06: an event-driven design where
  windows and buttons subscribe to what they need. The design honours that
  with one deliberate boundary, stated here so no task drifts across it: THE
  SIMULATION DOES NOT SUBSCRIBE. Lockstep determinism requires sim input to
  flow only through TeamControls into the 10Hz IAmAlive letter; an input
  handler that mutates game state directly is a desync generator. So events
  drive the UI and discrete actions, and a per-frame SampledInput snapshot -
  built FROM the same event stream - serves the camera, unit steering and
  TeamControls. controlEvent() is reimplemented over the snapshot as a
  compatibility shim, which is what lets 156 call sites across 29 files keep
  compiling and migrate opportunistically instead of in one unreviewable diff.

  Measured facts this plan is scoped from (2026-08-06): 8 drivers are
  registered (Main.cpp:812-820); InputDriverPipe is NOT among them and the
  InputFilter* family serves only it. The binding data uses conjoin (&&),
  invert (not), idle, and chord (one line - InputPreferences.txt:118, key
  control ++ key c) - so Chord STAYS - and never uses the value, alias or pref
  tokens. 69 XInput lines in InputPreferences.txt fail to parse at every
  startup because no XInput driver exists; INPUT_MODE_GAMEPAD is never
  produced, so SwitchTaskManagerForX360Controller (Main.cpp:645) and the
  controller-unplugged dialog pair in HandleCommonConditions cannot fire; and
  TeamControls carries four gamepad delta ints that never cross the wire
  (NetworkUpdate serialises the flags word only) yet are still read by
  InsertionSquad.cpp:322. The gamepad may return one day - it re-enters as a
  new event source; the InputMode enum stays, every dead consumer goes.

  KEEP, explicitly: the InputSpec/ControlBindings architecture and its prefs
  files - that is the user rebinding system and it works; the ControlMethod
  preference and the gestures task manager - that is a mouse-interface choice,
  not gamepad residue (TaskManagerInterface.cpp:153 and the keybindings window
  use it); Conjoin, Invert, Idle and Chord drivers.

  ORDERING vs THE OTHER PLANS: no blocked_by edges. T1, T2 and T8 touch
  Species/Main.cpp, which sound-xaudio2 T8 and network-transport T9 also name
  - do not run those concurrently. T3 touches NeuronCore/TeamControls.h, which
  the network plan's codec tasks read but do not modify - no ordering, just do
  not run T3 concurrently with network-transport T1.

tasks:
  - id: T1
    title: Delete the unregistered and data-unused input drivers
    intent: >
      InputDriverPipe is never registered, the InputFilter family exists only
      to serve it, and no line of binding data uses the value, alias or pref
      tokens. Code that cannot run teaches wrong lessons about what the input
      system needs to support; it goes before the redesign starts so the
      redesign is sized against reality.
    project: NeuronClient
    depends_on: []
    files:
      - NeuronClient/InputDriverPipe.h
      - NeuronClient/InputDriverPipe.cpp
      - NeuronClient/InputFilter.h
      - NeuronClient/InputFilter.cpp
      - NeuronClient/InputFilterDirection.h
      - NeuronClient/InputFilterDirection.cpp
      - NeuronClient/InputFilterManager.h
      - NeuronClient/InputFilterManager.cpp
      - NeuronClient/InputFilterSpec.h
      - NeuronClient/InputFilterSpec.cpp
      - NeuronClient/InputFilterWithDelta.h
      - NeuronClient/InputFilterWithDelta.cpp
      - NeuronClient/InputDriverValue.h
      - NeuronClient/InputDriverValue.cpp
      - NeuronClient/InputDriverValues.inc
      - NeuronClient/InputDriverAlias.h
      - NeuronClient/InputDriverAlias.cpp
      - NeuronClient/InputDriverPrefs.h
      - NeuronClient/InputDriverPrefs.cpp
      - NeuronClient/Input.cpp
      # Declares InputDetailsList, whose only consumer is the filter family.
      # Added to the list during the work, per docs/TASK_DAG.md - a file list
      # is written from where a thing is declared and the work is wherever it
      # is named.
      - NeuronClient/InputTypes.h
      - NeuronClient/NeuronClient.vcxproj
      - NeuronClient/NeuronClient.vcxproj.filters
      - Species/Main.cpp
    acceptance:
      - The audit is re-run and recorded in notes before deleting - grep the value/alias/pref tokens over GameData/Input and grep for programmatic InputSpec construction naming those drivers; both must be zero
      - The Pipe, Value, Alias and Prefs drivers and the five InputFilter files are gone from disk and vcxproj; Main.cpp registers W32, Conjoin, Chord, Invert and Idle
      - Chord, Conjoin, Invert and Idle demonstrably still parse - the bindings file loads with zero parse errors from those lines
      - check_project_files passes
    verify:
      - python3 tools/check_project_files.py
      - python3 tools/check_layering.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    status: done
    notes: |
      Landed 2026-08-06. CI green at 7e7b57d, first round: 19 files and 1210
      lines gone, and the tree still builds, links and passes the suite. The
      build and test verify commands were run by CI rather than locally.

      THE AUDIT, re-run 2026-08-06 before anything was deleted, as the first
      acceptance criterion requires.

      Data. Every binding right-hand side across InputPreferences.txt and both
      Keyboards/*.txt files, counted by leading token: key 99, XInput 64,
      mouse 23, idle 1, plus 18 icon paths on ~ lines. A whole-word grep for
      value, alias, pref and pipe over the same files returns NOTHING - not as
      a leading token, not anywhere. The combinators do not appear as leading
      tokens because they scan for their operator mid-spec, and all three are
      present in the data: && (Conjoin) and not (Invert) on
      UnitSetTarget/UnitSecondaryFireTarget, ++ (Chord) on
      GesturesTaskManagerEndTask, and idle on StopAttractMode.

      Code. The only callers that build a spec from a string are the three
      surviving combinators (recursing into parseInputSpec*) and
      PrefsKeybindingsWindow's ApplyKeybindingsButton. That last one was the
      one worth checking, and it is safe: its val comes from
      m_bindings[i]->pref, which is an InputDescription produced by
      getInputDescription - "key a pressed", "mouse left down" - never a
      driver keyword. Every other mention of the four deleted classes was
      inside their own files or the three addDriver lines in Main.cpp.

      A FINDING THAT STRENGTHENS THE CASE. ValueInputDriver could never have
      parsed its own syntax: its guard reads
      `if (tokens.length() < idx + 1 || stricmp(tokens[idx++], "value") == 0)
      return state;` - it returns FAILURE when the first token IS "value".
      So a "value ..." spec was always rejected, and what it actually accepted
      was a bare value name with no driver prefix, reachable only after every
      other driver had refused. It was not unused-but-working; it was
      inverted. Nothing in the data reached it either way.

      InputDetailsList and InputDetailsPtr went too. Both were declared in
      InputTypes.h and named ONLY by the deleted files - the two filter()
      overloads and InputFilterWithDelta's history buffers - so the deletion
      orphaned them. <memory> and <vector> stay in that header: nothing in it
      needs them now, but roughly twenty files include it and some rely on the
      transitive include, which is not a trade worth a build round.

  - id: T2
    title: Delete the gamepad vestige - dead switch, dead dialogs, 69 dead binding lines
    intent: >
      No driver can produce INPUT_MODE_GAMEPAD, so everything conditioned on it
      is unreachable, and the 69 XInput binding lines cost a parse failure each
      at every startup. Deleting the vestige - not the InputMode enum - leaves
      a clean seat for a future controller as a new event source.
    project: Species
    # The edge to T1 is file-collision serialisation over Species/Main.cpp,
    # not a logical dependency - docs/TASK_DAG.md, Waves and concurrency.
    depends_on: [T1]
    files:
      - Species/Main.cpp
      - Species/Main.h
      - Species/Renderer.cpp
      - NeuronClient/ControlTypes.inc
      - GameData/Input/InputPreferences.txt
      - Tests/NeuronClientTests/ControlBindingsTests.cpp
    acceptance:
      - SwitchTaskManagerForX360Controller and its call site are gone; the ControllerUnplugged/ControllerPlugged dialog block in HandleCommonConditions and both control types are gone
      - InputPreferences.txt contains no XInput line (baseline 69) and no gamepad glyph icon line (baseline 18); startup parses the file with zero errors
      # AMENDED 2026-08-06, DURING the work, original wording kept: it read
      # "The InputMode enum keeps its gamepad value; grep shows no remaining
      # consumer of INPUT_MODE_GAMEPAD outside the enum and the
      # mode-preference plumbing". Measured, there are TWENTY consumers across
      # eight files, and they are not what that sentence assumed. They are the
      # controller USER INTERFACE: a per-mode localised phrase table
      # (LanguageTable's m_phrasesXin, 6 sites), 360 button prompts in the task
      # manager (8), the whole ControlHelpSystem - whose Advance early-returns
      # unless the mode IS gamepad, so the overlay is gamepad-only by
      # construction (2) - plus camera tracking defaults, cursor rendering, a
      # task-manager branch and one order-given test. Deleting those removes a
      # feature and makes reintroducing a controller a UI rewrite rather than a
      # new driver, which is the opposite of what this plan says it wants. The
      # line between what went and what stayed is therefore: code that fires on
      # gamepad EVENTS cannot work and is gone; code that RENDERS differently
      # while in gamepad mode is a coherent feature waiting for a driver and
      # stays, unreached, exactly as the enum does.
      - Every consumer that reacts to a gamepad EVENT is gone; the ~20 that select rendering or defaults by current input mode stay with the enum, and are listed in the notes so the count is checkable
      - The ControlMethod preference and the gestures task manager are untouched - stated here so nobody deletes them as gamepad residue
      - ControlBindingsTests still passes, with its end-of-table test repointed rather than deleted
    verify:
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    status: done
    notes: |
      Landed 2026-08-06. CI green at 8f1e54a, first round.

      WHAT WENT: SwitchTaskManagerForX360Controller and its per-frame call, the
      ControllerUnplugged/ControllerPlugged dialog pair in
      HandleCommonConditions, both control types, 69 XInput binding lines and
      the 18 gamepad glyph icon lines that decorated them. Every one of those
      waited on a gamepad EVENT that no driver in the tree can report.

      WHAT STAYED, and the acceptance criterion above was amended during the
      work rather than quietly missed: twenty INPUT_MODE_GAMEPAD consumers
