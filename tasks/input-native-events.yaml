      - NeuronClient/InputDriverWin32.cpp
      - NeuronClient/Win32EventHandler.h
      - NeuronClient/Win32EventHandler.cpp
      # Gains the focus-lost hook, so the driver can release its own state
      # instead of the handler reaching into it through externs.
      - NeuronClient/Win32EventProc.h
      # THE ALT-TAB MACHINERY REACHES INTO GameLogic, which this list did not
      # say and the summary got wrong - see the corrected note below. These
      # three hold the calls and dead comments that go with it.
      - GameLogic/MainMenus.cpp
      - GameLogic/PrefsKeybindingsWindow.cpp
      - GameLogic/PrefsScreenWindow.cpp
      - Species/Main.cpp
    acceptance:
      - Focus state comes from WM_ACTIVATE handling; GetForegroundWindow no longer appears in the message path
      - Losing focus releases ALL held keys and buttons, generalising the ALT special case
      - BindAltTab, UnbindAltTab, ResetWindowHandle, the WM_HOTKEY handler and the duplicate WM_SYSKEYUP branch are gone, along with the one live ResetWindowHandle call and the three dead comment blocks that name the others
      - The wheel handler uses the named WM_MOUSEWHEEL constant and GET_WHEEL_DELTA_WPARAM, accumulating fractional detents instead of truncating
    verify:
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    status: done
    notes: |
      CORRECTION, 2026-08-06, before the work. This plan's summary said the
      Alt-Tab machinery was "dead since its only caller was commented out
      (Main.cpp:865)". That was written from a grep of Species/ alone and it
      is wrong twice over. BindAltTab and UnbindAltTab are named in GameLogic
      too - PrefsKeybindingsWindow.cpp and PrefsScreenWindow.cpp - though both
      of those are inside comment blocks, so the conclusion that nothing calls
      them survives. What does NOT survive is the file list: ResetWindowHandle
      has a LIVE caller at MainMenus.cpp:267, on the resolution-change path,
      and it exists only to re-register the hotkey against the new window.

      It is a no-op in practice, which is why nobody noticed: g_altTabBound is
      set true only by BindAltTab, BindAltTab is never called, so
      ResetWindowHandle reduces to UnbindAltTab, which unregisters a hotkey
      that was never registered. Deleting it and its one call is the honest
      outcome; keeping an empty stub would preserve a function whose whole
      subject is gone.

      This is the failure mode tasks/_next-batch.md names: a file list written
      from where a thing is DECLARED when the work is wherever it is NAMED.
      Three GameLogic and Species files joined the list above because of it.

  - id: T5
    title: Make OS messages an InputEvent stream and derive driver state from it
    intent: >
      The foundation move - WndProc produces typed, timestamped InputEvents
      into a queue, and the W32 driver builds its per-frame state by draining
      that queue, instead of scattering writes into file-scope arrays. The
      g_keys/g_keyDeltas globals and their block-scope-extern workarounds
      disappear, and a key pressed and released inside one frame finally
      reports both edges.
    project: NeuronClient
    depends_on: [T4]
    files:
      - NeuronClient/InputEvents.h
      - NeuronClient/InputDriverWin32.h
      - NeuronClient/InputDriverWin32.cpp
      - NeuronClient/Win32EventHandler.cpp
      - NeuronClient/WindowManager.cpp
      - NeuronClient/NeuronClient.vcxproj
      - NeuronClient/NeuronClient.vcxproj.filters
      - Species/Camera.cpp
      - Tests/NeuronClientTests/InputEventTests.cpp
      - Tests/NeuronClientTests/NeuronClientTests.vcxproj
      - Tests/NeuronClientTests/NeuronClientTests.vcxproj.filters
    acceptance:
      - InputEvents.h defines the event types (key down/up with repeat flag, char, mouse button, mouse move, wheel, focus); the window procedure only enqueues
      - g_keys and g_keyDeltas are driver members; the extern declarations in Win32EventHandler.cpp and the direct read in Camera.cpp:343 are gone (grep zero)
      - The queue-to-state derivation is a free function testable without a window, and InputEventTests covers it - including the press-and-release-within-one-frame case producing a down edge then an up edge on consecutive frames
      - Every existing controlEvent condition (down, up, pressed, read, moved) behaves identically at frame granularity
    verify:
      - python3 tools/check_project_files.py
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    status: done
    notes: |
      Landed 2026-08-06.

      THE SHAPE OF THE CHANGE: WndProc appends an InputEvent and does nothing
      else — no state writes, no Eclipse call, no window call. Advance pumps the
      queue, then DeriveFrameState builds the frame's state from it. The rule
      that recovers the lost information is one line: AT MOST ONE EDGE PER
      CONTROL PER FRAME, and an event that would need a second is left for the
      next frame. Press and release inside one frame now reports a down edge,
      then an up edge on the frame after.

      Stopping early defers everything BEHIND the deferred event too, not just
      that control. That is deliberate: consuming later events out of order
      would reorder edges, which is the thing this task exists to stop.

      g_keys and g_keyDeltas are gone as globals — not moved, deleted. The
      driver holds one InputFrameState and six former driver arrays collapsed
      into it. The last read outside the driver was in a 37-line commented-out
      Camera::AdvanceSphereWorldIntroMode, which went with them, so the grep is
      genuinely zero rather than zero-except-in-comments.

      FOUR THINGS THE REWRITE HAD TO PRESERVE DELIBERATELY, each found by
      reading the old code rather than by it failing:

      1. Modifier state for EclUpdateKeyboard is tracked ACROSS the walk from a
         snapshot taken before derivation. Reading it off the finished frame
         state would give every keystroke in a frame the same final answer, so
         shift-then-letter and letter-then-shift would look identical.
      2. System keys carry a flag and are NOT forwarded to Eclipse. The old
         window procedure hooked WM_KEYDOWN and not WM_SYSKEYDOWN, so Eclipse
         has never heard about Alt+anything; this task is not the one to change
         that.
      3. Alt-F4 still quits from inside the window procedure, not from a
         binding. It has to work with the queue full and the frame loop stalled.
      4. SetMousePosNoVelocity drops queued MouseMove events. A warp that left
         them in would report travel from the position it just overwrote, which
         is exactly the velocity the function exists to suppress.

      AUTO-REPEAT IS NOW DISTINGUISHABLE and is not an edge. Windows sets bit 30
      of lParam when it is repeating a held key; the old pipeline had no way to
      express the difference and the state made every repeat look like nothing,
      so the effect is unchanged and the information is now available to T6.

      A PRE-EXISTING BUG THIS FIXES, with no consumer to notice: WM_SYSKEYUP
      wrote g_keys[k] = 0 and never wrote a delta, so releasing ALT produced no
      up edge and `key alt up` could never fire. It fires now. The three
      GesturesTaskManager control types that bind ALT are declared in
      ControlTypes.inc and bound in InputPreferences.txt and NO CODE CALLS
      controlEvent FOR ANY OF THEM — dead controls, so nothing observes either
      the old bug or the fix. Handed to T11.

      VERIFIED TWICE. InputEventTests is 14 tests over DeriveFrameState, which
      needs no window: the fast press-and-release case the task names, deferral
      ordering, auto-repeat, click-in-one-frame, move coalescing and per-frame
      velocity, partial wheel detents accumulating, focus loss releasing held
      controls, focus loss DEFERRING behind a press made the same frame,
      characters, out-of-range keys, and an empty frame clearing deltas while
      keeping held state. The same rules were also run as a standalone g++
      program under ASan and UBSan before the driver was touched at all, which
      is what let the design be wrong cheaply.

      The queue is bounded at 4096 events and drops the NEWEST when full.
      Dropping the oldest would reorder edges.

  - id: T6
    title: Route WM_CHAR to text input
    intent: >
      Typing is currently synthesised from virtual-key codes plus a shift flag,
      which is wrong on any non-US layout - the per-locale keyboard files patch
      game controls, not text. Char events flowing to the focused InputField
      make typing correct on every layout at once, while VK codes remain the
      currency of control bindings.
    project: GameLogic
    depends_on: [T5]
    files:
      - NeuronClient/InputDriverWin32.cpp
      - NeuronClient/Eclipse.h
      - NeuronClient/Eclipse.cpp
      - NeuronClient/EclWindow.h
      - NeuronClient/EclWindow.cpp
      - GameLogic/InputField.h
      - GameLogic/InputField.cpp
      - Tests/GameLogicTests/InputFieldTests.cpp
    acceptance:
      - WM_CHAR (and WM_SYSCHAR suppression) feed Char events; the focused InputField consumes characters, not virtual-key guesses
      - Editing keys - backspace, delete, arrows, enter, escape - still arrive as key events
      - The InputField keystroke tests are extended with a shifted character and a character that differs between US and German layouts, asserting the character, not the VK
      - While an InputField has focus, character-producing keys do not also fire game bindings (the capture rule the router formalises in T8)
    verify:
      - python3 tools/check_project_files.py
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    status: todo

  - id: T7
    title: Raw Input for relative mouse motion
    intent: >
      Camera aiming is derived from client-coordinate WM_MOUSEMOVE deltas,
      which saturate at screen edges and force the warp-and-suppress-velocity
      hacks. WM_INPUT deltas are unclamped and DPI-independent; the visible
      cursor keeps riding WM_MOUSEMOVE for the UI.
    project: NeuronClient
    # T6 in the edge is file-collision serialisation over InputDriverWin32.cpp,
    # not a logical dependency; the real prerequisite is T5.
    depends_on: [T5, T6]
    files:
      - NeuronClient/InputEvents.h
      - NeuronClient/InputDriverWin32.h
      - NeuronClient/InputDriverWin32.cpp
      - NeuronClient/WindowManager.h
      - NeuronClient/WindowManager.cpp
    acceptance:
      - RegisterRawInputDevices is called for the mouse; WM_INPUT deltas accumulate into the frame's relative axis
      - The MOUSE_MOVEMENT read condition serves raw deltas; absolute cursor position still comes from WM_MOUSEMOVE
      - SetMousePosNoVelocity shrinks to warping the visible cursor - raw deltas need no velocity suppression
      - Manual check recorded in notes - camera rotation continues while the cursor is pinned at a screen edge, which the old path could not do
