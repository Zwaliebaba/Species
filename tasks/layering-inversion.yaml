  - id: T8
    title: Give GameLogic its own world access, ending g_app reaches from below
    intent: >
      89 GameLogic and 22 NeuronClient includes of App.h exist to write
      g_app->m_location and friends. With the world types living in
      GameLogic, the pointers GameLogic needs (location, global world,
      teams, client-to-server) become GameLogic-owned state that App SETS
      during startup — the same inversion neuroncore-layering T7 performed
      for NeuronCore. NeuronClient's App reaches get the equivalent
      treatment per T1's findings. No object changes lifetime; only who
      holds the pointer moves.
    project: GameLogic
    depends_on: [T1]
    files:
      - Species/App.h
      - Species/App.cpp
      - GameLogic/GameLogic.vcxproj
      - GameLogic/GameLogic.vcxproj.filters
      - tools/layering_allowlist.txt
    acceptance:
      - No allowlist entry from GameLogic targets App.h; NeuronClient's App.h entries shrank by the share T1 attributed to world access
      - Subsystem construction order in App is unchanged
    verify:
      - python3 tools/check_layering.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    parallel_safe: false
    notes: >
      BOTH HALVES LANDED 2026-08-02, CI green (abbd898 and 3b2303f +
      the Team.cpp include fix). Allowlist 474 -> 418 across the two.
      One defect escaped to CI and is worth recording: the sweep inserted
      each new include after the file's LAST #include, which is right
      almost everywhere but put the header below every use in Team.cpp,
      whose last include sits at line 660. The fix relocated it to the
      leading block, and a scan across all five projects confirmed no
      other file had a use preceding its include. Insert into the leading
      include block, not after the last include line.

      First half detail: the five
      library-owned singletons — Resource, SoundSystem, Profiler,
      LangTable, ClientToServer — now have globals declared in their own
      layer's header and assigned by App beside its own members. 641 call
      sites swept, 12 files dropped App.h, allowlist 474 -> 462. That
      half was safe to alias because App assigns each exactly once, at
      startup.

      SECOND HALF NEEDS A DIFFERENT DESIGN, and this is the finding that
      matters. The world members are NOT assigned once by App: Main.cpp
      reassigns m_location three times (nullptr on unload, new Location()
      on load) and m_locationEditor twice; GameLogic itself reassigns
      m_renderer in MainMenus.cpp:263 and PrefsScreenWindow.cpp:131,141,
      and m_taskManagerInterface in PrefsKeybindingsWindow.cpp:113. A
      global that merely ALIASES the member would go stale at any
      assignment site that forgot to mirror it, and the symptom would be
      code holding a renderer App no longer owns — silent, and not
      something the type system or a test would catch.

      So the second half must MOVE the storage rather than alias it: the
      global becomes the only variable, App's member is deleted, and
      every assignment site writes the global. That makes the sweep
      tree-wide (Species included, since Species holds most of the
      assignments) rather than lower-layers-only. Remaining reach counts
      to convert: m_location 974, m_camera 239, m_renderer 149,
      m_globalWorld 111, m_locationEditor 52, m_particleSystem 47,
      m_taskManager 11, m_script 9, m_taskManagerInterface 6, m_server 3,
      m_userInput 2.

      The declarations belong in a NeuronClient header, not GameLogic:
      NeuronClient reaches m_camera 25 times and m_location 12, and
      NeuronClient cannot include a GameLogic header. Forward
      declarations (class Location; class Camera;) are enough to declare
      the pointers; only files that dereference them need the Species
      headers they already include on existing entries.

      App's scalar state — m_editing 41, m_locationId 38,
      m_difficultyLevel 10, m_requestQuit 10, m_largeMenus 7, and the
      rest — is a separate problem again: those are mutable application
      state rather than subsystem handles, so they want accessors on a
      small interface, not globals. Splitting them out is a third slice.

      Runs BEFORE the file moves, not after — see the plan summary's
      ordering correction. It does not need Location to have moved:
      declare the world pointers in a GameLogic header behind forward
      declarations (class Location; class Team;) and have App assign them
      during startup, so no include direction changes to introduce the
      seam. Files that dereference those pointers still include the
      Species headers they already do, on entries that already exist —
      nothing new is added, and each later move then removes them.

      Expect several commits: one introducing the GameLogic-side access,
      then sweeps of the reaching files. The exact shape (globals like
      g_location, or a context struct) follows T1's findings and the
      neuroncore-layering precedent.
    status: done

