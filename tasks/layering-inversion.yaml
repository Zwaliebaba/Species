# Schema: docs/TASK_DAG.md    Validate: python3 tools/check_task_dag.py

plan: layering-inversion
title: Remove the 628 upward includes from GameLogic and NeuronClient into Species
summary: >
  The next phase after neuroncore-layering (AGENTS.md): every remaining
  allowlist entry points into Species (624) or GameLogic (4). Measured on
  b69c951 by clustering tools/layering_allowlist.txt on target header —
  re-measure with check_layering.py rather than trusting this:

    GameLogic -> Species (584):
      App.h 89, Location.h 69, Renderer.h 57, Camera.h 50, Main.h 45,
      Team.h 40, GlobalWorld.h 37, EntityGrid.h 32, ParticleSystem.h 31,
      Globals.h 21, Explosion.h 21, Unit.h 19, LevelFile.h 18,
      ObstructionGrid.h 11, LocationEditor.h 11, UserInput.h 10,
      TaskManager.h 8, tail 14
    NeuronClient -> Species (40):
      App.h 22, Camera.h 6, Renderer.h 4, Location.h 3, Main.h 2, tail 3
    NeuronClient -> GameLogic (4):
      Entity.h 2, WorldObject.h 1, tail 1

  The strategy follows from what the targets ARE. Location, GlobalWorld,
  Team, Unit, LevelFile, EntityGrid, ObstructionGrid, RoutingSystem,
  ParticleSystem and Explosion are simulation — they belong in GameLogic,
  and moving them down converts hundreds of upward includes into ordinary
  intra-layer ones. Camera and Renderer are presentation reached from
  entity render code — they move down into NeuronClient or hide behind an
  interface, decided by T1's findings. App.h is the singleton everything
  reaches through — it gets the same treatment NeuronCore got in
  neuroncore-layering T7: the things GameLogic needs stop living behind
  g_app.

  Mechanics that keep this honest: every file move is a `git mv` plus
  `python3 tools/check_layering.py --rename OLD NEW` so unchanged
  violations are not orphaned, plus the four-edit .vcxproj rule in BOTH
  projects. A moved file's own upward includes (Location.cpp -> Renderer.h)
  survive as renamed entries until their target also lands — counts shrink
  per task by the measured amount, never grow. Pure moves change no
  behaviour; the simulation rules still apply to any signature or include
  change inside moved files.

  Payoff beyond hygiene: each move brings code inside GameLogicTests'
  reach, shrinking LinkStubs (which may only shrink) and making entity and
  level-file behaviour testable for the first time (T11). This unblocks
  the characterisation work the modernisation plans lean on — where both
  plans are active, prefer landing a file's move before its conversion.

  Out of scope, stated to prevent drift: no new projects (build topology
  needs the owner), no netcode or renderer redesign, no behaviour change
  anywhere.

tasks:
  - id: T1
    title: Catalogue what each upward-included Species header is used for
    intent: >
      The clusters say how many; they do not say why. For each of the 23
      Species headers reached from below, record in notes which members are
      actually used and classify the fix — move-down, interface extraction,
      or trivial relocation of a declaration. The Camera/Renderer decision
      (move vs interface) and the App decomposition shape hang on these
      findings, so this lands first and its notes are the plan's map.
    depends_on: []
    files: []
    acceptance:
      - notes lists every target header with its used members and a proposed fix, grounded in grep evidence
      - The Camera.h and Renderer.h entries state which of their members entity render code actually calls
    verify:
      - python3 tools/check_layering.py
    parallel_safe: true
    status: todo

  - id: T2
    title: Move the frame-clock globals down out of Main.h and Globals.h
    intent: >
      g_gameTime, g_predictionTime and the other frame/advance globals are
      what most Main.h and Globals.h reaches want — simulation vocabulary
      stranded in the exe. They move to a header in GameLogic (or NeuronCore
      if genuinely engine-level, per T1's findings), leaving Main.h to the
      real main loop.
    project: GameLogic
    depends_on: [T1]
    files:
      - Species/Main.h
      - Species/Main.cpp
      - Species/Globals.h
      - Species/Globals.cpp
      - GameLogic/GameLogic.vcxproj
      - GameLogic/GameLogic.vcxproj.filters
      - Species/Species.vcxproj
      - Species/Species.vcxproj.filters
      - tools/layering_allowlist.txt
    acceptance:
      - No allowlist entry from GameLogic or NeuronClient targets Globals.h; Main.h entries drop by the measured share that wanted the globals
      - The allowlist shrank and check_layering.py passes
    verify:
      - python3 tools/check_layering.py
      - python3 tools/check_project_files.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
    parallel_safe: true
    status: todo

