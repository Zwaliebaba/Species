    parallel_safe: false
    notes: >
      HALF LANDED 2026-08-02 at a543e5a — recorded here late, which is the
      first thing to know before picking this up. Renderer is done: it sits
      behind NeuronClient/RendererAccess.h and its allowlist targets went 57
      -> 2 (`grep -c Renderer.h tools/layering_allowlist.txt`). AGENTS.md
      already says so; this task did not, so the work looked unstarted.

      WHAT IS LEFT IS CAMERA, 47 entries — 41 from GameLogic, 6 from
      NeuronClient. Re-measure with
      `grep Camera.h tools/layering_allowlist.txt | cut -d/ -f1 | sort | uniq -c`
      before starting, and do not re-derive the Renderer half.

      T1 settled the open choice: Camera is interface-extraction ONLY —
      Camera.h includes GameLogic's Entity.h and WorldObject.h for its
      tracking members, so moving it down would invert the violation. The
      face entity render code needs is small: GetPos/GetFront/GetUp/
      GetRight/GetVel, the two frustum tests, SetupProjectionMatrix,
      CreateCameraShake. Renderer.h has zero includes, so either approach
      works; its render face is six methods plus ScreenW/H. GetClickRay
      and the mode/animation setters are editor/window-only and can stay
      behind Species.

      CAMERA HALF LANDED 2026-08-03. The allowlist went 326 -> 279 entries and
      no entry names Camera.h. The seam is NeuronClient/CameraAccess.h, built
      the same way as RendererAccess.h: g_camera in WorldPointers.h is a
      CameraAccess*, so dereferencing it needs only the interface, and
      Species-side code that needs the concrete type goes through a new
      TheCamera() that mirrors TheRenderer().

      The surface was MEASURED rather than taken from T1's list —
      `grep -rhoE "g_camera->[A-Za-z_]+" GameLogic NeuronClient` finds exactly
      twenty members. T1's proposed face was too small: it left out
      GetControlVector, IsInteractive, IsInMode, RequestMode, the debug-mode
      pair, PlayAnimation/StopAnimation, SetTarget/CutToTarget and GetClickRay.
      GetClickRay in particular was written off as editor-only, which is true,
      but the five editor windows that call it live in GameLogic, so leaving it
      out would have kept five allowlist entries and missed the acceptance.

      Camera::Mode moved into CameraAccess rather than being duplicated. Because
      Camera derives from CameraAccess, `Camera::ModeFreeMovement` still
      resolves through the base, so no Species-side spelling had to change; the
      five call sites below Species now say CameraAccess::Mode... instead. The
      enum is still unscoped and carries a hygiene-ok marker: Camera stores
      m_mode as an int and indexes a string table with it, so converting it is
      language-hygiene T5's job, not this seam's.

      Camera gains a vtable it did not have. That is a per-call indirection on
      GetUp and GetRight, which entity render bodies call 61 and 58 times across
      the tree — the same cost RendererAccess already accepted for lighting and
      culling. Rendering only; nothing in the simulation path.

      Fifty-one of the touched files needed a whole-file clang-format commit
      first (100fe2a) because they are tab-indented and the changed-lines check
      does not converge on them.

      STILL OPEN: the owner-run rendering smoke test in the acceptance. Nothing
      here changes drawing logic — the change is an include, a pointer type and
      an enum's home — but the acceptance asks for it and no automated test in
      this repository covers rendering.
