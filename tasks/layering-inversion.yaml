# Schema: docs/TASK_DAG.md    Validate: python3 tools/check_task_dag.py

plan: layering-inversion
title: Remove the 628 upward includes from GameLogic and NeuronClient into Species
summary: >
  The next phase after neuroncore-layering (AGENTS.md): every remaining
  allowlist entry points into Species (624) or GameLogic (4). Measured on
  b69c951 by clustering tools/layering_allowlist.txt on target header —
  re-measure with check_layering.py rather than trusting this:

    GameLogic -> Species (584):
      App.h 89, Location.h 69, Renderer.h 57, Camera.h 50, Main.h 45,
      Team.h 40, GlobalWorld.h 37, EntityGrid.h 32, ParticleSystem.h 31,
      Globals.h 21, Explosion.h 21, Unit.h 19, LevelFile.h 18,
      ObstructionGrid.h 11, LocationEditor.h 11, UserInput.h 10,
      TaskManager.h 8, tail 14
    NeuronClient -> Species (40):
      App.h 22, Camera.h 6, Renderer.h 4, Location.h 3, Main.h 2, tail 3
    NeuronClient -> GameLogic (4):
      Entity.h 2, WorldObject.h 1, tail 1

  The strategy follows from what the targets ARE. Location, GlobalWorld,
  Team, Unit, LevelFile, EntityGrid, ObstructionGrid, RoutingSystem,
  ParticleSystem and Explosion are simulation — they belong in GameLogic,
  and moving them down converts hundreds of upward includes into ordinary
  intra-layer ones. Camera and Renderer are presentation reached from
  entity render code — they move down into NeuronClient or hide behind an
  interface, decided by T1's findings. App.h is the singleton everything
  reaches through — it gets the same treatment NeuronCore got in
  neuroncore-layering T7: the things GameLogic needs stop living behind
  g_app.

  Mechanics that keep this honest: every file move is a `git mv` plus
  `python3 tools/check_layering.py --rename OLD NEW` so unchanged
  violations are not orphaned, plus the four-edit .vcxproj rule in BOTH
  projects. A moved file's own upward includes (Location.cpp -> Renderer.h)
  survive as renamed entries until their target also lands — counts shrink
  per task by the measured amount, never grow. Pure moves change no
  behaviour; the simulation rules still apply to any signature or include
  change inside moved files.

  Payoff beyond hygiene: each move brings code inside GameLogicTests'
  reach, shrinking LinkStubs (which may only shrink) and making entity and
  level-file behaviour testable for the first time (T11). This unblocks
  the characterisation work the modernisation plans lean on — where both
  plans are active, prefer landing a file's move before its conversion.

  Out of scope, stated to prevent drift: no new projects (build topology
  needs the owner), no netcode or renderer redesign, no behaviour change
  anywhere.

tasks:
  - id: T1
    title: Catalogue what each upward-included Species header is used for
    intent: >
      The clusters say how many; they do not say why. For each of the 23
      Species headers reached from below, record in notes which members are
      actually used and classify the fix — move-down, interface extraction,
      or trivial relocation of a declaration. The Camera/Renderer decision
      (move vs interface) and the App decomposition shape hang on these
      findings, so this lands first and its notes are the plan's map.
    depends_on: []
    files: []
    acceptance:
      - notes lists every target header with its used members and a proposed fix, grounded in grep evidence
      - The Camera.h and Renderer.h entries state which of their members entity render code actually calls
    verify:
      - python3 tools/check_layering.py
    parallel_safe: true
    status: done
    notes: >
      Catalogue complete (2026-08-02, at 4840da3). Per header — refs from
      below, classification, surprises:

      App.h (89 GL / 22 NC): g_app-> members from GL: m_location 962,
      m_camera 214, m_resource 190, m_soundSystem 179, m_renderer 148,
      m_profiler 139, m_globalWorld 111, m_locationEditor 52, tail ~140;
      from NC: m_profiler 80, m_camera 25, m_soundSystem 23, m_resource
      16, m_location 12, tail ~15 — zero App METHODS called from NC.
      ~641 refs are library-owned singletons parked on App (m_resource,
      m_soundSystem, m_profiler, m_langTable, m_clientToServer) — those
      can become layer-owned globals (the T7-of-neuroncore treatment)
      WITHOUT waiting for the world moves; the sim members follow
      Location down. Fix: interface-extraction in two independent halves.
      Hidden coupling: NeuronClient/LanguageTable.h and ClientToServer.cpp
      use g_app via transitive include — invisible to the allowlist.

      Location.h (69/3): m_landscape 254, GetBuilding 144, m_buildings 96,
      m_spirits 80, m_teams 62, GetEntity 61, m_entityGrid 57, m_levelFile
      53, tail ~120. Nothing below constructs/advances/renders it. Fix:
      move-down-to-GameLogic. BLOCKER: Location.h includes Species'
      Globals.h and Landscape.h — Landscape must move (or split) in the
      same step; Landscape is mixed (m_heightMap 173 + RayHit/world-size
      from GL are sim; m_renderer/BuildOpenGlState are presentation).
      Location.h already includes four GameLogic headers, so it is
      downward-coupled today. Location.cpp carries 19 upward includes that
      survive as renamed entries.

      Renderer.h (57/4): entity render code uses exactly
      {Set,Unset}ObjectLighting 40, MarkUsedCells 12, GetNear/FarPlane 15,
      RasteriseSphere 1; windows use ScreenW/H 65. 14 GL includes are
      stale. Header has zero includes, only NC/Core forward decls — both
      interface-extraction and move-down-to-NeuronClient are viable; the
      six-method render face + screen-size accessor covers everything.

      Camera.h (50/6): entity render uses GetUp 58, GetRight 56, GetPos
      36, frustum tests 20, GetFront 6, SetupProjectionMatrix 10,
      CreateCameraShake 3; GetClickRay 11 is editor windows only; mode/anim
      setters confined to 6 files. 8 GL includes stale. Fix:
      interface-extraction ONLY — Camera.h includes GameLogic's Entity.h
      and WorldObject.h (m_trackingEntity, m_objectId), so a move to
      NeuronClient would invert the violation.

      Main.h (45/2): g_gameTime 117, g_advanceTime 9,
      g_lastProcessedSequenceId 2; g_predictionTime/g_lastServerAdvance/
      g_targetFrameRate/g_sliceNum UNUSED from below; 10 includes stale.
      Fix: trivial — relocate the clock, leave AppMain.

      Team.h (40): m_others 25, m_colour 26, m_units 8, NewUnit 7, tail
      ~25; 7 stale. Clean move-down (header already includes GameLogic's
      WorldObject.h/Entity.h). Team.cpp carries 11 upward includes.

      GlobalWorld.h (37): GetBuilding 31, m_research 25 (CurrentLevel 16),
      m_buildings 14, EvaluateEvents 13, tail ~30; 4 stale. Clean
      move-down; header's SphereRenderer.h include is legal from GameLogic.

      EntityGrid.h (32): GetEnemies 12, GetBestEnemy 10, GetNeighbours 9,
      Add/RemoveObject 11, tail; 6 stale. Move-down; its only upward need
      is Globals.h for NUM_TEAMS, which actually lives in
      NeuronCore/ProtocolLimits.h — repoint and it needs nothing.

      ParticleSystem.h (31): CreateParticle 47 + 48 Particle::Type enum
      refs, nothing else; 11 stale. Move-down (GameLogic per plan; header
      includes only Core/Client).

      Globals.h (21): 18 of 21 includers only want
      SERVER_ADVANCE_PERIOD/NUM_TEAMS = ProtocolLimits.h; GRAVITY used
      once (Tripod.cpp). Fix: trivial repoint + move GRAVITY down.

      Explosion.h (21): entire surface is g_explosionManager.AddExplosion
      27; 2 stale. Clean move-down.

      Unit.h (19): subclassed by AirstrikeUnit/ViriiUnit/InsertionSquad —
      full class needed; 2 stale. Clean move-down.

      LevelFile.h (18): m_landscape 18, m_cameraMounts 10, m_instantUnits
      7, tail; 5 stale. Move-down; SAME Landscape.h blocker as Location.

      ObstructionGrid.h (11): GetBuildings 11, CalculateAll 5. Clean move.
      LocationEditor.h (11): all consumers are GameLogic editor windows;
      body is #ifdef LOCATION_EDITOR (usage measurements understate).
      Move-down. UserInput.h (10): 8 of 10 includes STALE; residual want
      is one accessor (GetMousePos3d, 2 files). TaskManager.h (8): GetTask
      4, m_tasks 3, tail; move-down (Task is simulation). Script.h (4):
      RunScript/Skip/IsRunningScript only; 3-method face or trivial move.
      RoutingSystem.h (4): cleanest move in the set. Water.h (2): two
      prefs handlers do delete/new on m_water — replace with
      Location::RebuildWater(). TaskManagerInterface.h (2/1): below wants
      only SetCurrentMessage + m_visible; split the abstract base off
      Transform.h. GameCursor.h (2): BOTH includes stale — free removal.
      TaskManagerInterfaceIcons.h (1): one construction site in
      PrefsKeybindingsWindow — give Species a Recreate hook.

      NeuronClient -> GameLogic (4): SoundInstance/SoundSystem want
      WorldObjectId + the entity-type-name table; TargetCursor.cpp wants
      ControlHelpSystem::CondCameraAim; SoundSystem.cpp also reaches
      SaveOnQuitWindow.h. Moving WorldObjectId + a type-name table down to
      NeuronCore clears most of it.

      STALE INCLUDES TOTAL: ~60 upward includes are dead (Renderer 14+,
      Main 10, UserInput 8, ParticleSystem 11, EntityGrid 6, Team 7,
      Camera 8, GameCursor 2, others) — removing them is free allowlist
      shrinkage with zero behaviour risk; added as T13.

      LinkStubs.cpp stubs exactly ONE symbol: App* g_app = nullptr. The
      whole link wall is the App singleton.

