  - id: T4
    title: Move Profiler down into NeuronCore
    intent: >
      The profiler is infrastructure a headless server needs as much as a client
      does, and NeuronCore's networking code already reaches for it. Preferences
      was originally in this task and has been split out to T11 — see the notes.
    project: NeuronCore
    depends_on: []
    files:
      - NeuronClient/Profiler.h
      - NeuronClient/Profiler.cpp
      - NeuronCore/NeuronCore.vcxproj
      - NeuronClient/NeuronClient.vcxproj
