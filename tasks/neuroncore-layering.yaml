    project: NeuronCore
    depends_on: []
    files:
      - NeuronClient/Vector3.h
      - NeuronClient/Vector2.h
      - NeuronClient/Matrix33.h
      - NeuronClient/Matrix34.h
      - NeuronClient/MathUtils.h
      - NeuronClient/Random.h
      - NeuronClient/Plane.h
      - NeuronCore/NeuronCore.vcxproj
      - NeuronClient/NeuronClient.vcxproj
    acceptance:
      - The maths headers and their .cpp files live under NeuronCore/
      - MathUtils.cpp still carries the Mersenne Twister BSD notice verbatim (see LICENSE)
      - No NeuronCore/ allowlist entry names Vector3.h
    verify:
      - python3 tools/check_project_files.py
      - python3 tools/check_layering.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64
