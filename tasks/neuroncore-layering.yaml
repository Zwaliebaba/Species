  - id: T5
    title: Move the IP conversion helpers off Server and into Generic
    intent: >
      Server::ConvertIPToInt and ConvertIntToIP are static string/integer
      conversions with nothing to do with running a server, and ClientToServer
      calls ConvertIPToInt purely to get 127.0.0.1 as an int. They belong beside
      IpToString in Generic. Doing this first removes one client-to-server
      coupling before the projects are separated, so there is one less thing
      failing to compile when they are.
    project: NeuronCore
    depends_on: []
    files:
      - NeuronCore/Generic.h
      - NeuronCore/Generic.cpp
      - NeuronCore/Server.h
      - NeuronCore/Server.cpp
      - NeuronCore/ClientToServer.cpp
    acceptance:
      - ConvertIPToInt and ConvertIntToIP are free functions in Generic, not statics on Server
      - ClientToServer.cpp no longer references the Server class for IP conversion
      - Every call site is updated
    verify:
      - python3 tools/check_layering.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64
    parallel_safe: true
    status: done

  # ---------------------------------------------------------------------------
  # Wave 2: sever the wire protocol from the game model. Needs the containers and
  # maths in place, because the replacement id types are expressed with them.
  # ---------------------------------------------------------------------------

  - id: T6
    title: Give the wire protocol its own identifier types
    intent: >
      NetworkUpdate.h and ServerToClientLetter.h reference Entity, Team and
      WorldObject directly, dragging the game model into the networking layer.
      The protocol only ever needs opaque ids and a type tag. Defining those in
      NeuronCore severs the dependency and lets the protocol be built — and
      eventually tested — without a renderer or a game attached.

      Note WorldObjectId::m_index is a raw DArray slot serialised verbatim by
      WRITE_WORLDOBJECTID. Whatever replaces it must preserve that wire layout
      exactly, or old and new clients silently disagree.
    project: NeuronCore
    depends_on: [T1, T2]
    files:
      - NeuronCore/NetworkUpdate.h
      - NeuronCore/NetworkUpdate.cpp
      - NeuronCore/ServerToClientLetter.h
      - NeuronCore/ServerToClientLetter.cpp
    acceptance:
      - NeuronCore defines its own id types for objects, teams and units
      - No header under NeuronCore/ includes Entity.h, Team.h or WorldObject.h
      - The serialised byte layout is unchanged - NETWORKUPDATE_BYTESTREAMSIZE is still 42
      - GameLogic and Species convert between their types and the protocol ids at the boundary
    verify:
      - python3 tools/check_layering.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64
    parallel_safe: true
    status: done
    notes: >
      Far smaller than the intent assumed, and worth recording why. The protocol
      did not reference Entity, Team or WorldObject as *types* at all — every id
      it carries was already a plain int or unsigned char. Four of the five
      includes were simply dead, left behind by earlier edits.

      The one real dependency was TeamControls, which NetworkUpdate holds by
      value and serialises through GetFlags/SetFlags. It is a mouse position, a
      bitfield and a few deltas — a wire payload with no game-model dependency —
      so it moved down into NeuronCore rather than being abstracted away.

      The only other reference was Entity::TypeInvalid as a default. The protocol
      now declares its own EntityTypeInvalid = 0 and treats the entity-type tag
      as an opaque byte, which is what it always was on the wire. Entity.h's
      TypeInvalid is 0, verified, so the value is unchanged.

      NETWORKUPDATE_BYTESTREAMSIZE is untouched at 42 and no serialisation code
      changed, so the wire layout is identical.

      TeamControls did not move cleanly. Its data and flags encoding are core —
      that is what the wire carries — but Advance() polls g_app->m_camera,
      g_app->m_userInput, g_inputManager and the control-help system. That is
      client input-gathering and cannot live in the foundation, so the class is
      split: the struct, constructor, GetFlags, SetFlags, Clear and ClearFlags in
      NeuronCore; Advance() defined in Species/Team.cpp with the declaration
      annotated to say why. CI found this, not review.

      No new id types were needed. If the protocol later wants stronger typing
      than bare ints that is a separate design task, not a prerequisite for the
      split.

      Took four attempts. Two of the removed includes were not dead but
      load-bearing by accident: ServerToClientLetter.h declares
      LList<NetworkUpdate*> and NetworkUpdate.h declares Vector3 m_direction,
      and both were getting those types transitively through WorldObject.h.
      Grepping a header for type *usage* does not tell you whether its includes
      are dead. Verified green on aa20f67.

  # ---------------------------------------------------------------------------
  # Wave 3: the seam that makes the split possible at all.
  # ---------------------------------------------------------------------------

  - id: T7
    title: Replace the g_app loopback with an explicit transport seam in NeuronCore
    intent: >
      This is the task the whole plan turns on. Server.cpp reaches through
      g_app->m_clientToServer to deliver a letter to the local client, and
      ClientToServer.cpp reaches through g_app->m_server to deliver an update to
      a locally hosted server. Neither can survive the two ending up in different
      projects, and neither should exist regardless — a server has no business
      knowing a client object exists in its process.

      Define the delivery direction as an interface in NeuronCore that both sides
      hold: the server sends letters to a sink, the client sends updates to a
      sink, and whoever wires up a listen-server connects the two loopback sinks.
      A dedicated host binary connects sockets instead. Species keeps hosting
      exactly as it does today; it just does the wiring explicitly.
    project: NeuronCore
    depends_on: [T5, T6]
    files:
      - NeuronCore/Server.cpp
      - NeuronCore/Server.h
      - NeuronCore/ClientToServer.cpp
      - NeuronCore/ClientToServer.h
      - Species/App.cpp
      - Species/App.h
    acceptance:
      - Neither Server.cpp nor ClientToServer.cpp mentions g_app for transport
      - There is no in-process delivery path left for either side to reach for
      - Hosting still works, now over UDP loopback rather than in-process
      - Server.cpp includes none of App.h, Globals.h, Main.h, Team.h
    verify:
      - python3 tools/check_layering.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64
    parallel_safe: false
    status: done
    notes: >
      Resolved by deletion rather than abstraction. The seam was first built as
      NeuronCore/NetworkSinks.h — two one-method interfaces the endpoints held
      for each other — but the owner then removed the bypass-networking mode
      entirely: UDP only, no in-process delivery. With no loopback there is
      nothing for the sinks to carry, so NetworkSinks.h was deleted and both
      endpoints simply always use their sockets.

      That is the better outcome. The bidirectional g_app coupling this task
      existed to break is gone because the feature that required it is gone, and
      no indirection was left behind to pay for.

      Note the behavioural change: BypassNetwork defaulted to 1, so a local game
      previously delivered in-process. It now goes over real UDP loopback —
      client to 127.0.0.1:4000, server back on 4001. The socket path was always
      there but was not the default, so it is the less-travelled code.

      Two things the survey did not predict. Server.cpp needed NUM_TEAMS, which
      lived in Species/Globals.h next to GRAVITY and the render budget; the
      protocol constants (NUM_TEAMS, the server tick rates, IAMALIVE_PERIOD) are
      now NeuronCore/ProtocolLimits.h, which Globals.h includes so no existing
      user changed. And ServerToClient was reaching for g_app->m_bypassNetworking
      in its constructor — it is built only by Server, which already knows, so it
      is passed in.

      Server.cpp, ServerToClient.cpp and ClientToServer's transport half no
      longer mention g_app. What remains in ClientToServer.cpp is entirely inside
      ProcessServerUpdates, which is T12.

      parallel_safe false: it rewires two files that T8 and T9 then move, and
      touches App.cpp, which almost everything else in Species also touches.

      Surveyed before starting. The g_app uses are not one loopback but five
      distinct couplings, and they want different fixes:

        1. loopback delivery   Server.cpp:267 -> m_clientToServer->ReceiveLetter
                               ClientToServer.cpp:115 -> m_server->ReceiveLetter
                               This is the seam this task is about.
        2. self-reference      ClientToServer reaches its own instance through
                               g_app->m_clientToServer in a static callback and
                               in AdvanceSender. Wants a file-scope instance
                               pointer or a bound callback, not a global.
        3. config              g_app->m_bypassNetworking, read by both. Inject at
                               Initialise().
        4. profiler            g_app->m_profiler. Profiler is in NeuronCore since
                               T4; only the instance is held by App.
        5. game translation    ProcessServerUpdates and the Request* builders.
                               Not networking at all — see T12.

      Only 1-4 belong in T7. Doing 5 here would make the diff unreviewable.

      Closed on 6eb17e4, verified against the tree rather than from memory:

        - Server.cpp mentions g_app once, in a comment explaining what used to be
          reached for. No code reference, and it includes none of App.h,
          Globals.h, Main.h or Team.h.
        - ClientToServer.cpp has 12 g_app references, all at lines 491-555 —
          inside ProcessServerUpdates, which is T12's half. The transport half
          and the static callback are clean.
        - ServerToClient.cpp includes only NetLib, NetSocket and Debug.
        - No NetworkSinks.h and no BypassNetwork anywhere in the tree.
        - Of the five NeuronCore/Server.cpp allowlist entries this task started
          with, one remains: Server.cpp -> Preferences.h, which is T11's to
          remove, not T7's.

      Acceptance criteria 2 and 3 were reworded to describe what was delivered.
      The original said the loopback "is wired by Species at construction" and
      that hosting is unchanged "from the player's point of view"; neither is
      true of a deletion, and both would have failed a literal check while the
      task's actual intent — no cross-layer reach for delivery — was fully met.
      The behavioural change is recorded above rather than hidden by the rewrite.

  # ---------------------------------------------------------------------------
  # Wave 4: the moves themselves. Different destination projects, no shared
  # files, so these two can run concurrently once T7 has cut the tie.
  # ---------------------------------------------------------------------------

  - id: T8
    title: Move ClientToServer into NeuronClient
    intent: >
      ClientToServer is the client's network endpoint — it holds the inbox the
      renderer drains and assembles packets from game state. It is client code
      sitting in the foundation. Moving it up means NeuronCore stops needing
      Input, TaskManager, the entity headers and the rest that ClientToServer
      drags in, which is a large share of NeuronCore's remaining violations.
    project: NeuronClient
    depends_on: [T7, T12]
    files:
      - NeuronCore/ClientToServer.h
      - NeuronCore/ClientToServer.cpp
      - NeuronCore/NeuronCore.vcxproj
      - NeuronClient/NeuronClient.vcxproj
      - Tests/NeuronClientTests/NeuronClientTests.vcxproj
    acceptance:
      - ClientToServer lives under NeuronClient/ and is listed in NeuronClient.vcxproj
      - No NeuronCore/ClientToServer entries remain in the allowlist
      - Entries that are still violations were moved with check_layering.py --rename, not regenerated
      - NeuronClientTests still builds and passes with ClientToServer in the project
    verify:
      - python3 tools/check_project_files.py
      - python3 tools/check_layering.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64
    parallel_safe: true
    status: todo
    notes: >
      Re-measured on 6eb17e4. With T12 done first — which is why the edge is
      there — this task's only remaining allowlist work is one entry:
      ClientToServer.cpp -> Input.h. Input.h is owned by NeuronClient, so the
      violation disappears the moment the file lands there, with no code change.

      The intent paragraph overstates the payoff now: "a large share of
      NeuronCore's remaining violations" was true of 30, but T12 takes 11 of the
      14 that are left and this task takes the twelfth. It is still the move that
      lets NeuronCore stop knowing a client endpoint exists.

  - id: T9
    title: Move Server and ServerToClient into NeuronServer
    intent: >
      ServerToClient's own header says it: "Represents one connection to one
      client. Server is expected to have a list of these." Both are the
      authoritative host, and NeuronServer is the empty project waiting for them.
      This is what turns NeuronServer from a stub into the thing a headless
      binary can link.

      Species and GameLogic legitimately reference Server for listen-server
      hosting, so the layering model gains Species -> NeuronServer. NeuronServer
      -> NeuronClient stays forbidden, which is the direction that matters.
    project: NeuronServer
    depends_on: [T7]
    files:
      - NeuronCore/Server.h
      - NeuronCore/Server.cpp
      - NeuronCore/ServerToClient.h
      - NeuronCore/ServerToClient.cpp
      - NeuronCore/NeuronCore.vcxproj
      - NeuronServer/NeuronServer.vcxproj
      - tools/check_layering.py
    acceptance:
      - Server and ServerToClient live under NeuronServer/ and are listed in NeuronServer.vcxproj
      - check_layering.py allows Species -> NeuronServer, and still forbids NeuronServer -> NeuronClient
      - The one remaining Server.cpp entry moves with check_layering.py --rename, and the tree-wide count does not go up
      - NeuronServer.vcxproj lists NeuronCore only in AdditionalIncludeDirectories
      - Tests/NeuronServerTests/LayerWiringTests.cpp is replaced by coverage of the moved code, per its own comment
    verify:
      - python3 tools/check_project_files.py
      - python3 tools/check_layering.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64
    parallel_safe: true
    status: todo
    notes: >
      Two criteria rewritten on 6eb17e4 because the tree moved underneath them.

      "The five NeuronCore/Server.cpp entries are gone from the allowlist" is no
      longer achievable by this task: T7 removed four of them, and the fifth is
      Server.cpp -> Preferences.h, which only T11 can fix. Moving Server.cpp into
      NeuronServer with T11 unfinished relocates that entry rather than removing
      it, so the criterion is now that the rename is done with --rename and the
      count does not grow.

      The NeuronServer.vcxproj criterion already holds today — it lists
      $(SpeciesRoot)NeuronCore and nothing else — and needs to survive the move,
      not be established by it.

      NeuronServerTests now exists and holds one scaffolding test that only
      proves the project wiring is intact. This is the task that gives
      NeuronServer behaviour worth testing, so it is also the task that retires
      that placeholder.

  # ---------------------------------------------------------------------------
  # Wave 5: close the door, and prove the point of the exercise.
  # ---------------------------------------------------------------------------

  - id: T10
    title: Drop NeuronCore's upward include paths and link the headless server
    intent: >
      Removing the violations is half the job. Until NeuronClient, GameLogic and
      Species come off NeuronCore's AdditionalIncludeDirectories the next upward
      include compiles fine and the layer quietly rots again. Linking Server.exe
      without NeuronClient.lib is what proves the split was real rather than
      cosmetic, and it is this phase's definition of done in AGENTS.md.
    project: NeuronCore
    depends_on: [T8, T9]
    files:
      - NeuronCore/NeuronCore.vcxproj
      - Server/Server.vcxproj
      - Server/WinMain.cpp
      - tools/layering_allowlist.txt
      - AGENTS.md
    acceptance:
      - NeuronCore.vcxproj lists no other project in AdditionalIncludeDirectories
      - tools/layering_allowlist.txt contains no entry starting with NeuronCore/
      - Server.exe links against NeuronCore and NeuronServer only, with no NeuronClient.lib
      - Server.exe advances sequence ids with no client attached
      - AGENTS.md records which of the four definition-of-done conditions now hold
    verify:
      - python3 tools/check_layering.py
      - python3 tools/check_project_files.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64
    parallel_safe: true
    status: todo
    notes: >
      Where the four definition-of-done conditions stand on 6eb17e4:

        1. no NeuronCore/ allowlist entries    14 left. T11 (2), T12 (11), T8 (1).
        2. NeuronCore.vcxproj include dirs     not started. Still lists
                                               NeuronClient;Species;GameLogic in
                                               both Debug and Release.
        3. Server.exe links without the client already structurally true and not
                                               by this task's doing —
                                               Server.vcxproj references only
                                               NeuronCore and NeuronServer, and
                                               its include path is those two.
                                               But WinMain.cpp is `int main() {
                                               return 0; }`, so nothing ticks and
                                               no sequence id advances. That half
                                               is the real work here.
        4. green build                         x64 Debug is what CI gates.

      Condition 3 was folded into acceptance explicitly, because the linking half
      passing on its own would otherwise let this task be closed against a binary
      that does nothing.

  # ---------------------------------------------------------------------------
  # Split out of T4 during wave 1: Preferences is not foundational.
  # ---------------------------------------------------------------------------

  - id: T11
    title: Make Preferences foundational, then move it into NeuronCore
    intent: >
      T4 assumed Preferences was infrastructure that could simply move down.
      Moving it proved otherwise: Preferences.cpp includes App.h, Resource.h,
      TextStreamReaders.h and PrefsOtherWindow.h — a settings *store* reaching
      into the application object, the resource system and a settings *window*.
      That is a dependency inversion to fix, not a file to relocate, so it was
      moved back and given its own task.

      NeuronCore's networking still reads preferences, so this stays on the
      critical path for a standalone core, but it is a design change rather than
      the mechanical move the rest of wave 1 was.
    project: NeuronCore
    depends_on: []
    files:
      - NeuronClient/Preferences.h
      - NeuronClient/Preferences.cpp
      - GameLogic/PrefsOtherWindow.h
      - Species/App.cpp
      - NeuronCore/NeuronCore.vcxproj
      - NeuronClient/NeuronClient.vcxproj
    acceptance:
      - Preferences.cpp includes none of App.h, Resource.h, TextStreamReaders.h, PrefsOtherWindow.h
      - Reading and writing the preferences file does not require the resource system or a window
      - Preferences then lives under NeuronCore/ with no upward includes
      - The DefaultPreferences.txt override still applies, and only when there is no prefs file yet
    verify:
      - python3 tools/check_layering.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64
    parallel_safe: true
    status: done
    notes: >
      Still true as written, re-checked on 6eb17e4: Preferences.h/.cpp are under
      NeuronClient/ and Preferences.cpp still includes App.h, Resource.h,
      TextStreamReaders.h and PrefsOtherWindow.h.

      It is now the only task standing between the tree and two of the fourteen
      NeuronCore entries — ClientToServer.cpp -> Preferences.h and
      Server.cpp -> Preferences.h — and the second of those is the last thing
      keeping Server.cpp itself upward-dependent. Everything else in Server.cpp
      was resolved by T7. That makes this a better next pick than its wave-1
      placement suggests.

      Closing T7 opened T9 and T12, so `--next` now returns three tasks. This one
      shares no `files` with either, and none of the three overlap, so all three
      may be worked concurrently — with the caveat that T12 is
      `parallel_safe: false`.

      Done. Four allowlist entries removed: the two Preferences.h includes this
      task existed to fix, plus Preferences.cpp's own two upward includes, which
      went with it. 633 -> 629 tree-wide, and NeuronCore is down to a single
      entry — ClientToServer.cpp -> Input.h, which is T8's.

      The four includes fell into two groups, not one.

      PrefsOtherWindow.h was there for OTHER_DIFFICULTY, one of eight OTHER_*
      key-name macros defined beside the window that edits them under the comment
      "Defines useful to reference preferences from other parts of the program".
      They are preference key names, so all eight moved to Preferences.h. Every
      file that used one already included Preferences.h — checked, all seven —
      so not a single include line had to change.

      App.h, Resource.h and TextStreamReaders.h were all one thing: the tail of
      CreateDefaultValues reading GameData/DefaultPreferences.txt through
      g_app->m_resource to overlay shipped defaults. Two ways to break that, and
      the obvious one is wrong. Reading the file with fopen here — which Load()
      already does for the prefs file itself — looks equivalent but is not:
      Resource::GetTextReader hands back a TextReader whose CleanLine()
      "decrypt[s], strip[s] comments and scan[s] for conflict markers", so an
      fopen would silently fail on an encrypted data file. So it is a seam
      instead: PrefsManager::SetDefaultsProvider takes a function pointer, and
      Species/App.cpp installs one that does exactly what the old code did, with
      the same g_app/m_resource guard, immediately before constructing the
      manager. NULL provider means built-in defaults only, which is what a
      headless server gets and wants.

      Ordering checked rather than assumed: App.cpp creates m_resource on the
      line before it creates the PrefsManager, so the override really does fire
      today and the seam has to preserve that. It only ever runs when there is no
      preferences file, because that is the only path that reaches
      CreateDefaultValues.

      Two conditionals had to be verified before the move, not after. Preferences
      picks its sound and demo defaults from HAVE_DSOUND and DEMOBUILD, and
      moving the file changes which pch.h it compiles against. Both are defined
      in NeuronCore/NeuronCore.h, and the two projects carry identical
      PreprocessorDefinitions, so GetDefaultSoundLibrary still returns "dsound".
      Had either been a NeuronClient-only define, the move would have quietly
      changed a default.

      The MacOSX branch is untouched and still references macosx_hardware_detect.h,
      which does not exist anywhere in the tree. It is inside
      #ifdef TARGET_OS_MACOSX, never defined in any built configuration, so it
      compiles today for the same reason it did before — it is not compiled.

      Left behind deliberately: seven files (Camera, Location, App, LevelFile,
      TaskManager, TaskManagerInterfaceIcons, ControlHelp — all in Species) now
      include PrefsOtherWindow.h without naming anything in it, because the
      macros they wanted moved out. Those are Species -> GameLogic includes,
      downward and legal, so they cost nothing in layering terms, and removing
      an include without a compiler to hand is how T6 lost three attempts.
      Worth a tidy-up task, not worth risking here.

      A formatting trap worth recording. Preferences.h was first written with the
      full rationale in comments, which grew a 91-line header by a third and put
      it under git's rename-similarity threshold. The file then looked like a
      delete plus an add, so check_format treated every line as changed and
      reformatted the whole header — leaving a Neuron-formatted .h beside a
      legacy .cpp, the half-converted state CODING_STANDARDS forbids. Fixed by
      shortening the header comments until the rename was detected again and
      moving the reasoning into Preferences.cpp and into these notes. When you
      move a file, check `git diff -M --stat` shows a rename before trusting
      check_format --fix.

      Not built: msbuild is Windows-only, this machine is Linux. The four checks
      pass; x64 Debug CI is the build verification.

  # ---------------------------------------------------------------------------
  # Discovered while surveying T7: moving ClientToServer does not clean it.
  # ---------------------------------------------------------------------------

  - id: T12
    title: Split the game-to-protocol translation out of ClientToServer
    intent: >
      T8 assumed moving ClientToServer into NeuronClient would resolve its
      violations. It will not — NeuronClient cannot see GameLogic or Species
      either, so the violations relocate rather than disappear.

      ClientToServer is two things wearing one name. One half is transport: an
      inbox, an outbox, sockets, sequence ids, and nothing game-specific. The
      other half translates between the game and the protocol —
      ProcessServerUpdates (81 lines) applies inbound updates to m_location and
      m_taskManager, and the Request* methods build outbound packets from
      buildings, units and teams. Every game header ClientToServer includes is
      there for the second half.

      Measured: m_location and m_taskManager appear only inside
      ProcessServerUpdates; Building, Unit, Team, Factory, LaserFence and
      RadarDish are used by both halves, which is what makes this a split rather
      than a lift.

      The same reasoning that split the network layer three ways applies one
      level down: the transport half is client infrastructure, the translation
      half is game code that happens to talk to it.
    project: NeuronClient
    depends_on: [T7]
    files:
      - NeuronCore/ClientToServer.cpp
      - NeuronCore/ClientToServer.h
      - Species/ServerUpdates.cpp
      - Species/ServerUpdates.h
      - Species/Main.cpp
      - Species/Main.h
      - Species/Species.vcxproj
      - Tests/NeuronCoreTests/NetworkUpdateTests.cpp
    acceptance:
      - ClientToServer holds inbox, outbox, sockets and sequence ids, and includes no game header
      - ProcessServerUpdates lives in the game layer, called by Main rather than reached through the endpoint
      - No Species global is read or written from inside ClientToServer
      - The wire format is unchanged
      - NeuronCoreTests pins the bytes each packet type produces, so "unchanged" is checked rather than asserted
    verify:
      - python3 tools/check_layering.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64
    parallel_safe: false
    status: done
    notes: >
      Re-measured on 6eb17e4, and the split line is now exact. Every g_app
      reference left in NeuronCore is in this file, at lines 491-555 — all
      twelve inside ProcessServerUpdates, which begins at line 479. Nothing above
      it touches the game.

      This task carries 11 of the 14 remaining NeuronCore allowlist entries: the
      nine game headers ClientToServer.cpp includes (App, Engineer, Factory,
      LaserFence, Location, Main, RadarDish, TaskManager, Team) and the two
      ClientToServer.h includes (Entity, WorldObject). It is the largest single
      piece of work left in the plan by that measure, and T8 is close to a no-op
      without it.

      The test criterion is new. The plan predates Tests/, and docs/TESTING.md
      now requires anything on the wire to ship with coverage; "the wire format
      is unchanged" is precisely the claim that a round-trip test can hold and
      prose cannot. NETWORKUPDATE_BYTESTREAMSIZE is 42 today.

      Done. 11 allowlist entries removed with --prune, 644 -> 633 tree-wide and
      14 -> 3 for NeuronCore. What is left is Input.h (T8) and two Preferences.h
      (T11), exactly as predicted.

      This was a lift, not a split, and the intent paragraph was wrong about why.
      It claims "Building, Unit, Team, Factory, LaserFence and RadarDish are used
      by both halves, which is what makes this a split rather than a lift". They
      are not. Every game type in the file appears inside ProcessServerUpdates
      and nowhere else, and the Request* builders take nothing but int, unsigned
      char, Vector3 and TeamControls — all NeuronCore vocabulary. So the builders
      did not move: relocating 30-odd call sites across GameLogic and Species
      would have bought no layering change at all. The acceptance criterion that
      required it was rewritten to match, since meeting it literally would have
      been churn.

      What the survey did miss is the reverse coupling — the transport half
      reaching up for three Species globals, which is what really stood between
      this file and "includes no game header":

        g_lastProcessedSequenceId  read in GetNextLetter, written in ClientLeave.
                                   It tracks how far the *simulation* has
                                   advanced, so it stays in the game loop.
                                   GetNextLetter now takes it as a parameter, and
                                   ClientLeave resets only its own counter while
                                   Main.cpp resets that one.
        g_startTime                written in ReceiveLetter, read in exactly one
                                   place in Main.cpp. Derived entirely from
                                   arriving letters, so it was already this
                                   class's state living in someone else's header
                                   — now ClientToServer::m_startTime, same
                                   DBL_MAX initial value. Still written on the
                                   listen thread and read on the main thread with
                                   no lock, exactly as before; that race is
                                   pre-existing and was not touched.
        Main.h                     included only for those two.

      Header includes needed care for the reason T6 recorded. ClientToServer.h
      declares SendIAmAlive(TeamControls const&) and was getting that name from
      a forward declaration inside Entity.h. Dropping Entity.h and WorldObject.h
      without adding TeamControls.h would have failed to compile in a way that
      looks unrelated to the change. Engineer.h was carried by the old file and
      is not carried by the new one — Engineer appears nowhere in the body, and
      the rest of the include set is a far larger transitive closure than it
      provides. If CI disagrees it goes back with a comment saying why.

      One unrelated defect found while writing the tests, deliberately not fixed
      here: ReadByteStream does `unsigned char flags = READ_UNSIGNED_SHORT(...)`
      for the Alive case. The cursor advances the correct two bytes, so the
      packet stays aligned, but the value is truncated to 8 bits — and
      TeamControls::GetFlags assigns m_endSetTarget 0x0100, the ninth bit. So
      that flag is dropped in transit. TeamControls.h even carries the warning:
      "Also, NetworkUpdate::GetByteStream and NetworkUpdate::ReadByteStream if
      you use more than 8 bits". Fixing it changes what arrives at the far end
      and therefore what the simulation computes, which is its own task with its
      own test, not a rider on a file move. Not recorded as a node here because
      it is not part of making NeuronCore standalone.

      The new tests pin bytes rather than round-tripping only: a round trip
      passes on either byte order because one machine does both halves. They
      cover the header prefix, SelectUnit, CreateUnit and Alive field-for-field
      with their exact lengths (8, 21, 30, 24), check every client-sendable type
      fits the 42-byte buffer in Release as well as Debug, and round-trip
      TargetProgram. Note the READ_/WRITE_ macros are two statements each, not
      expressions, so they cannot be inlined into an Assert call — every read
      goes through a local.

      Not built. msbuild is Windows-only and this machine is Linux, so the four
      checks are what ran here and the x64 Debug CI job is the build
      verification. Nothing here can tell you the game runs.

      Formatting note: adding a member to ClientToServer.h reindented the
      following `public:` to `  public:`, because clang-format's affected-range
      expansion reaches the access specifier that closes the region. The file's
      other `public:` is untouched at column 0. That is the documented cost of
      formatting changed lines only; converting the whole file is its own task.
