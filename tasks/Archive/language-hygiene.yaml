    status: done
    notes: |
      DONE 2026-08-05. Every acceptance line is met; what each one cost, and
      the four decisions that were not mechanical, are at the end of this note.

      NOT COMPILED. Linux, no MSVC. The seven Python checks pass and the
      requalification was verified by grep to be total, but nothing here has
      been through a compiler and nothing has been run. The static_asserts
      described below are the part most likely to need a second pass, because
      they are the only construct in the diff that is not a requalification.

      Split out of T9 on 2026-08-05, sized at 473 use sites across 64 files,
      which was the argument for it being alone in a batch.

      THAT SIZE IS WRONG AND THE TASK IS SMALLER THAN IT LOOKS. Re-measured
      2026-08-05 at 18d13ed while scoping Batch 6, by generating the
      enumerator list from ControlTypes.inc rather than guessing at its shape
      — 133 DEF_CONTROL_TYPE lines, so 133 `Control<X>` enumerators, plus
      ControlNull, NumControlTypes, ControlType and controltype_t. Grepping
      exactly those names:

        267 lines / 298 occurrences, in 38 files
        (was: 473 sites in 64 files)

      Plus ControlTypes.inc itself, which spells no enumerator — it generates
      them by token-pasting `Control##x` — so it is in the work and in no
      grep. Biggest holders: TaskManagerInterfaceIcons.cpp 44, Camera.cpp 28,
      ControlBindings.cpp 21, PrefsKeybindingsWindow.cpp 19, LocationEditor.cpp
      17, ControlBindings.h 16.

      WHERE THE EXTRA 175 CAME FROM, because it is a repeatable mistake rather
      than a slip. A loose `\bControl[A-Z]\w*` grep returns 449 occurrences in
      58 files, which is within rounding of the recorded 473/64. 186 of those
      are not enumerators at all: ControlTower (45 — a BUILDING),
      ControlHelpSystem (28), ControlMethod (27), ControlBindings (25),
      ControlHelpAccess (14), ControlEventFunctor (13), ControlHelp (7). The
      prefix that names this enum's members is also the prefix of a building
      class and of a Species subsystem. GameLogic/ControlTower.* and
      Species/ControlHelp.* are NOT in this task's reach, and a collision
      analysis run off the loose number puts them there.

      This is the same failure the tree keeps finding in the other direction:
      language-hygiene/T12 was a false positive from a shared enumerator name,
      and this is a false positive from a shared identifier PREFIX. Regenerate
      the enumerator list from the .inc before believing any count here.

      EVERY ONE OF THE 267 IS AN EDIT, even though most are not errors. The
      enumerators are unscoped today, so `controlEvent(ControlSelectLocation)`
      compiles; under `enum class ControlType` it must become
      `ControlType::ControlSelectLocation`. controlEvent already takes a
      ControlType (Input.h:38-39), so the parameter types need nothing — it is
      the enumerator NAMES that all move. Reach and edit-count coincide here,
      which is not usually true (strings/T18 reached nine files and needed
      seven).

      THREE INTEGER BOUNDARIES TO DECIDE, all in ControlBindings.cpp and none
      of them a cast you can add without thinking:
        - getControlID RETURNS -1 for an unknown name. Same shape as the
          condition lookup T9 recorded, and it has the same off-by-one smell:
          check whether i can land on the terminator and pass the bound.
        - operator[] indexes `bindings[id]` with the enum directly.
        - the constructor does `memset(suppressed, 0, NumControlTypes)`.
      Neuron::I() is the intended spelling for the index and the size.

      A FOURTH BOUNDARY THE SPLIT DID NOT NAME, and it is the one lh/T10 was
      caught by. ControlBindings.h declares operator[], getIcon, bind,
      setIcon and isAcceptibleInputType TWICE each — once on ControlType and
      once on controltype_t, which is `typedef int`. Those overload pairs are
      the same function under a scoped enum, because controltype_t stops being
      a distinct type the moment the acceptance line "controltype_t names
      ControlType or is gone" is met. Decide which of each pair survives
      before converting, not after the redefinition errors arrive. And read
      every `return` in the functions that RETURN one — lh/T10's two CI
      failures were both `return -1;`, which names no enumerator and which no
      sweep over enumerator names can see.

      NOT DISJOINT FROM strings/T17: GlobalWorld.cpp (5 sites), Mine.cpp (1)
      and Rocket.cpp (1) are on both. All seven are controlEvent calls and
      none is a printf, so the collision is file-level rather than line-level
      — but it is why this task is not in Batch 6 alongside T17. It also
      contests nine files with strings/T11 and twelve with strings/T12.

      ---- WHAT LANDED ----

      Two commits. The first whole-file reformats ControlTypes.h,
      ControlBindings.h and Input.h, because all three are tab-indented legacy
      files that this task rewrites enough of for the changed-lines format
      check to demand nearly the whole file anyway — the practice AGENTS.md
      sets and the one ownership/T6 followed for Species/App.h. The second is
      the conversion: 196 requalifications in 27 files, plus the six files
      above that needed real thought.

      THE MEASUREMENT HELD. 267 lines in 38 files was the prediction and 38
      files is what changed, with one file the reach measurement DID find and
      did not flag as interesting: InputDriverAlias.cpp, whose two bounds
      checks the measurement counted but whose THIRD site — the assignment
      into spec.control_id — it did not, because that line names no
      enumerator. See the boundary section below. Reach measurement finds
      files; it does not find expressions, which is what Batch 5 recorded
      after lh/T10 and is now true twice.

      FOUR DECISIONS THAT WERE NOT MECHANICAL:

      1. getControlID RETURNS std::optional<ControlType>, not an enumerator.
         It returned -1, and the temptation is ControlNull. That would be
         wrong in the same way mapping InputDriverWin32's `return -1` to
         INPUT_TYPE_FAIL would have been wrong in T10: ControlNull is a REAL
         index into all three of ControlBindings' arrays and a bindable one,
         so a caller that stopped checking would silently bind to it instead
         of rejecting the name. Both callers tested `>= 0` and neither used
         the value, so nothing needed the integer. std::optional says what -1
         was standing in for. LevelFile.h/.cpp already use std::optional, so
         this is not the tree's first.

      2. THE FIVE DOUBLE DECLARATIONS COLLAPSED TO THE CHECKED BODY. This is
         the fourth boundary, the one the split did not name and the one worth
         reading before touching this class again. operator[] and getIcon were
         each declared twice — on ControlType and on controltype_t — and
         DIFFERED IN BEHAVIOUR, not just in type: the enum ones indexed
         unchecked, the int ones bounds-checked and threw. `using controltype_t
         = ControlType` makes each pair one function, so one body had to win.
         The checked one did. That is a behaviour change confined to inputs
         that were already out of bounds; every reachable caller passes a real
         enumerator or a value getControlID has vouched for, so nothing that
         works today starts throwing.

      3. THE TABLE AGREEMENT IS ASSERTED, NOT TESTED. The acceptance offered
         either. ControlBindings.cpp now walks ControlTypes.inc a THIRD time
         with a DEF_CONTROL_TYPE that emits one static_assert per line:
         s_actions[I(ControlType::Control##name)].name == #name. All 133 pairs,
         generated from the same file both tables are generated from, so they
         cannot drift without the build naming the first row that did. Three
         more assert the tail: the table is NumControlTypes + 1 long,
         ControlNull's row is the empty-name row, and the row at
         NumControlTypes is the null terminator getControlID stops on.
         s_actions became constexpr to make this possible; nothing ever wrote
         to it. THIS IS THE ONE PART OF THE DIFF THAT COULD FAIL TO COMPILE
         for a reason other than a missed call site — it constant-evaluates
         std::string_view over a constexpr array of string literals.

      4. memset(suppressed, 0, NumControlTypes) BECAME sizeof(suppressed)
         rather than Neuron::I(ControlType::NumControlTypes). Identical bytes
         today, because the array is unsigned char and NumControlTypes long.
         The point is that it stays identical if the element type ever stops
         being one byte, which the old spelling did not.

      THE BOUNDARIES, listed as the acceptance line requires. Three, all in
      NeuronClient, and all three are the same boundary seen from different
      sides — InputSpec::control_id is a control_id_t (int) that holds a
      keycode for every driver except the alias driver, where it holds a
