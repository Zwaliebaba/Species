    title: Convert InputMode and InputParserState to enum class
    intent: >
      The two input-system enums that are only ever used as themselves. Neither
      crosses the wire, neither is a bit field, and neither has an int typedef
      standing in for it — which is what separates them from the other three
      the old T4 tried to carry (see T9). Converting them hardens the driver
      stack's type boundaries without touching the parts of it that treat an
      enum as an integer.
    project: NeuronClient
    depends_on: []
    files:
      - NeuronClient/InputTypes.h
      - NeuronClient/InputDriver.h
      - NeuronClient/LanguageTable.h
      - NeuronClient/LanguageTable.cpp
      - NeuronClient/Input.cpp
      - NeuronClient/SepulvedaStrings.cpp
      - NeuronClient/InputDriverSimple.cpp
      - NeuronClient/InputDriverPipe.cpp
      - NeuronClient/InputDriverPrefs.cpp
      - NeuronClient/InputDriverInvert.cpp
      - NeuronClient/InputDriverValue.cpp
      - NeuronClient/InputDriverChord.cpp
      - NeuronClient/InputDriverConjoin.cpp
      - NeuronClient/InputDriverAlias.cpp
      - Species/Main.cpp
      - Species/TaskManagerInterfaceIcons.cpp
      - Species/ControlHelp.cpp
      - Species/Renderer.cpp
    acceptance:
      - InputMode and InputParserState are enum class with an explicit underlying type
      - No use site casts either of them back to int
      - grep -cEow "INPUT_MODE_[A-Z_]*|STATE_[A-Z_]*" over the six projects is unchanged at 119, and every one is qualified
    verify:
      - python3 tools/check_layering.py
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
    parallel_safe: true
    status: done
    notes: |
      RE-SCOPED 2026-08-03, before starting, on a measurement the original task
      did not have. It listed three files and five enums. The five enums have
      795 use sites across 39 files, and three of them cannot be converted the
      way this task describes — those three are now T9.

      What stayed here, with counts at fdf9421: INPUT_MODE_* 47 sites in 14
      files, STATE_* 72 sites in 19 files. Larger than "three files" but
      mechanical: both are plain sequential enums used only as themselves, so
      the conversion is qualification plus an underlying type.

      The file list above is the measured one and includes Species/, which the
      original did not mention at all — INPUT_MODE_ reaches Main.cpp (7),
      TaskManagerInterfaceIcons.cpp (8) and three more files up there.

      The old acceptance line "grep -E for a plain enum over NeuronClient
      headers returns nothing" is dropped, because it was never this task's to
      satisfy: CameraAccess.h declares `enum Mode`, and language-hygiene T5
      owns it. A criterion a task cannot meet by doing its own work is a
      criterion that gets ignored or gets the wrong thing done to satisfy it.

      DONE 2026-08-03. 119 sites across 22 files, plus a whole-file reformat of
      the same 22 first. Both enums were confirmed free of integer interop
      before starting — no comparison against a literal, no array indexing, no
      arithmetic — which is what made them the safe half of the old T4.

      Written with T3's two mistakes designed out rather than repeated: the
      script leaves the enumerator DECLARATIONS bare, and skips comment lines
      and any line containing a string literal. T3 had to be repaired for both.

      THREE RED BUILDS ON THIS TASK, all the same root cause: I surveyed for
      integer interop by grepping the NAMES of variables I expected to hold the
      enum, and the interop was in shapes I had not listed. The three that got
      through were `errors[state]` (subscripting), `if (_key && _mood)` (boolean
      context, meaning "not INPUT_MODE_NONE" because that enumerator is 0), and
      `static int oldControlType = InputMode::INPUT_MODE_KEYBOARD` in Main.cpp
      (an int variable holding the enum).

      The survey that works is by SHAPE, not by name. For any enum about to be
      scoped, grep for: the enum used as a subscript, in a boolean or arithmetic
      context, and any `int`/`bool` variable initialised from one of its
      enumerators. The last of those is a one-line grep and would have caught
      the third failure:
      grep -rnE '\b(int|bool|unsigned|short|char)\s+\w*\s*=\s*EnumName::'

      AND A FOURTH, which is not interop at all but the same failure to
      enumerate a shape: an enumerator reached through the ENCLOSING CLASS,
      `TaskManagerInterface::TMTerminate`. A qualification pass keyed on
      "enumerator not preceded by ::" skips those by construction, because they
      are preceded by ::. It needs a second pass for `Class::Enumerator` ->
      `Class::Enum::Enumerator`. FootState hit this and was handled; TMControl
      hit it and was not, in a different file. The check that closes it:
      grep -rnE '\w+::(Enumerator1|Enumerator2)' | grep -v 'EnumName::'


      PARSE_SUCCESS in InputDriver.h is a use site, not a declaration, so the
      macro now reads `(InputParserState::STATE_DONE == (x))` — worth noting
      because a macro body is the one place a scoped enumerator is easy to miss.

  - id: T9
    title: Scope InputCondition, and settle what condition_t is
    intent: >
      InputCondition is the default input driver's vocabulary for
      InputSpec::condition. Scoping it makes that vocabulary a type and turns
      every place it meets the driver-defined integer into a cast that says so.
      The task also answers the question the old wording got wrong: condition_t
      is NOT this enum and cannot become it.
    project: NeuronClient
    depends_on: [T4]
    files:
      - NeuronClient/InputDriver.h
      - NeuronClient/InputDriver.cpp
      - NeuronClient/InputDriverWin32.cpp
      - NeuronClient/InputSpec.h
    acceptance:
      - InputCondition is enum class with an explicit underlying type
      - condition_t stays an int, with the reason written at the typedef
      - No use of a COND_ enumerator is unqualified, and every conversion to or from InputSpec::condition is an explicit cast
      - The two defects in the condition lookup are recorded, not fixed
    verify:
      - python3 tools/check_layering.py
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
    parallel_safe: true
    status: done
    notes: |
      Split out of T4 on 2026-08-03. RE-SCOPED 2026-08-05, from four enums down
      to one, and the other three are now T10, T11 and T12. What forced that is
      below; the short version is that the old task was four independent
      conversions and about 900 use sites wearing one number, and one of its
      four acceptance criteria was wrong.

      condition_t CANNOT NAME AN ENUM, which is the finding. The old acceptance
      asked that controltype_t, inputtype_t and condition_t "either name the
      enum type or are gone". InputSpec::condition is driver-defined, and three
      drivers put three unrelated things in it:
        - the default driver writes InputCondition's enumerators;
        - InputDriverPrefs.cpp writes its own anonymous {COND_TRUE, COND_FALSE};
        - IdleInputDriver::getConditionID does `str >> num` on the binding
          string and returns the NUMBER, which getInput then compares against
          an idle time in milliseconds.
      Naming any one of those in the field is wrong for the other two. This is
      the shape the plan's own restart note warned about — surveying integer
      interop by variable NAME rather than by what is actually stored — and it
      is what cost four red builds on the earlier enum tasks. Found by reading
      the three drivers rather than by grepping condition_t.

      TWO DEFECTS, PRESERVED AND COMMENTED WHERE THEY LIVE. Both predate this
      task and neither is fixed here, per CODING_STANDARDS: a conversion commit
      that also changes behaviour cannot be reviewed or reverted cleanly.
        1. s_conditions holds eight entries and a terminator, but both lookups
           bound the search with NumInputConditions, which is ten. An unmatched
           name leaves i at 8, 8 < 10 passes, and the failure path reads the
           TERMINATOR: getDefaultConditionID returns its cond (COND_DOWN, 0)
           instead of -1.
        2. Worse in getDefaultPrefsString, which on the same path assigns the
           terminator's nullptr to a std::string. That is undefined behaviour,
           not a wrong answer.
      A malformed control binding in a preferences file reaches both. Whoever
      fixes them owns deciding what the failure value should be, and the answer
      is probably a real sentinel rather than -1 in an int.

      The enumerators keep their COND_ prefix, matching InputMode and
      InputParserState in the same two headers.

      Two NULLs went with the table's terminator; both were zero and both still
      are, since INPUT_TYPE_FAIL and COND_DOWN are 0. One NULL is left in
      NeuronClient, in ControlTypes.cpp, which T10 owns.

      Not compiled here (Linux).

  - id: T5
    title: Convert the game-side enums to enum class
    intent: >
      EntityLeg::FootState, TaskManagerInterface::TMControl and Camera::Mode
      are the remaining plain header enums. None is serialised (verify that
      claim while working — if one turns out to reach a file or the wire,
      pin it first like T3). ENUM_HELPER from NeuronHelper.h where iteration
