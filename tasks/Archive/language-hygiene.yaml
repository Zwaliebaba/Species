  - id: T13
    title: Scope CamAnimNode's transition enum, and correct the bound that named the wrong one
    intent: >
      A camera-animation node's transition mode is validated against
      CameraAccess::ModeNumModes -- a different enum, on a different class,
      counting a different thing. Naming and scoping the transition enum makes
      the mistake impossible to write rather than merely corrected, which is
      the whole argument for this plan's enum tasks.
    project: GameLogic
    depends_on: []
    files:
      - GameLogic/LevelFile.h
      - GameLogic/LevelFile.cpp
      - GameLogic/CameraAnimWindow.cpp
      - Species/Camera.cpp
    acceptance:
      - CamAnimNode's transition enum is named and is enum class with an explicit underlying type
      - m_transitionMode has that type, or notes records why it stayed an int and what stops the
        wrong-enum comparison recurring
      - LevelFile.cpp's parse-time bound names the transition enum, not CameraAccess::Mode
      - GetTransitModeId's -1 answer is still distinguishable from a valid mode at every call site
      - The DropDownMenu binding in CameraAnimWindow.cpp still round-trips a mode through the editor,
        stated as what was checked
    verify:
      - python3 tools/check_layering.py
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
    parallel_safe: false
    notes: |
      Added 2026-08-05 on the owner's instruction, from a defect T12 found and
      deliberately did not fix -- tightening a bound is a behaviour change and
      this plan forbids one riding along inside a conversion.

      THE DEFECT. LevelFile.cpp:275 asserts
      `m_transitionMode >= 0 && m_transitionMode < ModeNumModes`, where
      ModeNumModes is CameraAccess::Mode's count. m_transitionMode is a
      CamAnimNode transition: TransitionMove, TransitionCut,
      TransitionNumModes -- **2 values, against a bound of 16**. The assert
      accepts 0..15 for something that can only legitimately be 0 or 1.

      IT IS LATENT, NOT LIVE, and that matters for how urgently to take it.
      The only writer is GetTransitModeId, which returns -1, 0 or 1, and -1 is
      caught by the other half of the assert. So no reachable input gets past
      it today. What the wrong bound costs is the check itself: if the
      transition enum ever gains a third value, or the parse ever gains
      another writer, the assert will not notice.

      THE ENUM IS ANONYMOUS, which is why the mistake was easy to write:
      LevelFile.h:40 declares `enum { TransitionMove, TransitionCut,
      TransitionNumModes };` with no name at all, so m_transitionMode HAD to
      be an int and no comparison against it could ever be type-checked.
      Naming it is most of the fix.

      THE OBSTACLE IS THE EDITOR BINDING, and it is the same shape as T11's
      integer loop. CameraAnimWindow.cpp:324 does
      `modeBut->RegisterInt(&node->m_transitionMode)` -- DropDownMenu holds an
      `int*` into the member and writes through it, so typing the member
      breaks the binding. Three ways out, in the order they are worth trying:
      keep an int in the widget and convert at the two edges; give
      DropDownMenu a typed registration alongside RegisterInt; or leave the
      member an int and rely on the corrected bound plus a named enum, which
      satisfies this task's second acceptance line by the escape it offers.

      THE OTHER SITES ARE ALREADY WELL-BEHAVED and should stay that way:
      Camera.cpp switches on m_transitionMode at :2080, :2096 and :2503 with
      CamAnimNode::TransitionMove / TransitionCut labels, and
      GetTransitModeName's own DEBUG_ASSERT at LevelFile.cpp:67 bounds against
      TransitionNumModes correctly. Only the parse-time assert names the wrong
      enum.

      parallel_safe false because LevelFile.cpp is contested: strings/T17
      declares it, and ownership/T5 rewrote it on 2026-08-05.
      DONE 2026-08-05, in Batch 5. The enum is `CamAnimNode::Transition : int`
      with TransitionMove and TransitionCut pinned to 0 and 1, and
      m_transitionMode carries that type rather than staying an int.

      THE WRONG BOUND WAS DELETED RATHER THAN CORRECTED, which is the part
      worth reading. LevelFile.cpp compared a parsed transition against
      CameraAccess::Mode::ModeNumModes -- sixteen, for a two-valued enum. The
      obvious fix is to swap in TransitionNumModes. Instead GetTransitModeId
      now returns std::optional<Transition>, so the parse site asks
      has_value() and there is no numeric bound at that site at all. That is
      the honest answer to "what stops this recurring": not a corrected
      constant that the next person can get wrong again, but no constant.

      THE BOUND WAS NOT LIVE, and the plan entry should not have implied it
      was. GetTransitModeId's own loop ran to TransitionNumModes and returned
      -1 otherwise, so the value reaching the assert was always -1, 0 or 1 and
      the too-loose upper bound could not admit anything. It was wrong in
      intent and harmless in effect, and it would have become live the moment
      a third transition was added. Recorded precisely so nobody re-reports it
      as a fixed crash.

      SIX FILES, NOT THE FOUR DECLARED, and the two extra are the whole
      design question. DropDownMenu::RegisterInt(int*) is how the editor binds
      a mode, and a scoped enum cannot be reached through an int*. The
      acceptance line above offers an out -- keep m_transitionMode an int and
      say why -- and that out was refused, because an int member puts the
      Camera.cpp switches back to comparing an int against foreign
      enumerators, which is the exact hazard this task exists to close.

      So DropDownMenu gained RegisterEnum, a ~12-line template beside
      RegisterInt that stores a std::function<void(int)> write-back instead of
      an int*. SelectOption writes through whichever of the two is set. All 35
      existing RegisterInt callers are untouched by construction, and several
      of them bind ints that are morally enums -- LaserFence m_mode,
      SafeArea m_entityTypeRequired, ResearchItem m_researchType, SpawnPoint
      and ScriptTrigger m_entityType, m_buildingType -- so the next scoping
      task in this plan has its hook already.

      ONE ORDERING CHANGE IN CameraAnimWindow, stated because it is behaviour
      even though it is invisible. The old sequence was RegisterInt, then
      AddOption twice, then SelectOption. RegisterInt calls SelectOption
      immediately, against an EMPTY option list, so FindValue answered -1 and
      the caption was briefly the button's own name before the trailing
      SelectOption fixed it. The new sequence adds both options first and then
      calls RegisterEnum, which selects once, correctly. Same final state, one
      fewer transient.

      WHAT WAS ACTUALLY CHECKED, and it is not the editor. No MSVC and no
      Windows client in this environment, so the drop-down round trip was
      traced in the source rather than exercised: AddOption with the default
      _value assigns m_nextValue 0 then 1 in call order, the menu is
      constructed with _sortItems false so insertion order is preserved,
      option values therefore equal the enumerators, and RegisterEnum's
      lambda static_casts the selected value back to Transition. The
      static_assert added beside g_transitionModeNames pins the other half --
      one name per enumerator -- at compile time. THE EDITOR ITSELF IS
      UNVERIFIED; the camera-animation window is not on the Garden smoke-test
      path, so nothing in the seven steps would notice if this were wrong.
    status: done
