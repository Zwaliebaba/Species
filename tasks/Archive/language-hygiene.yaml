    depends_on: [T3]
    blocked_by:
      - layering-inversion/T9
      - layering-inversion/T10
    files:
      - GameLogic/EntityLeg.h
      - Species/TaskManagerInterface.h
      - Species/Camera.h
    acceptance:
      - grep -rE "^\s*enum\s+[A-Za-z]" over all six projects' headers returns nothing
      - notes records the serialisation check for each enum
    notes: >
      blocked_by layering-inversion T9 and T10: Camera.h is what T9's
      remaining half reshapes (Renderer's half already landed), and
      TaskManagerInterface.h is on T10's list. Converting an enum inside a
      header that is about to be split behind an interface means doing it
      twice.

      Re-measured 2026-08-02 at 11aee84: 12 plain enums in headers, not 11,
      and `enum class` appears once in the tree. Re-derive the list when
      starting — the twelfth is not identified here.

      DONE 2026-08-03 for TWO of the three. FootState and TMControl are scoped;
      Camera::Mode is NOT, and moved to T9.

      CAMERA::MODE BELONGS WITH THE INT-TYPEDEF ENUMS. Camera stores
      `int m_mode` and RequestMode takes `int _mode`, so scoping the enum breaks
      every comparison and every call — it is the same shape as ControlType and
      InputCondition, not a keyword swap. The comment above the enum in
      CameraAccess.h said exactly this and I scoped it before reading it. Read
      the comment above an enum before converting it; on this one the previous
      agent had already done the analysis.

      The serialisation check the acceptance asks for: none of the three reaches
      a file or the wire, and nothing indexes an array with one. Camera.h's
      "remember to update the static string table at the end of camera.cpp" is
      STALE — that table does not exist; the only thing left there is a
      commented-out switch.

      TWO FINDINGS FROM THE CONVERSION, both preserved rather than fixed.

      Tripod.cpp tested `!m_foot.m_state == EntityFoot::OnGround` twice. That
      parses as `(!state) == OnGround`, and because OnGround is 0 it was
      ACCIDENTALLY equivalent to `state != OnGround` — which is what it meant.
      A scoped enum has no operator!, so the accident is written out as the
      intent, with the same result.

      The four input drivers index a nine-string error table with a ten-value
      InputParserState, so errors[STATE_DONE] reads past the end and every
      message from STATE_WANT_OPTIONAL on is off by one. Surfaced by T4, which
      had to look at the indexing to compile it; recorded at all four sites and
      not fixed, because changing which string the parser reports is a decision.
    verify:
      - python3 tools/check_layering.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
    parallel_safe: true
    status: done

