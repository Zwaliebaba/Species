  - id: T7
    title: Ratchet the sweeps with a hygiene check in CI
    intent: >
      A sweep that is not enforced regrows. A small tools/check_hygiene.py
      rejects NEW occurrences of NULL, `#ifndef _included`, strcpy-family
      calls and plain `enum` in changed lines — same changed-lines-only
      philosophy as check_format.py, so legacy files not yet converted do
      not fail. Added to ci.yml alongside the existing four checks; this is
      a new check, not a build-topology change, but flag it to the owner in
      the PR since ci.yml is shared.
    depends_on: [T1, T2]
    files:
      - tools/check_hygiene.py
      - .github/workflows/ci.yml
      - AGENTS.md
    acceptance:
      - check_hygiene.py fails on a synthetic diff reintroducing each banned pattern and passes on the clean tree
      - CI runs it on every push; AGENTS.md's "Before you push" section lists it
    verify:
      - python3 tools/check_hygiene.py
      - python3 tools/check_task_dag.py
    parallel_safe: true
    notes: >
      Landed 2026-08-02. tools/check_hygiene.py enforces four rules on changed
      lines only, the same contract as check_format.py and for the same reason:
      a whole-file rule would fail most of the tree, because stages 4 and 5 have
      not run, and a check that has to be switched off to get work done is not a
      check. `--all` scans whole files as a diagnostic and is explicitly not a
      gate.

      Acceptance evidence, all run on Linux: a synthetic file exercising every
      rule reports exactly eight findings and exits 1, while `enum class`,
      `enum struct`, a comment naming NULL and sprintf, and a string literal
      containing both are all correctly ignored. Four diff scenarios were run
      against real history — untracked file inside a checked root (flagged),
      untracked file outside one (ignored), a committed file diffed against
      HEAD~1 (flagged), and one line inserted into NeuronCore/Preferences.cpp,
      a legacy file already full of violations, which reported that line and
      nothing else. The clean tree exits 0.

      Two design decisions worth keeping. String literals and comments are
      blanked before matching, because the first false positive on a comment
      is what teaches people to suppress the tool reflexively —
      layering-inversion T13 recorded the mirror-image failure, where a
      substring search for g_app matched "dialog_apply". And the escape hatch
      is a `hygiene-ok` marker rather than a config file, so an exception is
      visible on the line it applies to; T1's two typedef'd-integer NULLs in
      ControlTypes.cpp and InputDriver.cpp are what it exists for, though
      neither carries the marker yet since neither line has been touched
      since.

      Known limitation, accepted: strip_noise is single-line, so a banned token
      inside a multi-line block comment still matches. `hygiene-ok` covers it.

      Not verified here: nothing in this task compiles, so the msbuild and
      vstest lines other tasks carry do not apply. CI's static-checks job runs
      the new check on every push, which is the verification that matters for
      it.
    status: done

  - id: T8
    title: Retire the min and max macros that shadow the std functions
    intent: >
      NeuronCore/MathUtils.h defines function-style `min(a,b)` and `max(a,b)`
      macros. NeuronCore.h sets NOMINMAX to keep the Windows pair out, and then
      this header puts an equivalent pair back — so `std::min` and `std::max`
      do not compile anywhere MathUtils.h is reachable, which from a NeuronCore
      header is most of the tree. Every stage 3, 4 and 5 conversion wants those
      functions; today each one has to write the comparison out by hand and
      explain why. Replacing the macros with the std functions removes a
      standing obstacle rather than a wart.
    project: NeuronCore
    depends_on: []
    files:
      - NeuronCore/MathUtils.h
    acceptance:
      - MathUtils.h defines no min or max macro; grep -nE "define[[:space:]]+(min|max)\b" over the six projects returns nothing
      - The 216 bare min(/max( call sites across 51 files resolve to std::min/std::max, by include or by qualification, with no change to any computed value
      - A file that previously failed on std::min now compiles — NetworkUpdate.cpp's SetClientIp is the worked example, and its hand-written comparison collapses back to std::min in the same commit
    verify:
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    parallel_safe: false
    notes: >
      Found on 2026-08-02 by strings-modernised T2, the hard way: one
      std::min in NetworkUpdate.cpp failed CI with C2589, and it turned out to
      be the only std::min or std::max anywhere in the tree. Nobody had tried
      before, which is why a macro that shadows two of the most reachable
      functions in the standard library had gone unnoticed.

      Determinism: min and max on floats are the macro's `(a) < (b) ? ...`
      versus std::min's `b < a ? b : a`. Those agree for every non-NaN input
      and pick different arguments only on ties of equal value, so no computed
      float changes — but the macros also double-evaluate their arguments, so
      any call site passing an expression with a side effect (or an expensive
      one) changes behaviour when it stops being evaluated twice. Audit for
      that while converting; it is the one place this can bite.

      MathUtils.cpp carries a third-party notice listed in LICENSE. MathUtils.h
      does not, but check before editing rather than after.

      parallel_safe false: 51 files, and the include-order sensitivity means a
      half-landed version is worse than either end state.

      DONE 2026-08-03. 216 grep matches at b0bde71, which resolve to 202 call
      sites: 2 were the macro definitions and 12 are inside commented-out code
      or prose, left alone. 188 converted mechanically, 12 needed an explicit
      type, 2 were preserved verbatim. 50 files.

      THE FINDING THAT MATTERS, and it is not a formatting one. Spirit.cpp
      wrote `max(m_hover.y, 0.0f + syncfrand(0.5f))` in StateBirth and the same
      shape with syncfrand(2.0f) in StateDeath. The macro evaluates its second
      argument TWICE — once in the comparison, once to produce the result — so
      when m_hover.y loses the comparison, syncfrand() is called a second time
      and THAT second draw is what lands in m_hover.y. Two consequences:
      the expression does not compute a maximum (the value stored can be lower
      than m_hover.y), and the number of draws from the synchronised stream
      depends on the comparison. syncrand() is the deterministic lockstep RNG,
      and CODING_STANDARDS.md#determinism names its call sequence as network
      identity.

      Both sites are preserved EXACTLY, written out as the conditional the
      macro expanded to, with the reason in a comment at the call site.
      Collapsing them to std::max would have been a one-character-looking
      change that altered the RNG sequence — the precise failure this plan's
      determinism paragraph warns about, found in the wild rather than
      theorised. Whether the double draw is intended is an owner question and
      a behaviour change either way; it is deliberately NOT decided here.

      TWELVE MIXED-TYPE SITES, which is the other thing a sweep would have got
      wrong. The macro's conditional operator applies the usual arithmetic
      conversions, so `max(pos.x, 20)` compiled and returned a float;
      std::max cannot deduce from (float, int) and fails. Each was rewritten to
      the type the conditional operator produced, not to the type that looked
      tidy: Rocket's maxLoops and m_surges are floats compared against integer
      literals, Centipede's newHealth likewise, Armour's and Engineer's speed
      clamps compare a float against an `unsigned char` stat, Camera's
      forwardSpeed against 1000/2000, Location's pos.x/pos.z against 20, and
      `int numDebris = max(1, <float>)` needed a static_cast<int> around a
      float std::max to keep the same truncation.

      ONE OF THEM IS A DIFFERENT NUMBER IF WRITTEN NAIVELY.
      Camera::AdvanceMoveToTargetMode clamps a DOUBLE against the literal 0.2f.
      The macro promoted 0.2f to double — 0.20000000298023224 — and writing
      std::max(x, 0.2) would substitute 0.2000000000000000111. It is
      static_cast<double>(0.2f), with the arithmetic in a comment, because the
      acceptance criterion is "no change to any computed value" and this is
      exactly the kind of change that hides inside a tidy-up.

      DOUBLE EVALUATION ELSEWHERE, all benign and all now single: four
      heightmap GetValue lookups (Engineer x3, Water), Spam's landHeight, and
      SoundLibrary3dDSound's GetMaxChannels. Same values, one call instead of
      two. Species/Script.cpp's `max(m_waitUntil, GetHighResTime() + _time)`
      read the CLOCK twice and used the second reading; it reads once now,
      which is a real behaviour change of sub-microsecond size on a real-time
      script wait, not on anything the simulation sees.

      TWELVE MATCHES LEFT, all in commented-out code: InvertMatrix's two prose
      comments, four commented-out assignments (SoulDestroyer, Armour, Camera,
      GameMenu), and six inside the /* ... */ block that spans GameCursor.cpp
      772-953. That block is why SELECTION_ARROWS_MAX_ALPHA and BOOST_FADE_RATE
      are used in that file and defined nowhere in the tree — worth knowing
      before someone greps for them. Rewriting dead comments is noise, so they
      were left; none is a call site.

      MessageDialog.cpp needed a whole-file reformat first, in its own commit.
      It is tab-indented legacy and two converted lines sit in one hunk with
      untouched lines between them, so the changed-lines format check
      reformatted those too and each --fix pass dragged in the next adjacent
      line. It was the only one of the fifty that did.

      NOT COMPILED HERE. This was done on Linux; the six Python checks pass and
      nothing else was run. Every mixed-type site is a compile error if the
      analysis is wrong, which makes CI's x64 Debug build the real verification
      — and a green build is still not evidence that the game runs. The two
      Spirit.cpp sites are argued from the code and are not covered by any
      test; the Garden smoke test would not catch a changed RNG sequence in
      single player either.
    status: done

  - id: T10
    title: Scope InputType, the bit field
    intent: >
      InputType's enumerator values are bit flags — FAIL 0, BOOL 1, ANALOG 2,
      1D 6, 2D 10, ANY 15 — and 1D and 2D both carry ANALOG's bit. Scoping it
      costs the bitwise operators it is built on, so this task is the decision
      about how it keeps them, not a keyword swap. inputtype_t is a genuine
      alias for it, unlike condition_t, and goes.
    project: NeuronClient
    depends_on: [T9]
    files:
      - NeuronClient/InputTypes.h
      - NeuronClient/InputSpec.h
      - NeuronClient/InputDriver.h
      - NeuronClient/InputDriver.cpp
      - NeuronClient/ControlBindings.h
      - NeuronClient/ControlBindings.cpp
      - NeuronClient/ControlTypes.cpp
      - NeuronClient/InputDriverWin32.cpp
      - NeuronClient/InputDriverWin32.h
      - NeuronClient/InputDriverSimple.cpp
      - NeuronClient/InputDriverSimple.h
      - NeuronClient/InputDriverIdle.cpp
      - NeuronClient/InputDriverIdle.h
      - NeuronClient/InputDriverPrefs.cpp
      - NeuronClient/InputDriverAlias.cpp
      - NeuronClient/InputDriverChord.cpp
      - NeuronClient/InputDriverConjoin.cpp
      - NeuronClient/InputDriverInvert.cpp
      - NeuronClient/InputDriverPipe.cpp
      - NeuronClient/InputDriverValue.cpp
      - NeuronClient/InputFilterWithDelta.cpp
      - NeuronClient/Input.cpp
      - NeuronClient/Movement2d.h
      - NeuronClient/Movement2d.cpp
      - NeuronClient/TargetCursor.cpp
      - NeuronClient/ControlTypes.inc
    acceptance:
      - InputType is enum class with an explicit underlying type
      - Neuron::ENUM_HELPER supplies its bitwise operators, or the task records why a plain enum was kept instead
      - INPUT_TYPE_1D and INPUT_TYPE_2D still each carry INPUT_TYPE_ANALOG's bit, and ControlBindings::isAcceptibleInputType still ORs INPUT_TYPE_1D into a BOOL binding
      - inputtype_t names InputType or is gone
      - The 216 INPUT_TYPE_ use sites compile without a C-style cast, except where the task lists an integer boundary and says why
    verify:
      - python3 tools/check_layering.py
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
    parallel_safe: false
    notes: |
      Split out of T9 on 2026-08-05. 216 use sites across 19 files.

      ENUM_HELPER IS UNUSED TODAY. NeuronCore/NeuronHelper.h defines it — ++,
      --, the six bitwise operators, SizeOfT() and an iterable RangeT — and
      nothing in the tree instantiates it. This task and T11 would be its first
      two users, so expect to debug the macro itself rather than only the
      conversion. Its operators are constexpr and take T by value, which is
      what InputType needs.

      ControlTypes.cpp IS DEAD AND BROKEN, and this task is where that has to
      be dealt with because it is the file's InputType column that stops
      compiling. The whole file is one static ControlAction s_actions[] that
      NOTHING references — the real table is in ControlBindings.cpp — and its
      macro is `#define DEF_CONTROL_TYPE(x,y) "x", y,`, which produces the
      literal two-character string "x" for every entry rather than
      stringifying the name. ControlBindings.cpp gets it right with {#name,
      type}. The dead copy is also brace-elided and terminated with
      `nullptr, NULL`, which is the last NULL in NeuronClient. It is compiled:
      NeuronClient.vcxproj lists it. Deleting the file is almost certainly
      right, and it is a file removal rather than a conversion, so do it in its
      own commit with check_project_files.py run after.

      THE FILE LIST WAS ELEVEN FILES AND THE REACH IS TWENTY-FIVE. Corrected
      2026-08-05 at e7a1a88 by grepping `INPUT_TYPE_\w+|inputtype_t` over the
      six projects rather than trusting the list: every declared file is real,
      and fourteen more were missing — Input.cpp, TargetCursor.cpp, Movement2d
      (.h and .cpp), the six composing drivers (Alias, Chord, Conjoin, Invert,
      Pipe, Value), InputFilterWithDelta.cpp, and the three driver HEADERS whose
      .cpp was listed without them. Same shape as the correction T12's list
      needed on the day this task was split out, and the same cause: the list
      was written from the type name, and the enumerators are what the tree
      actually spells.

      The 216 sites above re-measure to 218 at e7a1a88, which is drift in
      commented code rather than new work.

      IT IS FILE-DISJOINT FROM EVERY OTHER READY TASK — checked at e7a1a88
      against strings T8, T11 and T12 and ownership T8: not one shared file.
      Its only overlap in the whole ready set is TargetCursor.cpp, with T12 in
      this same plan, and T12 cannot run beside it regardless. parallel_safe is
      still false, so this is not permission to run it concurrently; it is the
      measurement someone will want before asking to.

      SIXTY-TWO PER CENT OF THIS TASK LIVES IN A FILE IT DID NOT DECLARE.
      Measured 2026-08-05 at 97b5844: of the 218 INPUT_TYPE_ sites, **136 are
      in NeuronClient/ControlTypes.inc** and only 82 are in .cpp and .h files.
      The .inc is the generated control table — `DEF_CONTROL_TYPE( MenuLeft,
      INPUT_TYPE_BOOL )`, one line per control — and its second column is
      InputType. Scoping the enum changes all 136 spellings, so this task must
      edit that file; it has been added to the list above.

      THAT FILE IS T11's, AND THE SEAM IS REAL RATHER THAN CLERICAL. T11 owns
      ControlTypes.inc because it owns the FIRST column; this task owns the
      second. They cannot both be in flight, which the existing T10 -> T11 edge
      already prevents — but whoever runs T11 should expect the .inc to have
      moved under them, and whoever runs this task should not be surprised to
      be editing 136 lines of a file the task list called T11's.

      THREE MACROS CONSUME THAT COLUMN, not one: ControlTypes.h ignores it
      (`#define DEF_CONTROL_TYPE(x,y) Control##x,`), ControlBindings.cpp uses it
      (`{#name, type}`), and ControlTypes.cpp — the dead, broken file this task
      deletes — uses it too. Deleting ControlTypes.cpp first removes one of the
      three consumers before the column changes, which is the cheaper order.

      The "218 sites in 25 files" figure above counts INPUT_TYPE_ and
      inputtype_t together across every extension. Split at 97b5844: 218
      INPUT_TYPE_ in 19 files, of which 136 are the .inc, plus 25 inputtype_t.

      RE-VERIFIED 2026-08-05 FOR BATCH 5, AND THE LIST IS NOW EXACTLY RIGHT.
      `grep -rl 'INPUT_TYPE_\|inputtype_t'` over the six projects and Tests
      returns the 26 declared files, with nothing reached that is not declared
      and nothing declared that is not reached. That is the only task in the
      ready set of which this is true, and it is true because the list was
      corrected by measurement twice rather than written once.

      One sharpening to the NULL point above: `nullptr, NULL` in
      ControlTypes.cpp is the last NULL in the TREE, not just in NeuronClient.
      The only other tree-wide hit for `\bNULL\b` is inside a diagnostic string
      literal in Win32EventHandler.cpp, which T1 correctly left alone. So
      deleting this file takes the sweep T1 started to a genuine zero, and
      that is worth saying in the commit that does it.

      DONE 2026-08-05, in Batch 5, in three commits: the dead-file deletion,
      a whole-file reformat, then the conversion. 217 qualified INPUT_TYPE_
      sites across 18 files.

      InputType is `enum class InputType : int`. int because that is what the
      `typedef int inputtype_t` it was reached through has always been.

      ENUM_HELPER IS USED, AND THIS IS ITS FIRST USE IN THE TREE -- the macro
      has been carried in NeuronHelper.h, invoked by nothing, since it was
      written. Only half of it means anything here, and the header now says so
      at the invocation: a bit field with gaps has no business with
      operator++, ItInputType, RangeInputType or SizeOfInputType(), and
      RangeInputType would walk 0 to 15 where eleven of the sixteen values
      name nothing. The bitwise operators are what the code needs and they are
      what it gets.

      inputtype_t IS NOW `using inputtype_t = InputType`, not int, and not
      deleted. Twenty-five signatures and members spell it; every one of them
      now carries the real type without a single edit, and renaming them is
      not this task's business. InputSpec.h gained an include of InputTypes.h
      to make that alias legal.

      THE BIT RELATIONSHIPS ARE PINNED BY static_assert, not by the comment
      the acceptance line would have settled for. Scoping the enum stops a
      value being confused with a ControlType; it does nothing about someone
      renumbering these, which is the actual way this breaks. Four asserts:
      1D carries ANALOG's bit, 2D carries ANALOG's bit, ANY is a superset of
      all of them, and FAIL is the zero value the tables terminate on.
      isAcceptibleInputType still ORs INPUT_TYPE_1D into a BOOL binding, and
      `int validTypes` beside it is `InputType validTypes` now, so the & and |
      there are InputType's own operators.

      NO C-STYLE CAST WAS ADDED ANYWHERE. Nearly every operation on these
      values across all 18 files is assignment, ==, !=, >, >=, & or |, which a
      scoped enum with ENUM_HELPER serves directly. Four sites needed more than
      qualification: `int validTypes` above; ControlBindings.cpp's `{0, 0}`
      table terminator, now {nullptr, InputType::INPUT_TYPE_FAIL}; and the two
      integer boundaries below.

      THE INTEGER BOUNDARY THIS TASK DECLARES, as its acceptance requires:
      W32InputDriver::getControlType and ::getMouseControlType each end in
      `default: return -1; // Should never get here!`. Both are now
      `static_cast<InputType>(-1)`.

      -1 IS PRESERVED RATHER THAN MAPPED TO INPUT_TYPE_FAIL, and choosing the
      nicer-looking value would have inverted the behaviour. InputType is a bit
      field: -1 is every bit SET, so a `(type & x) == x` test accepts
      EVERYTHING; INPUT_TYPE_FAIL is zero and accepts NOTHING. The value is
      read in exactly that form -- it flows through InputDriverSimple.cpp's
      `spec.type = getControlType(...)` into
      InputDriver::getDefaultConditionID, whose loop condition is
      `(type & info.type) != info.type`. FAIL there would walk the table to the
      terminator and hit the off-by-two failure path T9 already documented.

      Whether -1 or FAIL is the RIGHT answer is a separate question and this
      task does not answer it. The path is marked unreachable, both arms are
      guarded by a prior `getControlID(...) >= 0`, and there is no evidence
      either way. Recorded rather than fixed, in the shape Batch 4 used for the
      three defects it found. NO TASK OWNS IT.

      CI CAUGHT BOTH OF THESE AND THE FIRST PUSH OF THIS TASK WAS RED --
      `error C2440: 'return': cannot convert from 'int' to 'inputtype_t'`,
      twice, and nothing else in the tree. Worth reading as a method failure
      rather than a typo:

      THE SWEEP WAS KEYED ON THE ENUMERATOR NAME, so it found all 217 sites
      that SPELL an INPUT_TYPE_ and was blind to the two that do not. Changing
      a function's RETURN TYPE makes every `return` in it a conversion site,
      and `return -1;` names nothing the grep could match. This is precisely
      the failure mode check_math_types.py was written for during the
      DirectXMath migration -- "a converted signature leaves its parameter's
      uses behind exactly as a converted local does" -- and there is no
      equivalent check for enum conversions. THE RULE FOR THE NEXT ONE: after
      changing a type, enumerate the functions that RETURN it and read every
      return statement, then the assignments INTO it. Do not rely on a sweep
      over the enumerator names; by construction it cannot see a bare
      integer.

      THE HAND-ALIGNED TABLE IN ControlTypes.inc DID NOT SURVIVE, and that was
      a deliberate choice rather than an oversight. 136 of its lines change
      here, so the changed-lines format check reformats them; clang-format
      collapses `DEF_CONTROL_TYPE( MenuLeft,    INPUT_TYPE_BOOL )` to
      `DEF_CONTROL_TYPE(MenuLeft, InputType::INPUT_TYPE_BOOL)` and aligns the
      trailing comments instead. `// clang-format off` would have preserved
      the columns. It was rejected: THIS TREE HAS NO FORMATTING ESCAPE HATCH
      ANYWHERE, deliberately -- the last hygiene-ok marker went in T12 -- and
      introducing the first one to save a table's alignment is not a trade a
      single task should make unasked. If the alignment is wanted back, that
      is a decision about the .clang-format policy, not about this file.

      The reformat is its own commit, per AGENTS.md, and it cost blame on
      three files: ControlTypes.inc, InputDriverIdle.cpp and Movement2d.cpp.
      Movement2d.cpp is the poor-value one -- 141 lines reformatted to land a
      single converted line -- and it is recorded because the changed-lines
      rule will keep producing that shape.

      NOT COMPILED. No MSVC here. This is 217 sites in the input layer and
      nothing in the unit suite touches any of it; the Garden smoke test would
      exercise it at step 5, since nothing moves without the input drivers.
      T11 is next in this plan and inherits ControlTypes.inc's first column.

