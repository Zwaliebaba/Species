      the project standard. Three-line deletion plus one-line insertion per
      header; no include-order or content changes.
    depends_on: []
    files:
      - NeuronCore
      - NeuronClient
      - NeuronServer
      - GameLogic
      - Species
      - Server
    acceptance:
      - grep -rlE "#ifndef _included" over the six projects returns nothing
      - Every header in the six projects contains exactly one `#pragma once`
      - The solution builds and the suite passes
    verify:
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    parallel_safe: false
    status: done

  - id: T3
    title: Pin and convert the wire enums to enum class
    intent: >
      NetworkUpdate::UpdateType, ServerToClientLetter::LetterType and
      NetLib's NetRetCode are serialised as integers — their numeric values
      are the protocol. Each enumerator's value gets pinned in the wire
      tests first (where the byte-pinning tests do not already fix them),
      then the enums become enum class with explicit underlying type and
      unchanged values, with casts at the serialisation boundary.
    project: NeuronCore
    depends_on: []
    files:
      - NeuronCore/NetworkUpdate.h
      - NeuronCore/NetworkUpdate.cpp
      - NeuronCore/ServerToClientLetter.h
      - NeuronCore/ServerToClientLetter.cpp
      - NeuronCore/NetLib.h
      - Tests/NeuronCoreTests/NetworkUpdateTests.cpp
      - Tests/NeuronCoreTests/ServerToClientLetterTests.cpp
    notes: >
      File overlap without an ordering: containers-replaced T4 also touches
      ServerToClientLetter.h/.cpp and the letter tests. Neither task has to
      precede the other — this one changes enumerator types at the
      serialisation boundary, that one changes the container behind the
      updates — but they must not run concurrently. Whichever starts second
      rebases. There is deliberately no blocked_by edge here: a collision is
      not an ordering, and inventing one would serialise two tasks that are
      genuinely independent.

      DONE 2026-08-03, in three commits: the pinning tests, a whole-file reformat
      of the four tab-indented netcode files, then the conversion.

      ONE OF THE THREE IS NOT A WIRE ENUM, and this task's intent says it is.
      NetRetCode never reaches a byte stream — grep for it alongside WRITE_, READ_
      or byteStream returns nothing. It is a return code from the socket layer.
      So it is `enum class NetRetCode : int` (int because NetFailed is -1) with no
      pinning test, and the header now says why it has none. UpdateType and
      LetterType really are the protocol: both go out as WRITE_INT and come back
      as READ_INT.

      THE PINNING TESTS ARE THE POINT and they landed first, in their own commit,
      so the conversion had to preserve the numbers rather than assert whatever it
      produced. Nothing had pinned them before: the byte-layout tests fix the SIZE
      of the type field, not the meaning of what is in it, so reordering the enum
      was a protocol break that compiled, linked and passed every test.

      Scoping the enums moved every enumerator: NetworkUpdate::ClientJoin is
      NetworkUpdate::UpdateType::ClientJoin now, 49 sites, and the letter's five
      are 21 more. NetRetCode's seven are 42. The switch labels inside the two
      owning .cpp files needed the same treatment.

      READ_INT CANNOT SIT INSIDE A FUNCTION-STYLE CAST, and that cost a red
      build. The macro expands to `*((int*)_stream); _stream += sizeof(int);` —
      TWO statements. A static_cast has to parenthesise its argument, which puts
      a `;` inside the parentheses; the C cast it replaced worked only because
      it binds to the first sub-expression and lets the pointer advance follow
      it. The fix reads into an `int` first, which makes the macro's shape
      visible rather than load-bearing. WRITE_INT takes a cast argument fine,
      because the value lands in the macro's first statement.

      That is a property of every READ_ macro in ByteStream.h, not just this
      one. Anyone modernising a cast at a deserialisation site hits it.

      TWO MISTAKES THE SCRIPT MADE, both caught before committing and both worth
      expecting next time. It qualified the enumerator DECLARATIONS inside
      NetLib.h — the one file where the enumerators appear unqualified in the
      definition rather than at a use site — and it rewrote six comment lines in
      NetSocket.h that merely mention the names. The first would not compile; the
      second would have been prose churn in a task whose diff should be code.
    acceptance:
      - Each enumerator's numeric value is asserted by a test that passes on both sides of the conversion
      - The three enums are enum class with an explicit underlying type
      - The existing byte-pinning wire tests pass unchanged
    verify:
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    parallel_safe: true
    status: done

