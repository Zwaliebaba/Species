    acceptance:
      - All seven registered targets are std::string, and InputField holds a std::string* rather than a char*
      - grep -cE "strcpy|strncpy|strcat|sprintf|snprintf" over InputField.cpp, SpeciesWindow.cpp, CameraAnimWindow.cpp, CameraMountWindow.cpp, BuildingsWindow.cpp, UserProfileWindow.cpp and GlobalWorldEditorWindow.cpp returns 0
      - No registration passes a raw char buffer — T14's overload set makes that a compile error rather than a runtime corruption
      - The sprintf sites in LevelFile.cpp and Script.cpp are untouched; this task only adjusts reads of the seven members there, and T8 converts them
    verify:
      - python3 tools/check_layering.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - Owner runs the Garden smoke test — step 6 exercises the windows that register these fields
    parallel_safe: false
    status: done
    notes: |
      RE-SCOPED 2026-08-03 as part of the restart (tasks/_restart.md). The note
      below is the discarded attempt's deliverable and is kept verbatim; what
      changed is that its closing recommendation has been acted on rather than
      left for the next reader.

      The four numbered tasks it identified as one coupled change are now
      ordered rather than merged: T14 (the typed overload set) -> T5 (this,
      the coupled member conversion) -> T8 (the level-file writers, which own
      the byte-identity proof because they land last) and T11 (the Eclipse
      widget names, which already depended on this task). T15 carries the five
      window files that were only ever in T5's list because they are in the
      same project — none of them registers anything InputField writes into.

      Ordered rather than merged because merging produces one diff spanning
      GameLogic and Species with a byte-identity requirement inside it, and
      "one reviewable change per task" is the rule that would break first.
      LevelFile.cpp and Species/Script.cpp appear in both this file list and
      T8's; that collision is real and the T5 -> T8 edge is what keeps the two
      from running concurrently.

      parallel_safe is false now, not true. The old value was written when the
      task looked like eleven independent window files.


      ATTEMPTED AND DELIBERATELY DISCARDED 2026-08-03. No code survives; this
      note is the deliverable. Do not go looking for a stash or a side branch —
      the owner's call was to redo the task later against a corrected plan
      rather than resurrect a half-finished diff against the old one.

      WHAT THE ATTEMPT ESTABLISHED. Converting InputField cannot be done alone.
      It writes into its registered target through a raw pointer, so making
      m_string a std::string* forces SEVEN members to convert in the same
      commit — CameraMount::m_name, CameraAnimation::m_name,
      ScriptTrigger::m_scriptFilename, GenericHub::m_shapeName,
      StaticShape::m_shapeName, FenceSwitch::m_script, and the editor statics
      s_profileName and s_locationName. There is no intermediate state that
      compiles. The attempt got that far and left about 68 call sites reading
      those members — level-file writers, name comparisons, resource lookups.

      THE SHAPE OF THIS TASK IS NOT WHAT THE FILE LIST SAYS, and that is the
      thing to know. InputField writes into its target through a raw pointer, so
      converting it FORCES all seven members to convert in the same commit —
      there is no intermediate state that compiles. Five of those members are
      written to level files, which is T8's byte-identical requirement, and two
      are the fields T6 deliberately left as fixed arrays behind Neuron::CopyInto
      for exactly this reason.

      So T5, T6's three members, T8 and T11 are ONE coupled change wearing four
      task numbers. The DAG says they are independent and it is wrong. Whoever
      picks this up should either merge them or give them an explicit order with
      the level-file byte-identity check owned by whichever lands last.

      THE CAST IS THE HAZARD, and it is the single most important line here.
      CreateValueControl takes void*, so passing a char[256] where a
      std::string* is expected still COMPILES and corrupts memory at runtime.
      There are seven TypeString call sites today; the compiler will not catch
      an eighth, and it will not catch one added later either. Whoever does this
      should consider replacing the void* with an overload set before
      converting anything, so that the compiler is on their side for the rest
      of the change.


      DONE 2026-08-05, in three commits: the whole-file reformat of
      InputField, the characterisation tests, then the conversion.

      THE COUPLING HELD EXACTLY AS THE DISCARDED ATTEMPT DESCRIBED, and T14
      earned its keep: with the void* gone every mis-registration was a compile
      error waiting rather than a corruption, and the seven registrations
      became `&member` with nothing to check by hand.

      THE TOUCH SET WAS NARROWER THAN DECLARED. 22 of the 25 listed files, plus
      three test files. LandscapeWindow.cpp, Species/Camera.h and
      Species/Script.cpp needed nothing: their m_name uses are all Eclipse
      widget names, which are T11's, and Camera.h only forward-declares
      CameraAnimation. Species/Camera.cpp and Species/LocationEditor.cpp needed
      one line each.

      CHARACTERISED FIRST, which is what makes the no-behaviour-change claim
      evidence rather than assertion. Tests/GameLogicTests/InputFieldTests.cpp
      is TWELVE tests over the keystroke write-back, written against the char*
      API and committed before the conversion; the conversion commit changes
      four lines in it — the target's declaration, its registration, and one
      std::string wrapper that stopped being needed — and not one assertion.

      TWO CLAIMS IN THIS TASK'S COMMIT MESSAGES ARE WRONG, corrected here
      because the plan file is the record that gets read. They said thirteen
      tests, and there are twelve. They also said this is the first test of
      anything in GameLogic, and it is not — EntityGridTests, RoutingSystemTests
      and SliceWiringTests were already there. What is true is narrower: it is
      the first test of a GameLogic UI widget. Both were caught by reading CI's
      test output rather than by anything here.

      FIVE UNBOUNDED WRITES WENT WITH THE TYPES. None is fixed separately
      because none survives the conversion; all five are recorded here because
      the counts are the argument for doing the rest of stage 4.
        1. InputField wrote its 256-byte buffer into the registered target with
           strcpy, whatever size the target was. CameraMount::m_name had 64, so
           a camera mount name over 63 characters overran it. This is the one
           that motivated the task and it was live.
        2. InputField's letter branch wrote m_buf[strlen] and [strlen+1] with
           no length test, so a full field wrote two bytes past the array. The
           digit and full-stop branches did test, and still do — MAX_EDIT_LENGTH
           keeps them dropping the key at 255 rather than growing.
        3. and 4. Both camera windows formatted button labels into a char[64]
           from a prefix plus a name of up to 63 characters.
        5. CreateValueScrollers and RemoveValueControl formatted "%s left" and
           "%s right" into a char[64] from a control name of unbounded length.
           T14 recorded these two as belonging here; they do, and they are gone.

      WHAT WAS DELIBERATELY NOT CHANGED, each because it is another task's or
      because changing it would be a behaviour change wearing a conversion's
      clothes:
        - The level-file load path still truncates camera mount and animation
          names at 63. It is what a file carrying a longer name loads as today,
          so it is what such a file writes back, and T8 cannot prove byte
          identity against a load path that moved underneath it. The bound is
          now written out rather than implied by an array size.
        - InputField::Render passes m_buf as DrawText2D's FORMAT STRING, not as
          an argument, exactly as before. A '%' cannot be typed — Keypress
          accepts A-Z, 0-9 and '.' — but one can arrive in a name loaded from a
          level file. Left for T12, whose notes say a call site that stops
          compiling under std::format is a latent bug being surfaced. This is
          one, and it will not compile there.
        - The camera-mount window's delete, goto and update buttons ALIAS the
          mount's name; they are std::string* now and still alias it, because
          InputField edits that string in place and the lookup has to keep
          matching after a rename. The camera-anim window's delete button holds
          a COPY in its own EclButton::m_name and unbinds on rename. That
          inconsistency is inherited and preserved.
        - The two stricmp comparisons on camera names stay case-insensitive.
          This is the hazard T11's notes describe, arriving one task early:
          std::string::operator== matches strcmp and NOT stricmp, so every one
          of these was read rather than swept.
        - Refresh still does not update m_inputBoxWidth. The shared reload body
          is factored out as ReloadBuffer, and the width assignment stayed in
          Render where it was — folding it in would have changed what an
          InputScroller drag does between frames.

      SetShapeName took char* on both DynamicBase and StaticShape and takes
      std::string_view now. Neither is virtual and they are unrelated classes,
      so there was no overrider set to move with them.

      RemoveValueControl has no callers anywhere in the tree.

      NO GAMELOGIC HEADER USED std::string BEFORE THIS TASK. Eight do now, and
      each includes <string> itself — the tree's practice, per Building.h and
      <vector> — rather than relying on pch.h having been seen first.

      Not compiled here (Linux) and the client cannot be launched here either.
      CI's x64 Debug build and the unit suite are the first things to execute
      any of this. The editor is where almost all of it lives, so the Garden
      smoke test reaches only InputField's rendering path and none of the
      windows.

