      Batch 6 puts this task beside strings/T11, and the pair is disjoint on
      measured reach — zero contested files, T17 being the building Write()
      methods and the sound blueprint writer, T11 being the Eclipse widgets
      and the UI windows. It is NOT disjoint from strings/T12 (14 contested
