# Schema: docs/TASK_DAG.md    Validate: python3 tools/check_task_dag.py

plan: strings-modernised
title: Replace C string handling with std::string, string_view and std::format
summary: >
  Migration stage 4 (CODING_STANDARDS.md): char*/char[N] buffers and the
  strcpy/strncpy/strcat/sprintf/snprintf family become std::string,
  std::string_view and std::format. Measured on b69c951 — re-measure:
  ~345 call sites across 84 files. Hotspots: GameLogic/GlobalWorld.cpp (22),
  Species/TaskManagerInterfaceIcons.cpp (21), NeuronClient/Eclipse.cpp (20),
  GameLogic/LevelFile.cpp (19), NeuronClient/LanguageTable.cpp (16),
  Species/App.cpp (15), GameLogic/InputField.cpp (15).

  Two hard exclusions:

    Wire format. Fixed-size char fields inside NetworkUpdate,
    ServerToClientLetter and anything else the ByteStream macros serialise
    keep their exact layout and size. T1 audits and pins them before any
    netcode file is converted.

    File format. LevelFile and GlobalWorld WRITE level and profile files.
    Their output must stay byte-identical or every existing save and level
    stops round-tripping. Format strings are converted 1:1 (e.g. %d -> {},
    %.2f -> {:.2f}) and T8 states the equivalence per call site.

  Cross-plan ordering: per file, containers-replaced finishes before this
  plan's task for that file, and this plan's task finishes before
  ownership's (stage 3 -> 4 -> 5). Every task below now carries the
  `blocked_by` edges that state which containers-replaced task gates it
  (docs/TASK_DAG.md, "Ordering across plans"), so `--next` enforces the
  stage order instead of contradicting it. Same-file tasks in different
  plans never run concurrently even where no ordering exists — check
  `files` overlap before starting.

  Re-measured 2026-08-02 at 11aee84 with
  grep -rEo '\b(strcpy|strncpy|strcat|sprintf|snprintf)\b' over the six
  projects: 367 sites (GameLogic 132, Species 115, NeuronClient 99,
  NeuronCore 20, NeuronServer 1). Not comparable to the 345 above without
  care — that figure was cited from the planning survey and this one counts
  headers too — but the direction is unambiguous: stage 4 has not started,
  and only T1's audit has landed.

  Re-measured again 2026-08-03 at b0bde71, same command: 180 sites across 53
  files (GameLogic 152, Species 14, NeuronClient 13, NeuronServer 1,
  NeuronCore 0, Server 0). T2, T3, T4, T6, T7 and T10 took the tree from 367
  to 180 in one day; NeuronCore is at zero and NeuronServer holds one
  (ServerToClient.cpp:20, the per-connection record key T1's audit listed).
  What is left is 84% GameLogic, and most of it sits behind T5.

  RESTART, 2026-08-03. Work stopped at b0bde71 with T5 attempted and
  discarded, and T5 gates almost everything downstream — see tasks/_restart.md
  for the ordering across all four open plans. T5 was re-scoped here rather
  than left as the note found it: it is the coupled InputField change and
  nothing else, T14 puts the compiler on its side first, and T15 carries the
  windows that were only ever grouped with it by project. T8 now depends on
  T5, which is the explicit order T5's note asked whoever picked this up to
  choose.

tasks:
  - id: T1
    title: Audit and pin every serialised char buffer
    intent: >
      Establishes the do-not-touch list for the whole plan. Every fixed
      char[N] that crosses the wire or lands in a file gets found, listed in
      this task's notes, and — for wire fields not already covered by the
      NetworkUpdate/ServerToClientLetter byte-pinning tests — pinned with a
      test that fails if size, offset or encoding changes.
    project: NeuronCore
    depends_on: []
    files:
      - Tests/NeuronCoreTests/NetworkUpdateTests.cpp
      - Tests/NeuronCoreTests/ServerToClientLetterTests.cpp
      - Tests/GameLogicTests/WorldObjectIdTests.cpp
    acceptance:
      - notes lists every serialised char buffer in the tree with file and field name
      - Every wire-crossing buffer is covered by a byte-pinning test
    verify:
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    parallel_safe: true
    status: done
    notes: >
      Audit complete (2026-08-02). Serialised or serialisation-adjacent char
      buffers in the tree, with what protects each:
      (1) NetworkUpdate::m_byteStream[42] and the letter's stream buffer are
      the wire image itself — do not touch; sizes covered by the existing
      EveryClientPacketFitsTheFixedBuffer test.
      (2) WorldObjectId is raw-copied by WRITE_/READ_WORLDOBJECTID, so its
      sizeof (16), field offsets and the three padding bytes after m_teamId
      are wire format — now pinned by WorldObjectIdTests::
      TheWireLayoutIsSixteenBytesWithTheTeamByteFirst.
      (3) NetworkUpdate::m_clientIp[16] is NOT serialised: ClientJoin sends
      the 8-byte header only, and the server fills the field from the UDP
      source address (Server.cpp, SetClientIp(fromIP)). It is a registry
      key. The real constraint found instead: ServerToClientLetter
      memcpy()s whole NetworkUpdate structs (AddUpdate and its copy ctor),
      so NetworkUpdate must stay trivially copyable — m_clientIp may only
      be converted together with turning those memcpys into assignments.
      Also noted: SetClientIp strcpy()s unbounded into 16 bytes — safe for
      dotted IPv4 (15 chars + NUL), a hazard if ever fed a hostname; fix
      with the conversion, not silently.
      (4) NeuronServer/ServerToClient::m_ip[16] — per-connection record
      key, never serialised.
      (5) TeamControls serialises as a flags word via GetFlags — no char
      buffers; the nine-flag round trip is already pinned.
      Nothing else in NeuronCore or NeuronServer writes a fixed char buffer
      to the wire. The file-format writers (Preferences, LevelFile,
      GlobalWorld) are text emitters with no fixed-width binary fields;
      their byte-identical output is pinned by T2 and T8 as planned.

  - id: T2
    title: Convert NeuronCore string handling
    intent: >
      The foundation goes first and sets the pattern: Preferences.cpp (10
      calls) plus the NeuronCore stragglers a re-measure finds. Preferences
      writes the preferences file, so its output format is pinned by a test
      before conversion — the file must round-trip byte-identically.
    project: NeuronCore
    depends_on: [T1]
    blocked_by: [containers-replaced/T18]
    files:
      - NeuronCore/Preferences.cpp
      - NeuronCore/NetworkUpdate.cpp
      - NeuronCore/NeuronCore.h
    acceptance:
      - grep -cE "strcpy|strncpy|strcat|sprintf|snprintf" over NeuronCore returns 0 outside the legacy container headers and Generic.cpp, which T10 owns
      - The preferences-file format tests from containers-replaced T19 pass unchanged, with no edit to PreferencesTests.cpp in the same commit
      - NetworkUpdate stays trivially copyable and m_clientIp stays a char[16], per T1's audit
    verify:
      - python3 tools/check_project_files.py
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    parallel_safe: true
    notes: >
      Landed 2026-08-02, CI green at ec5e40b. NeuronCore's remaining
      strcpy-family sites are BTree.h (a legacy container header the criterion
      excludes, deleted by containers-replaced T16) and Generic.cpp, which T10
      owns.

      Preferences.cpp: nine sprintf-into-a-shared-char[1024] pairs in
      CreateDefaultValues became std::format expressions and the scratch buffer
      went with them; the tenth was Save()'s strncpy into a char[128] key
      buffer, now a std::string built from the two pointers that already
      bounded it. That removed the truncation clamp as well as the copy — a key
      longer than 127 characters now looks itself up instead of being cut short
      and missing.

      NeuronCore.h: a compatibility #define mapping C99's bounded formatter
      onto the old MSVC underscore variant, with zero callers. Dead, and worse
      than dead — the underscore variant does not null-terminate on truncation.

      NetworkUpdate::SetClientIp: bounded. The field stays char[16] because
      T1's audit established ServerToClientLetter memcpy()s whole NetworkUpdate
      structs. This is the fix T1 asked for in writing.

      TWO FINDINGS THAT OUTLIVE THIS TASK.

      Generic.cpp is not NeuronCore-local, which is why it became T10.
      IpToString writes into a caller-supplied buffer, ConvertIntToIP returns a
      pointer into a function-local static char[16], and Server::ReceiveLetter
      takes `char* fromIP` — so converting them changes a NeuronServer
      signature. The task scoping in this plan was done from grep counts rather
      than from reading call sites, and that keeps producing tasks whose
      "self-contained" premise fails on contact. Expect it; re-scope rather
      than quietly widening a touch set.

      std::min and std::max do not compile in this tree. NeuronCore.h sets
      NOMINMAX and MathUtils.h then defines its own min/max macros, so
      `std::min(` becomes `std::(...)(` and MSVC reports C2589. The one in
      SetClientIp was the only std::min or std::max in all six projects, so
      nobody had found out. SetClientIp writes the comparison by hand with a
      pointer to language-hygiene T8, which carries the real fix — 216 call
      sites across 51 files, and an audit rather than a sweep because the
      macros double-evaluate their arguments.
    status: done

  - id: T3
    title: Convert NeuronClient text and UI string handling
    intent: >
      Eclipse (20), EclWindow, EclButton, TextRenderer, SepulvedaStrings and
      TextStreamReaders format what appears on screen. Frame-rate code with
      no wire or file output — the safest large cluster, good early
      throughput.
    project: NeuronClient
    depends_on: [T1]
    blocked_by: [containers-replaced/T7]
    files:
      - NeuronClient/Eclipse.cpp
      - NeuronClient/SepulvedaStrings.cpp
      - NeuronClient/TextStreamReaders.cpp
    acceptance:
      - grep -cE "strcpy|strncpy|strcat|sprintf|snprintf" over the three files returns 0
      - Every fixed char[N] LOCAL and file static is gone; the widget members move in T11
    verify:
      - python3 tools/check_layering.py
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
    parallel_safe: true
    status: done
    notes: |
      SCOPE CORRECTED 2026-08-03, and the second acceptance line is what
      changed. It read "no fixed char[N] buffer remains in their class
      declarations", which sounds like a property of these six files and is not:
      the buffers in question are EclButton::m_name and EclWindow::m_name, and
      they have 115 references across NeuronClient, GameLogic and Species, 60 of
      them C-string operations in files this task does not list.

      That is the same shape as the split that produced T10 and
      containers-replaced/T18: a task that looks layer-local because its file
      list is, while the thing it actually has to change is reached from
      everywhere. Measured before starting rather than discovered halfway
      through, which is the only reason it is a split and not a third red build.

      SPLIT AGAIN, same measurement, same day. TextRenderer.cpp's eight sites are
      all inside the DrawText2D/DrawText3D family, which take `char *_text, ...`
      and vsprintf into a stack buffer. Removing the vsprintf means making them
      std::format templates, and those have 241 CALL SITES — 161 in GameLogic,
      57 in Species, 8 here. That is T12.

      This task is now the genuinely local half: Eclipse.cpp's five file statics
      and its unique-name builder, SepulvedaStrings' key and phrase buffers, and
      TextStreamReaders' separator array. Eclipse's statics are reached from
      outside only through EclGetCurrentButton and EclGetCurrentFocus, which
      have two callers between them.

      EclWindow.cpp and EclButton.cpp left the list because every one of their
      sites writes m_name, m_title or m_currentTextEdit — T11's members. There
      was nothing local left in them to do.


      DONE 2026-08-03, after the two splits above. Three files, 32 sites.

      Eclipse's five file statics hold the names of the focused window, the
      moused-down window, the popup, the maximised window and the highlighted
      button. All were char arrays copied into with an unbounded call from
      EclWindow::m_name; a window whose name was longer than the array
      overwrote the next static in the block, which is a silent corruption of
      an adjacent name rather than a crash.

      EclGenerateUniqueWindowName kept its static-storage return, because
      callers hold the pointer long enough to register a window with it — but
      it appends an index in a loop until the name is unique, and it built that
      into a fixed buffer with no bound.

      TextReader::m_filename and m_seperatorChars were both fixed arrays filled
      by bounded copies, so both truncated silently: a reader given a path
      longer than 255 characters reported the wrong name in its own assert
      messages.
  - id: T12
    title: Convert the TextRenderer variadic text API
    intent: >
      DrawText2D, DrawText2DCentre, DrawText2DRight and their 3D counterparts
      take `char *_text, ...` and vsprintf into a fixed stack buffer. Making
      them std::format templates removes the unbounded write and gets
      compile-time format checking, but it is a signature change with 241 call
      sites — 161 in GameLogic, 57 in Species, 8 in NeuronClient — so it is its
      own task rather than four lines inside T3.
    project: NeuronClient
    depends_on: [T3]
    files:
      - NeuronClient/TextRenderer.h
      - NeuronClient/TextRenderer.cpp
    acceptance:
      - grep -cE "strcpy|strncpy|strcat|sprintf|snprintf" over TextRenderer returns 0
      - No variadic (...) entry point remains on TextRenderer
      - Every call site compiles unchanged or is updated in the same commit; no format string is reinterpreted
    verify:
      - python3 tools/check_layering.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - Owner runs the Garden smoke test — every step renders text, so a broken format shows immediately
    parallel_safe: false
    status: done
    notes: |
      DONE 2026-08-05. NOT COMPILED — Linux, no MSVC; the seven Python checks
      are the whole of the local evidence.

      THE DESIGN THE NOTES BELOW ASKED FOR, built as described: two overloads
      per entry point, not one. What they did not settle is how to keep the two
      unambiguous, and the answer is that THE FORMATTING TEMPLATE TAKES AT
      LEAST ONE ARGUMENT:

        template <typename T, typename... Args>
        void DrawText2D(..., std::format_string<T, Args...> _fmt, T&& _arg, Args&&...)
        void DrawText2D(..., std::string_view _text)

      With only the text, the template is not viable and the plain overload
      takes the call. A single `format_string<Args...>` template would have
      been ambiguous against the string_view overload for every zero-argument
      call, and 147 of the 199 sites are zero-argument.

      THE POPULATIONS, re-measured at 17b0778 with a parser rather than a grep,
      over 199 real call sites. The old count of 225 included commented-out
      code and TextRenderer's own declarations:

        128  runtime string, no arguments   -> plain overload, source unchanged
         52  literal format, with arguments -> formatting template, format
                                               string rewritten
         19  literal, no arguments          -> plain overload, source unchanged

      92 format strings were rewritten across 29 files, counting commented-out
      calls, which were converted too so they do not read as valid printf.

      NO ZERO-ARGUMENT LITERAL CONTAINS A PERCENT SIGN. Checked before anything
      moved, and it is the fact that makes the split safe: those 19 calls stop
      being format strings entirely, so a `%` in one would have changed what is
      drawn. There is none.

      THE SPEC SET CONTAINED NO BARE %f, which is the one conversion that would
      have changed output silently — printf's %f is six decimals and
      std::format's {} is shortest-round-trip. Every float site already carried
      an explicit precision:

        %d x66  %s x21  %2.2f x12  %4.0f x4  %.1f x3  %.0f x2  %2.1f  %2.0f  %%

      Translated by a converter that RAISES on anything it does not model
      rather than guessing; it raised on nothing. Two of its rules are worth
      keeping if this is repeated: a padded %s must become {:>N}, because
      printf right-justifies strings and std::format left-justifies them, and a
      literal brace has to be doubled.

      TWO ENTRY POINTS WERE VARIADIC AND IGNORED THEIR ARGUMENTS. DrawText2DUp
      and DrawText2DDown declared `char const* _text, ...` and their bodies
      never called va_start — they drew the format string as it stood. Any
      caller passing an argument would have printed "%d". No caller did, so
      nothing changes; the declarations simply stop lying.

      Split out of T3 on 2026-08-03, on the measurement in T3's notes.

      The trap here is not the template. It is that printf and std::format
      disagree about what a bare `%` means and about argument types: a call
      passing an int to %s compiles today and is undefined at runtime, while
      std::format rejects it at compile time. That is an improvement, but it
      means the 241 sites cannot be assumed to be correct — each one that fails
      to compile is a latent bug being surfaced, not a conversion error, and
      should be recorded as such rather than silently patched.

      RE-MEASURED 2026-08-05 at e7a1a88, and the measurement changes what this
      task is. No code was touched. 225 call sites outside TextRenderer.cpp —
      GameLogic 161, Species 57, NeuronClient 8 — and they are TWO populations,
      not one:

        109 pass a STRING LITERAL as the format string, 89 of them with
        arguments after it. These are the std::format conversions, and they are
        where a wrong argument type becomes a compile error rather than
        runtime undefined behaviour. This is the population the task was
        written for.

        116, in 22 files, pass NO literal at all — the format string is a
        runtime value. `m_caption` (15), `LANGUAGEPHRASE(...)`, `caption.c_str()`,
        `loc->m_mapFilename`, `islandName`, InputField's `m_buf.c_str()`. Not
        one of them passes an argument after it.

      THE 116 CANNOT BECOME std::format AT ALL, and that is the decision this
      task has to make before it writes a line. std::format_string is
      consteval — a runtime char const* does not convert to it — so a
      single format template breaks every one of them. They want a SECOND,
      NON-FORMATTING overload taking std::string_view, and converting them that
      way is a fix rather than a translation: today each one hands user data,
      level-file data or a translated phrase to vsprintf AS A FORMAT STRING, so
      a `%` anywhere in that data is undefined behaviour.

      How live that is, stated rather than implied: the shipped language files
      hold exactly one `%` — Russian.txt:122, `sepulveda_pressreturnXmore`,
      whose key no code references. So the hazard is latent in shipped content
      today and unbounded in content a user or a level file supplies.

      strings/T5 predicted InputField::Render would fail to compile here and
      recorded it as a latent bug to surface. Under the two-overload design it
      resolves to the safe overload instead and the bug is simply gone. Both
      answers are correct; do not "fix" the site by wrapping it in "{}".

      THE PATTERN IS ALREADY IN THE TREE. strings/T4 converted
      NeuronClient/PersistingDebugRender.h from `char *_fmt, ...` to four
      `std::format_string<Args...>` templates. Read that file before starting;
      it is what these ten entry points should look like, minus the second
      overload the 116 need.

      COLLISIONS MEASURED 2026-08-05 at 18d13ed, while scoping Batch 6. This
      is the most contested of the five ready tasks and it is why it is not in
      Batch 6: 46 files, contesting 14 with strings/T17 (the GameLogic
      buildings, which both render text and write themselves to a level file),
      12 with strings/T11 and 12 with language-hygiene/T11. There is no ready
      task it can run beside.

      THE 15 m_caption SITES ARE strings/T11's MEMBER, and the two tasks
      interact whichever order they run in. 17 lines in
      GameLogic/SpeciesWindow.cpp pass EclButton::m_caption — a raw char*
      today — straight into DrawText2D and DrawText2DCentre. If T11 lands
      first, those 17 pass a std::string through `...`, which MSVC accepts
      with warning C4840 and which is undefined at runtime; T11's notes carry
      that and require .c_str() at each. If THIS task lands first, the
      non-formatting string_view overload takes them and T11's conversion is
      free. T12 first is the cheaper order, and neither task should gain a
      graph edge for it — they are not sequenced, they are merely not
      concurrent.

  - id: T13
    title: Narrow the read-only char const* parameters to string_view
    intent: >
      A `char const*` parameter that is only ever compared or copied is a
      `string_view` that has not been converted yet. The Eclipse window
      functions (EclGetWindow, EclSetWindowPosition, EclSetWindowSize,
      EclRemoveWindow, EclDirtyWindow) and SoundSystem::ParseSoundEvent are the
      known set: none forwards its argument to a C API, so none needs the null
      terminator that is the only reason to keep char const*. Narrowing them
      also removes the .c_str() that every std::string caller currently writes.
    project: NeuronClient
    depends_on: [T11, T12]
    files:
      - NeuronClient/Eclipse.h
      - NeuronClient/Eclipse.cpp
      - NeuronClient/SoundSystem.h
      - NeuronClient/SoundSystem.cpp
      - NeuronClient/SoundInstance.h
      - NeuronClient/SoundInstance.cpp
      - GameLogic/BuyNowWindow.cpp
      - GameLogic/DropDownMenu.cpp
      - GameLogic/FileDialog.cpp
      - GameLogic/GlobalWorldEditorWindow.cpp
      - GameLogic/InstantUnitWindow.cpp
      - GameLogic/LandscapeWindow.cpp
      - GameLogic/MainMenus.cpp
      - GameLogic/MessageDialog.cpp
      - GameLogic/PrefsOtherWindow.cpp
      - GameLogic/ScrollBar.cpp
      - GameLogic/SpeciesWindow.cpp
      - GameLogic/TreeWindow.cpp
      - GameLogic/UpdateAvailableWindow.cpp
      - GameLogic/UserProfileWindow.cpp
      - Species/GameMenu.cpp
      - Species/LocationEditor.cpp
      - Species/Main.cpp
      - Species/UserInput.cpp
    acceptance:
      - No listed function takes char const* for a parameter it only compares or copies
      - No call site passes .c_str() to one of them
      - The rule in CODING_STANDARDS.md, Strings, is what decides each case
    verify:
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
    parallel_safe: false
    status: done
    notes: |
      Raised 2026-08-03 by the project owner, mid-conversion, and the criticism
      was fair: T3 and T7 widened several of these to char const* while fixing a
      red build, which was the smallest change that compiled rather than the
      right one. Recorded rather than done on the spot because these are T11's
      and T12's files and a third concurrent edit to them would collide.

      NOT a blanket sweep. string_view is wrong wherever the argument reaches
      fopen, strcmp, strchr, _findfirst or a resource lookup, because it
      carries no null terminator — see the table in CODING_STANDARDS.md. The
      four files above are the ones measured to be free of that.

      DONE 2026-08-05. Nine Eclipse entry points narrowed, not the five the
      intent listed: EclDirtyWindow does not exist and has not for some time,
      and EclGetWindowIndex, EclBringWindowToFront, EclMaximiseWindow,
      EclSetCurrentFocus and EclGenerateUniqueWindowName all take a name they
      only compare against EclWindow::m_name or copy into one of the module's
      std::string statics. 36 .c_str() calls went from 18 files.

      THE THREE ACCESSORS KEEP char const* AND THAT IS THE DECISION, NOT AN
      OMISSION. EclGetCurrentButton, EclGetCurrentClickedButton and
      EclGetCurrentFocus return a pointer into a static this module reassigns.
      CODING_STANDARDS.md says narrowing that return to string_view preserves
      the lifetime bug rather than fixing it, so the return types are
      unchanged and the reason is now at the declaration.

      TWO FILES WERE ADDED TO THE LIST AND ONE DEFECT CAME OUT OF IT.
      ParseSoundEvent's _entityName is forwarded to
      SoundInstance::SetEventName, so that signature had to move with it —
      SoundInstance.h/.cpp are in the list now. Its SECOND parameter stays
      char const* on purpose: the only caller passes
      SoundEventBlueprint::m_eventName, which is NULL whenever the blueprint
      line carried no token, because TextReader::GetNextToken returns nullptr
      for a missing one. A string_view would have to be constructed from that
      null before the assert that catches it ever runs. The assert dropped its
      `_entityName &&` clause and kept the rest.

      ECLREMOVEWINDOW WAS A USE-AFTER-FREE AND NARROWING IT IS WHAT SHOWED
      THAT. Nearly every caller spells EclRemoveWindow(w->m_name), so the
      argument borrows storage owned by the window the function then destroys —
      and the two comparisons against mouseDownWindow and windowFocus run
      AFTER that destruction. It was equally wrong when the parameter was
      char const* and every caller wrote .c_str(); a raw pointer just made it
      unremarkable to look at. The name is copied into a local before the
      window goes.

      EclSetCurrentFocus lost its SIZE_ECLWINDOW_NAME length guard, which is
      the same defect T11 found in EclButton::SetProperties: a name one
      character too long left the focus where it was and reported nothing.
      m_name has not been a fixed buffer since T11, so the guard protected
      nothing and only refused work.

      NOT COMPILED. No MSVC in the executing environment, so the msbuild in
      verify was not run — the seven Python checks are the whole of the
      evidence, and an overload resolution change is exactly the kind of thing
      only a compiler settles.

