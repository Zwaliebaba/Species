      It writes into its registered target through a raw pointer, so making
      m_string a std::string* forces SEVEN members to convert in the same
      commit — CameraMount::m_name, CameraAnimation::m_name,
      ScriptTrigger::m_scriptFilename, GenericHub::m_shapeName,
      StaticShape::m_shapeName, FenceSwitch::m_script, and the editor statics
      s_profileName and s_locationName. There is no intermediate state that
      compiles. The attempt got that far and left about 68 call sites reading
      those members — level-file writers, name comparisons, resource lookups.

      THE SHAPE OF THIS TASK IS NOT WHAT THE FILE LIST SAYS, and that is the
      thing to know. InputField writes into its target through a raw pointer, so
      converting it FORCES all seven members to convert in the same commit —
      there is no intermediate state that compiles. Five of those members are
      written to level files, which is T8's byte-identical requirement, and two
      are the fields T6 deliberately left as fixed arrays behind Neuron::CopyInto
      for exactly this reason.

      So T5, T6's three members, T8 and T11 are ONE coupled change wearing four
      task numbers. The DAG says they are independent and it is wrong. Whoever
      picks this up should either merge them or give them an explicit order with
      the level-file byte-identity check owned by whichever lands last.

      THE CAST IS THE HAZARD, and it is the single most important line here.
      CreateValueControl takes void*, so passing a char[256] where a
      std::string* is expected still COMPILES and corrupts memory at runtime.
      There are seven TypeString call sites today; the compiler will not catch
      an eighth, and it will not catch one added later either. Whoever does this
      should consider replacing the void* with an overload set before
      converting anything, so that the compiler is on their side for the rest
      of the change.

