    title: Convert Species app and interface string handling
    intent: >
      TaskManagerInterfaceIcons (21), App.cpp (15), Main, GameCursor,
      GameMenu, EntityGrid, Water and the remaining Species call sites
      outside the file-writing pair handled by T8. Mostly screen text and
