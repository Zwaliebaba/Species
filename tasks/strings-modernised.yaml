    notes: |
      DONE 2026-08-03. Seven files, 55 sites.

      THREE GLOBALS CHANGED TYPE, which reaches past this task's file list:
      g_userProfileName, g_requestedMission and g_requestedMap were char[256] in
      AppState.h and every write into them was an unbounded copy — from a
