      MainMenus:354 and :491 strcpy a URL into `m_website` on the buy-now and
      website windows — another char member on a window class, in the shape
      T11 handles for Eclipse's. ProfileWindow:116 formats with `%*s%-*s`,
      runtime field widths, which std::format spells `{:{}}` — one of the few
      printf constructs that does not translate by eye.

      DONE 2026-08-03. Four files, 19 sites, no reformat needed — all four were
      already converted.

      THE THREE PROFILEWINDOW SITES WERE NOT WHAT THE COUNT SUGGESTED. They
      rotate a button's caption Min -> Avg -> Max by copying into
      EclButton::m_caption, which is not a fixed array: it is a char* pointing
      at `new char[strlen(caption) + 1]`, sized to whatever caption the button
      was last given. Writing into it only ever worked because all three words
      are three characters long. A four-letter caption there would have
      overrun the heap block. They call SetCaption now, which reallocates. The
      member stays a char* — that is T11's.

      m_website was the same shape and simpler: a char[256] on a window class
      local to MainMenus.cpp, so it is a std::string with no reach outside the
