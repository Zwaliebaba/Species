      each fixes a real hazard as well as the formatting: the static buffer is
      neither reentrant nor safe to hold across a second call.
    project: NeuronCore
    depends_on: [T1]
    files:
      - NeuronCore/Generic.cpp
      - NeuronCore/Generic.h
      - NeuronClient/ClientToServer.cpp
      - NeuronServer/Server.cpp
