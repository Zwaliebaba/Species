      - grep -cE "strcpy|strncpy|strcat|sprintf|snprintf" over InputField.cpp, SpeciesWindow.cpp, CameraAnimWindow.cpp, CameraMountWindow.cpp, BuildingsWindow.cpp, UserProfileWindow.cpp and GlobalWorldEditorWindow.cpp returns 0
