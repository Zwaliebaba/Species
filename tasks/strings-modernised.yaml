      MEASUREMENT INTACT on its source files: grepping every `->printf(` and
      `.printf(` receiver tree-wide returns exactly the 29 source files
      declared here, plus FileWriter's own pair. Nothing was missing and
      nothing declared was idle. Six lists have been found wrong before this
      one; recording the one that was right is the other half of the argument
      for measuring.

      Why it held where the others did not: FileWriter::printf is reached
      through a FUNCTION NAME on an object, not through a member name or a
      type name. `_out->printf(...)` spells the thing being converted at every
      single call site, so a grep for it cannot miss a caller the way a grep
      for m_locations misses a file that only calls AddLocation, or a grep for
      INPUT_TYPE_ misses a bare `return -1`. Expect a variadic-API conversion
