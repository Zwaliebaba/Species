      A CONVERSION SCRIPT ATE THE SEMICOLONS and it is worth recording how that
      was caught, because the file still had zero grep hits and passed all six
      checks. The regex matched `sprintf(...);` including the terminator and the
      replacement did not put it back, so fifteen statements ran into the ones
      after them. What found it was reading the generated lines rather than
      trusting the counts — `iconFilename = std::format(...) if (...)` on one
      line is obvious once looked at. The bracket-balance check added after the
      container sweep did NOT catch it: brackets stayed balanced. Semicolon
      count is now part of that check for the same reason.
