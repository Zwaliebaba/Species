  - id: T14
    title: Replace CreateValueControl's void* with a typed overload set
    intent: >
      SpeciesWindow::CreateValueControl takes `int dataType, void* value` and
      casts the pointer to whatever the tag says, so registering a char[256]
      where a std::string* is expected compiles and corrupts memory at run
      time. That is the single hazard standing in front of T5, and it is a
      type-safety change with no string conversion in it — worth its own commit
      precisely so that T5's diff is about strings and the compiler is checking
      every registration by the time it starts.
    project: GameLogic
    depends_on: []
    files:
      - GameLogic/SpeciesWindow.h
      - GameLogic/SpeciesWindow.cpp
      - GameLogic/InputField.h
