      - Owner runs the Garden smoke test — step 6, the Task Manager, is the one this can break
    parallel_safe: false
    status: done
    notes: |
      DONE 2026-08-05. NOT COMPILED — Linux, no MSVC.

      WHAT CONVERTED: EclButton::m_name, m_caption and m_tooltip;
      EclWindow::m_name, m_title and m_currentTextEdit; ScrollBar::m_name and
      m_parentWindow. All std::string. No fixed char[N] member is left in any of
      the three classes, and the acceptance grep for a C-string call on a widget
      name comes back empty.

      THE CASE-SENSITIVITY TRAP WAS REAL AND IT WAS SEVENTEEN SITES. The notes
      below predicted it; here is what it actually was. Eclipse's own lookup —
      EclGetWindowIndex, EclWindow::GetButton, RemoveButton — compared with
      strcmp, and std::string's == is the same comparison, so those are exactly
      unchanged. But seventeen call sites in the UI compared a widget name
      or caption with stricmp: ProfileWindow matches its buttons on their captions
      ("Min", "Avg", "Max"), and LandscapeWindow, InstantUnitWindow and
      CameraAnimWindow match theirs against a LANGUAGEPHRASE. Sweeping those to
      == would have made each one stop matching whenever the language file's
      spelling differed in case — silently, and only for some spellings.

      They now call Neuron::StrEqualsIgnoreCase, added to StringUtils for this.
      SampleCache.h already carried the same idea privately for the sample
      cache's hash; this is the shared spelling of it.

      FOUR DEFECTS THE CONVERSION RETIRED, none of them the point of the task:

        EclButton::SetProperties silently REFUSED a name longer than 256 —
        `if (strlen(_name) > SIZE) {} else strcpy(...)`. The button kept the
        name "New Button", so every later lookup by the intended name missed.
        EclWindow::SetName and SetTitle had the same shape and returned early.

        ~EclButton freed m_caption and m_tooltip, and the destructor is gone
        with them: the class needs no destructor now. This retires the fourth of
        the raw-ownership survivors AGENTS.md lists.

        InputField::Render guarded on `m_parent->m_currentTextEdit &&` — a
        char[256] MEMBER, so the array always decayed to a non-null pointer and
        the guard was dead.

        DropDownMenu built an option name with the C formatter into a char[64]
        from a menu name of up to 256, and ScrollBar built three button names
        the same way. Both are std::format now.

      CopyInto is gone from eleven call sites in CameraAnimWindow and
      CameraMountWindow. It exists to bound a copy at a char array destination;
      the destination is a std::string, so the label is simply assigned.

      ONE SIGNATURE OUTSIDE THE FILE LIST HAD TO MOVE: EclBringWindowToFront
      took `char*`, non-const, and its only caller passes EclWindow::m_name. It
      is `char const*` now. DropDownWindow::CreateDropDownWindow took two
      `char*` for the same reason and takes string_view.

      WHAT CI CAUGHT, in one round of two errors, and both are the same class
      of miss: THE SWEEP WAS KEYED ON THE MEMBER NAMES THE WIDGETS USE.

        SpeciesWindow.cpp had EclSetCurrentFocus((*windows)[0]->m_name) and the
        regex that added .c_str() elsewhere required an argument with no
        parentheses in it. A receiver with a subscript or a dereference in it
        does not match; 29 of the 30 sites did.

        DropDownWindow::m_parentName IS AN ECLIPSE WINDOW NAME IN A char[256]
        and this task should have converted it on the first pass. It holds
        EclWindow::m_name, strcpy'd; it is not called m_name, so a sweep over
        the widget member names could not see it. It is a std::string now, its
        constructor takes string_view, and SpeciesWindow's constructor follows
        — it forwards to EclWindow, which already took string_view.

      A paren-aware re-sweep afterwards found no third site: the fourteen calls
      that still hand a member straight to a C-string API are all on OTHER
      classes — Profiler, SoundSystem's blueprints, ScreenZone, StartSequence.

      THE .c_str() CALLS ARE T13's TO REMOVE, and there are 30 of them —
      EclRemoveWindow, EclGetWindow and EclSetCurrentFocus still take
      char const*. That is exactly the churn T13 exists for; it is the next task
      and it deletes them.

      Split out of T3 on 2026-08-03. See T3's notes for the measurement.

      The risky part is not the type change, it is that Eclipse looks windows
      and buttons up BY NAME with strcmp, and a std::string comparison is
      case-sensitive in the same way strcmp is but NOT in the same way stricmp
      is. Both appear in the call sites, so each one has to be read rather than
      swept — getting that wrong silently breaks a menu button rather than
      failing to compile.

      Depends on T5 as well as T3 because InputField writes into these fields
      through a raw char*, and T5 is what converts InputField.

      GAINED SCROLLBAR IN THE 2026-08-03 RESTART, from the old T5's file list.
      Its nine sites are all Eclipse names and nothing else: m_parentWindow is
      strcpy'd from parent->m_name, m_name is an EclButton name, and the six
      sprintfs build "<name> bar", "<name> up" and "<name> down" to look
      buttons up with. Converting those while EclWindow::m_name is still a
      char[N] means converting them twice, which is the same argument that put
      EclWindow.cpp and EclButton.cpp here rather than in T3.

      REACH MEASURED 2026-08-05 at 18d13ed, while scoping Batch 6. No code was
      touched. THE FILE LIST WAS THE WORST ONE FOUND IN THIS TREE SO FAR: it
      declared EIGHT files against a measured THIRTY, and one of the eight was
      wrong. The list above is the corrected one.

      NeuronClient/WindowManager.cpp WAS ON THE LIST AND HOLDS NONE OF THIS
      WORK. Its only matches are m_titleHeight — a different member of a
      different class, caught by a substring. It is removed above. This is the
      seventh declared list found wrong here and the second to name a file that
      has nothing to do with the task (determinism/T4 named a path that did not
      exist; language-hygiene/T12 matched a shared enumerator name).

      WHY THE UNDER-COUNT, because it is not carelessness — it is that these
      members cannot be measured by name. m_name means TWELVE different things
      in this tree: Profiler, three SoundSystem classes, three Shape classes,
      InputDriver, InputFilter, two LevelFile classes, GlobalWorld and two
      TaskManagerInterface classes all declare one, and only EclButton's,
      EclWindow's and ScrollBar's are this task. A grep for the member name
      returns 54 files and over-reports; a grep for the declaring class
      returns 8 and under-reports, because every use site reaches the member
      through a pointer whose type is named nowhere on the line. The thirty
      above were arrived at by grepping the member names and then READING
      every hit to classify its receiver. m_caption is contended too, at two:
      EclButton's and Species/StartSequence's, and StartSequence's is NOT this
      task.

      THE 23 FILES THE LIST WAS MISSING are the UI windows — every
      *Window.cpp in GameLogic plus DropDownMenu, MainMenus, FileDialog,
      MessageDialog, InputField, and four Species files that call
      EclRemoveWindow(w->m_name). They contain no widget DECLARATION, which is
      why a list written from where the members live could not see them. This
      is the same rule ownership/T5 and T11 both hit, stated in AGENTS.md: a
      file list is written from where the member LIVES, and the work is
      wherever it is NAMED.

      THE ONE SITE THAT NEEDS A DECISION BEFORE ANY OF IT, and it is a silent
      hazard rather than a compile error. GameLogic/SpeciesWindow.cpp passes
      EclButton::m_caption straight into TextRenderer's variadic
      DrawText2D/DrawText2DCentre at 17 lines. Convert m_caption to
      std::string with T12 unconverted and those 17 lines pass a CLASS TYPE
      THROUGH `...`, which MSVC accepts with warning C4840 and which is
      undefined at runtime — a green build that prints garbage or faults.
      Either add .c_str() at all 17 in the same commit, or let T12 land first
      and take its non-formatting string_view overload. T12's own notes count
      m_caption as 15 of the 116 runtime-format-string sites it has to give
      that overload to; these are those sites. Neither task depends on the
      other in the graph and neither should — but they must not be in flight
      at the same time, and if both are wanted, T12 first is the cheaper
      order.

      EclButton::m_caption AND m_tooltip ARE RAW OWNING char*, new[]/delete[]
      in SetCaption/SetTooltip and the destructor, with a strcpy each. They
      are not in AGENTS.md's list of raw-ownership survivors because that list
