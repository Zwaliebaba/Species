      `Shape::~Shape()` called free(m_name) — so default-constructing a Shape
      and destroying it freed an uninitialised pointer. std::string ends that
      without anyone deciding to.

      NOT FIXED, AND IT NEEDS AN OWNER: ShapeMarker's TextReader constructor
      does not initialise m_depth before the parse loop, then calls
      m_parents.assign(m_depth, nullptr). A marker block with no `Depth:` line
      sizes a vector from an indeterminate value. Every shipped shape has one,
      so it does not bite today. Left alone deliberately — a default member
      initialiser is a behaviour change and this plan forbids one riding along
      inside a conversion — and recorded here rather than fixed quietly. The
      test file says the same thing at the helper that avoids it.

      m_displayListName IS NOT IN SCOPE and stays a char*. It is not a strdup:
      it comes from g_resource->GenerateName() and is released with delete[],
      so it belongs to whoever converts Resource's naming API, not here.

      NOT COMPILED. No MSVC in the environment this ran in. The seven Python
      checks pass; the five new tests have never been executed.

