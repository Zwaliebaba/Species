      THE SHARP EDGE T8 RECORDS LIVES HERE, not there. GlobalWorld.cpp:1548
      writes the location table with `%4d %4d %30s %40s` — two integers and
      two 30/40-wide strings, the last being m_mapFilename and
      m_missionFilename. Field widths are where std::format and printf are
      least alike, and a profile written with different padding is a different
      file even though every character of content matches. It is a
      FileWriter::printf call. Pin it with T8's round-trip test first; that is
      the whole reason this task depends on T8 rather than running beside it.

      SIZE, measured: 207 calls in 29 files. LevelFile.cpp has 80 and
      GlobalWorld.cpp 33, so 113 of them are in two files T8 already owns —
      which is the second reason for the edge. SoundSystem.cpp (18) and
      SoundParameter.cpp (7) write the sound blueprint file; the remaining 22
      GameLogic files are one Write() method per building type.

      THE BUFFER IS WORSE THAN UNBOUNDED. vsprintf writes into char[10240] and
      the encryption loop then runs over `len` bytes of it — so an overrun
      corrupts the stack AND the loop follows it. Nothing on the save path
      bounds a level name, a shape name or a script filename before it gets
      here.

      THE LAST ENTRY IN THE FILE LIST USED TO NAME A FILE THAT DOES NOT EXIST,
