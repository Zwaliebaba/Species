      Split out of T15 on 2026-08-02 with the owner. Gates ownership/T1 and
      strings-modernised/T2 and T4, which name it in blocked_by. Profiler's
      HashTable is a name-keyed cache with no simulation state, so
      std::unordered_map is legitimate there; Preferences' m_fileText is
      ordered output and becomes a vector.

      The acceptance criterion about item order was CORRECTED after T19
      characterised the writer, and the correction is the reason T19 exists.
      "Preferences' item order is unchanged" is not achievable as written:
      Save() emits keys the loaded file did not contain by walking m_items
      from slot 0 to Size(), and m_items is a HashTable, so that order is a
      function of the key text, the insertion sequence and where the table
      last doubled. No std:: container reproduces it and neither would a
      different hash. What is achievable, and what T19 pins, is that template
      lines keep their exact positions and no key is lost.
    status: done

