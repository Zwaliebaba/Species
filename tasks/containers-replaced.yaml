  - id: T20
    title: Convert the profiler and its window off SortingHashTable
    intent: >
      ProfiledElement::m_children is a SortingHashTable, which is a HashTable
      that also walks its keys in alphabetical order. std::map with a
      case-insensitive comparator reproduces both halves exactly — but the
      ordered walk is driven from GameLogic/ProfileWindow.cpp through
      StartOrderedWalk/GetNextOrderedIndex/NumUsed, so the window converts in
      the same commit or the profiler cannot move at all.
    project: NeuronCore
    depends_on: [T1]
    files:
      - NeuronCore/Profiler.h
      - NeuronCore/Profiler.cpp
      - GameLogic/ProfileWindow.cpp
      - GameLogic/PrefsGraphicsWindow.cpp
      - GameLogic/PrefsSoundWindow.cpp
    acceptance:
      - grep -lwE "HashTable|SortingHashTable" on the three files returns nothing
      - Child iteration stays case-insensitive alphabetical — the comparator uses stricmp, matching SortingHashTable::FindPrevKey and HashFunc's key uppercasing
      - GetMaxChildTime divides by the same element's m_historyNumSeconds as before, which is the alphabetically first child and therefore order-dependent
      - The profile window lists the same entries in the same order (owner-observable; there is no test project reach here)
    verify:
      - python3 tools/check_layering.py
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    parallel_safe: true
    notes: >
      Split out of T18 on 2026-08-02 after it turned out not to be a leaf.
      T18's premise was that Preferences, Profiler and PersistingDebugRender
      were self-contained; Profiler is not. ProfileWindow.cpp reaches
      m_children directly at six sites, so the conversion crosses from
      NeuronCore into GameLogic and is a different size and shape of task.

      Ordering is observable twice over, which is why the comparator matters:
      the window displays children in walk order, and GetMaxChildTime returns
      `rv / m_children[first]->m_historyNumSeconds` — the divisor is whichever
      child sorts first. Two latent oddities found while reading, neither
      fixed here and neither a crash: that divisor looks arbitrary rather than
      intentional, and GetMaxChildTime declares a `child` local it never uses.
      Decide deliberately when converting; do not silently "tidy" the divisor,
      because it changes a displayed number.

      LANDED 2026-08-02, CI green at e830155.

      Scope grew twice. ProfileWindow.cpp was known from the split; CI then
      found PrefsGraphicsWindow.cpp and PrefsSoundWindow.cpp, both calling
      m_children.GetData(key). Both were in the grep run while scoping this
      task and were read as "probably their own members" without opening the
      files. The lesson is narrow and worth keeping: the grep was right, the
      skim of it was not.

      Behaviour preserved deliberately in three places. The comparator uses
      stricmp so the walk order is unchanged. GetMaxChildTime keeps dividing
      by the FIRST child's m_historyNumSeconds — it reads like an oversight,
      but it is a number on screen. Its `float val` narrowing from a double is
      kept so near-ties resolve the same way. And GetData returned nullptr for
      an absent key, so the two window call sites use find rather than
      operator[], which would have inserted.

      DEFECT FOUND, NOT FIXED: PrefsSoundWindow.cpp dereferences the lookup
      result with no null check, where PrefsGraphicsWindow.cpp checks. If
      "Advance SoundSystem" has not been profiled yet that is a null
      dereference in the sound preferences window. Pre-existing, preserved
      exactly by this conversion, and left for a commit that is allowed to
      change behaviour.

      Dead code removed while converting: an unused `child` local in
      GetMaxChildTime, and `int tableSize = root->m_children.Size();` in
      ProfileWindow::Render, assigned and never read.

      GameLogic/ProfileWindow.cpp was whole-file formatted in its own commit
      first (23ca526). The changed-lines format check does not converge on
      that file — fifteen passes took a 15-line edit to 141 changed lines and
      it was still growing, flattening an untouched hand-indented GL block on
      the way. After the format, the conversion diff was 14 lines and
      converged in one pass.

      No test reaches any of this. Evidence is the build, the reading above,
      and an owner's eye on the profile window.
    status: done

