# Schema: docs/TASK_DAG.md    Validate: python3 tools/check_task_dag.py

plan: containers-replaced
title: Replace the hand-rolled containers with standard ones and a Neuron slot map
summary: >
  Migration stage 3 (CODING_STANDARDS.md). The legacy containers all live in
  NeuronCore since stage 1; this plan replaces their users and then deletes
  them. Measured on b69c951 — re-measure rather than trusting these:

    LList        127 files (GameLogic 82, Species 26, NeuronClient 16,
                 NeuronCore 2, NeuronServer 1)
    DArray       14 files    FastDArray  17 files    SliceDArray  Location
    BTree        5 files     HashTable/SortingHashTable  7 files
    2dArray/BoundedArray/2dSurfaceMap  ~12 files (input system, grids, water)

  Owner decisions (2026-08-02): DArray/FastDArray are replaced by a NEW
  Neuron slot map, then deleted — not modernised in place. Everything else
  goes to std:: equivalents.

  Determinism is the whole game here. DArray indices are network identity
  (WorldObjectId::m_index serialises them verbatim) and GenerateSyncValue()
  accumulates in container index order, so the slot map must reproduce
  DArray's index-assignment behaviour EXACTLY — including the fact that
  DArray::PutData scans linearly for the first free slot while
  FastDArray::PutData pops a freelist, which assign DIFFERENT indices after
  removals. T2 pins both sequences before T3 exists. LList order is
  insertion order and every conversion preserves traversal order.
  std::unordered_* may hold caches and UI state; in simulation state only
  through the sanctioned patterns in CODING_STANDARDS.md — lookup-only via
  Neuron::LookupTable (T17), insertion-ordered iteration, or
  sort-before-iterate.

  Characterisation limits, stated up front: the container templates
  themselves are fully testable in NeuronCoreTests (T1, T2). Per-file
  conversions in GameLogic sit behind the LinkStubs link wall and Species is
  an exe with no test project, so those tasks rely on the template-level
  pinned tests, an unchanged call-site structure, the build, and the Garden
  smoke test — each such task says so in notes rather than implying more.

  Cross-plan ordering: a file finishes its task here before its
  strings-modernised task, which finishes before its ownership task
  (stage 3 -> 4 -> 5 per file, CODING_STANDARDS.md). That ordering is no
  longer prose — the downstream tasks carry `blocked_by` edges naming the
  task here that gates them (docs/TASK_DAG.md, "Ordering across plans"),
  so `--next` will not offer a stage-4 or stage-5 task before its stage-3
  task lands. Tasks in different plans that list the same file must still
  not run concurrently even where no ordering exists — check `files`.

  Re-measured 2026-08-02 at 11aee84, and the headline is that stage 3 has
  not started: LList 126 files (GameLogic 82, Species 26, NeuronClient 16,
  NeuronCore 2, NeuronServer 1), DArray 14, FastDArray 17 — all within one
  file of the b69c951 figures. T3's SlotMap and T17's LookupTable exist and
  are tested; they have zero callers. The foundation is built and no
  production code has moved onto it.

tasks:
  - id: T1
    title: Characterise LList semantics in NeuronCoreTests
    intent: >
      Every LList conversion claims behaviour preservation; this task creates
      the evidence. Pins insertion order, index stability under
      PutDataAtStart/PutDataAtIndex, removal shifting, FindData, and the
      ownership semantics of EmptyAndDelete, against the legacy template.
    project: NeuronCore
    depends_on: []
    files:
      - Tests/NeuronCoreTests/LListTests.cpp
      - Tests/NeuronCoreTests/NeuronCoreTests.vcxproj
      - Tests/NeuronCoreTests/NeuronCoreTests.vcxproj.filters
    acceptance:
      - LListTests pins traversal order and index behaviour for insert-at-end, insert-at-start, insert-at-index and removal
      - LListTests demonstrates EmptyAndDelete deletes pointees and Empty does not
      - python3 tools/check_project_files.py passes (the four-edit rule)
    verify:
      - python3 tools/check_project_files.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    parallel_safe: true
    status: done

  - id: T2
    title: Characterise DArray and FastDArray slot-assignment semantics
    intent: >
      Slot indices are network identity, and DArray (linear first-free scan)
      and FastDArray (freelist pop) assign different indices after removals.
      Pin the exact index sequence each returns from PutData across a
      scripted mix of puts and MarkNotUsed calls, plus ValidIndex, NumUsed,
      Grow behaviour and SetStepDouble. These pinned sequences are the
      contract T3 implements against.
    project: NeuronCore
    depends_on: []
    files:
      - Tests/NeuronCoreTests/DArrayTests.cpp
      - Tests/NeuronCoreTests/NeuronCoreTests.vcxproj
      - Tests/NeuronCoreTests/NeuronCoreTests.vcxproj.filters
    acceptance:
      - Tests pin the PutData index sequence for DArray and FastDArray over identical scripted put/remove mixes, and the two sequences differ where the implementations differ
      - Tests pin ValidIndex/NumUsed/Size across growth and slot reuse
      - python3 tools/check_project_files.py passes
    verify:
      - python3 tools/check_project_files.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    parallel_safe: true
    status: done

  - id: T3
    title: Implement Neuron::SlotMap with DArray-identical index semantics
    intent: >
      The owner chose a new slot map over modernising DArray in place. A
      C++20 Neuron::SlotMap (NeuronCore, namespace Neuron) whose index
      assignment reproduces the legacy behaviour bit-for-bit — both the
      DArray linear-scan flavour and the FastDArray freelist flavour, since
      callers of each depend on different sequences. How the two flavours
      are expressed (policy parameter or two types) is this task's design
      decision; what is not negotiable is that T2's pinned sequences pass
      unchanged against the replacement.
    project: NeuronCore
    depends_on: [T2]
    files:
      - NeuronCore/SlotMap.h
      - NeuronCore/NeuronCore.vcxproj
      - NeuronCore/NeuronCore.vcxproj.filters
      - Tests/NeuronCoreTests/SlotMapTests.cpp
      - Tests/NeuronCoreTests/NeuronCoreTests.vcxproj
      - Tests/NeuronCoreTests/NeuronCoreTests.vcxproj.filters
    acceptance:
      - T2's pinned index sequences pass verbatim against both SlotMap flavours
      - SlotMap supports iteration in index order over occupied slots only
      - SlotMap is Neuron style throughout — no raw owning pointers, no legacy macros
    verify:
      - python3 tools/check_project_files.py
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    parallel_safe: true
    notes: >
      Future-proofing decided with the owner (2026-08-02), recorded in
      docs/ARCHITECTURE.md (runtime model): when the lockstep protocol is
      eventually replaced, object identity moves from slot indices to
      deterministically generated stable ids. None of that is built now —
      but SlotMap's API is shaped as a narrow seam (handle in, reference
      out; no caller performs raw index arithmetic) so that swap stays one
      bounded change. Migration tasks T4-T13 hold callers to that surface.
    status: done

  - id: T4
    title: Migrate the protocol-adjacent containers (ServerToClientLetter, Server)
    intent: >
      NeuronCore/ServerToClientLetter.h uses DArray and LList, and
      NeuronServer/Server.h holds the client and team registries in DArray —
      registry indices are client identity on the wire. Converting these
      first, under the existing wire-format and Server-initial-state tests,
      proves the SlotMap on the highest-stakes users while they are the
      smallest.
    project: NeuronServer
    depends_on: [T1, T3]
    files:
      - NeuronCore/ServerToClientLetter.h
      - NeuronCore/ServerToClientLetter.cpp
      - NeuronServer/Server.h
      - NeuronServer/Server.cpp
      - Species/ServerUpdates.cpp
      - Tests/NeuronCoreTests/ServerToClientLetterTests.cpp
      - Tests/NeuronServerTests/ServerTests.cpp
    acceptance:
      - grep -lwE "DArray|LList" on the four source files returns nothing
      - Existing ServerToClientLetter byte-pinning tests and Server initial-state tests pass unchanged
      - Server.exe --ticks 20 still advances the sequence id (CI asserts this)
    verify:
      - python3 tools/check_layering.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    parallel_safe: true
    notes: >
      LANDED 2026-08-02, CI green first try, including Server.exe --ticks 20.
      SlotMap's first production caller: T3 built it and T2 pinned it four
      tasks earlier and nothing had used it until now.

      FLAVOUR IS THE DECISION, and the next migration should copy the
      reasoning rather than the answer. These were DArray, so they take the
      default LowestFirst. Client and team registry indices ARE identity — a
      letter carries m_clientId as an index into m_clients — so the freelist
      flavour would hand the same join sequence different identities after a
      disconnect. Check which legacy template a member was, not which one
      looks tidier.

      SlotMap was a drop-in for every DArray call site: PutData, PutData at an
      index, ValidIndex, Size, SetSize, NumUsed, MarkNotUsed, EmptyAndDelete
      and indexing all carried over untouched, so the diff for those three
      members is confined to their declarations. That is worth knowing before
      T9, T10 and T12, which are the same substitution at twenty times the
      scale: budget the effort for the LList members, not the DArray ones.

      The LList members are ordinary queues — PutDataAtEnd is push_back,
      RemoveData(0) is erase(begin()), ValidIndex is a written-out bounds
      check — and they still hold raw owning pointers, so three EmptyAndDelete
      calls became explicit delete loops. ownership T2 covers these files.

      Scope corrected BEFORE converting rather than by CI: Species/
      ServerUpdates.cpp walks a letter's m_updates and was not in the file
      list. Enumerating every use of every member first cost a minute; the
      three conversions before this one each lost a CI round to skipping it.

      One honest caveat on "tests pass unchanged": every assertion is
      unchanged, but ServerToClientLetterTests needed .Size() -> .size() with
      a cast, because Assert::AreEqual(int, size_t) does not compile.
    status: done

  - id: T5
    title: Convert the sound subsystem containers
    intent: >
      SoundSystem, SoundInstance and SampleCache use DArray, FastDArray,
      BTree, HashTable and LList for what are caches and playback lists —
      frame-rate code, not simulation state, so std::vector and
      std::unordered_map are legitimate here. Removes a large cluster of
      container users in one reviewable, low-determinism-risk diff.
    project: NeuronClient
    depends_on: [T1, T3]
    files:
      - NeuronClient/SoundSystem.h
      - NeuronClient/SoundSystem.cpp
      - NeuronClient/SoundInstance.h
      - NeuronClient/SoundInstance.cpp
      - NeuronClient/SampleCache.h
      - NeuronClient/SampleCache.cpp
    acceptance:
      - grep -lwE "LList|DArray|FastDArray|BTree|HashTable" on the six files returns nothing
      - No speciesRandom() call is added or removed (sound must not touch the simulation stream)
    verify:
      - python3 tools/check_layering.py
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
    parallel_safe: true
    notes: >
      SURVEYED 2026-08-02 and NOT started. Two findings change what this task
      is, and one of them is bigger than this plan.

      THIS TASK'S PREMISE IS WRONG. The intent says sound is "frame-rate code,
      not simulation state, so std::vector and std::unordered_map are
      legitimate here". SoundInstance.cpp calls speciesRandom() twice — line
      533 picks a sample, line 1009 picks an object id — so the sound
      subsystem draws from the DETERMINISTIC SIMULATION RANDOM STREAM. Any
      conversion here that changes how many times those lines execute changes
      the sequence every other consumer of speciesRandom() sees. The
      acceptance criterion "no speciesRandom() call is added or removed" is
      therefore load-bearing rather than a formality, and unordered containers
      anywhere that decides whether those lines run are not safe. See the
      hazard recorded in AGENTS.md, which is a much larger problem than this
      task.

      SCOPE: ListSoundEvents is not part of these six files. It is a virtual
      taking LList<char const*>* implemented across 64 files — every entity
      and building type — so SoundSystem.h cannot lose its LList reference,
      and this task cannot meet its own grep acceptance, without a tree-wide
      interface change. Split out as T23.

      The rest is ordinary: m_events, m_samples, m_objIds and m_dspFX are
      vectors; m_sounds is a SlotMap MostRecentFirst (FastDArray); m_params
      and the three blueprint arrays are SlotMap LowestFirst (DArray); m_cache
      is keyed AND index-iterated, so std::map rather than a hash. Note
      SampleGroup's destructor calls EmptyAndDeleteArray — delete[], not
      delete — so m_samples holds new char[] and its replacement loop must
      too.
    status: todo

