  - id: T17
    title: Add Neuron::LookupTable, the no-iteration hashed lookup
    intent: >
      CODING_STANDARDS.md sanctions hashed containers in simulation code
      only when their order can never be observed. LookupTable wraps
      std::unordered_map and exposes Insert, Erase, Find, Contains and
      Size — no begin/end, no traversal of any kind — so "never iterated"
      is a compile-time property instead of a review hope. Gives
      simulation code O(1) lookup without opening the unordered-traversal
      door; available to any migration task (T4-T13) whose profiling
      justifies it.
    project: NeuronCore
    depends_on: []
    files:
      - NeuronCore/LookupTable.h
      - NeuronCore/NeuronCore.vcxproj
      - NeuronCore/NeuronCore.vcxproj.filters
      - Tests/NeuronCoreTests/LookupTableTests.cpp
      - Tests/NeuronCoreTests/NeuronCoreTests.vcxproj
      - Tests/NeuronCoreTests/NeuronCoreTests.vcxproj.filters
    acceptance:
      - LookupTable exposes no begin/end or any other way to observe element order; the header comment states why, citing CODING_STANDARDS.md
      - Tests cover insert, find, erase, contains and size, including collision-prone keys
      - CODING_STANDARDS.md's reference to this task resolves — the "until it lands" caveat there can be dropped in the same commit
    verify:
