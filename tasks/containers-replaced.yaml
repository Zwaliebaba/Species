# Schema: docs/TASK_DAG.md    Validate: python3 tools/check_task_dag.py

plan: containers-replaced
title: Replace the hand-rolled containers with standard ones and a Neuron slot map
summary: >
  Migration stage 3 (CODING_STANDARDS.md). The legacy containers all live in
  NeuronCore since stage 1; this plan replaces their users and then deletes
  them. Measured on b69c951 — re-measure rather than trusting these:

    LList        127 files (GameLogic 82, Species 26, NeuronClient 16,
                 NeuronCore 2, NeuronServer 1)
    DArray       14 files    FastDArray  17 files    SliceDArray  Location
    BTree        5 files     HashTable/SortingHashTable  7 files
    2dArray/BoundedArray/2dSurfaceMap  ~12 files (input system, grids, water)

  Owner decisions (2026-08-02): DArray/FastDArray are replaced by a NEW
  Neuron slot map, then deleted — not modernised in place. Everything else
  goes to std:: equivalents.

  Determinism is the whole game here. DArray indices are network identity
  (WorldObjectId::m_index serialises them verbatim) and GenerateSyncValue()
  accumulates in container index order, so the slot map must reproduce
  DArray's index-assignment behaviour EXACTLY — including the fact that
  DArray::PutData scans linearly for the first free slot while
  FastDArray::PutData pops a freelist, which assign DIFFERENT indices after
  removals. T2 pins both sequences before T3 exists. LList order is
  insertion order and every conversion preserves traversal order.
  std::unordered_* may hold caches and UI state; in simulation state only
  through the sanctioned patterns in CODING_STANDARDS.md — lookup-only via
  Neuron::LookupTable (T17), insertion-ordered iteration, or
  sort-before-iterate.

  Characterisation limits, stated up front: the container templates
  themselves are fully testable in NeuronCoreTests (T1, T2). Per-file
  conversions in GameLogic sit behind the LinkStubs link wall and Species is
  an exe with no test project, so those tasks rely on the template-level
  pinned tests, an unchanged call-site structure, the build, and the Garden
  smoke test — each such task says so in notes rather than implying more.

  Cross-plan ordering: a file finishes its task here before its
  strings-modernised task, which finishes before its ownership task
  (stage 3 -> 4 -> 5 per file, CODING_STANDARDS.md). Tasks in different
  plans that list the same file must not run concurrently — check `files`.

tasks:
  - id: T1
    title: Characterise LList semantics in NeuronCoreTests
    intent: >
      Every LList conversion claims behaviour preservation; this task creates
      the evidence. Pins insertion order, index stability under
      PutDataAtStart/PutDataAtIndex, removal shifting, FindData, and the
      ownership semantics of EmptyAndDelete, against the legacy template.
    project: NeuronCore
    depends_on: []
    files:
      - Tests/NeuronCoreTests/LListTests.cpp
      - Tests/NeuronCoreTests/NeuronCoreTests.vcxproj
      - Tests/NeuronCoreTests/NeuronCoreTests.vcxproj.filters
    acceptance:
      - LListTests pins traversal order and index behaviour for insert-at-end, insert-at-start, insert-at-index and removal
      - LListTests demonstrates EmptyAndDelete deletes pointees and Empty does not
      - python3 tools/check_project_files.py passes (the four-edit rule)
    verify:
      - python3 tools/check_project_files.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    parallel_safe: true
    status: in_progress

  - id: T2
    title: Characterise DArray and FastDArray slot-assignment semantics
    intent: >
      Slot indices are network identity, and DArray (linear first-free scan)
      and FastDArray (freelist pop) assign different indices after removals.
      Pin the exact index sequence each returns from PutData across a
      scripted mix of puts and MarkNotUsed calls, plus ValidIndex, NumUsed,
      Grow behaviour and SetStepDouble. These pinned sequences are the
      contract T3 implements against.
    project: NeuronCore
    depends_on: []
    files:
      - Tests/NeuronCoreTests/DArrayTests.cpp
      - Tests/NeuronCoreTests/NeuronCoreTests.vcxproj
      - Tests/NeuronCoreTests/NeuronCoreTests.vcxproj.filters
    acceptance:
      - Tests pin the PutData index sequence for DArray and FastDArray over identical scripted put/remove mixes, and the two sequences differ where the implementations differ
      - Tests pin ValidIndex/NumUsed/Size across growth and slot reuse
      - python3 tools/check_project_files.py passes
    verify:
      - python3 tools/check_project_files.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    parallel_safe: true
    status: in_progress

  - id: T3
    title: Implement Neuron::SlotMap with DArray-identical index semantics
    intent: >
      The owner chose a new slot map over modernising DArray in place. A
      C++20 Neuron::SlotMap (NeuronCore, namespace Neuron) whose index
      assignment reproduces the legacy behaviour bit-for-bit — both the
      DArray linear-scan flavour and the FastDArray freelist flavour, since
      callers of each depend on different sequences. How the two flavours
      are expressed (policy parameter or two types) is this task's design
      decision; what is not negotiable is that T2's pinned sequences pass
      unchanged against the replacement.
    project: NeuronCore
    depends_on: [T2]
    files:
      - NeuronCore/SlotMap.h
      - NeuronCore/NeuronCore.vcxproj
      - NeuronCore/NeuronCore.vcxproj.filters
      - Tests/NeuronCoreTests/SlotMapTests.cpp
      - Tests/NeuronCoreTests/NeuronCoreTests.vcxproj
      - Tests/NeuronCoreTests/NeuronCoreTests.vcxproj.filters
    acceptance:
      - T2's pinned index sequences pass verbatim against both SlotMap flavours
      - SlotMap supports iteration in index order over occupied slots only
      - SlotMap is Neuron style throughout — no raw owning pointers, no legacy macros
    verify:
      - python3 tools/check_project_files.py
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    parallel_safe: true
    notes: >
      Future-proofing decided with the owner (2026-08-02), recorded in
      docs/ARCHITECTURE.md (runtime model): when the lockstep protocol is
      eventually replaced, object identity moves from slot indices to
      deterministically generated stable ids. None of that is built now —
      but SlotMap's API is shaped as a narrow seam (handle in, reference
      out; no caller performs raw index arithmetic) so that swap stays one
      bounded change. Migration tasks T4-T13 hold callers to that surface.
    status: todo

