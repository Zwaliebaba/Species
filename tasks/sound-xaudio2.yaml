  - id: T8
    title: Delete the software mixer and the waveOut output layer
    intent: >
      With XAudio2 the only backend, the software mixer has no output device
      and SoundLibrary2d has no caller. This also ends the two-devices-open
      state - the unconditional waveOut creation and the per-frame TopupBuffer
      pump in the main loop - and retires the SoundMixFreq preference, since
      XAudio2 resamples to the device rate.
    project: NeuronClient
    # T7 in the edge is file-collision serialisation over SoundSystem.cpp, the
    # NeuronClient vcxproj pair and PrefsSoundWindow.cpp; the real
    # prerequisite is T6.
    depends_on: [T6, T7]
    files:
      - NeuronClient/SoundLibrary3dSoftware.h
      - NeuronClient/SoundLibrary3dSoftware.cpp
      - NeuronClient/SoundLibrary2d.h
      - NeuronClient/SoundLibrary2d.cpp
      - NeuronClient/SoundSystem.cpp
      - NeuronClient/SystemInfo.cpp
      - NeuronClient/NeuronClient.vcxproj
      - NeuronClient/NeuronClient.vcxproj.filters
      - Species/Main.cpp
      - GameLogic/PrefsSoundWindow.cpp
      - NeuronCore/Preferences.cpp
    acceptance:
      - SoundLibrary3dSoftware and SoundLibrary2d are gone from disk and vcxproj; RestartSoundLibrary constructs exactly one backend
      - The TopupBuffer call at Species/Main.cpp:584 and the Stop/delete block in Finalise are gone
      - The SoundMixFreq preference and its options-window dropdown are retired
      - grep for waveOut returns nothing; winmm.lib is dropped from the link lines if the SystemInfo device enumeration was its last user (audit in-task, record in notes)
    verify:
      - python3 tools/check_project_files.py
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    status: done
    notes: |
      Landed 2026-08-06, in the same push as T7.

      Gone: SoundLibrary3dSoftware.{h,cpp} and SoundLibrary2d.{h,cpp}, the
      per-frame TopupBuffer call in the main loop, the Stop/delete block in
      Finalise, and the SoundMixFreq preference with its options-window
      dropdown, label and shipped default. RestartSoundLibrary constructs one
      backend and reads no SoundLibrary preference at all, because there is
      nothing left for it to select — a preferences file still naming dsound
      or software is ignored rather than honoured.

      SoundLibrary3d::Initialise lost every parameter but the channel count.
      The mix rate had nothing to choose once XAudio2 resamples to the endpoint,
      and the two ring sizes were DirectSound's and were already ignored.

      A NOMINAL rate replaces the preference INSIDE the backend, and the value
      is deliberate: 44100, the highest rate any sample in GameData uses. It
      sizes a block and gives a voice its opening format. Choosing lower would
      make the ring shrink in wall-clock terms once ResetChannel adopts a
      44kHz sample's own rate — six blocks sized at 22050 are 150ms of a 44kHz
      voice, not 300ms.

      TWO AUDITS THE ACCEPTANCE ASKED FOR, both answered NO:

      1. winmm.lib STAYS, and so does waveOut. The acceptance allowed dropping
         it "if the SystemInfo device enumeration was its last user". It is a
         user, but a DIFFERENT one: SystemInfo::GetAudioDetails calls
         waveOutGetNumDevs/waveOutGetDevCaps to enumerate output devices and
         score them, and PrefsSoundWindow displays the preferred device's name
         from it. That is enumeration, not output, and deleting the output
         layer does not make it dead. Replacing it would mean writing WASAPI
         IMMDeviceEnumerator code, since XAudio2.9 removed device enumeration
         from the API — a separate task if anyone wants it, not a tidy-up here.
      2. The grep for waveOut therefore does not reach zero, and cannot while
         that enumeration stands. It is at 2, both in SystemInfo.cpp.

      FOUND WHILE DOING THIS, and it was a real break in T7: Species/Main.cpp
      still included SoundLibrary3dDSound.h, a header T7 had deleted. T7's
      acceptance grep was for the substring DSOUND and the filename spells it
      DSound, so a case-sensitive search walked straight past it.

      THAT FIX WAS INCOMPLETE, and CI caught the remainder on this task's own
      commit. Deleting the include did not just remove a dead header - it
      removed the only path by which Species/Main.cpp saw a declaration of
      g_soundLibrary3d, which Finalise() deletes. Three errors at Main.cpp:840.
      The include of SoundLibrary3d.h that Main.cpp should always have had is
      now there directly, and the delete stays: SoundSystem's destructor has
      the same two lines, but that destructor never runs, because App::~App is
      unreachable behind Main.cpp's exit(0). Finalise() is the live shutdown of
      the audio device.

      THE LESSON IS ABOUT THE DELETION, NOT THE GREP. Removing an include
      withdraws every declaration it carried transitively, and the deleted
      header included SoundLibrary3d.h. A grep for the deleted TYPE finds
      nothing when the survivor is a global the header merely passed along.

      Collides with input-native-events T2/T8 and network-transport T9 over
      Species/Main.cpp - do not run concurrently with them.

  - id: T9
    title: Give music a stereo voice, and make a stereo sample safe to load
    # THE ORIGINAL INTENT WAS WRONG ON ITS FACTS, and the correction is the
    # reason this task changed shape. It read: "The music channel has been
    # silently mono since Darwinia - the DirectSound secondary buffer was
    # created with one channel even though the decoder reads stereo WAVs."
    #
    # Every WAV in GameData is mono. All 1332 of them, including the three
    # music tracks. Music is mono because the FILES are mono, and no buffer
    # width was ever the reason. Checked with a header census over
    # GameData/Sounds: (channels=1, rate=44100) x1330 and (1, 22050) x2.
    #
    # And the thing the premise assumed already worked does not. A stereo file
    # today is memory corruption, not a downmix: SoundStreamDecoder handles
    # interleaved data correctly, but everything above it confuses a FRAME
    # count with a SHORT count. CachedSample::Read memcpy's
    # m_numChannels * _numSamples shorts into a buffer the caller sized for
    # _numSamples, and indexes its source by frame into a short array.
    # Nothing rejects such a file either: SoundSourceNotMono exists, but its
    # only caller is IsSoundSourceOK, reached only from LoadtimeVerify, whose
    # one call site is commented out at SoundSystem.cpp:582.
    intent: >
      Make the stereo path real rather than nominal. The frame/short confusion
      above the decoder is fixed so interleaved data is indexed correctly, the
      music voice becomes stereo so a stereo track plays as one, and a mono
      track fans out across it and plays centred. Effect channels stay mono,
      and become mono BY CONSTRUCTION rather than by a checker that does not
      run - the main callback refuses a non-mono sample instead of overrunning
      its block.
    project: NeuronClient
    depends_on: [T7, T8]
    files:
      - NeuronClient/SoundStreamDecoder.cpp
      - NeuronClient/SampleCache.h
      - NeuronClient/SampleCache.cpp
      - NeuronClient/SoundLibraryXAudio2.h
      - NeuronClient/SoundLibraryXAudio2.cpp
      - NeuronClient/SoundLibrary3d.h
      - NeuronClient/SoundLibrary3d.cpp
      - NeuronClient/SoundSystem.h
      - NeuronClient/SoundSystem.cpp
    acceptance:
      - SoundStreamDecoder::Read and CachedSample::Read both count FRAMES, and a stereo sample no longer writes past the buffer it was given
      - The music voice is stereo; a stereo WAV plays with both channels distinct, a mono one plays centred
      - The music callback carries interleaved frames with an explicit channel count; the main callback is unchanged and still mono
      - A non-mono sample on an effect channel produces silence, not a buffer overrun, with no dependence on LoadtimeVerify
      - Every shipped sample is mono, so none of the above may change what the game sounds like today
    verify:
      - python3 tools/check_sound_effects.py
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    status: done
    notes: |
      Landed 2026-08-06.

      THE BUG WAS REAL AND IT WAS A HEAP OVERFLOW. Demonstrated rather than
      asserted: the old shape — a mono block of N shorts handed to a Read that
      memcpy's channels * N — is a WRITE of 32 bytes into a 16-byte region under
      AddressSanitizer, and g++ flags it at compile time with
      -Wstringop-overflow. A stereo file was never a downmix.

      FRAMES ARE COUNTED AS FRAMES NOW, in the three places that confused them
      with shorts:

      * SoundStreamDecoder::ReadWavData returned bytes/2 from its 16-bit branch,
        a count of SHORTS, and the caller subtracted it from m_samplesRemaining,
        a count of FRAMES. Its 8-bit branch read _numSamples single samples and
        called them frames. Both now take and return frames. A truncated file
        that ends mid-frame drops the partial frame rather than reporting an
        interleave one sample out of phase.
      * CachedSample::Read indexed BOTH its source subscripts by frame into a
        short array — m_rawSampleData[m_amountCached] and
        m_rawSampleData[_startSample] — while its memcpy length carried the
        channel factor. Both subscripts now carry it too.
      * The music callback's pointer arithmetic. Counts stayed frames, offsets
        became shorts, and every step through the block carries _numChannels.

      For a mono sample the channel factor is one and every one of those
      expressions is the number it always was, which is why 1332 mono files
      never showed any of it — and why this cannot change what the game sounds
      like today.

      THE MUSIC VOICE IS STEREO AND STAYS STEREO rather than being rebuilt per
      track. A source voice's channel count is fixed at creation, so matching
      the sample would mean DestroyVoice/CreateSourceVoice on every track
      change, and a window where the voice and the sample disagree. The
      callback has to fan a mono sample out regardless — every music file the
      game ships is mono — so once it can do that, a permanent stereo voice
      costs one extra block of memory and deletes the whole recreate path.
      ReadMusicFrames expands BACKWARDS so a frame is never overwritten before
      it is read: frame N reads index N and writes from N * channels, which is
      at or ahead of it for every N.

      EFFECT CHANNELS ARE MONO BY CONSTRUCTION NOW. The acceptance originally
      leaned on LoadtimeVerify rejecting non-mono EFFECT samples through
      SoundSourceNotMono. That function only checks WAV references, is
      #ifdef _DEBUG, and its one call site at SoundSystem.cpp:582 is commented
      out — it does not run. So the rule is enforced where the damage would
      happen: SoundLibraryMainCallback refuses a sample whose channel count is
      not one, writes silence and traces. A modded Sounds.txt naming a stereo
      effect sample now loses that sound instead of corrupting the ring.

      A LOOP GUARD THAT THE OLD CODE DID NOT NEED. The music callback's Looped
      branch spins until the block is full, trusting each Read to return
      something after AdvanceLoop rewinds. ReadMusicFrames can also return zero
      — for a sample wider than the voice — which would have made that an
      infinite loop inside the audio fill. It writes silence and breaks.

      VERIFIED WITHOUT MSVC, because the arithmetic is what a green build says
      least about. The fan-out and the frame indexing were lifted verbatim into
      a standalone g++ program and run under ASan and UBSan: ten checks covering
      mono to stereo, partial reads, stereo passthrough, a SPLIT stereo read
      (the case that catches the misindexing), a sample wider than the voice,
      and mono to mono unchanged. All pass. Re-running the same checks against
      the old indexing fails the split-read case, which is the proof the checks
      are worth anything.

      NOT DONE, and it is a property rather than a bug: the in-fill effects walk
      shorts and know nothing about interleaving. BitCrusher is memoryless and
      correct either way; Gargle advances an LFO per sample, so on a stereo
      voice its rate comes out doubled. Only music is stereo and no music
      blueprint asks for either effect, so there is nothing to hear — it is
      commented at the call site as the thing a modded Sounds.txt would meet.

      Collides with T10 over SoundLibraryXAudio2 and SoundSystem.cpp - do not
      run the two concurrently.

  - id: T10
    title: Device-loss resilience and the last dead code
    intent: >
      An audio device unplugged mid-game must mean silence, then recovery on
      restart of the library - never a crash. And the file-level archaeology
      goes - the hundred commented lines of the legacy Advance, the dead
      recording API, the waveOut device census in SystemInfo.
    project: NeuronClient
    # T9 in the edge is file-collision serialisation over SoundLibraryXAudio2
    # and SoundSystem.cpp; the real prerequisites are T7 and T8.
    depends_on: [T7, T8, T9]
    files:
      - NeuronClient/SoundLibraryXAudio2.h
      - NeuronClient/SoundLibraryXAudio2.cpp
      - NeuronClient/SoundLibrary3d.h
      - NeuronClient/SoundSystem.cpp
      - NeuronClient/SystemInfo.h
      - NeuronClient/SystemInfo.cpp
      - Species/Species.vcxproj
      - Tests/NeuronClientTests/NeuronClientTests.vcxproj
      - Tests/GameLogicTests/GameLogicTests.vcxproj
      # Added by T4, which found it dead. RestartSoundLibrary constructs
      # SoundLibraryXAudio2 unconditionally after T8, so SOUND_LIBRARY has no
      # reader that changes anything -- but PrefsSoundWindow still offers a
      # three-way dropdown and still WRITES "dsound" or "software" when a dead
      # option is applied. The preference default line in Preferences.cpp goes
      # with it, and dialog_dsound/dialog_software/dialog_xaudio2 in the six
      # language files are its labels.
      - GameLogic/PrefsSoundWindow.h
      - GameLogic/PrefsSoundWindow.cpp
      - NeuronCore/Preferences.cpp
    acceptance:
      - OnCriticalError parks the backend in a silent state without touching game logic; RestartSoundLibrary recovers when a device is available again
      - No HRESULT anywhere in the backend is a fatal assert
      - The commented-out legacy SoundSystem::Advance block and StartRecordToFile/EndRecordToFile are gone
      - The SoundLibrary preference, its dropdown and its language strings are gone; grep SOUND_LIBRARY returns nothing
      # REVERSES T8's AUDIT, which kept winmm because PrefsSoundWindow displayed
      # the preferred device's name. What it displays is wrong twice over:
      # GetAudioDetails never updates bestScore inside its loop, so every device
      # beats it and m_preferredDevice ends up the LAST one enumerated rather
      # than the best; and XAudio2's mastering voice takes the Windows default
      # endpoint regardless, so the name has no relationship to what comes out
      # of the speakers. A wrong device name is worse than none.
      - The waveOut device census, AudioInfo and the options-window device name are gone; winmm.lib leaves every link line
    notes: |
      Landed 2026-08-06.

      DEVICE LOSS IS HANDLED IN TWO HALVES, split across the thread boundary
      because that is where the constraint is. IXAudio2EngineCallback's
      OnCriticalError runs on XAudio2's own audio thread, so it does one thing:
      store an atomic flag. Advance, on the game thread, sees the flag and runs
      TearDownDevice — voices destroyed, mastering voice destroyed, callbacks
      unregistered, engine released — which leaves the library in EXACTLY the
      state Initialise produces on a machine with no audio device. Every entry
      point in the file already handles that state, so nothing else needed a
      new branch. Sounds keep starting, ending and releasing on schedule
      because TopUpChannel's no-device path still consumes one block per call.

      RECOVERY IS A LEVEL, NOT AN EDGE, and getting that wrong is a bug I wrote
      and then caught before pushing. The first version asked the backend
      DeviceLost() — did you lose a device — and retried while it was true.
      That breaks on the second failure: RestartSoundLibrary DESTROYS the
      backend, so a rebuild that also fails produces a fresh one that has lost
      nothing, reports false, and stops the retries dead. Unplug, wait, plug
      back in, silence forever. The interface now asks HasOutputDevice(), a
      level, and SoundSystem remembers in m_hadOutputDevice that one has been
      seen working — which is why that flag lives in SoundSystem and not in the
      backend it keeps rebuilding. A machine that never had a device never
      retries; one that had a device retries every five seconds until it comes
      back.

      TRACED RATHER THAN ASSUMED, since no test can unplug a sound card: the
      state machine was lifted verbatim into a standalone g++ program and driven
      through six scenarios under ASan and UBSan — no hardware at all, lost and
      still gone, lost with a FAILED retry and then replugged, recovered, and
      healthy. All pass. Scenario three is the one the edge-based version failed.

      NO HRESULT IN THE BACKEND IS A FATAL ASSERT, and this was already true
      rather than fixed here. The three asserts in SoundLibraryXAudio2.cpp check
      arguments — a channel count, a volume range, a filter count — and every
      HRESULT path traces and continues. Recorded because the criterion asked.

      DELETED: the 246-line commented-out legacy SoundSystem::Advance, which
      still called CommitChanges, a method the interface no longer has;
      StartRecordToFile and EndRecordToFile, virtual no-ops with no caller and
      no implementor; the SoundLibrary preference along with its dropdown, its
      three scoped constants, the four language strings in all six files, and
      its default line; SoundBufferSize, which T8's Initialise change left with
      no reader; and the waveOut census with AudioInfo and winmm.lib.

      THE CENSUS WENT AGAINST T8's AUDIT, and the claim commit records why in
      full: GetAudioDetails never updates bestScore inside its loop, so
      m_preferredDevice is the LAST device enumerated rather than the best, and
      XAudio2's mastering voice follows the Windows default endpoint regardless.
      The options window was displaying a name unrelated to what you hear.

      GetCPUOverhead needed no decision: T7 had already deleted it. The options
      window's CPU readout is the profiler's own and is untouched.

      Documentation corrected alongside, all of it stale rather than newly
      wrong: ARCHITECTURE's sound section still described three backends and the
      SoundLibrary preference, BUILD's OS row still named DirectSound and its
      dependency row still listed dsound/dxguid/winmm, AGENTS' link list said
      WinMM and DirectSound, its plan table said 3 of 11 blocked on T5, and the
      Known issue about the legacy backends' out-of-bounds read described files
      that no longer exist — kept as a resolved-by-deletion entry rather than
      dropped, because the shape recurs.
      # GetCPUOverhead was already deleted by T7 -- it had zero callers -- so
      # the criterion that asked what to do about it has nothing left to decide.
      # The options window's CPU readout is the profiler's, not the backend's.
    verify:
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    status: done

