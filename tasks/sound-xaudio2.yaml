# Schema: docs/TASK_DAG.md    Validate: python3 tools/check_task_dag.py

plan: sound-xaudio2
title: One native XAudio2 backend - X3DAudio positioning, XAPO effects, both legacy paths deleted
summary: >
  Three audio paths are compiled in today and two of them are legacy shims: the
  default 1270-line DirectSound backend (DirectSound has been a software
  emulation over WASAPI since Vista - its hardware-3D caps path reports zero
  buffers on every modern machine), a 553-line software mixer, and a WinMM
  waveOut output layer that is created EVEN WHEN DirectSound is active
  (SoundSystem.cpp:283 constructs SoundLibrary2d before choosing a backend), so
  the default configuration opens two audio devices and pumps one of them with
  silence. Latency rides a 20000-sample (~0.9s at 22kHz) cursor-chased ring.
  SetListenerPosition and CommitChanges QueryInterface the 3D listener on every
  call and never Release it (SoundLibrary3dDSound.cpp:671-696); every HRESULT
  is a fatal assert, so a busy or vanishing audio device kills the game.

  The owner directed the target on 2026-08-06: one native XAudio2 backend with
  X3DAudio positioning and the DSP filters carried by XAudio2's effect
  machinery, DirectSound AND the software mixer AND waveOut deleted. XAudio2.9
  ships in Windows 10+ and is first-class on ARM64, the primary dev platform.

  The upper layers do not move: SoundSystem's channel allocation and priority
  stealing, SoundInstance's ADSR and parameters, SampleCache, the blueprints
  and Sounds.txt all sit above the SoundLibrary3d seam, which is already in
  the right place. The pull-callback contract survives - the backend fills
  fixed blocks through the existing m_mainCallback/m_musicCallback from the
  main thread by polling BuffersQueued, so no new threading is introduced.

  Effect inventory measured from GameData (2026-08-06): Sounds.txt uses Echo
  x13 and Gargle x1 (portable filters in SoundFilter.cpp), and DSound_Echo x6,
  DSound_I3DL2Reverb x1, DSound_WavesReverb x1 (DirectX8 DMO effects). The
  mapping: ResonantLowPass becomes the built-in per-voice biquad
  (XAUDIO2_VOICE_USEFILTER - no effect object at all); Echo becomes FXECHO
  (parameters match DspEcho one for one); the I3DL2 reverb converts losslessly
  via ReverbConvertI3DL2ToNative; Gargle and BitCrusher run verbatim inside
  one generic XAPO adapter hosting the existing DspEffect classes. The
  frequency data peaks at 2.17x (measured), so voices are created with
  MaxFrequencyRatio 4.0 - the default is 2.0 and would clamp.

  BUILD TOPOLOGY NOTE, per AGENTS.md "ask before changing build topology": T1
  adds xaudio2.lib to the link lines of Species and both test projects that
  link NeuronClient, and T7 removes dsound.lib and dxguid.lib. This was
  authorised by the owner's direction of 2026-08-06 (this plan's brief); it is
  recorded here rather than re-asked per task.

  DETERMINISM NOTE: sound consumes only the cosmetic LCG stream (established
  by determinism T3/T4 - do not reopen). Nothing in this plan touches
  Location::Advance or the synchronised stream, so no task here is gated on a
  desync argument; the two owner gates exist because NOTHING in CI can hear.

  ORDERING vs THE OTHER PLANS: no blocked_by edges. T8 touches
  Species/Main.cpp, which input-native-events T2/T8 and network-transport T9
  also name - do not run those concurrently.

tasks:
  - id: T1
    title: Build the XAudio2 backend skeleton behind an opt-in preference
    intent: >
      A working SoundLibraryXAudio2 - engine, mastering voice, per-channel mono
      source voices, music voice, streaming and volume - selectable with
      SoundLibrary=xaudio2 while dsound stays the default, so the new backend
      can be A/B'd against the old one on the same build before anything is
      deleted.
    project: NeuronClient
    depends_on: []
    files:
      - NeuronClient/SoundLibraryXAudio2.h
      - NeuronClient/SoundLibraryXAudio2.cpp
      - NeuronClient/NeuronClient.vcxproj
      - NeuronClient/NeuronClient.vcxproj.filters
      - NeuronClient/SoundSystem.cpp
      - Species/Species.vcxproj
      - Tests/NeuronClientTests/NeuronClientTests.vcxproj
      - Tests/GameLogicTests/GameLogicTests.vcxproj
    acceptance:
      - Setting the SoundLibrary preference to xaudio2 selects the new backend; dsound remains the default in this task
      - Each channel is a mono source voice; refill happens on the main thread when GetState().BuffersQueued drops below the block count, through the EXISTING m_mainCallback/m_musicCallback - no new threads, no XAudio2 callbacks required
      - Channel restart goes through FlushSourceBuffers plus SetSourceSampleRate to the sample's native rate; SetChannelFrequency maps to SetFrequencyRatio; voices are created with MaxFrequencyRatio 4.0 (blueprint data peaks at 2.17)
      - Volume converts the existing hundredths-of-a-decibel master value to amplitude once; no per-backend duplicate curve
      - A failed device or engine creation yields a silent, playable game - not an assert; there is no SOUNDASSERT equivalent in the new file
      - xaudio2.lib is on the three link lines; dsound.lib stays until T7
    verify:
      - python3 tools/check_project_files.py
      - python3 tools/check_format.py
      - python3 tools/check_hygiene.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    status: done
    notes: |
      Landed 2026-08-06. CI green at 9abbf02, FIRST ROUND — static checks, the
      x64 Debug build, the unit suite and the headless server tick. The build
      and test verify commands were run by CI rather than locally, which is the
      honest reading of "every verify command passes" for an agent on Linux;
      nothing here has been HEARD by anyone, and cannot be until T5.

      THE SDK QUESTION IS ANSWERED, and it was the one real unknown: xaudio2.h
      resolves to the in-box XAudio 2.9 and xaudio2.lib links from the Windows
      SDK with no DirectX SDK, no redistributable and no toolset change. The
      build-topology change is therefore exactly the three AdditionalDependencies
      lines and nothing else. X3DAudio in T2 needs no further lib — the Windows
      SDK exports it from the same import library.

      FOUND WHILE WRITING THIS, and deliberately not inherited: both legacy
      backends read one element PAST THE END of SoundSystem::m_channels on every
      audio tick. SoundSystem sizes that array from GetNumMainChannels(), which
      is m_numChannels - 1, but DirectSound and the software mixer both pump
      channels up to m_numChannels and hand the index straight to the main
      callback, which subscripts the array with it. It is benign in practice —
      the garbage SoundInstanceId fails a bounds-checked slot map lookup and the
      channel writes silence — but it is real UB in the shipping default path.
      This backend sizes its channel vector from GetNumMainChannels() so the
      callback can only be given an index the array holds. The legacy files are
      NOT fixed: T7 and T8 delete them, and a fix would have to be justified
      against a smoke test that will never be run on code that is going away.

      Still true after this task, both by design: the waveOut device is opened
      even under xaudio2 because SoundLibrary2d is constructed unconditionally
      (T8 removes it), and effects are no-ops with positioning recorded but not
      applied (T3 and T2). So xaudio2 output today is centred and dry — the A/B
      at T5 is not meaningful until those two land.

      One deliberate deviation from the acceptance wording: SetSourceSampleRate
      adopts the frequency the game last ASKED for at reset, not a rate the
      backend reads off the sample, because SoundLibrary3d never sees the
      sample — it is handed nativeFreq * pitchParam through SetChannelFrequency.
      Adopting that value as the source rate and expressing every later call as
      a ratio against it is the same arithmetic (sourceRate * ratio equals the
      requested Hz either way) and keeps the ratio near 1.0, which is what makes
      MaxFrequencyRatio 4.0 sufficient.

  - id: T2
    title: Position voices with X3DAudio, including doppler
    intent: >
      Replaces DS3D. X3DAudioCalculate produces the mono-to-stereo output
      matrix and a doppler factor per positioned channel from exactly the data
      the game already sends - listener from SetListenerPosition, emitter from
      SetChannelPosition, min distance as the curve scaler - so no caller above
      the backend changes.
    project: NeuronClient
    depends_on: [T1]
    files:
      - NeuronClient/SoundLibraryXAudio2.h
      - NeuronClient/SoundLibraryXAudio2.cpp
    acceptance:
      - Mode3dPositioned channels get SetOutputMatrix from X3DAudioCalculate at the SoundSystem tick cadence; ModeMono and head-relative channels get an identity matrix and skip the calculation
      - DopplerScaler is 0.1, matching the DirectSound SetDopplerFactor call it replaces, and the doppler term multiplies into the frequency ratio alongside the game's pitch parameter
      - CurveDistanceScaler comes from SetChannelMinDistance, reproducing the inverse-distance attenuation the game was tuned against
    verify:
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    status: in_progress

  - id: T3
    title: Carry the DSP effects on XAudio2 - built-in filter, stock XAPOs, one adapter
    intent: >
      Every effect the data uses gets a native home. ResonantLowPass costs
      nothing (the per-voice biquad); Echo maps parameter-for-parameter onto
      FXECHO; the I3DL2 reverb converts losslessly; Gargle and BitCrusher keep
      their exact sound by running the existing DspEffect code inside one
      generic XAPO adapter. Enable/Update/DisableDspFX keep their signatures.
    project: NeuronClient
    # T2 in the edge is file-collision serialisation over SoundLibraryXAudio2,
    # not a logical dependency; the real prerequisite is T1.
    depends_on: [T1, T2]
    files:
      - NeuronClient/SoundLibraryXAudio2.h
      - NeuronClient/SoundLibraryXAudio2.cpp
      - NeuronClient/DspEffectXapo.h
      - NeuronClient/DspEffectXapo.cpp
      - NeuronClient/SoundFilter.h
      - NeuronClient/SoundFilter.cpp
      - NeuronClient/NeuronClient.vcxproj
      - NeuronClient/NeuronClient.vcxproj.filters
    acceptance:
      - DSP_RESONANTLOWPASS uses the built-in voice filter (XAUDIO2_VOICE_USEFILTER at creation, SetFilterParameters on update) - no effect object
      - DSP_ECHO and the DSound_Echo data entries drive one echo implementation (FXECHO or the adapter hosting DspEcho - decided in-task and recorded in notes)
      - The two reverb data entries drive XAUDIO2FX_REVERB, the I3DL2 one through ReverbConvertI3DL2ToNative
      - DspGargle and DspBitCrusher run inside DspEffectXapo (CXAPOParametersBase) unmodified in behaviour
      - Effect chains attach at the StartPlaying boundary while the voice is flushed - the same moment the DirectSound path stopped and restarted its buffer - and UpdateDspFX maps to SetEffectParameters/SetFilterParameters
    verify:
      - python3 tools/check_project_files.py
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    status: todo

