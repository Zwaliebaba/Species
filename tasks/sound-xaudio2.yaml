      Species/Main.cpp - do not run concurrently with them.

  - id: T9
    title: Give music a stereo voice
    intent: >
      The music channel has been silently mono since Darwinia - the DirectSound
      secondary buffer was created with one channel even though the decoder
      reads stereo WAVs. A stereo music voice and an interleaved music callback
      are the first audible improvement the new backend unlocks, and the
      mono-only rule correctly remains enforced for positional effect samples.
    project: NeuronClient
    depends_on: [T7, T8]
    files:
      - NeuronClient/SoundLibraryXAudio2.h
      - NeuronClient/SoundLibraryXAudio2.cpp
      - NeuronClient/SoundLibrary3d.h
      - NeuronClient/SoundSystem.h
      - NeuronClient/SoundSystem.cpp
    acceptance:
      - The music voice is stereo; a stereo WAV plays with both channels distinct, a mono one plays centred
      - The music callback carries interleaved frames with an explicit channel count; effect channels are unchanged
      - LoadtimeVerify still rejects non-mono EFFECT samples (SoundSourceNotMono), and a note records that music files are exempt
    verify:
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    status: todo

  - id: T10
    title: Device-loss resilience and the last dead code
    intent: >
      An audio device unplugged mid-game must mean silence, then recovery on
      restart of the library - never a crash. And the file-level archaeology
      goes - the hundred commented lines of the legacy Advance, the dead
      recording API, the waveOut device census in SystemInfo.
    project: NeuronClient
    # T9 in the edge is file-collision serialisation over SoundLibraryXAudio2
    # and SoundSystem.cpp; the real prerequisites are T7 and T8.
    depends_on: [T7, T8, T9]
    files:
      - NeuronClient/SoundLibraryXAudio2.h
      - NeuronClient/SoundLibraryXAudio2.cpp
      - NeuronClient/SoundLibrary3d.h
      - NeuronClient/SoundSystem.cpp
      - NeuronClient/SystemInfo.h
      - NeuronClient/SystemInfo.cpp
    acceptance:
      - OnCriticalError parks the backend in a silent state without touching game logic; RestartSoundLibrary recovers when a device is available again
      - No HRESULT anywhere in the backend is a fatal assert
      - The commented-out legacy SoundSystem::Advance block and StartRecordToFile/EndRecordToFile are gone
      - GetCPUOverhead is served by GetPerformanceData or the readout is deleted (decide in-task, record which)
    verify:
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    status: todo

