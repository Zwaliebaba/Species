  - id: T8
    title: Delete the software mixer and the waveOut output layer
    intent: >
      With XAudio2 the only backend, the software mixer has no output device
      and SoundLibrary2d has no caller. This also ends the two-devices-open
      state - the unconditional waveOut creation and the per-frame TopupBuffer
      pump in the main loop - and retires the SoundMixFreq preference, since
      XAudio2 resamples to the device rate.
    project: NeuronClient
    # T7 in the edge is file-collision serialisation over SoundSystem.cpp, the
    # NeuronClient vcxproj pair and PrefsSoundWindow.cpp; the real
    # prerequisite is T6.
    depends_on: [T6, T7]
    files:
      - NeuronClient/SoundLibrary3dSoftware.h
      - NeuronClient/SoundLibrary3dSoftware.cpp
      - NeuronClient/SoundLibrary2d.h
      - NeuronClient/SoundLibrary2d.cpp
      - NeuronClient/SoundSystem.cpp
      - NeuronClient/SystemInfo.cpp
      - NeuronClient/NeuronClient.vcxproj
      - NeuronClient/NeuronClient.vcxproj.filters
      - Species/Main.cpp
      - GameLogic/PrefsSoundWindow.cpp
      - NeuronCore/Preferences.cpp
    acceptance:
      - SoundLibrary3dSoftware and SoundLibrary2d are gone from disk and vcxproj; RestartSoundLibrary constructs exactly one backend
      - The TopupBuffer call at Species/Main.cpp:584 and the Stop/delete block in Finalise are gone
      - The SoundMixFreq preference and its options-window dropdown are retired
      - grep for waveOut returns nothing; winmm.lib is dropped from the link lines if the SystemInfo device enumeration was its last user (audit in-task, record in notes)
    verify:
      - python3 tools/check_project_files.py
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    status: todo
    notes: >
