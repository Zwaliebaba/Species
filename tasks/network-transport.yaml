      NetSocket, NetSocketListener, NetUdpPacket, the thread and mutex wrappers
      and the Win32 macro sheet exist only to serve code T4 and T5 removed.
      Deleting them removes the _fdopen-on-a-SOCKET Flush, the dead connect
      retry loop, the broken timeout math and the global MIN macro in one
      commit.
    project: NeuronCore
    depends_on: [T5]
    files:
      - NeuronCore/NetSocket.h
      - NeuronCore/NetSocket.cpp
      - NeuronCore/NetSocketListener.h
      - NeuronCore/NetSocketListener.cpp
      - NeuronCore/NetUdpPacket.h
      - NeuronCore/NetUdpPacket.cpp
      - NeuronCore/NetThread.h
      - NeuronCore/NetThreadWin32.cpp
      - NeuronCore/NetMutex.h
      - NeuronCore/NetMutexWin32.cpp
      - NeuronCore/NetLibWin32.h
      - NeuronCore/NetLibWin32.cpp
      - NeuronCore/NetLib.h
      - NeuronCore/NetLib.cpp
      - NeuronCore/NeuronCore.vcxproj
      - NeuronCore/NeuronCore.vcxproj.filters
    acceptance:
      - The ten legacy transport files are gone from disk and from the vcxproj; NetLib keeps only WSAStartup/WSACleanup and NetDebugOut
      - grep for NetSocketListener, NetUdpPacket, NetStartThread, NetMutex, NetGetHostByName and _fdopen returns nothing
      - The MIN macro no longer exists in any header
    verify:
