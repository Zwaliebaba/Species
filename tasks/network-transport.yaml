# Schema: docs/TASK_DAG.md    Validate: python3 tools/check_task_dag.py

plan: network-transport
title: Session-grade UDP - bounded wire reads, one polled socket, real identity, liveness
summary: >
  The Winsock2/UDP layer is Darwinia's NetLib essentially unchanged - correct in
  shape (sequence-numbered letters, server-side history retransmission) and
  carrying defects at every level. Found by reading the whole layer on
  2026-08-06, each with a file anchor:

  Wire safety: a letter over 512 bytes is sent (send buffer is 1024,
  ServerToClientLetter.h:8) and dropped at the receiver (recv buffer is 512,
  NetLib.h:36; WSAEMSGSIZE discarded at NetSocketListener.cpp:100-104), and
  because the client then can never ack that sequence id, the server
  retransmits the same oversized letter forever - a permanent stall.
  Deserialisation trusts the datagram: ServerToClientLetter(char*,int) reads
  numUpdates from the wire and parses past the end of the buffer
  (ServerToClientLetter.cpp:76-84; the length parameter is never consulted).
  Every Update letter leaks: m_updates is a vector of raw owning pointers and
  the class has no destructor.

  Transport: NetSocket carries TCP-inherited dead code - a connect retry loop
  meaningless for UDP (NetSocket.cpp:135-164), a select-plus-partial-send loop
  that cannot happen for datagrams (NetSocket.cpp:170-243), a Flush() that
  hands a SOCKET to _fdopen and has zero callers, and select timeout math off
  by 10x (divisor 100000, NetSocket.cpp:182). Both endpoints run blocking
  listener threads that are never joined; ~ClientToServer opens with an
  unsynchronised spin-wait (ClientToServer.cpp:89) and then destroys the
  listener the thread is still executing inside. Both inboxes are only DRAINED
  at tick cadence, so the threads buy zero latency - polling the socket from
  Advance() deletes the threads, both mutexes, and every cross-thread hazard.

  Identity: clients are keyed by source-IP string and replied to on fixed port
  4001, so one client per host, no NAT - and remote play is broken outright
  today, because ProcessServerLetters decides "is this TeamAssign mine?" by
  comparing against GetOurIP_Int(), which is hard-stubbed to 127.0.0.1
  (Species/Main.cpp:188, ClientToServer.cpp:147). Identity must stop being an
  address: the server assigns a connection id and replies to the datagram's
  source address.

  Liveness: none. The server never times out a silent client (RemoveClient
  fires only on graceful ClientLeave), so a crashed client is retransmitted-to
  forever while m_history grows without bound. The two lockstep tripwires -
  sync mismatch (NeuronServer/Server.cpp:369) and team capacity
  (Server.cpp:187) - are DEBUG_ASSERTs, so release builds desync silently.

  Deliberate design calls, so nobody relitigates them mid-task: the transport
  stays a SINGLE non-blocking socket polled from the tick - IOCP/RIO earn their
  complexity at thousands of sockets and a UDP game server is one socket at any
  client count; ITransport is the seam where a fancier implementation would
  slot in later with zero protocol change. Single player STAYS real UDP over
  loopback (recorded stance, NeuronServer/Server.h:55); the loopback transport
  introduced here is a TEST seam, not a runtime shortcut. Payload encodings
  stay byte-identical until T8 bumps the protocol version deliberately, in its
  own commit, with the old-vs-new bytes visible in the pinning tests.

  ORDERING vs THE OTHER TWO PLANS: no blocked_by edges - nothing here is
  gated by them. But T9 touches Species/Main.cpp, which input-native-events
  (T2, T8) and sound-xaudio2 (T8) also name. Do not run those tasks
  concurrently with T9; grep the other plans' files lists before starting.
  Recommended overall order across the three plans: input dead-code first,
  sound second, this plan third - it has the largest blast radius and, thanks
  to T7's loopback seam, the strongest CI safety net once it lands.

tasks:
  - id: T1
    title: Replace the ByteStream macros with a bounded reader and writer
    intent: >
      Any datagram can currently crash either endpoint, because reads are
      cast-and-advance macros with no notion of where the buffer ends. A small
      span-style reader/writer with explicit bounds makes truncation and hostile
      counts return an invalid letter instead of reading out of bounds - and the
      existing pinning tests prove the emitted bytes do not change.
    project: NeuronCore
    depends_on: []
    files:
      - NeuronCore/ByteStream.h
      - NeuronCore/NetworkUpdate.h
      - NeuronCore/NetworkUpdate.cpp
      - NeuronCore/ServerToClientLetter.h
      - NeuronCore/ServerToClientLetter.cpp
      - Tests/NeuronCoreTests/NetworkUpdateTests.cpp
      - Tests/NeuronCoreTests/ServerToClientLetterTests.cpp
    acceptance:
      - The READ_/WRITE_ macro family is gone from ByteStream.h and has zero users tree-wide (90 uses across NetworkUpdate.cpp and ServerToClientLetter.cpp today; READ_WORLDOBJECTID already has none)
      - Reads are bounds-checked against the real buffer length; the length parameter of ServerToClientLetter(char*, int) is finally consulted
      - Existing round-trip and pinned-value tests pass UNCHANGED - the bytes on the wire are identical
      - New tests cover a truncated buffer, a numUpdates larger than the buffer can hold, and a negative numUpdates - each yields an empty or invalid letter, never a crash
      - Unaligned access goes through memcpy, not pointer casts
    verify:
      - python3 tools/check_format.py
      - python3 tools/check_hygiene.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    status: done
    notes: >
      THE FILES LIST WAS SHORT BY FIVE, in the way _next-batch.md keeps
      recording: it names where the macros are DECLARED and the work is wherever
      they are USED. Tests/NeuronCoreTests/ByteStreamTests.cpp and
      WorldObjectIdTests.cpp both used the macro family and both had to be
      ported for the zero-users acceptance to be true. NeuronServer/Server.cpp
      and NeuronClient/ClientToServer.cpp are the two receive callbacks - the
      first was constructing a NetworkUpdate from m_data with NO length at all,
      which is the unbounded read this task exists to close, so bounding the
      type without fixing its only production caller would have been a change
      with no effect. NeuronCore/WorldObjectId.cpp is explained below.

      FOUR DECISIONS BEYOND THE LETTER OF THE ACCEPTANCE, each because the
      acceptance is unmeetable or meaningless without it:

      1. WorldObjectId lost its hand-written operator=. It was memberwise and
      identical to the implicit one, and its only effect was to make the type
      not trivially copyable - so ByteWriter::Write<WorldObjectId> would not
      compile against the static_assert that the wire only carries object
      representations. The type's whole documented purpose is going onto the
      wire whole; the assert now enforces that.

      2. An unrecognised type is invalid, not "whatever the wire said". Both
      parsers used to assign m_type from the wire BEFORE switching on it, so a
      datagram carrying any integer produced an update or letter claiming to be
      that type. They now switch on the raw value and assign only what this
      build knows.

      3. The DEBUG_ASSERTs on the RECEIVING side are gone. DEBUG_ASSERT(false)
      on an Invalid update type and DEBUG_ASSERT(numUpdates >= 0) were both
      reached from bytes off a socket: in Release they checked nothing, and in
      Debug they handed anyone who can reach the port a way to stop the build a
      developer is running. The writing-side assert on Invalid STAYS - nothing
      hostile reaches it.

      4. Both receive callbacks drop what did not parse. A letter that fails to
      parse still has a sequence id, and ClientToServer::ReceiveLetter acts on
      that id - it moves the client's clock and its last-valid-sequence id -
      before anything looks at the type. Parsing safely and then acting on the
      result anyway is not a fix.

      NOT COMPILED BY MSVC AND NOT RUN AS A SUITE. Written on Linux. What was
      run: all eight tools/ checks, and a g++ 13 harness under ASan and UBSan
      over verbatim copies of NetworkUpdate.cpp, ServerToClientLetter.cpp and
      TeamControls.cpp against shims for pch.h, Debug.h and the XMFLOAT3
      storage. It carries the PRE-T1 macro serialisers alongside the new ones
      and compares byte for byte: all twelve update types and all four letter
      types are identical, at the same lengths the suite pins (8, 11, 24, 21,
      30, 25, 12, 10, 22, 13). It then feeds the real parsers every truncation
      of a 63-byte letter and a 30-byte update, 263 type values, a
      billion-update count, a negative count and 20,000 random datagrams with
      no sanitizer report. A negative control confirms the harness can see the
      defect: the same five-byte datagram through the old READ_INT is a
      heap-buffer-overflow, and UBSan reports the old WRITE_FLOAT as a
      misaligned store while running the comparison.

      WHAT THAT CANNOT SEE is a type that no longer matches its use at a call
      site MSVC compiles and g++ never saw - the standing lesson of this
      repository. The signature changes are the exposure: NetworkUpdate(char*)
      became NetworkUpdate(char const*, int), ReadByteStream(char*) became
      ReadByteStream(ByteReader&) returning bool, and
      ServerToClientLetter(char*, int) became (char const*, int). Every caller
      of all three was found by grep and changed; a caller that was missed is a
      compile error rather than anything worse.

  - id: T2
    title: Give ServerToClientLetter value semantics and end the update leak
    intent: >
      m_updates is a vector of raw owning NetworkUpdate* with no destructor -
      every Update letter the client receives and every history copy the server
      makes leaks all its updates. NetworkUpdate is 88 trivially copyable bytes;
      holding them by value deletes the leak, the new-plus-memcpy copy
      constructor, and the "remember to update the copy constructor" comment in
      one move.
    project: NeuronCore
    depends_on: [T1]
    files:
      - NeuronCore/ServerToClientLetter.h
      - NeuronCore/ServerToClientLetter.cpp
      - NeuronServer/Server.cpp
      - Species/ServerUpdates.cpp
      - Tests/NeuronCoreTests/ServerToClientLetterTests.cpp
    acceptance:
      - m_updates is std::vector of NetworkUpdate by value; AddUpdate takes a const reference and copies no bytes by hand
      - The hand-written copy constructor and its memcpy are gone; the deep-copy test now asserts value copies instead of distinct pointers
      - grep "new NetworkUpdate" returns nothing outside tests
      - The static s_byteStream in ServerToClientLetter.cpp is replaced by a caller-owned or member buffer
    verify:
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    status: done
    notes: >
      MEASURED, NOT ASSERTED: the leak is 24 allocations for three letters
      carrying eight updates each - one built, one broadcast copy, one parsed
      off the wire - counted by a global operator new/delete pair in the g++
      harness. The same program over this task's code balances at zero.
      LeakSanitizer is disabled in this container (a deliberate `new int[10]`
      goes unreported), which is why the counter exists rather than a sanitizer
      run being cited.

      THE FILES LIST WAS RIGHT this time, with one addition:
      NeuronCore/NetworkUpdate.h and .cpp, because NetworkUpdate's own
      hand-written operator= - memcpy(this, &n, sizeof(*this)) - is the other
      half of "copies no bytes by hand", and declaring it stopped the type being
      trivially copyable. A vector of these by value is the whole task, so the
      thing standing in the way of the vector had to go with it. The implicit
      copy assignment is memberwise over scalars, which is what the memcpy was.

      GetByteStream BECAME Serialise(char*, int) ON THE LETTER, and the rename
      is the honest part of the change rather than churn: the buffer is the
      caller's now. What it replaces is a file-scope char[1024] shared by every
      letter in the process, so the bytes a letter "returned" stayed valid only
      until the next letter was serialised anywhere. Nothing was relying on
      that, because the one caller sent immediately - but it is a static that
      two sending threads would have raced over, and T4 and T5 are about to
      delete the threads that made it survivable. NetworkUpdate::GetByteStream
      keeps its shape and its member buffer; only the letter changed.

      WHY UPDATES ARE STILL FLATTENED THROUGH A SCRATCH BUFFER rather than
      written straight into the letter's writer: T3 needs to know whether the
      next update fits BEFORE committing any of it, so that a full letter stops
      cleanly and the remainder spills into the next tick. Writing through
      directly would leave a partial update behind the cursor with no way back.
      That is why ByteWriter::WriteBytes exists and is kept.

      NOT COMPILED BY MSVC AND NOT RUN AS A SUITE, same as T1. The harness was
      refreshed onto this task's sources: the byte comparison against the
      pre-T1 macro serialisers still passes for all twelve update types and all
      four letter types, the truncation and hostile-datagram sweeps still pass
      under ASan and UBSan, and the allocation balance is the new section. What
      it does not cover is Species/ServerUpdates.cpp and NeuronServer/Server.cpp
      - the two call sites that had to change shape (`m_updates[i]` is a value,
      `AddUpdate` takes a reference, the send path owns its buffer). Both are
      compile errors if they are wrong, not silent ones.

  - id: T3
    title: One datagram size, enforced at both ends, with per-letter spillover
    intent: >
      The 512-versus-1024 mismatch is the permanent-stall bug. One
      MaxDatagramSize constant in ProtocolLimits.h, used by the send path, the
      receive buffer, and a serialisation-time cap that spills excess updates
      into the next tick's letter, makes the failure impossible rather than
      merely unlikely.
    project: NeuronCore
    depends_on: [T2]
    files:
      - NeuronCore/ProtocolLimits.h
      - NeuronCore/NetLib.h
      - NeuronCore/NetSocketListener.cpp
      - NeuronCore/ServerToClientLetter.h
      - NeuronCore/ServerToClientLetter.cpp
      - NeuronServer/Server.cpp
      - Tests/NeuronCoreTests/ServerToClientLetterTests.cpp
      - Tests/NeuronServerTests/ServerTests.cpp
    acceptance:
      - ProtocolLimits.h defines the single maximum datagram size; MAX_PACKET_SIZE (512) and SERVERTOCLIENTLETTER_BYTESTREAMSIZE (1024) no longer disagree
      - A letter that would serialise past the limit stops accepting updates at runtime, in release builds too - not a DEBUG_ASSERT
      - Server::Advance carries updates that did not fit into the next tick's letter instead of dropping or overflowing
      - A test fills a letter past the cap and shows the remainder arriving in the following letter
    verify:
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    status: done
    notes: >
      1024, NOT 512, and the reason is arithmetic rather than taste: a full tick
      of 48 SelectUnits is 1020 bytes with its header, so 512 would have made
      spillover the normal case rather than the overflow case. The upper bound
      is one un-fragmented IP datagram - 1500 MTU less 20 IP and 8 UDP - so
      there is room above 1024 but nothing to buy with it.

      THE SPILLOVER NEEDED A LIFT, and it is the same shape input-native-events
      used for DeriveFrameState. Server::Advance cannot be called in a test: it
      locks a mutex Initialise creates, drains an inbox a listen thread fills,
      and reads g_prefsManager. So the decision it makes - which updates go in
      this letter and which are carried - moved into FillLetter, a free function
      over a letter and a queue, and THAT is what NeuronServerTests drives. The
      loop in Advance now queues into m_pendingUpdates and calls it once.

      Two things about that queue are load-bearing and both are asserted:
      updates carried from a full tick go at the FRONT of the next letter, and
      the first refusal ends the fill. "Add everything that fits" would let a
      small update overtake the large one that did not, and the order updates
      are broadcast in is the order every client applies them in - so that is a
      desync, not a cosmetic difference.

      SerialisedSize IS A SECOND PLACE THE LAYOUT IS WRITTEN DOWN. The cap has
      to be checked before an update is committed, and Serialise only answers
      after writing, so HeaderSize computes the per-type header independently.
      TheSerialisedSizeMatchesWhatSerialiseWrites is the only thing stopping the
      two drifting - it is the test that will fail when T8 adds a frame header
      to one and not the other, which is the intended way to find out.

      AddUpdate IS [[nodiscard]] because a caller that ignores the refusal has
      silently dropped a player's order.

      THE FILES LIST WAS SHORT BY THREE: NeuronCore/NetUdpPacket.h and .cpp both
      sized themselves from MAX_PACKET_SIZE, and Tests/NeuronServerTests is
      where the spillover test had to go.

      NOT COMPILED BY MSVC AND NOT RUN AS A SUITE. The harness was extended:
      60 updates spill across two letters at 1020 and 264 bytes, in order, and
      the capped letter round trips through the parser. FillLetter's five lines
      are TRANSCRIBED into the harness rather than compiled from Server.cpp,
      which cannot build here - so the cap itself is real code under test and
      the loop around it is not. The byte-identity comparison against the pre-T1
      macro serialisers still passes for every type.

  - id: T4
    title: Introduce UdpSocket and poll it from the server tick
    intent: >
      One non-blocking socket class - Open, SendTo, TryReceive - replaces the
      NetSocket/NetSocketListener split on the server. Server::Advance drains
      the socket at tick start, which deletes the listener thread, the inbox
      mutex and the file-scope callback plumbing, with no observable timing
      change because the inbox was only ever read at tick time anyway.
    project: NeuronServer
    depends_on: [T3]
    files:
      - NeuronCore/UdpSocket.h
      - NeuronCore/UdpSocket.cpp
      - NeuronCore/NeuronCore.vcxproj
      - NeuronCore/NeuronCore.vcxproj.filters
      - NeuronServer/Server.h
      - NeuronServer/Server.cpp
      - NeuronServer/ServerToClient.h
      - NeuronServer/ServerToClient.cpp
      - Tests/NeuronServerTests/ServerTests.cpp
    acceptance:
      - Server owns one UdpSocket bound to the server port; Advance drains it non-blocking before compiling the tick's letter
      - The server listener thread, ListenThread, ListenCallback and the inbox NetMutex are gone from NeuronServer
      - Sends still target each client's address on port 4001 - identity does not change in this task
      - Server.exe --ticks 20 still advances the sequence id (CI runs it on every push)
      - Errors are reported through std::system_category, not bare WSAGetLastError ints
    verify:
      - python3 tools/check_project_files.py
      - python3 tools/check_layering.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    status: done
    notes: >
      THE REAL UdpSocket.cpp WAS COMPILED AND RUN, which is more than any other
      task in this plan can say. Winsock's names are shimmed onto POSIX in a
      harness - SOCKET, closesocket, ioctlsocket, WSAGetLastError and the three
      error codes are renames; recvfrom's address-length parameter is the one
      genuine difference, int* on Windows and socklen_t* here, and the shim
      converts it. The file itself is byte-identical to the one in the tree. It
      builds clean under -Wall -Wextra and passes 30 checks over real loopback
      UDP: bind, non-blocking receive reporting empty as empty, send, receive
      with the source address and port recovered, REPLY TO THAT SOURCE (which is
      T9's identity change working before it is wired up), a five-datagram drain
      in one pass, sending on a closed socket, null and empty payloads,
      reopening and double-closing.

      WHAT IS STILL UNCOMPILED IS THE WIRING, not the socket: Server.cpp,
      Server.h, ServerToClient.cpp and the test file need MSVC and the rest of
      NeuronServer. The shapes that changed there are the ones to look at if CI
      is red - Server owns a UdpSocket by value (so Server is no longer
      copyable), ServerToClient::GetSocket became GetEndpoint, and Server.h
      includes UdpSocket.h and therefore winsock2.h (safe only because every pch
      includes WinSock2.h before Windows.h; the reverse order is the classic
      redefinition error).

      BOTH MUTEXES WENT, not just the inbox one the acceptance names. The outbox
      mutex protected m_outbox against the same listen thread, and AdvanceSender
      is called from Advance on the same thread as everything else, so it was
      guarding one thread from itself.

      THE PORTS ARE NAMED NOW - ServerPort and ClientPort in ProtocolLimits.h.
      That is T11's acceptance rather than this one's, but 4000 and 4001 were
      literals in the code this task rewrote, and putting them back as literals
      to be swept later would have been theatre. ClientPort is deliberately
      short-lived: T9 deletes the whole idea of a fixed reply port.

      ONE THING THE ACCEPTANCE ASKS FOR THAT CANNOT BE CHECKED HERE: "Server.exe
      --ticks 20 still advances the sequence id". That is a CI step and it needs
      Windows. It is also the single most valuable signal on this commit,
      because it exercises Initialise, the socket, and twenty real ticks of
      Advance with the listen thread gone.

      ServerToClient became CONSTRUCTIBLE IN A TEST as a side effect - it used
      to open and connect a socket to exist at all - so there is now a test that
      its endpoint is the address ConvertIPToInt produces on ClientPort.

  - id: T5
    title: Poll the client socket from the frame loop and fix shutdown
    intent: >
      Same conversion for ClientToServer - and with the listen thread gone, the
      destructor's unsynchronised spin-wait on m_outbox, the use-after-free on
      the listener object, and the listen-thread call into g_inputManager
      (ClientToServer.cpp:233) all cease to exist rather than being patched.
    project: NeuronClient
    depends_on: [T4]
    files:
      - NeuronClient/ClientToServer.h
      - NeuronClient/ClientToServer.cpp
    acceptance:
      - ClientToServer owns a UdpSocket bound to 4001 and drains it at the top of Advance; no thread, no mutexes
      - The destructor sends what the outbox holds and closes - the "while (!m_outbox.empty()) {}" spin-wait is gone
      - m_startTime is a plain member again, with the unsynchronised-access comment deleted because both accesses are now the main thread
      - The debug packet-drop hook runs on the main thread
    verify:
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    status: done
    notes: >
      THE DESTRUCTOR'S SPIN-WAIT IS GONE BY CONSTRUCTION, which is the point of
      the task rather than a tidy-up. `while (!m_outbox.empty()) {}` waited for a
      thread to drain a member it accessed without synchronisation, with nothing
      guaranteeing the thread ever would - and then reset the listener object
      that thread was still executing inside. With the sending on this thread,
      waiting for the outbox to empty IS emptying it: the destructor calls
      AdvanceSender and closes.

      HOSTNAME RESOLUTION WOULD HAVE BEEN LOST SILENTLY, and this is the find of
      the task. ServerAddress is a preferences string, so a user can write
      "myserver.local"; NetSocket::Connect resolved it through NetGetHostByName,
      which T6 deletes. Sending to ConvertIPToInt(serverAddress) instead would
      have compiled, passed every check, and worked perfectly for the default
      value of 127.0.0.1 - failing only for the users who typed a name.
      ResolveEndpoint (getaddrinfo, first IPv4 answer, which is the h_addr_list[0]
      NetGetHostByName's caller took) is in UdpSocket.cpp and is exercised in the
      POSIX harness against a dotted quad, a name, a null, an empty string and an
      unresolvable name.

      THE DEBUG PACKET-DROP HOOK now runs on the main thread because there is no
      other thread. It used to ask g_inputManager for a control event from the
      listen thread, which is a thread that never touches input.

      Advance RECEIVES THEN SENDS, deliberately: an order given this frame then
      goes out carrying the sequence id of a letter that arrived this frame
      rather than last frame's.

      NOT COMPILED. Nothing in this task can be built here - ClientToServer
      needs NeuronClient. The socket underneath it is the same UdpSocket that T4
      compiled and ran under the POSIX shim; the additions to it here,
      ResolveEndpoint, ran there too. What needs CI is the file that uses them.

