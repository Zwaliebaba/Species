      - python3 tools/check_layering.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    status: in_progress

  - id: T7
    title: Put ITransport behind the endpoints and test the protocol end to end
    intent: >
      The protocol has never once been exercised by CI - the tests cover
      encodings, not conversations. A two-method transport interface with a
      loopback implementation lets NeuronServerTests drive a scripted fake
      client through join, hello, team assignment, sequenced updates, acks and
      the retransmission window. This seam is what makes every task after this
      one verifiable by CI instead of by hope.
    project: NeuronCore
    depends_on: [T6]
    files:
      - NeuronCore/Transport.h
      - NeuronCore/LoopbackTransport.h
      - NeuronCore/LoopbackTransport.cpp
      - NeuronCore/UdpSocket.h
      - NeuronCore/UdpSocket.cpp
      - NeuronCore/NeuronCore.vcxproj
      - NeuronCore/NeuronCore.vcxproj.filters
      - NeuronServer/Server.h
      - NeuronServer/Server.cpp
      - NeuronClient/ClientToServer.h
      - NeuronClient/ClientToServer.cpp
      - Tests/NeuronServerTests/ServerProtocolTests.cpp
      - Tests/NeuronServerTests/NeuronServerTests.vcxproj
      - Tests/NeuronServerTests/NeuronServerTests.vcxproj.filters
    acceptance:
      - Server and ClientToServer send and receive through ITransport; the game injects UdpTransport, so runtime behaviour is unchanged and single player still runs real loopback UDP
      - ServerProtocolTests drives a scripted client over LoopbackTransport - join produces HelloClient, RequestTeam produces TeamAssign, updates come back sequenced, an unacked letter is retransmitted, an acked one is not
      - The new test file is in the vcxproj (check_project_files is the guard) and runs in CI
    verify:
      - python3 tools/check_project_files.py
      - python3 tools/check_layering.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    status: todo

  - id: T8
    title: Frame every datagram - magic, version, kind - and bump to protocol v2
    intent: >
      Today the first byte of a random datagram is interpreted as a message
      type. A four-byte header (magic, version, kind) lets both ends drop
      foreign or stale traffic on the floor, and gives the identity change in
      T9 a version to ride on. This is the deliberate compatibility break;
      there are zero deployed builds to protect, and there will never be a
      cheaper moment.
    project: NeuronCore
    depends_on: [T7]
    files:
      - NeuronCore/ProtocolLimits.h
      - NeuronCore/NetworkUpdate.cpp
      - NeuronCore/ServerToClientLetter.cpp
      - NeuronClient/ClientToServer.cpp
      - NeuronServer/Server.cpp
      - Tests/NeuronCoreTests/NetworkUpdateTests.cpp
      - Tests/NeuronCoreTests/ServerToClientLetterTests.cpp
      - Tests/NeuronServerTests/ServerProtocolTests.cpp
    acceptance:
      - Every datagram begins with the magic, a version byte (2), and a kind byte; receivers silently drop anything that does not match, and a test proves it
      - The pinned-bytes tests are updated in the same commit, so the review shows the old and new layouts side by side
      - The commit message states plainly that v2 does not interoperate with v1
    verify:
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    status: todo

  - id: T9
    title: Server-assigned connection ids and reply-to-source addressing
    intent: >
      Identity stops being an IP string and a fixed reply port. The server keys
      clients by the (address, port) each datagram arrives from, assigns a
      connection id in HelloClient, and addresses TeamAssign by that id -
      which fixes remote team assignment (broken today via the stubbed
      GetOurIP_Int), allows any number of clients per host, removes the
      client's second socket and port 4001, and works through ordinary NAT.
    project: NeuronServer
    depends_on: [T8]
    files:
      - NeuronCore/ServerToClientLetter.h
      - NeuronCore/ServerToClientLetter.cpp
      - NeuronServer/Server.h
      - NeuronServer/Server.cpp
      - NeuronServer/ServerToClient.h
      - NeuronServer/ServerToClient.cpp
      - NeuronClient/ClientToServer.h
      - NeuronClient/ClientToServer.cpp
      - Species/Main.cpp
      - Tests/NeuronCoreTests/ServerToClientLetterTests.cpp
      - Tests/NeuronServerTests/ServerProtocolTests.cpp
    acceptance:
      - The server replies to the source address of the datagram; ServerToClient holds an endpoint and a connection id, not a socket and an IP string
      - HelloClient carries the assigned connection id; the client stores it and ProcessServerLetters matches TeamAssign by id - the m_ip field and GetOurIP_Int (with its notes-by-John block) are deleted
      - The client no longer binds port 4001; the constant exists nowhere outside tasks/Archive
      - ServerProtocolTests joins TWO scripted clients from the same address on different ports and both receive their own TeamAssign
    verify:
      - python3 tools/check_format.py
      - python3 tools/check_layering.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    status: todo
    notes: >
      Collides with input-native-events T2/T8 and sound-xaudio2 T8 over
      Species/Main.cpp - do not run concurrently with them.

  - id: T10
    title: Liveness, history pruning, and runtime lockstep guards
    intent: >
      A server that never forgets a dead client and never prunes history cannot
      run longer than its memory, and a desync that only trips a DEBUG_ASSERT
      is a desync release builds play through silently. Timeouts, pruning below
      the minimum acked sequence id, and runtime responses turn all three into
      observable, bounded behaviour.
    project: NeuronServer
    depends_on: [T9]
    files:
      - NeuronCore/ProtocolLimits.h
      - NeuronServer/Server.h
      - NeuronServer/Server.cpp
      - NeuronServer/ServerToClient.h
      - NeuronClient/ClientToServer.h
      - NeuronClient/ClientToServer.cpp
      - Tests/NeuronServerTests/ServerProtocolTests.cpp
    acceptance:
      - A client silent for the timeout (default ten times IAMALIVE_PERIOD, named in ProtocolLimits.h) is removed with a GoodbyeClient; a test proves it
      - m_history is pruned below the minimum acked sequence id across live clients; a test shows history size bounded over a long scripted run
      - A sync-value mismatch logs the sequence id and disconnects the offending client at runtime; the team-capacity check refuses at runtime; neither is a DEBUG_ASSERT any more
      - The client exposes a server-silent-for-too-long state instead of simulating forward on an empty inbox indefinitely
    verify:
      - python3 tools/check_format.py
      - msbuild Species.slnx /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\*Tests.dll
    status: todo

