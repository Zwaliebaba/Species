  - id: T12
    title: Owner-run Garden smoke test on the v2 transport
    intent: >
      Single player runs the whole join, assign, update, sync conversation over
      real loopback UDP, so the Garden run exercises the new transport end to
      end in a way CI cannot. Step 7 - the sync assert staying quiet - is the
      one that vouches for the lockstep path.
    depends_on: [T11]
    acceptance:
      - Owner-reported Garden run, all seven steps, on a build containing T1-T11
      - Step 7 explicitly confirmed - GenerateSyncValue trips nothing in a full session including entering and leaving the location
      - The result is recorded in AGENTS.md "What working looks like", per that file's standing instruction
    parallel_safe: false
    status: todo
    notes: >
      Nothing in this plan changes what the simulation computes - letters carry
      the same payloads in the same order - so a desync here means a transport
      bug, not an accepted cost. That is the difference from determinism/T6.
