name: CI

on:
  # Every branch, not just main. Work here happens on branches for a while before
  # a pull request exists, and "did it build" is the answer that is most useful
  # earliest. The cost is a duplicate run once a PR is opened, which the
  # concurrency group below keeps cheap.
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run. main is exempt so
# every commit on the default branch keeps a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:

  # ---------------------------------------------------------------------------
  # Everything that does not need a compiler. Runs in under a minute and gives a
  # fast answer on the mistakes that are easiest to make without an IDE open.
  # ---------------------------------------------------------------------------
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check_format.py diffs against the merge base, so it needs history.
          fetch-depth: 0

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          sudo update-alternatives --install /usr/bin/clang-format clang-format \
            /usr/bin/clang-format-18 100
          pip install pyyaml
          clang-format --version

      - name: Project files match the tree
        run: python3 tools/check_project_files.py

      - name: No new layering violations
        run: python3 tools/check_layering.py

      - name: Task plans are valid DAGs
        run: python3 tools/check_task_dag.py

      - name: Changed lines are formatted
        run: |
          python3 tools/check_format.py \
            --base "origin/${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}"

  # ---------------------------------------------------------------------------
  # The real build. Both images carry Visual Studio 2026, so CI compiles with the
  # same v145 toolset used locally — no downgrade, no per-CI project settings.
  #
  # windows-11-vs2026-arm is a public preview image; the windows-11-arm label
  # migrates onto it in early September 2026, at which point this can be renamed.
  # ---------------------------------------------------------------------------
  # x64 Debug only.
  #
  # Release differs from Debug in optimisation settings alone and catches little
  # Debug does not. ARM64 is the primary development platform, so it is built
  # constantly on the desk and gains little from being built here too — and the
  # arm64 runner is a preview image that roughly doubles the wall clock.
  #
  # Build ARM64 and Release locally; CI will not catch a break in either.
  #
  # The unit tests run in this job rather than a separate one because they need
  # the build output, and shipping a few hundred megabytes of .lib and .obj
  # between jobs to save nothing is not a trade worth making.
  build:
    name: x64 Debug build and tests
    runs-on: windows-2025-vs2026

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        shell: pwsh
        run: |
          # The file logger is what makes a failure diagnosable. /m interleaves
          # output from parallel projects, so a compiler error can end up
          # thousands of lines above the point the build gives up — and the
          # console tail then shows only "exit code 1".
          msbuild Species.slnx `
            /p:Configuration=Debug `
            /p:Platform=x64 `
            /m `
            /nologo `
            /verbosity:minimal `
            /fileLogger `
            /fileLoggerParameters:LogFile=build-errors.log`;ErrorsOnly`;Verbosity=normal

      - name: Show build errors
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build-errors.log) {
            Write-Host '===== compiler errors ====='
            Get-Content build-errors.log
          } else {
            Write-Host 'no build-errors.log produced'
          }

      - name: Check GameData was staged beside the executables
        shell: pwsh
        run: |
          # GameData.targets copies the content tree after every build. If it
          # silently stopped running, the game would launch and then fail to find
          # a single asset — a far worse failure to debug than this check.
          $source = Join-Path $PWD 'GameData\Locations.txt'
          $staged = Get-ChildItem -Recurse -Filter 'Locations.txt' -File |
                    Where-Object { $_.FullName -ne $source }
          if (-not $staged) { throw 'GameData was not staged next to any build output' }
          $staged | ForEach-Object { Write-Host "staged: $($_.FullName)" }

      - name: Run unit tests
        shell: pwsh
        run: |
          # Every test project is a NativeUnitTestProject, so the build drops one
          # <Name>Tests.dll per covered library into the solution output
          # directory. Discovering them by glob rather than listing them means a
          # test project added later is picked up without anyone remembering to
          # edit this file.
          $tests = Get-ChildItem 'x64\Debug' -Filter '*Tests.dll' -File |
                   Select-Object -ExpandProperty FullName

          # An empty glob would otherwise let vstest.console exit 0 and report a
          # green run for nothing at all — the one failure mode a test gate must
          # never have. Tests/ holds one project per covered library; if that
          # ever legitimately drops to zero, this number changes with it.
          if ($tests.Count -lt 4) {
            throw "expected at least 4 test DLLs in x64\Debug, found $($tests.Count)"
          }
          $tests | ForEach-Object { Write-Host "discovered: $_" }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vstest = & $vswhere -latest -products * `
            -find 'Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe' |
            Select-Object -First 1
          if (-not $vstest) { throw 'vstest.console.exe not found on the runner' }

          & $vstest $tests /Platform:x64 /Logger:trx /ResultsDirectory:TestResults
          if ($LASTEXITCODE -ne 0) { throw "tests failed (vstest.console exit $LASTEXITCODE)" }

      - name: Headless server ticks with no client attached
        shell: pwsh
        run: |
          # Condition 3 of the definition of done in AGENTS.md, checked rather
          # than asserted. Server.exe references NeuronCore and NeuronServer and
          # nothing else, so it having built at all is most of the claim — if the
          # foundation still needed the game client, there would be no binary
          # here to run. Running it proves the other half: the host sequences
          # letters with nothing connected to it.
          #
          # --ticks bounds the run; without it the server loops until killed,
          # which is what it does in earnest.
          $exe = 'x64\Debug\Server.exe'
          if (-not (Test-Path $exe)) { throw "$exe was not built" }

          $output = & $exe --ticks 20 2>&1
          $output | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) { throw "server exited $LASTEXITCODE" }

          $final = $output | Select-String -Pattern 'Stopped at sequence id (\d+)\.'
          if (-not $final) { throw 'server did not report a final sequence id' }

          $seq = [int]$final.Matches[0].Groups[1].Value
          if ($seq -lt 20) { throw "sequence id only reached $seq after 20 ticks" }
          Write-Host "headless server reached sequence id $seq with no client attached"

      - name: Upload test results
        # Kept on failure only. A green run's .trx says nothing the job summary
        # does not, and uploading one per push is storage spent on nothing.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
